<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생태계평형</title><!-- JS의 CONTENT_CONFIG.title로 자동 변경됩니다 -->

    <!-- ════════════════════════════════════════════════════════
         🚫 [수정 금지] 핵심 라이브러리 — KaTeX · Tailwind CSS
         ════════════════════════════════════════════════════════ -->
    <link rel="icon" href="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_short.png"
        type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ════════════════════════════════════════════════════════
         ⚙️  [선택 수정] Tailwind 테마 — 브랜드 색상·폰트만 변경
         ════════════════════════════════════════════════════════ -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: { 'desktop-only': { 'raw': '(hover: hover) and (pointer: fine)' } },
                    colors: { primary: '#4f46e5' },   /* ✏️ 브랜드 색상 */
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] }
                }
            }
        }
    </script>
    <script>
        /* 모바일에서 생략되는 number 스피너만 보완하고 PC 네이티브 UI는 유지 */
        const isIPadDevice =
            /iPad/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isMobileNumberUI =
            navigator.userAgentData?.mobile === true ||
            /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
            isIPadDevice;
        if (isMobileNumberUI) document.documentElement.classList.add('mobile-number-controls');
    </script>

    <style>
        html,
        body,
        button,
        input,
        select,
        textarea {
            font-family: 'Noto Sans KR', sans-serif;
        }
        body { word-break: keep-all; overflow-wrap: break-word; }

        /* ════════════════════════════════════════════════════════
           ⚙️  [선택 수정] CSS 변수 — 전체 색상·폰트 크기 일괄 조정
           ════════════════════════════════════════════════════════ */
        :root {
            /* 폰트 크기 */
            --font-size-title: 1.275rem;
            --font-size-modal: 1.15rem;
            --font-size-guide: 1.025rem;
            --font-size-desc: 1rem;
            --font-size-small: 0.9rem;
            --font-size-tiny: 0.75rem;

            /* 텍스트 색상 */
            --color-text-main: #334155;
            --color-text-sub: #475569;
            --color-text-light: #64748b;

            /* 테마 포인트 색상 */
            --color-primary: #4f46e5;
            /* ✏️ 메인 포인트 색상 */
            --color-primary-bg: #e0e7ff;
            --color-tab-bg: #d8e0ff80;
            --color-action: #059669;
            --color-action-hover: #047857;
            --color-pause: #e11d48;
            --color-pause-bg: #fff1f2;
            --color-pause-border: #fecdd3;
            --color-obs1: #ea580c;
        }

        /* ════════════════════════════════════════════════════════
           ⚙️  [선택 수정] 디자인 클래스 매핑 — CSS 변수를 UI 요소에 적용
           ════════════════════════════════════════════════════════ */
        .sim-title {
            font-size: var(--font-size-title);
            font-weight: 700;
            color: var(--color-text-main);
            line-height: 1.25;
        }

        .guide-on-off {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: var(--color-text-light);
        }

        .guide-title {
            font-size: var(--font-size-guide);
            color: var(--color-primary);
            font-weight: 700;
        }

        .guide-desc {
            font-size: var(--font-size-desc);
            color: var(--color-text-sub);
        }

        .env-text {
            font-weight: 700;
            color: var(--color-text-light);
            font-size: var(--font-size-tiny);
        }

        .tab-btn {
            font-weight: 700;
            color: var(--color-text-light);
            font-size: var(--font-size-small);
        }

        @media (min-width: 768px) {
            .env-text {
                font-size: var(--font-size-small);
            }
        }

        .helper-text-default {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .helper-text-running {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-pause);
        }

        .helper-text-paused {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: #d97706;
        }

        .var-label-control {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-main);
        }

        .var-label-obs1 {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-obs1);
        }

        .var-label-obs2 {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-action);
        }

        .var-label-var {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: var(--color-text-main);
        }

        .slider-limit-label {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: #94a3b8;
        }

        .var-unit-display {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-primary);
            background-color: var(--color-primary-bg);
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
        }

        .select-option-text {
            font-size: var(--font-size-tiny);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .header-button {
            background-color: #fff;
            color: var(--color-text-sub);
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (hover: hover) and (pointer: fine) {
            .header-button:hover {
                background-color: #f1f5f9;
            }
        }

        .btn-action-start {
            background-color: var(--color-action);
            color: #fff;
            border-color: var(--color-action-hover);
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-action-start:hover {
                background-color: var(--color-action-hover);
            }
        }

        .btn-action-pause {
            background-color: var(--color-pause-bg);
            color: var(--color-pause);
            border-color: var(--color-pause-border);
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        .btn-sub {
            background-color: #fff;
            color: var(--color-text-main);
            border-color: #cbd5e1;
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-sub:hover {
                background-color: #f1f5f9;
            }
        }

        .btn-reset-custom {
            color: var(--color-text-main);
            border-color: #cbd5e1;
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-reset-custom:hover {
                color: var(--color-pause);
                border-color: #fda4af;
                background-color: var(--color-pause-bg);
            }
        }

        .modal-title {
            font-size: var(--font-size-modal);
            font-weight: 700;
            color: #1e293b;
        }

        .modal-close-btn {
            color: #94a3b8;
        }

        @media (hover: hover) and (pointer: fine) {
            .modal-close-btn:hover {
                color: #f43f5e;
            }
        }

        .concept-title-1 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #c2410c;
        }

        .concept-title-2 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #047857;
        }

        .concept-title-3 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #4338ca;
        }

        .concept-title-4 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #6e0478;
        }

        .concept-desc {
            font-size: var(--font-size-desc);
            color: var(--color-text-main);
        }

        .quiz-step {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: #4338ca;
            background-color: var(--color-primary-bg);
        }

        .quiz-question {
            font-size: var(--font-size-modal);
            font-weight: 700;
            color: #1e293b;
        }

        .quiz-btn-check {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #fff;
            background-color: #f97316;
            border: 1px solid #f97316;
            line-height: 1.5rem;
        }

        @media (hover: hover) and (pointer: fine) {
            .quiz-btn-check:hover {
                background-color: #ea580c;
                border-color: #ea580c;
            }
        }

        .quiz-answer-box {
            font-size: var(--font-size-guide);
            font-weight: 700;
            line-height: 1.5rem;
            color: var(--color-text-main);
            background-color: #f8fafc;
            border-color: #e2e8f0;
        }

        .header-button:is(.is-tap-feedback, .is-pen-hover),
        .btn-sub:is(.is-tap-feedback, .is-pen-hover),
        .zoom-btn:is(.is-tap-feedback, .is-pen-hover),
        .nav-btn:is(.is-tap-feedback, .is-pen-hover),
        #customSelectTrigger:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #f1f5f9;
        }

        .btn-action-start:is(.is-tap-feedback, .is-pen-hover) {
            background-color: var(--color-action-hover);
        }

        .btn-reset-custom:is(.is-tap-feedback, .is-pen-hover) {
            color: var(--color-pause);
            border-color: #fda4af;
            background-color: var(--color-pause-bg);
        }

        .modal-close-btn:is(.is-tap-feedback, .is-pen-hover) {
            color: #f43f5e;
        }

        .quiz-btn-check:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #ea580c;
        }

        .tab-btn:not(.border-indigo-600):is(.is-tap-feedback, .is-pen-hover) {
            background-color: rgb(226 232 240 / 0.5);
        }

        .radio-label:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #f8fafc;
        }

        #customSelectList [role="option"]:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #eef2ff;
        }

        /* PC·모바일에서 동일한 숫자 입력 스피너를 고정 노출 */
        .ratio-number-field {
            display: flex;
            flex: 1 1 0%;
            min-width: 0;
            position: relative;
        }

        .ratio-number-stepper {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            width: 2.5rem;
            justify-content: center;
            gap: 0;
        }

        .ratio-step-btn {
            display: flex;
            flex: 1 1 50%;
            min-height: 0;
            width: 100%;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 0.15rem;
            background-color: transparent;
            color: #737373;
            line-height: 1;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .ratio-step-icon {
            width: 0.66rem;
            height: 0.48rem;
            fill: currentColor;
        }

        .ratio-step-btn[data-step-direction="up"] .ratio-step-icon {
            transform: translateY(0.1875rem);
        }

        .ratio-step-btn[data-step-direction="down"] .ratio-step-icon {
            transform: translateY(-0.1875rem);
        }

        .ratio-step-btn:active {
            background-color: transparent;
            color: #475569;
        }

        .ratio-step-btn:focus {
            background-color: transparent;
        }

        .ratio-step-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .ratio-number-field>.input-text {
            appearance: textfield;
            -moz-appearance: textfield;
            padding-right: 2.75rem;
            background-color: transparent;
            transition: border-color 150ms ease;
        }

        .ratio-number-field>.input-text::-webkit-inner-spin-button,
        .ratio-number-field>.input-text::-webkit-outer-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }

        .ratio-number-field:has(>.ratio-number-stepper>.ratio-step-btn:active)>.input-text,
        .ratio-number-field:has(>.ratio-number-stepper>.ratio-step-btn.is-tap-feedback)>.input-text {
            border-color: #6366f1;
        }

        /* iOS Safari는 16px 미만 입력창에 포커스할 때 화면을 자동 확대한다. */
        @supports (-webkit-touch-callout: none) {
            html.mobile-number-controls input[type="number"] {
                font-size: 16px !important;
            }

            .radio-label>.select-option-text {
                white-space: nowrap;
            }
        }

        /* ════════════════════════════════════════════════════════
           🚫 [수정 금지] 코어 레이아웃 구조 — 전체화면·캔버스·스크롤
           ════════════════════════════════════════════════════════ */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html,
        body {
            overscroll-behavior: none;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-size: 16px !important;
        }

        .ui-box {
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
        }

        .shutter-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shutter-wrapper.is-open {
            grid-template-rows: 1fr;
        }

        .shutter-inner {
            overflow: hidden;
        }

        @media (hover: none), (pointer: coarse) {

            input,
            textarea,
            select,
            button,
            [role="button"],
            [contenteditable="true"] {
                touch-action: manipulation;
            }

            .zoom-btn,
            .nav-btn,
            .header-button,
            .btn-sub,
            .btn-reset-custom,
            .modal-close-btn,
            #btnScrollLeft,
            #btnScrollRight {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }

            .zoom-btn:active,
            .zoom-btn.is-tap-feedback,
            .nav-btn:active,
            .nav-btn.is-tap-feedback,
            .header-button:active,
            .header-button.is-tap-feedback,
            .btn-sub:active,
            .btn-sub.is-tap-feedback {
                background-color: #f1f5f9;
            }

            .btn-reset-custom:active,
            .btn-reset-custom.is-tap-feedback {
                color: var(--color-pause);
                border-color: #fda4af;
                background-color: var(--color-pause-bg);
            }

            .modal-close-btn:active,
            .modal-close-btn.is-tap-feedback {
                color: #f43f5e;
            }

            #btnScrollLeft:active,
            #btnScrollLeft.is-tap-feedback,
            #btnScrollRight:active,
            #btnScrollRight.is-tap-feedback {
                color: #4f46e5;
            }

            #fullscreen-btn:is(:active, .is-tap-feedback),
            #fullscreen-btn-mobile:is(:active, .is-tap-feedback) {
                background-color: #f1f5f9;
            }
        }

        canvas {
            touch-action: none;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .bar-track {
            width: 100%;
            height: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }

        .popup-overlay {
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
        }

        #workspace:fullscreen {
            background-color: #f8fafc;
            padding: 1rem;
            overflow-y: auto;
        }

        @media (orientation: landscape) {
            #workspace:fullscreen {
                padding: 1rem;
                overflow-y: hidden;
            }
        }
    </style>

    <!-- 🚫 [수정 금지] Tailwind 컴포넌트 추출 -->
    <style type="text/tailwindcss">
        @layer components {
            .panel-block      { @apply flex flex-col gap-2 p-3 border border-slate-200 rounded-lg bg-white; }
            .modal-container  { @apply bg-white border border-slate-300 rounded-2xl w-full flex flex-col relative shadow-2xl max-h-[70dvh]; }
            .modal-header     { @apply h-14 lg:h-16 px-6 border-b border-slate-100 flex items-center justify-between flex-none; }
            .modal-body       { @apply flex-1 overflow-y-auto p-4 lg:p-6 flex flex-col gap-4; }
            .guide-block      { @apply p-4 bg-slate-50 border border-slate-200 rounded-xl; }
            .zoom-btn         { @apply w-10 h-10 flex items-center justify-center bg-white border border-slate-300 rounded-full shadow-sm text-slate-600 font-bold desktop-only:hover:bg-slate-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed desktop-only:disabled:hover:bg-slate-50; }
            .nav-btn          { @apply w-12 h-12 flex items-center justify-center bg-white border border-slate-300 text-slate-600 rounded-full desktop-only:hover:bg-slate-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed desktop-only:disabled:hover:bg-slate-50; }
            .radio-label      { @apply flex items-start gap-2 p-2 border border-slate-200 rounded bg-white cursor-pointer desktop-only:hover:bg-slate-50 transition-colors has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 has-[:disabled]:opacity-50 has-[:disabled]:cursor-not-allowed; }
            .input-text       { @apply w-full p-2 border border-slate-200 rounded text-center focus:outline-none focus:border-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-slate-50; }
        }
    </style>
</head>

<!-- ════════════════════════════════════════════════════════════════════
     🚫 [수정 금지] BODY — 레이아웃 클래스 수정 금지
     ════════════════════════════════════════════════════════════════════ -->

<body
    class="bg-slate-100 text-slate-800 font-sans w-full m-0 p-0 box-border select-none overflow-x-hidden md:overflow-hidden landscape:overflow-hidden flex flex-col justify-center md:h-[100dvh] landscape:h-[100dvh]">

    <div
        class="flex flex-col w-full max-w-[1680px] mx-auto p-2 gap-2 box-border md:h-[100dvh] md:overflow-hidden landscape:h-[100dvh] landscape:overflow-hidden relative">

        <!-- ═══════════════════════════════════════════════════════════════
         🚫 [수정 금지] 헤더 — 제목은 JS CONTENT_CONFIG.title로 자동 주입
         ═══════════════════════════════════════════════════════════════ -->
        <header class="ui-box flex-none px-4 py-2 flex items-center justify-between z-10 bg-white relative">
            <div class="flex items-center gap-4">
                <a href="https://www.tsherpa.co.kr" target="_blank"
                    class="flex items-center flex-none desktop-only:hover:opacity-80 transition-opacity">
                    <img src="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_black.png"
                        alt="T셀파"
                        class="h-7 md:h-8 object-contain draggable-false flex-none hidden [@media(min-width:768px)]:block">
                    <img src="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_short.png"
                        alt="T셀파"
                        class="h-7 md:h-8 object-contain draggable-false flex-none block [@media(min-width:768px)]:hidden">
                </a>
                <div class="border-l border-slate-300 pl-4">
                    <h1 class="sim-title" id="sim-title-el">로딩 중...</h1><!-- CONTENT_CONFIG.title 자동 주입 -->
                </div>
            </div>
            <div class="flex items-center relative">
                <button id="moreMenuBtn"
                    class="header-button flex landscape:hidden desktop-only:hidden transition-colors ml-2"
                    title="메뉴 더보기">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                    </svg>
                </button>
                <div class="hidden landscape:flex desktop-only:flex items-center">
                    <!-- SOUND MANAGER -->
                    <div id="volume-popup"
                        class="flex items-center overflow-hidden transition-all duration-300 w-0 opacity-0">
                        <div
                            class="flex items-center gap-2 w-48 px-3 bg-white border border-slate-200 rounded-xl h-[36px] ml-2">
                            <button id="popup-mute-btn"

        /* ── 화면 이름·색 (교과서 표기. 동물 종 이름은 화면 글자에 쓰지 않음) ── */

        const IMG = {};
        [

            ['herb', './contents/herbivore_impala.webp'],

        let selfChecked = false;
        const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
        const font = (px, wt) => `${wt} ${px.toFixed(1)}px "Noto Sans KR", sans-serif`;
        /* 캔버스 글자 크기 = 기준 × ui, 폰에서도 읽히고 큰 화면에서 넘치지 않게 최소·최대 */
        const textPx = (base, ui, min = 11, max = 20) => clampN(base * ui, min, max);

        /* ── 모형: 세 개체군이 먹이 관계로 서로의 증가 빠르기를 바꾼다 (0이면 0으로 남음) ── */
        function modelRates(u) {
            const m = SIM_CONFIG.model;
            const rP = m.s + m.a, rH = m.s + m.g - m.b, rC = m.s - m.d;
            return [
                u[0] * (rP - m.s * u[0] - m.a * u[1]),
                u[1] * (rH + m.b * u[0] - m.s * u[1] - m.g * u[2]),
                u[2] * (rC + m.d * u[1] - m.s * u[2])
            ];
        }

        function stepModel(u, h) {
            const add = (a, k, f) => a.map((v, i) => v + k[i] * f);
            const k1 = modelRates(u);
            const k2 = modelRates(add(u, k1, h / 2));
            const k3 = modelRates(add(u, k2, h / 2));
            const k4 = modelRates(add(u, k3, h));
            return u.map((v, i) => {
                let n = v + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
                if (!(n * SIM_CONFIG.base[i] >= SIM_CONFIG.extinct)) n = 0;
                return Math.min(SIM_CONFIG.maxU, n);
            });
        }

        /* 고롱고사 시작: 육식동물이 없을 때 생산자·초식동물이 머무는 상태 (정지 상태) */
        function gorongosaStart() {
            const m = SIM_CONFIG.model;
            const rP = m.s + m.a, rH = m.s + m.g - m.b;
            const det = -m.s * m.s - m.a * m.b;
            return [(-m.s * rP + m.a * rH) / det, (-m.s * rH - m.b * rP) / det, 0];
        }

        function scenarioStart(name) {
            return name === 'gorongosa' ? gorongosaStart() : [1, 1, 1];
        }

        function applyPerturb(u, level, dir, scenario) {
            const v = u.slice();
            if (dir === 'up') v[level] = v[level] > 0 ? Math.min(SIM_CONFIG.maxU, v[level] * SIM_CONFIG.upFactor) : SIM_CONFIG.reintroduce;
            else v[level] = scenario === 'limit' ? 0 : v[level] * SIM_CONFIG.downFactor;
            if (v[level] * SIM_CONFIG.base[level] < SIM_CONFIG.extinct) v[level] = 0;
            return v;
        }

        /* 교란한 궤적과 교란하지 않은 궤적의 차이로 첫 반응 방향을 구한다 */
        function firstResponse(before, level, dir, scenario) {
            let u = applyPerturb(before, level, dir, scenario);
            let sh = before.slice();
            const got = {}, h = SIM_CONFIG.dt;
            for (let t = 0; t < SIM_CONFIG.firstTimeout; t += h) {
                u = stepModel(u, h);

        function selfCheckModel() {
            const bad = [];
            const compare = (label, key, got) => {
                Object.keys(FIRST_RESPONSE[key]).forEach(i => {
                    if (got[i] !== FIRST_RESPONSE[key][i]) bad.push(`${label} ${key}: ${LV_SHORT[i]} 표 ${FIRST_RESPONSE[key][i]}, 모형 ${got[i]}`);

            Object.keys(FIRST_RESPONSE).forEach(key => {

            if (!(u[1] < gs[1] && u[2] > 0 && u[0] > gs[0])) bad.push('고롱고사 끝 상태 방향');

            let z = [1, 0, 1];
            for (let t = 0; t < 150; t += 0.05) z = stepModel(z, 0.05);

            let judge = Object.keys(preds).length === 2 ? 'ok' : 'nopred';
            if (others.some(i => after[i] === 0)) judge = 'zero';
            simData.pert = { key: level + dir, level, dir, t0: simData.t, shadow: before, others, got: {}, preds, judge, done: false };
            simData.feedback = null;
            simData.phase = 'broken'; simData.pertT = simData.t; simData.holdAcc = 0;
            simData.events.push(simData.t);
            pushSample();
            draw();
        }

        function finishPert(p) {
            p.done = true;
            const table = FIRST_RESPONSE[p.key];
            const word = s => (s > 0 ? '증가' : s < 0 ? '감소' : '변화 없음');
            if (p.judge !== 'zero') {
                const off = p.others.filter(i => p.got[i] !== table[i]);
                if (off.length) console.warn('[자체 점검] 첫 반응이 지도서 p.139 표와 다름:', p.key, off.map(i => LV_SHORT[i]).join(', '));
            }
            simData.feedback = {
                title: `${LV_SHORT[p.level]} ${p.dir === 'up' ? '증가' : '감소'}`,
                key: p.key,
                judge: p.judge,
                lines: p.others.map(i => ({ level: i, name: LV_NAMES[i], obs: word(p.got[i]), pred: p.preds[i] ? word(p.preds[i]) : '', ok: p.preds[i] === table[i] }))
            };
            simData.feedback.right = simData.feedback.lines.filter(l => l.ok).length;
            if (p.judge === 'ok') (simData.feedback.right === simData.feedback.lines.length ? uiSound.playCorrect : uiSound.playWrong)();
        }

        function advance(h) {
            simData.u = stepModel(simData.u, h);
            simData.t += h;
            const p = simData.pert;
            if (p && !p.done) {
                p.shadow = stepModel(p.shadow, h);
                p.others.forEach(i => {
                    if (p.got[i] !== undefined) return;
                    const d = simData.u[i] - p.shadow[i];
                    if (Math.abs(d) > SIM_CONFIG.firstThreshold) p.got[i] = Math.sign(d);
                });
                const elapsed = simData.t - p.t0;
                if ((p.others.every(i => p.got[i] !== undefined) && elapsed >= SIM_CONFIG.revealAfter) || elapsed > SIM_CONFIG.firstTimeout) finishPert(p);
            }
            if (simData.phase === 'broken' && simData.t - simData.pertT >= SIM_CONFIG.breakTime) simData.phase = 'recovering';
            if (simData.phase === 'recovering') {
                const dev = Math.max(...simData.u.map(v => Math.abs(v - 1)));
                simData.holdAcc = dev < SIM_CONFIG.eqThreshold ? simData.holdAcc + h : 0;
                if (simData.holdAcc >= SIM_CONFIG.holdTime) simData.phase = 'recovered';
            }
            if (simData.t - simData.lastSample >= SIM_CONFIG.sampleEvery - 1e-9) pushSample();
        }

        /* 띄어쓰기 단위로 줄을 나눈다 (캔버스 글자, 어절 중간에서 끊지 않음) */
        function wrapWords(text, maxW) {
            const out = [];
            let line = '';
            text.split(' ').forEach(w => {
                const t = line ? line + ' ' + w : w;
                if (line && ctx.measureText(t).width > maxW) { out.push(line); line = w; } else line = t;
            });
            if (line) out.push(line);
            return out;
        }

        const RECOVER_MSG = '한 개체군의 수가 변해도 먹이 관계로 연결된 다른 개체군의 수가 연쇄적으로 변하면서 다시 안정적인 상태를 회복했습니다.';

        /* 평형 회복 팝업: 자동으로 멈출 때 캔버스 가운데에 뜨고 '확인'으로 닫는다 */
        function drawPopup(L) {
            simData.popupBtn = null;
            if (!simData.popup) return;
            const ui = L.ui, W = L.w, H = L.h;
            ctx.fillStyle = 'rgba(15,23,42,0.45)';
            ctx.fillRect(0, 0, W, H);
            const f = simData.feedback;
            const rows = [];
            if (f) rows.push({ t: `교란 : ${f.title}`, c: '#334155', w: 700 });
            if (f && f.judge === 'ok') rows.push({ t: `예측 ${f.lines.length}개 중 ${f.right}개 맞음`, c: f.right === f.lines.length ? '#047857' : '#be123c', w: 700 });
            /* 캔버스 위 HTML(위쪽 실행 상태 안내, 오른쪽 아래 초기화 버튼)과 겹치지 않는 세로 구간 */
            const top = 56, bottom = H - 60;
            const cw = Math.min(W - 24, Math.max(280, 460 * ui));
            let fsT, fs, pad, inner, body, lh, btnH, titleH, ch;
            for (let k = 1; k >= 0.6; k -= 0.05) {   /* 자리가 모자라면 글자·여백을 줄인다 */
                fsT = textPx(20, ui, 16, 26) * k; fs = Math.max(11, textPx(15, ui, 12.5, 20) * k);
                pad = Math.max(10, 22 * ui * k);
                inner = cw - pad * 2;
                ctx.font = font(fs, 500);
                body = wrapWords(simData.scenario === 'gorongosa' ? GORONGOSA_END : RECOVER_MSG, inner);
                lh = fs * 1.5; btnH = Math.max(34, 44 * ui * k); titleH = fsT * 1.5;
                ch = pad + titleH + 6 * ui + (rows.length + body.length) * lh + 10 * ui + btnH + pad;
                if (ch <= bottom - top - 8) break;
            }
            /* 그래도 넘치면(휴대폰 가로) 설명 문장을 빼고 제목·교란·예측·확인만 */
            if (ch > bottom - top - 8) { ch -= body.length * lh; body = []; }
            const cx = (W - cw) / 2;
            const cy = ch <= bottom - top - 8 ? top + (bottom - top - ch) / 2 : Math.max(4, (H - ch) / 2);
            ctx.save();
            ctx.shadowColor = 'rgba(15,23,42,0.25)';
            ctx.shadowBlur = 24;
            rrect(cx, cy, cw, ch, 14 * ui);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.restore();
            /* 제목 + 원 안 체크 (선으로 그림) */
            let y = cy + pad + titleH / 2;
            const r0 = fsT * 0.55;
            ctx.beginPath();
            ctx.arc(cx + pad + r0, y, r0, 0, Math.PI * 2);
            ctx.fillStyle = '#4f46e5';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.4 * ui;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx + pad + r0 * 0.5, y + r0 * 0.02);
            ctx.lineTo(cx + pad + r0 * 0.88, y + r0 * 0.38);
            ctx.lineTo(cx + pad + r0 * 1.5, y - r0 * 0.36);
            ctx.stroke();
            ctx.lineCap = 'butt';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = font(fsT, 800);
            ctx.fillStyle = '#312e81';
            ctx.fillText('생태계평형 회복', cx + pad + r0 * 2 + 10 * ui, y + 0.5);
            y += titleH / 2 + 6 * ui;
            rows.forEach(row => {
                ctx.font = font(fs, row.w);
                ctx.fillStyle = row.c;
                ctx.fillText(row.t, cx + pad, y + lh / 2);
                y += lh;
            });
            ctx.font = font(fs, 500);
            ctx.fillStyle = '#475569';
            body.forEach(t => { ctx.fillText(t, cx + pad, y + lh / 2); y += lh; });
            /* 확인 버튼 */
            const bw = Math.min(inner, 160 * ui), bx = cx + (cw - bw) / 2, by = cy + ch - pad - btnH;
            rrect(bx, by, bw, btnH, 10 * ui);
            ctx.fillStyle = '#4f46e5';
            ctx.fill();
            ctx.font = font(fs, 700);
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText('확인', bx + bw / 2, by + btnH / 2 + 0.5);
            simData.popupBtn = { x: bx, y: by, w: bw, h: btnH };
        }

        function setHTMLOnce(el, html) {
            if (el && el._shown !== html) { el._shown = html; el.innerHTML = html; }
        }

        /* 시나리오마다 의미 있는 교란만 고를 수 있다
           - 복원 한계: 사라진 영양단계가 없으면 감소만, 있으면 그 영양단계 '증가'(다시 들여오기)만
           - 고롱고사: 육식동물이 없는 동안은 아프리카들개 도입(= 2차 소비자 증가 버튼)만
           - 공통: 이미 0인 개체군의 감소는 바뀌는 것이 없어 잠금 */
        function perturbAllowed(lv, dir) {
            const u = simData.u;
            if (dir === 'down' && u[lv] === 0) return false;
            if (simData.scenario === 'gorongosa' && u[2] === 0) return lv === 2 && dir === 'up';
            if (simData.scenario === 'limit') {
                const gone = [0, 1, 2].filter(i => u[i] === 0);
                return gone.length ? dir === 'up' && gone.includes(lv) : dir === 'down';
            }
            return true;
        }

        function syncControls() {
            const running = sysState.isStarted && !sysState.isPaused;
            const status = currentStatus();
            const pd = simData.pending;
            const isSel = (lv, dir) => !!pd && pd.level === lv && pd.dir === dir;
            const SEL = ['ring-2', 'ring-indigo-500', 'bg-indigo-50', 'text-indigo-700', 'border-indigo-400'];
            const grid = document.getElementById('perturbGrid');
            if (grid) grid.querySelectorAll('button').forEach(b => {
                const lv = Number(b.dataset.level), dir = b.dataset.dir;
                const allowed = perturbAllowed(lv, dir);
                b.disabled = running || !allowed;
                /* 이 시나리오에서 고를 수 없는 버튼: 실행 중 잠금(흐림)과 달리 점선·회색 바탕·취소선 */
                ['border-dashed', 'bg-slate-100', 'line-through', 'text-slate-400'].forEach(c => b.classList.toggle(c, !allowed));
                b.title = allowed ? '' : '이 시나리오에서는 고를 수 없습니다';
                const on = !b.disabled && isSel(lv, dir);
                SEL.forEach(c => b.classList.toggle(c, on));
                b.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            /* 고롱고사에서 육식동물이 없는 동안 2차 소비자 증가 = 아프리카들개 도입 */
            const dogBtn = document.getElementById('perturb2up');
            if (dogBtn) {
                const isDog = simData.scenario === 'gorongosa' && simData.u[2] === 0;
                setHTMLOnce(dogBtn, isDog ? '들개<br>도입' : '증가');
                dogBtn.setAttribute('aria-label', isDog ? '아프리카들개 도입' : '2차 소비자 증가');
            }
            /* 예측: 교란을 고른 뒤에 나머지 두 개체군만 고른다. 맞음/틀림은 '예측 결과' 팝업에서 확인 */
            const f = simData.feedback;
            const shownLevel = pd ? pd.level : (simData.pert ? simData.pert.level : -1);
            [0, 1, 2].forEach(i => {
                const isPert = i === shownLevel;
                /* 교란한 개체군 칸은 증가·감소를 숨기고 '교란한 개체군'만 */
                document.querySelectorAll(`input[name="pred${i}"]`).forEach(r => {
                    r.disabled = running || !pd || isPert;
                    r.closest('label')?.classList.toggle('hidden', isPert);
                });
                const lbl = document.getElementById(`predLbl${i}`);
                if (lbl) lbl.classList.toggle('text-indigo-600', isPert);
                const res = document.getElementById(`predRes${i}`);
                if (!res) return;
                const html = isPert ? '<span class="text-indigo-600">교란한 개체군</span>' : '';
                if (res._shown !== html) { res._shown = html; res.innerHTML = html; }
                res.classList.toggle('hidden', !html);
            });
            /* 판정이 나면 안내 문장 대신 '예측 결과 다시 보기' 버튼 */
            const judged = !!(f && f.judge === 'ok' && !pd);
            const hint = !pd && !judged ? '먼저 ① 교란을 하나 고르세요.'
                       : pd ? '② 나머지 두 개체군이 처음에 증가할지 감소할지 고릅니다.' : '';
            const hintEl = document.getElementById('predictHint');
            setHTMLOnce(hintEl, hint);
            hintEl?.classList.toggle('hidden', !hint);
            const resBtn = document.getElementById('predictResultBtn');
            if (resBtn) { resBtn.classList.toggle('hidden', !judged); resBtn.disabled = running; }
            const envEl = document.getElementById('env-label-canvas');
            if (envEl) {
                const narrow = (container ? container.clientWidth : 0) < 520;
                const html = (narrow ? '' : `${CONTENT_CONFIG.envLabel}<span class="mx-2 text-slate-300">|</span>`) + `상태 : <span class="text-indigo-600">${STATUS_TEXT[status]}</span>`;
                if (envEl.innerHTML !== html) envEl.innerHTML = html;
            }
            setHTMLOnce(document.getElementById('scenarioDesc'), SCENARIOS[simData.scenario].desc);
        }

        /* ── 배치: 화면 모양마다 레이아웃만 다시 계산 (시뮬레이션 상태는 그대로) ── */
        function computeLayout(w, h) {
            const ui = clampN(Math.min(w / 1080, h / 700), 0.75, 1.5);
            const pad = 10 * ui, gap = 10 * ui;
            const TOP_SAFE = 56;        /* 위쪽 안내 문구(helperText) 자리 */
            const RESET_SAFE = 60;      /* 오른쪽 아래 초기화 버튼 자리 */
            const vw = window.innerWidth, vh = window.innerHeight;
            const L = { ui, pad, gap, w, h, mode: 'wide', tabs: null };
            if (vh < 500 && vw > vh) {
                /* 휴대폰 가로: 장면(또는 그래프) | 피라미드, 그래프는 탭으로 */
                L.mode = 'land';
                const leftW = Math.round(w * 0.58);
                const tabH = 40, tabW = 72;
                L.scene = { x: 0, y: 0, w: leftW, h };
                L.tabs = [
                    { id: 'scene', label: '장면', x: pad, y: h - pad - tabH, w: tabW, h: tabH },
                    { id: 'graph', label: '그래프', x: pad + tabW + 6, y: h - pad - tabH, w: tabW, h: tabH }
                ];
                L.graph = { x: pad, y: TOP_SAFE, w: leftW - 2 * pad, h: h - TOP_SAFE - tabH - 2 * pad - 4 };
                L.pyr = { x: leftW + gap, y: TOP_SAFE, w: w - leftW - gap - pad, h: h - TOP_SAFE - RESET_SAFE };
            } else if (vw < 768) {
                /* 휴대폰 세로: 장면 → 피라미드 → 그래프 */
                L.mode = 'tall';
                /* 피라미드는 세 행이 겹치지 않을 높이(제목 + 3×18px 이상)를 먼저 확보, 그래프는 약 32% 이상 */
                const ph = Math.max(Math.round(h * 0.19), 82);
                const sh = Math.round(clampN(h - ph - 2 * gap - pad - h * 0.32, h * 0.34, h * 0.40));
                L.scene = { x: 0, y: 0, w, h: sh };
                L.pyr = { x: pad, y: sh + gap, w: w - 2 * pad, h: ph };
                L.graph = { x: pad, y: sh + ph + 2 * gap, w: w - 2 * pad, h: h - sh - ph - 2 * gap - pad };
            } else {
                /* PC·태블릿: 장면 위, 아래에 피라미드 | 그래프 */
                const sh = Math.round(h * 0.52);
                const by = sh + gap, bh = h - by - pad;
                const pw = clampN(w * 0.38, 190, 560 * ui);
                L.scene = { x: 0, y: 0, w, h: sh };
                L.pyr = { x: pad, y: by, w: pw, h: bh };
                L.graph = { x: pad + pw + gap, y: by, w: w - pw - gap - 2 * pad, h: bh };
            }
            return L;
        }

        /* 초기화 버튼과 겹치면 그래프를 좁히거나 낮춘다 (잃는 넓이가 적은 쪽) */
        function avoidReset(b, L) {
            const rx = L.w - 128, ry = L.h - 64;
            if (b.x + b.w <= rx || b.y + b.h <= ry) return b;
            const narrow = { x: b.x, y: b.y, w: rx - b.x, h: b.h };
            const short = { x: b.x, y: b.y, w: b.w, h: ry - b.y };
            return narrow.w * narrow.h >= short.w * short.h ? narrow : short;
        }

        function rrect(x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function drawCard(r, ui) {
            rrect(r.x, r.y, r.w, r.h, 10 * ui);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1 * ui;
            ctx.stroke();
        }

        function drawCreature(it) {
            const img = IMG[SPRITE_KEYS[it.s]];
            if (img) { ctx.drawImage(img, it.x, it.y, it.w, it.h); return; }
            const { x, y, w, h } = it;
            ctx.fillStyle = it.s === 0 ? '#4d7c0f' : it.s === 1 ? '#b45309' : '#3f3f46';
            if (it.s === 0) {
                ctx.beginPath();
                for (let k = 0; k < 3; k++) {
                    const bx = x + w * (0.12 + 0.28 * k);
                    ctx.moveTo(bx, y + h);
                    ctx.lineTo(bx + w * 0.14, y + h * 0.1);
                    ctx.lineTo(bx + w * 0.28, y + h);
                }
                ctx.fill();
                return;
            }
            ctx.beginPath();
            ctx.ellipse(x + w * 0.5, y + h * 0.55, w * 0.36, h * 0.18, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(x + w * 0.22, y + h * 0.6, w * 0.06, h * 0.4);
            ctx.fillRect(x + w * 0.7, y + h * 0.6, w * 0.06, h * 0.4);
            const hx = it.s === 1 ? x + w * 0.84 : x + w * 0.16;
            ctx.beginPath();
            ctx.arc(hx, y + h * 0.38, Math.min(w, h) * 0.13, 0, Math.PI * 2);
            ctx.fill();
            if (it.s === 2) {
                ctx.fillStyle = '#facc15';
                [[0.4, 0.52], [0.55, 0.6], [0.62, 0.5]].forEach(([fx, fy]) => {
                    ctx.beginPath();
                    ctx.arc(x + w * fx, y + h * fy, w * 0.05, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        /* ① 서식지 장면: 배경(cover, 땅 기준) + 개체수에 비례하는 그림 개수 */
        function drawScene(r, L) {
            const ui = L.ui;
            ctx.save();
            ctx.beginPath();
            ctx.rect(r.x, r.y, r.w, r.h);
            ctx.clip();
            let groundTop;
            const bg = IMG.bg;
            if (bg) {
                const sc = Math.max(r.w / bg.naturalWidth, r.h / bg.naturalHeight);
                const dw = bg.naturalWidth * sc, dh = bg.naturalHeight * sc;
                let dy = r.y + r.h - dh;
                /* 아주 가로로 긴 장면: 아래 기준이면 지평선(이미지 약 50%)이 잘리므로 장면 위쪽 22% 근처에 둔다 */
                if (L.mode !== 'tall' && dy + dh * 0.5 < r.y + r.h * 0.2) dy = r.y + r.h * 0.22 - dh * 0.5;
                ctx.drawImage(bg, r.x + (r.w - dw) / 2, dy, dw, dh);
                groundTop = Math.max(r.y, dy + dh * 0.54);
            } else {
                groundTop = r.y + r.h * 0.5;
                ctx.fillStyle = '#7dd3fc';
                ctx.fillRect(r.x, r.y, r.w, groundTop - r.y);
                ctx.fillStyle = '#a3b545';
                ctx.fillRect(r.x, groundTop, r.w, r.y + r.h - groundTop);
            }

            /* 그림 1개가 나타내는 개체수는 화면 넓이에 따라 바뀐다 (실제 값은 피라미드·그래프 숫자) */
            const k = clampN(r.h * 0.16, 34, 140);
            const widths = [1.35 * k, 1.0 * k, 1.3 * k];
            const cap = clampN(Math.round(r.w * r.h / 11000), 15, 40);
            const eqCount = [Math.max(3, Math.round(cap * 0.3)), Math.max(3, Math.round(cap * 0.15)), Math.max(2, Math.round(cap * 0.07))];
            const yTop = groundTop + (r.y + r.h - groundTop) * 0.12;
            const yBot = r.y + r.h - r.h * 0.03;
            const running = sysState.isStarted && !sysState.isPaused;
            const items = [];
            for (let s = 0; s < 3; s++) {
                const u = simData.u[s];
                const n = u > 0 ? clampN(Math.round(u * eqCount[s]), 1, Math.round(eqCount[s] * 1.8)) : 0;
                const img = IMG[SPRITE_KEYS[s]];
                const aspect = img ? img.naturalWidth / img.naturalHeight : SPRITE_ASPECT[s];
                for (let j = 0; j < n; j++) {
                    /* 고정된 저불일치 수열 → 매 프레임 같은 자리, 개수가 늘어도 고르게 퍼짐 */
                    const fx = (0.5 + 0.7548776662 * (j + 1) + s * 0.31) % 1;
                    const fd = (0.5 + 0.5698402910 * (j + 1) + s * 0.17) % 1;
                    const iw = widths[s] * (0.72 + 0.28 * fd);
                    const ih = iw / aspect;
                    const feet = yTop + (yBot - yTop) * fd;
                    const bob = running && s > 0 ? Math.abs(Math.sin(simData.anim * 6 + j * 1.7 + s)) * 2.5 * ui : 0;
                    items.push({ s, x: r.x + r.w * 0.02 + (r.w * 0.96 - iw) * fx, y: feet - ih - bob, w: iw, h: ih, feet });
                }
            }
            items.sort((a, b) => a.feet - b.feet);
            items.forEach(drawCreature);

            /* 상태 표시 (장면이 충분히 클 때) */
            const st = currentStatus();
            if (r.h >= 160) {
                ctx.font = font(textPx(14, ui, 11.5, 20), 700);
                const txt = STATUS_TEXT[st];
                const cw = ctx.measureText(txt).width + 30 * ui, ch = 28 * ui;
                const cx = r.x + 12 * ui;
                const cy = cx + cw > L.w / 2 - 170 ? r.y + 58 : r.y + 12 * ui;
                rrect(cx, cy, cw, ch, ch / 2);
                ctx.fillStyle = 'rgba(255,255,255,0.94)';
                ctx.fill();
                ctx.strokeStyle = STATUS_COLORS[st];
                ctx.lineWidth = 1.5 * ui;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + 12 * ui, cy + ch / 2, 4 * ui, 0, Math.PI * 2);
                ctx.fillStyle = STATUS_COLORS[st];
                ctx.fill();
                ctx.fillStyle = '#334155';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(txt, cx + 21 * ui, cy + ch / 2 + 0.5);
            }

            /* 아래쪽 안내 상자들이 쌓이는 기준선 */
            let stackBottom = L.tabs ? L.tabs[0].y - 6 : r.y + r.h - 8 * ui;

            /* 한 영양단계가 사라졌을 때 안내 */
            if (simData.u.some(v => v === 0)) {
                const fs = textPx(14, ui);
                ctx.font = font(fs, 700);
                const maxW = r.w - 24 * ui;
                let lines = [LIMIT_MSG];
                if (ctx.measureText(LIMIT_MSG).width + 24 * ui > maxW) lines = LIMIT_MSG.split(' / ');
                const lh = fs * 1.4;
                const bw = Math.min(maxW, Math.max(...lines.map(t => ctx.measureText(t).width)) + 24 * ui);
                const bh = lines.length * lh + 10 * ui;
                const bx = r.x + (r.w - bw) / 2, by = stackBottom - bh;
                rrect(bx, by, bw, bh, 8 * ui);
                ctx.fillStyle = 'rgba(15,23,42,0.74)';
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                lines.forEach((t, i) => ctx.fillText(t, r.x + r.w / 2, by + 5 * ui + lh * (i + 0.5)));
            }
            ctx.restore();
        }

        /* ② 개체수피라미드: 아래부터 생산자 · 1차 소비자 · 2차 소비자 */
        function drawPyramid(r, L) {
            const ui = L.ui;
            drawCard(r, ui);
            const compact = r.h < 100;   /* 휴대폰 세로: 여백을 줄인다 */
            const m = compact ? 5 : Math.max(8, 10 * ui);
            const fsT = compact ? textPx(13, ui, 11.5, 14) : textPx(15.5, ui, 12, 22);
            const fsBase = textPx(13.5, ui);
            const padX = Math.max(10, 12 * ui), labelGap = Math.max(12, 16 * ui), valGap = Math.max(8, 10 * ui);
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.font = font(fsT, 700);
            ctx.fillStyle = '#334155';
            const titleY = r.y + m + fsT / 2;
            ctx.fillText('개체수피라미드', r.x + r.w / 2, titleY);
            const top = titleY + fsT / 2 + (compact ? 4 : Math.max(10, 12 * ui)), bottom = r.y + r.h - m;
            const rowH = (bottom - top) / 3;
            if (rowH < 8) return;
            /* 라벨끼리 겹치지 않게: 행 높이 ≥ 글자 × 1.5 (최소 10px) */
            const fs = Math.max(10, Math.min(fsBase, rowH / 1.5));
            const barH = Math.max(6, Math.min(rowH * 0.7, 46 * ui));
            ctx.font = font(fs, 600);
            const lh = fs * 1.35;
            const twoLine = !compact && (Math.max(...LV_NAMES.map(t => ctx.measureText(t).width)) + labelGap > r.w * 0.42) && rowH >= lh * 2;
            const labels = LV_NAMES.map(t => (twoLine ? t.replace('(', '\n(').split('\n') : [t]));
            const labelW = Math.max(...labels.flat().map(t => ctx.measureText(t).width)) + labelGap;
            ctx.font = font(fs, 700);
            const valW = ctx.measureText('000').width + valGap;
            const x0 = r.x + padX + labelW, x1 = r.x + r.w - padX;
            const cx = (x0 + x1) / 2, maxBar = Math.max(10, x1 - x0 - 2 * valW);
            const vals = simData.u.map((v, i) => Math.round(v * SIM_CONFIG.base[i]));
            const scale = Math.max(150, ...vals);
            for (let i = 0; i < 3; i++) {
                const y = bottom - (i + 1) * rowH + (rowH - barH) / 2;
                const bw = vals[i] > 0 ? Math.max(3 * ui, vals[i] / scale * maxBar) : 0;
                if (bw > 0) {
                    rrect(cx - bw / 2, y, bw, barH, 3 * ui);
                    ctx.fillStyle = LV_COLORS[i];
                    ctx.fill();
                } else {
                    ctx.setLineDash([3 * ui, 3 * ui]);
                    ctx.strokeStyle = LV_COLORS[i];
                    ctx.lineWidth = 1.2 * ui;
                    ctx.strokeRect(cx - 10 * ui, y, 20 * ui, barH);
                    ctx.setLineDash([]);
                }
                ctx.font = font(fs, 600);
                ctx.fillStyle = '#334155';
                ctx.textAlign = 'left';
                labels[i].forEach((t, k) => ctx.fillText(t, r.x + padX, y + barH / 2 + (k - (labels[i].length - 1) / 2) * lh));
                ctx.font = font(fs, 700);
                ctx.fillStyle = LV_COLORS[i];
                ctx.fillText(String(vals[i]), cx + Math.max(bw / 2, 10 * ui) + valGap, y + barH / 2);
            }
        }

        function graphMax(tStart) {
            let m = 0;
            simData.hist.forEach(s => { if (s.t >= tStart - 0.2) s.u.forEach((v, i) => { m = Math.max(m, v * SIM_CONFIG.base[i]); }); });
            simData.u.forEach((v, i) => { m = Math.max(m, v * SIM_CONFIG.base[i]); });
            return Math.max(150, Math.ceil(m * 1.1 / 50) * 50);
        }

        /* ③ 시간–개체수 그래프 */
        function drawGraph(r, L) {
            const ui = L.ui;
            drawCard(r, ui);
            const small = r.h < 120;     /* 아이폰SE 세로 등: 세로축 제목 생략, 범례·여백 축소 */
            const fs = small ? 10 : textPx(13.5, ui), fsT = textPx(15.5, ui, 12, 22), p = small ? 7 : Math.max(10, 12 * ui);
            const right = r.x + r.w - p;
            const rowH = (r.h >= 150 ? Math.max(fsT, fs) : fs) * 1.6;
            const swW = small ? 12 : 18 * ui, swGap = small ? 5 : Math.max(7, 8 * ui), itemGap = small ? 12 : Math.max(16, 18 * ui), titleGap = Math.max(16, 22 * ui);
            let x = r.x + p, y = r.y + p * 0.6;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'left';
            const showTitle = r.h >= 150;
            if (showTitle) {
                ctx.font = font(fsT, 700);
                ctx.fillStyle = '#334155';
                ctx.fillText('시간–개체수 그래프', x, y + rowH / 2);
                x += ctx.measureText('시간–개체수 그래프').width + titleGap;
            }
            ctx.font = font(fs, 600);
            const itemW = LV_NAMES.map(name => swW + swGap + ctx.measureText(name).width);
            /* 제목 옆에 범례가 다 들어가지 않으면 범례 전체를 제목 아래 줄로 */
            if (showTitle && x + itemW.reduce((a, b) => a + b, 0) + itemGap * 2 > right) { x = r.x + p; y += rowH; }
            LV_NAMES.forEach((name, i) => {
                if (x + itemW[i] > right && x > r.x + p) { x = r.x + p; y += rowH; }
                ctx.strokeStyle = LV_COLORS[i];
                ctx.lineWidth = 3 * ui;
                ctx.beginPath();
                ctx.moveTo(x, y + rowH / 2);
                ctx.lineTo(x + swW, y + rowH / 2);
                ctx.stroke();
                ctx.fillStyle = '#334155';
                ctx.fillText(name, x + swW + swGap, y + rowH / 2);
                x += itemW[i] + itemGap;
            });
            y += rowH + 4 * ui;

            const W = SIM_CONFIG.graphWindow;
            const tEnd = Math.max(simData.t, W), tStart = tEnd - W;
            const yMax = graphMax(tStart);
            ctx.font = font(fs, 500);
            const tickGap = Math.max(6, 8 * ui);
            const tickW = ctx.measureText(String(yMax)).width + tickGap;
            const noYLab = small || L.mode === 'land';   /* 작은 그래프·휴대폰 가로 탭: 세로축 제목 생략 */
            const yLabW = noYLab ? 0 : fs * 1.4 + Math.max(6, 8 * ui);
            const xLabH = small ? fs * 1.5 : fs * 1.8;   /* '시간 →'은 항상 플롯 아래(선과 겹치지 않게) */
            let box = { x: r.x + p + yLabW + tickW, y: y + fs * 0.6 + (small ? 2 : 6 * ui), w: 0, h: 0 };
            box.w = right - 8 * ui - box.x;
            box.h = r.y + r.h - p * 0.6 - box.y;
            box = avoidReset(box, L);
            const plot = { x: box.x, y: box.y, w: box.w, h: box.h - xLabH };
            if (plot.h < 16 || plot.w < 40) return;
            const X = t => plot.x + (t - tStart) / W * plot.w;
            const Y = v => plot.y + plot.h - v / yMax * plot.h;

            /* 눈금 */
            /* 겹치지 않는 간격(글자 × 1.3)이 될 때까지 눈금 간격을 넓히되, 눈금은 최소 3개 */
            let step = yMax <= 200 ? 50 : yMax <= 400 ? 100 : 200;
            while (plot.h / (yMax / step) < fs * 1.3 && yMax / (step * 2) >= 2) step *= 2;
            ctx.textAlign = 'right';
            ctx.lineWidth = 1 * ui;
            for (let v = 0; v <= yMax + 1e-6; v += step) {
                const yy = Y(v);
                ctx.strokeStyle = '#e2e8f0';
                ctx.beginPath();
                ctx.moveTo(plot.x, yy);
                ctx.lineTo(plot.x + plot.w, yy);
                ctx.stroke();
                ctx.fillStyle = '#64748b';
                ctx.fillText(String(v), plot.x - tickGap, yy);
            }
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.5 * ui;
            ctx.beginPath();
            ctx.moveTo(plot.x, plot.y);
            ctx.lineTo(plot.x, plot.y + plot.h);
            ctx.lineTo(plot.x + plot.w, plot.y + plot.h);
            ctx.stroke();

            /* 축 이름 */
            ctx.fillStyle = '#475569';
            ctx.font = font(fs, 600);
            const yLab = '상대 개체수';
            /* 세로축 제목은 플롯 바깥(눈금 숫자 왼쪽)에 세로로만. 자리가 없으면 그리지 않는다 */
            if (!noYLab && ctx.measureText(yLab).width <= plot.h + 8 * ui) {
                ctx.save();
                ctx.translate(r.x + p + fs * 0.7, plot.y + plot.h / 2);
                ctx.rotate(-Math.PI / 2);
                ctx.textAlign = 'center';
                ctx.fillText(yLab, 0, 0);
                ctx.restore();
            }
            ctx.textAlign = 'right';
            ctx.fillText('시간 (상대적) →', plot.x + plot.w, plot.y + plot.h + xLabH * 0.55);

            /* 교란한 때 */
            ctx.setLineDash([4 * ui, 4 * ui]);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1 * ui;
            simData.events.forEach(t => {
                if (t < tStart) return;
                ctx.beginPath();
                ctx.moveTo(X(t), plot.y);
                ctx.lineTo(X(t), plot.y + plot.h);
                ctx.stroke();
            });
            ctx.setLineDash([]);

            /* 세 개체군 선 */
            ctx.save();
            ctx.beginPath();
            ctx.rect(plot.x, plot.y - 4 * ui, plot.w + 4 * ui, plot.h + 6 * ui);
            ctx.clip();
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            for (let i = 0; i < 3; i++) {
                ctx.strokeStyle = LV_COLORS[i];
                ctx.lineWidth = 2.5 * ui;
                ctx.beginPath();
                let started = false;
                simData.hist.forEach(s => {
                    if (s.t < tStart - 0.2) return;
                    const px = X(s.t), py = Y(s.u[i] * SIM_CONFIG.base[i]);
                    if (started) ctx.lineTo(px, py); else { ctx.moveTo(px, py); started = true; }
                });
                ctx.lineTo(X(simData.t), Y(simData.u[i] * SIM_CONFIG.base[i]));
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(X(simData.t), Y(simData.u[i] * SIM_CONFIG.base[i]), 3.5 * ui, 0, Math.PI * 2);
                ctx.fillStyle = LV_COLORS[i];
                ctx.fill();
            }
            ctx.restore();
        }

        function drawTabs(L) {
            ctx.font = font(Math.max(12, 14 * L.ui), 700);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            L.tabs.forEach(t => {
                const on = simData.view === t.id;
                rrect(t.x, t.y, t.w, t.h, 8);
                ctx.fillStyle = on ? '#4f46e5' : 'rgba(255,255,255,0.95)';
                ctx.fill();
                ctx.strokeStyle = on ? '#4f46e5' : '#cbd5e1';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = on ? '#ffffff' : '#334155';
                ctx.fillText(t.label, t.x + t.w / 2, t.y + t.h / 2 + 0.5);
            });
        }

        /** 시뮬레이션 초기화 — 리셋 버튼·시나리오 변경 시 호출 (시나리오·속도는 유지) */
        function initSimulation() {
            resetState();
            setScenarioLabel();

            /* 엔진 상태 초기화 */
            sysState.isStarted = false; sysState.isPaused = false;
            sysState.zoomLevel = 1.0; sysState.offsetX = 0; sysState.offsetY = 0;

            if (!selfChecked) { selfChecked = true; selfCheckModel(); }

            stopLoop();
            updateUIState();
            draw();
        }

        /* ─────────────────────────────────────────────────────────────
           ✏️  draw() — 매 프레임 캔버스를 그리는 함수
           ───────────────────────────────────────────────────────────── */
        function draw() {
            if (!ctx || !canvas) return;
            syncControls();
            const w = sysState.canvasLogicalWidth;
            const h = sysState.canvasLogicalHeight;
            if (!w || !h) return;
            const L = computeLayout(w, h);
            simData.layout = L;

            ctx.clearRect(0, 0, w, h);
            ctx.save();
            ctx.imageSmoothingEnabled = false;   /* 도트 그림을 선명하게 */
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, w, h);
            if (L.mode === 'land') {
                if (simData.view === 'graph') drawGraph(L.graph, L);
                else drawScene(L.scene, L);
                drawPyramid(L.pyr, L);
                drawTabs(L);
            } else {
                drawScene(L.scene, L);
                drawPyramid(L.pyr, L);
                drawGraph(L.graph, L);
            }
            drawPopup(L);
            ctx.restore();
        }

        /* ─────────────────────────────────────────────────────────────
           ✏️  updatePhysics() — 매 프레임 계산 (실행 중에만)
           ───────────────────────────────────────────────────────────── */
        function updatePhysics() {
            if (!sysState.isStarted || sysState.isPaused || sysState.isDragging) return;
            const now = performance.now();
            let real = simData.lastNow ? (now - simData.lastNow) / 1000 : 1 / 60;
            simData.lastNow = now;
            real = clampN(real, 0, 0.05);
            simData.anim += real;
            simData.popup = false;   /* 팝업을 닫지 않고 계속하기를 눌러도 닫힌다 */
            /* 시작(계속하기)을 누른 첫 프레임에 고른 교란을 적용 (예측도 이때 읽는다) */
            if (simData.pending) {
                const pd = simData.pending;
                simData.pending = null;
                simData.autoStopped = false;
                applyDisturbance(pd.level, pd.dir);
            }
            let remain = real * (SIM_CONFIG.speed[simData.speed] || SIM_CONFIG.speed.normal);
            const wasRecovered = simData.phase === 'recovered';
            const wasJudged = !!(simData.pert && simData.pert.done);
            while (remain > 1e-9) {
                const h = Math.min(SIM_CONFIG.dt, remain);
                advance(h);
                remain -= h;
            }
            const p = simData.pert;
            /* 첫 반응 판정이 나면 잠시 멈추고 예측 결과 팝업을 연다 (닫으면 이어서 실행) */
            if (!wasJudged && p && p.done && p.judge === 'ok') {
                simData.lastNow = 0;
                sysState.isPaused = true;
                stopLoop();
                updateUIState();
                openPredictResult(true);
            }
            /* 평형으로 돌아오면 자동으로 멈춘다 (사라진 영양단계가 있으면 회복되지 않으므로 멈추지 않음) */
            else if (!wasRecovered && simData.phase === 'recovered') {
                simData.autoStopped = true;
                simData.popup = true;
                uiSound.playDone();
                simData.lastNow = 0;
                sysState.isPaused = true;
                stopLoop();
                updateUIState();
            }
            /* 사라진 영양단계가 있고 더 이상 변하지 않으면(판정도 끝남) 멈춘다 — 끝없이 실행 중으로 두지 않음 */
            else if (simData.u.some(v => v === 0) && (!simData.pert || simData.pert.done)
                && Math.max(...modelRates(simData.u).map((v, i) => Math.abs(v) * SIM_CONFIG.base[i])) < 0.01) {
                simData.autoStopped = true;
                simData.lastNow = 0;
                sysState.isPaused = true;
                stopLoop();
                updateUIState();
            }
        }
        /* ████ ZONE F 끝 ████████████████████████████████████████████████████████ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE G — LOOP & TAB STATE MANAGER (수정 금지)
           ════════════════════════════════════════════════════════════════════════ */
        function startLoop() { if (!sysState.isLooping) { sysState.isLooping = true; updateLoop(); } }
        function stopLoop() { sysState.isLooping = false; }
        function updateLoop() {
            if (!sysState.isLooping) return;
            updatePhysics(); draw();
            requestAnimationFrame(updateLoop);
        }

        function saveTabState(shape) {
            const selectedRadio = document.querySelector('input[name="simOption"]:checked')?.value;
            const selectedVal = DOM.customSelectTrigger?.getAttribute('data-selected-value') || null;
            tabStates[shape] = {
                ...simData,
                isStarted: sysState.isStarted, isPaused: sysState.isPaused,
                zoomLevel: sysState.zoomLevel, offsetX: sysState.offsetX, offsetY: sysState.offsetY,
                selectVal: selectedVal, radioVal: selectedRadio
            };
        }

        function loadTabState(shape) {
            const state = tabStates[shape];
            if (state) {
                Object.assign(simData, state);
                sysState.isStarted = state.isStarted; sysState.isPaused = state.isPaused;
                sysState.zoomLevel = state.zoomLevel || 1.0;
                sysState.offsetX = state.offsetX || 0;
                sysState.offsetY = state.offsetY || 0;

                const csvEl = document.getElementById('customSelectValue');
                if (state.selectVal) {
                    const li = document.querySelector(`#customSelectList li[data-value="${state.selectVal}"]`);
                    if (li && csvEl) { csvEl.innerHTML = li.innerHTML; DOM.customSelectTrigger?.setAttribute('data-selected-value', state.selectVal); }
                } else {
                    if (csvEl) csvEl.textContent = '학습 내용을 선택하세요';
                    DOM.customSelectTrigger?.removeAttribute('data-selected-value');
                }
                const radio = document.querySelector(`input[name="simOption"][value="${state.radioVal}"]`);
                if (radio) radio.checked = true;
            } else {
                simData.value1 = SIM_CONFIG.slider.initialValue;
                simData.diameter = SIM_CONFIG.object.radius * 2;
                simData.radius = SIM_CONFIG.object.radius;
                simData.ratioA = 1; simData.ratioB = 1;
                sysState.isStarted = false; sysState.isPaused = false;
                sysState.zoomLevel = 1.0; sysState.offsetX = 0; sysState.offsetY = 0;
                if (canvas) { simData.x = sysState.canvasLogicalWidth / 2; simData.y = sysState.canvasLogicalHeight / 2; }
                const csvEl = document.getElementById('customSelectValue');
                if (csvEl) csvEl.textContent = '학습 내용을 선택하세요';
                DOM.customSelectTrigger?.removeAttribute('data-selected-value');
                const dr = document.querySelector('input[name="simOption"][value="parallel"]');
                if (dr) dr.checked = true;
            }

            if (varSlider1) varSlider1.value = simData.value1;
            if (varDisplay1) varDisplay1.textContent = `${simData.value1} ${SIM_CONFIG.slider.unit}`;
            if (DOM.directInputSingle) DOM.directInputSingle.value = simData.diameter;
            if (DOM.ratioInputA) DOM.ratioInputA.value = simData.ratioA;
            if (DOM.ratioInputB) DOM.ratioInputB.value = simData.ratioB;

            sysState.isStarted && !sysState.isPaused ? startLoop() : stopLoop();
            updateUIState(); draw();
        }

        function updateUIState() {
            updateZoomButtons();

        /* ════════════════════════════════════════════════════════════════════════

        function limitOffset() {
            if (!canvas) return;

                    sysState.offsetX = 0; sysState.offsetY = 0;
                }

            sysState.offsetX = Math.max(R - simData.x, Math.min((sysState.canvasLogicalWidth - R) - simData.x, sysState.offsetX));
            sysState.offsetY = Math.max(R - simData.y, Math.min((sysState.canvasLogicalHeight - R) - simData.y, sysState.offsetY));

            sysState.canvasLogicalHeight = rect.height;
            simData.x = rect.width / 2; simData.y = rect.height / 2;
            for (const k in tabStates) { if (tabStates[k]) { tabStates[k].x = rect.width / 2; tabStates[k].y = rect.height / 2; } }

            !!(document.fullscreenElement || document.webkitFullscreenElement);

        const FULLSCREEN_HISTORY_CLEANUP_DELAY = 400;
        const isNaverInAppBrowser = () => /NAVER\s*\((?:inapp|higgs);/i.test(navigator.userAgent);

        let fullscreenExitFromHistory = false;
        let fullscreenHistoryCleanup = false;
        let fullscreenHistoryCleanupTimer = null;
        let previousScrollRestoration = null;

        const addFullscreenHistoryToken = stateValue => {
            if (!fullscreenHistoryToken) return stateValue;
            return { ...stateValue, [FULLSCREEN_HISTORY_KEY]: fullscreenHistoryToken };
        };

        const clearFullscreenHistoryTracking = () => {
            clearTimeout(fullscreenHistoryCleanupTimer);
            fullscreenHistoryCleanupTimer = null;
            if (previousScrollRestoration !== null && 'scrollRestoration' in history) {
                history.scrollRestoration = previousScrollRestoration;
            }
            previousScrollRestoration = null;
            fullscreenHistoryToken = null;
            fullscreenExitFromHistory = false;
            fullscreenHistoryCleanup = false;
        };

        const pushFullscreenHistoryEntry = () => {
            if (!isNaverInAppBrowser() || fullscreenHistoryToken) return;
            const token = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
            try {
                if ('scrollRestoration' in history && previousScrollRestoration === null) {
                    previousScrollRestoration = history.scrollRestoration;
                    history.scrollRestoration = 'manual';
                }
                history.pushState({ [FULLSCREEN_HISTORY_KEY]: token }, '');
                fullscreenHistoryToken = token;
            } catch (_) {
                clearFullscreenHistoryTracking();
            }
        };

        const restoreFullscreenHistoryEntry = () => {
            const shouldRestore = isFullscreenActive();
            clearFullscreenHistoryTracking();
            if (shouldRestore) pushFullscreenHistoryEntry();
        };

        const exitFullscreenFromHistory = () => {
            const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
            if (!exitFullscreen) {
                restoreFullscreenHistoryEntry();
                return;
            }
            const token = fullscreenHistoryToken;
            const restoreEntry = () => {
                if (fullscreenHistoryToken === token) restoreFullscreenHistoryEntry();
            };
            fullscreenExitFromHistory = true;
            try {
                const result = exitFullscreen.call(document);
                if (result && typeof result.catch === 'function') result.catch(restoreEntry);
            } catch (_) {
                restoreEntry();
            }
        };

        const cleanupFullscreenHistoryEntry = () => {
            const token = fullscreenHistoryToken;
            if (!token || !history.state || history.state[FULLSCREEN_HISTORY_KEY] !== token) {
                clearFullscreenHistoryTracking();
                return;
            }
            fullscreenHistoryCleanup = true;
            history.back();
        };

        const scheduleFullscreenHistoryCleanup = () => {
            const token = fullscreenHistoryToken;
            clearTimeout(fullscreenHistoryCleanupTimer);
            fullscreenHistoryCleanupTimer = setTimeout(() => {
                if (fullscreenHistoryToken !== token || isFullscreenActive()) return;
                const state = history.state;

                return;
            }

            else clearFullscreenHistoryTracking();

        function toggleFullScreen() {

            toast.innerHTML = '<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>';
            toast.appendChild(document.createTextNode(message));

        let fullscreenNumberExitResetTimer = null;

        const resetFullscreenNumberExitTracking = () => {

        /* ████████████████████████████████████████████████████████████████████████

        function bindInputEvents() {
            /* 실행 중(일시정지 아님)에는 설정 입력을 무시한다 */
            const isRunning = () => sysState.isStarted && !sysState.isPaused;

            /* 시나리오 — 드롭다운 커스텀 셀렉트 (실행 중에는 코어가 잠금) */
            const trigger = DOM.customSelectTrigger;
            const list = DOM.customSelectList;
            if (trigger && list) {
                const items = list.querySelectorAll('li');
                const toggleDropdown = (show) => {
                    show = show !== undefined ? show : list.classList.contains('hidden');
                    if (show) { list.classList.remove('hidden'); trigger.setAttribute('aria-expanded', 'true'); }
                    else { list.classList.add('hidden'); trigger.setAttribute('aria-expanded', 'false'); }
                };
                trigger.addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown(); });
                trigger.addEventListener('keydown', (e) => {
                    if (['Enter', ' ', 'ArrowDown'].includes(e.key)) { e.preventDefault(); toggleDropdown(true); items[0]?.focus(); }
                });
                list.addEventListener('click', (e) => {
                    const item = e.target.closest('li'); if (!item) return;
                    e.stopPropagation();
                    toggleDropdown(false);
                    if (isRunning()) return;
                    uiSound.playClick();
                    loadScenario(item.getAttribute('data-value'));
                });
                items.forEach((item, i) => {
                    item.addEventListener('keydown', (e) => {
                        if (['Enter', ' '].includes(e.key)) { e.preventDefault(); item.click(); trigger.focus(); }
                        else if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length]?.focus(); }
                        else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length]?.focus(); }

            const allOk = f.right === f.lines.length;
