                        <button type="button" data-close class="modal-close-btn transition-colors" aria-label="닫기"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                    </div>
                    <div class="modal-body">
                        <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
                            <p class="font-bold text-slate-700">교란 : <span class="text-indigo-600">${f.title}</span></p>
                            <p class="text-lg font-bold ${allOk ? 'text-emerald-700' : 'text-rose-600'}">예측 ${f.lines.length}개 중 ${f.right}개 맞음</p>
                        </div>
                        <table class="w-full text-sm lg:text-base">
                            <thead><tr class="text-slate-500">
                                <th scope="col" class="py-2 pr-2 text-left font-bold">개체군</th>
                                <th scope="col" class="py-2 px-2 text-center font-bold">내 예측</th>
                                <th scope="col" class="py-2 px-2 text-center font-bold">실제 첫 변화</th>
                                <th scope="col" class="py-2 pl-2 text-center font-bold">결과</th>
                            </tr></thead>
                            <tbody>${f.lines.map(l => `<tr class="border-t border-slate-200">
                                <th scope="row" class="py-2.5 pr-2 text-left font-bold text-slate-700">${LV_SHORT[l.level]}</th>
                                <td class="py-2.5 px-2 text-center text-slate-700">${l.pred}</td>
                                <td class="py-2.5 px-2 text-center font-bold text-slate-800">${l.obs}</td>
                                <td class="py-2.5 pl-2 text-center font-bold whitespace-nowrap ${l.ok ? 'text-emerald-700' : 'text-rose-600'}">${ICON(l.ok)}${l.ok ? '맞음' : '틀림'}</td>
                            </tr>`).join('')}</tbody>
                        </table>
                        <div class="guide-block">
                            <h4 class="guide-title mb-2">왜 그럴까요?</h4>
                            <ul class="guide-desc list-disc pl-5 space-y-1.5">${f.lines.map(l => `<li>${reason(l.level)}</li>`).join('')}</ul>
                        </div>
                        <button type="button" data-close class="btn-action-start self-center px-8 py-2 border rounded-lg transition-colors">${resume ? '계속 관찰하기' : '닫기'}</button>
                    </div>
                </div>`;
            /* 전체 화면일 때도 보이도록 workspace 안에 넣는다 */
            (document.getElementById('workspace') || document.body).appendChild(box);
            const close = () => {
                box.remove();
                document.removeEventListener('keydown', onKey);
                if (resume && sysState.isStarted && sysState.isPaused) {
                    sysState.isPaused = false;
                    simData.lastNow = 0;
                    startLoop();
                }
                updateUIState();
                draw();
            };
            const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
            document.addEventListener('keydown', onKey);
            box.addEventListener('click', e => {
                if (e.target === box || e.target.closest('[data-close]')) { uiSound.playClick(); close(); }
            });
            box.querySelector('.btn-action-start')?.focus();
        }
        /* ████ ZONE I 끝 ████████████████████████████████████████████████████████ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE J — CORE EVENT BINDING (수정 금지)
           전체화면·모달·셔터·캔버스 드래그·줌·탭·토스트 이벤트 처리
           ════════════════════════════════════════════════════════════════════════ */
        function bindCoreEvents() {

            /* 동작 중 입력 차단 토스트 */
            const showDisabledToast = (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                showSimulationToast('일시정지 후 설정을 변경해 주세요.');
            };

            const interceptInteraction = (e) => {
                if (!(sysState.isStarted && !sysState.isPaused)) return;
                const disabledControl = e.target.closest?.(':disabled, [aria-disabled="true"], .tab-btn');
                const disabledLabel = e.target.closest?.('label');
                if (!disabledControl && !disabledLabel?.querySelector(':disabled')) return;
                showDisabledToast(e);
            };

            ['controlsWrapper', 'shapeTabs'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('pointerdown', interceptInteraction, true);
                    el.addEventListener('click', interceptInteraction, true);
                    el.addEventListener('keydown', interceptInteraction, true);
                }
            });

            /* 손가락·펜 입력 피드백 — 모바일 펜의 hover/press 상태도 버튼과 옵션에 동일 적용 */
            const TAP_FEEDBACK_SELECTOR = 'button, [role="button"], .radio-label, #customSelectList [role="option"]';
            const isFeedbackDisabled = (control) =>
                control.matches(':disabled, [aria-disabled="true"]') || !!control.querySelector(':disabled');
            document.addEventListener('pointerdown', (e) => {
                if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
                const control = e.target.closest?.(TAP_FEEDBACK_SELECTOR);
                if (!control || isFeedbackDisabled(control)) return;
                control.classList.add('is-tap-feedback');
                clearTimeout(control._tapFeedbackTimer);
                const feedbackDuration = control.matches('.ratio-step-btn') ? 500 : 250;
                control._tapFeedbackTimer = setTimeout(() => {
                    control.classList.remove('is-tap-feedback');
                    control.blur();
                }, feedbackDuration);
            });
            document.addEventListener('pointerover', (e) => {
                if (e.pointerType !== 'pen' || e.buttons !== 0) return;
                const control = e.target.closest?.(TAP_FEEDBACK_SELECTOR);
                if (!control || isFeedbackDisabled(control)) return;
                control.classList.add('is-pen-hover');
            });
            document.addEventListener('pointerout', (e) => {
                if (e.pointerType !== 'pen') return;
                const control = e.target.closest?.(TAP_FEEDBACK_SELECTOR);
                if (!control || control.contains(e.relatedTarget)) return;
                control.classList.remove('is-pen-hover');
            });
            document.addEventListener('pointerup', (e) => {
                if (e.pointerType !== 'pen' || matchMedia('(any-hover: hover)').matches) return;
                e.target.closest?.(TAP_FEEDBACK_SELECTOR)?.classList.remove('is-pen-hover');
            });

            /* 사운드 */
            const soundBtn = document.getElementById('sound-toggle-btn');
            const popup = document.getElementById('volume-popup');
            const muteBtn = document.getElementById('popup-mute-btn');
            const slider = document.getElementById('volume-slider');
            if (soundBtn && popup && muteBtn && slider) {
                uiSound.setDOM(document.getElementById('sound-icon-main'), document.getElementById('sound-icon-popup'), slider);
                soundBtn.addEventListener('click', (e) => { e.stopPropagation(); popup.classList.toggle('w-48'); popup.classList.toggle('w-0'); popup.classList.toggle('opacity-0'); popup.classList.toggle('opacity-100'); });
                muteBtn.addEventListener('click', (e) => { e.stopPropagation(); uiSound.toggleMute(); if (parseFloat(slider.value) === 0) { popup.classList.remove('w-48', 'opacity-100'); popup.classList.add('w-0', 'opacity-0'); } });
                slider.addEventListener('input', (e) => uiSound.setVolume(e.target.value));
                window.addEventListener('click', (e) => { if (!soundBtn.contains(e.target) && !popup.contains(e.target) && popup.classList.contains('w-48')) { popup.classList.remove('w-48', 'opacity-100'); popup.classList.add('w-0', 'opacity-0'); } });
            }

            /* 모바일 메뉴 */
            const moreMenuBtn = document.getElementById('moreMenuBtn');
            const mobileMenuPanel = document.getElementById('mobileMenuPanel');
            if (moreMenuBtn && mobileMenuPanel) {
                const close = () => { mobileMenuPanel.classList.remove('w-[84px]', 'opacity-100'); mobileMenuPanel.classList.add('w-0', 'opacity-0'); };
                const toggle = () => {
                    uiSound.playClick();
                    const isOpen = mobileMenuPanel.classList.contains('w-[84px]');
                    if (!isOpen) { mobileMenuPanel.classList.remove('w-0', 'opacity-0'); mobileMenuPanel.classList.add('w-[84px]', 'opacity-100'); }
                    else { close(); }
                };
                moreMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
                window.addEventListener('resize', () => { if (isFullscreenActive()) return; if (getComputedStyle(moreMenuBtn).display === 'none' && mobileMenuPanel.classList.contains('w-[84px]')) { close(); } });
                window.addEventListener('click', (e) => { if (!moreMenuBtn.contains(e.target) && !mobileMenuPanel.contains(e.target) && mobileMenuPanel.classList.contains('w-[84px]')) { close(); } });
            }

            /* 전체화면 */
            bindEvent('fullscreen-btn', 'click', toggleFullScreen);
            bindEvent('fullscreen-btn-mobile', 'click', toggleFullScreen);

            /* 모달 */
            const toggleModal = (id, show) => {
                uiSound.playClick();
                const modal = document.getElementById(id); if (!modal) return;
                if (show) { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; history.pushState(addFullscreenHistoryToken({ modalOpen: id }), ''); }
                else { modal.classList.add('hidden'); document.body.style.overflow = ''; if (history.state?.modalOpen === id) history.back(); }
            };
            window.addEventListener('popstate', () => {
                ['helpBox', 'conceptBox', 'quizBox'].forEach(id => document.getElementById(id)?.classList.add('hidden'));
                document.body.style.overflow = '';
            });
            document.addEventListener('keydown', (event) => {
                if (event.key !== 'Escape') return;
                const openModalId = ['helpBox', 'conceptBox', 'quizBox'].find(id => {
                    const modal = document.getElementById(id);
                    return modal && !modal.classList.contains('hidden');
                });
                if (!openModalId) return;
                event.preventDefault();
                toggleModal(openModalId, false);
            });
            bindEvent('helpBtn', 'click', () => toggleModal('helpBox', true));
            bindEvent('help-Btn', 'click', () => toggleModal('helpBox', true));
            bindEvent('closeHelpBtn', 'click', () => toggleModal('helpBox', false));
            bindEvent('conceptBtn', 'click', () => toggleModal('conceptBox', true));
            bindEvent('closeConceptBtn', 'click', () => toggleModal('conceptBox', false));
            bindEvent('closeQuizBtn', 'click', () => toggleModal('quizBox', false));

            /* 셔터 */
            const shutterToggle = document.getElementById('shutter-toggle');
            const shutterContent = document.getElementById('shutter-content');
            const shutterIcon = document.getElementById('shutter-icon');
            if (shutterToggle && shutterContent) {
                const shutterText = shutterToggle.querySelector('span');
                shutterToggle.addEventListener('click', () => {
                    uiSound.playClick();
                    const isOpen = shutterContent.classList.toggle('is-open');
                    shutterToggle.classList.toggle('is-open', isOpen);
                    if (shutterIcon) shutterIcon.classList.toggle('rotate-180', isOpen);
                    if (shutterText) shutterText.textContent = isOpen ? '학습 가이드 닫기' : '학습 가이드 보기';
                });
            }

            /* 시작/일시정지 */
            bindEvent('pauseBtn', 'click', () => {
                uiSound.playClick();
                if (!sysState.isStarted) { sysState.isStarted = true; sysState.isPaused = false; startLoop(); }
                else { sysState.isPaused = !sysState.isPaused; sysState.isPaused ? stopLoop() : startLoop(); }
                updateUIState(); draw();
            });

            /* 리셋 */
            bindEvent('resetBtn', 'click', () => { uiSound.playClick(); initSimulation(); });

            /* 퀴즈 */
            function stabilizeQuizLayout() {
                if (!CONTENT_CONFIG.quizzes?.length) return;
                const sizerQ = document.getElementById('sizerQ');
                const sizerA = document.getElementById('sizerA');
                if (!sizerQ || !sizerA) return; // 뼈대가 없으면 작동 안 함

                let longestQ = '', longestA = '';

                // 1) 전체 퀴즈를 순회하면서 가장 긴 질문과 정답을 찾습니다.
                CONTENT_CONFIG.quizzes.forEach(({ q, a }) => {
                    if (q.length > longestQ.length) longestQ = q;
                    if (a.length > longestA.length) longestA = a;
                });

                // 2) 찾아낸 가장 긴 텍스트를 투명 뼈대(Sizer)에 꽂아 넣습니다. (끝!)
                sizerQ.textContent = longestQ;
                sizerA.textContent = longestA;
            }

            function updateQuizUI() {
                if (!CONTENT_CONFIG.quizzes?.length) return;
                const q = CONTENT_CONFIG.quizzes[sysState.currentQuizIndex];
                const stepEl = document.getElementById('quizStep');
                const qEl = document.getElementById('questionText');
                const aEl = document.getElementById('answerText');
                const showBtn = document.getElementById('showAnswerBtn');
                const prevBtn = document.getElementById('prevQuizBtn');
                const nextBtn = document.getElementById('nextQuizBtn');
                if (stepEl) stepEl.textContent = `질문 ${sysState.currentQuizIndex + 1} / ${CONTENT_CONFIG.quizzes.length}`;
                if (qEl) qEl.innerText = q.q;
                if (aEl) { aEl.textContent = q.a; aEl.classList.add('hidden'); }
                if (showBtn) showBtn.classList.remove('hidden');
                if (prevBtn) prevBtn.disabled = sysState.currentQuizIndex === 0;
                if (nextBtn) nextBtn.disabled = sysState.currentQuizIndex === CONTENT_CONFIG.quizzes.length - 1;
            }
            bindEvent('quizBtn', 'click', () => { sysState.currentQuizIndex = 0; updateQuizUI(); toggleModal('quizBox', true); requestAnimationFrame(stabilizeQuizLayout); });
            bindEvent('showAnswerBtn', 'click', () => { uiSound.playClick(); document.getElementById('answerText')?.classList.remove('hidden'); document.getElementById('showAnswerBtn')?.classList.add('hidden'); });
            bindEvent('nextQuizBtn', 'click', () => { if (sysState.currentQuizIndex < CONTENT_CONFIG.quizzes.length - 1) { uiSound.playClick(); sysState.currentQuizIndex++; updateQuizUI(); } });
            bindEvent('prevQuizBtn', 'click', () => { if (sysState.currentQuizIndex > 0) { uiSound.playClick(); sysState.currentQuizIndex--; updateQuizUI(); } });
            window.addEventListener('resize', debounce(stabilizeQuizLayout, 100));

            /* 캔버스 상단 탭 */
            const shapeTabsDOM = document.getElementById('shapeTabs');
            if (shapeTabsDOM) {
                const updateTabScrollIndicators = () => {
                    const leftInd = document.getElementById('tabScrollLeft');
                    const rightInd = document.getElementById('tabScrollRight');
                    if (!leftInd || !rightInd) return;
                    const maxSL = shapeTabsDOM.scrollWidth - shapeTabsDOM.clientWidth;
                    leftInd.classList.toggle('opacity-0', shapeTabsDOM.scrollLeft <= 1);
                    leftInd.classList.toggle('pointer-events-none', shapeTabsDOM.scrollLeft <= 1);
                    leftInd.classList.toggle('opacity-100', shapeTabsDOM.scrollLeft > 1);
                    rightInd.classList.toggle('opacity-0', Math.ceil(shapeTabsDOM.scrollLeft) >= maxSL - 1 || maxSL <= 0);
                    rightInd.classList.toggle('pointer-events-none', Math.ceil(shapeTabsDOM.scrollLeft) >= maxSL - 1 || maxSL <= 0);
                    rightInd.classList.toggle('opacity-100', Math.ceil(shapeTabsDOM.scrollLeft) < maxSL - 1 && maxSL > 0);
                };
                shapeTabsDOM.addEventListener('scroll', updateTabScrollIndicators);
                window.addEventListener('resize', debounce(updateTabScrollIndicators, 100));
                setTimeout(updateTabScrollIndicators, 150);

                bindEvent('btnScrollLeft', 'click', () => { uiSound.playClick(); shapeTabsDOM.scrollBy({ left: -120, behavior: 'smooth' }); });
                bindEvent('btnScrollRight', 'click', () => { uiSound.playClick(); shapeTabsDOM.scrollBy({ left: 120, behavior: 'smooth' }); });

                let isDownTab = false, startXTab = 0, scrollLeftTab = 0;
                shapeTabsDOM.addEventListener('mousedown', (e) => { isDownTab = true; startXTab = e.pageX - shapeTabsDOM.offsetLeft; scrollLeftTab = shapeTabsDOM.scrollLeft; });
                shapeTabsDOM.addEventListener('mouseleave', () => isDownTab = false);
                shapeTabsDOM.addEventListener('mouseup', () => isDownTab = false);
                shapeTabsDOM.addEventListener('mousemove', (e) => { if (!isDownTab) return; e.preventDefault(); shapeTabsDOM.scrollLeft = scrollLeftTab - (e.pageX - shapeTabsDOM.offsetLeft - startXTab) * 1.5; });

                const tabBtns = shapeTabsDOM.querySelectorAll('.tab-btn');
                shapeTabsDOM.addEventListener('click', (e) => {
                    const target = e.target.closest('.tab-btn');
                    if (!target || (sysState.isStarted && !sysState.isPaused)) return;
                    const newShape = target.getAttribute('data-shape');
                    if (simData.shape === newShape) return;
                    saveTabState(simData.shape);
                    tabBtns.forEach(b => { b.classList.remove('border-indigo-600', 'text-indigo-600', 'bg-white'); b.classList.add('border-transparent', 'text-slate-500', 'bg-transparent', 'desktop-only:hover:bg-slate-200/50'); });
                    target.classList.remove('border-transparent', 'text-slate-500', 'bg-transparent', 'desktop-only:hover:bg-slate-200/50');
                    target.classList.add('border-indigo-600', 'text-indigo-600', 'bg-white');
                    simData.shape = newShape;
                    loadTabState(simData.shape);
                });
            }

            /* 전체화면 마우스 오버 */
            let fullscreenHoverTimer;
            document.addEventListener('mousemove', (e) => {
                if (!document.fullscreenElement) return;
                const exitUI = document.getElementById('fullscreen-exit-ui'); if (!exitUI) return;
                if (e.clientY < 80) { exitUI.classList.remove('opacity-0'); exitUI.classList.add('opacity-100'); clearTimeout(fullscreenHoverTimer); }
                else { clearTimeout(fullscreenHoverTimer); fullscreenHoverTimer = setTimeout(() => { exitUI.classList.remove('opacity-100'); exitUI.classList.add('opacity-0'); }, 10); }
            });
        }
        /* ════ ZONE J 끝 ════════════════════════════════════════════════════════ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE K — 초기 실행 (수정 금지)
           ════════════════════════════════════════════════════════════════════════ */
        const resizeObserver = new ResizeObserver(() => resizeCanvas());

        window.addEventListener('load', () => {
            if (container) resizeObserver.observe(container);
            bindCoreEvents();   /* 🚫 코어 이벤트 바인딩 */
            bindInputEvents();  /* ✏️ 입력 이벤트 바인딩 (ZONE I) */
            initSimulation();   /* ✏️ 시뮬레이션 초기화  (ZONE F) */
        });
        /* ════ ZONE K 끝 ════════════════════════════════════════════════════════ */
    </script>
</body>
