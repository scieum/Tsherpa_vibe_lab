<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산화·환원 반응</title><!-- JS의 CONTENT_CONFIG.title로 자동 변경됩니다 -->

    <!-- ════════════════════════════════════════════════════════
         🚫 [수정 금지] 핵심 라이브러리 — KaTeX · Tailwind CSS
         ════════════════════════════════════════════════════════ -->
    <link rel="icon" href="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_short.png"
        type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ════════════════════════════════════════════════════════
         ⚙️  [선택 수정] Tailwind 테마 — 브랜드 색상·폰트만 변경
         ════════════════════════════════════════════════════════ -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: { 'desktop-only': { 'raw': '(hover: hover) and (pointer: fine)' } },
                    colors: { primary: '#4f46e5' },   /* ✏️ 브랜드 색상 */
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] }
                }
            }
        }
    </script>
    <script>
        /* 모바일에서 생략되는 number 스피너만 보완하고 PC 네이티브 UI는 유지 */
        const isIPadDevice =
            /iPad/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isMobileNumberUI =
            navigator.userAgentData?.mobile === true ||
            /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
            isIPadDevice;
        if (isMobileNumberUI) document.documentElement.classList.add('mobile-number-controls');
    </script>

    <style>
        html,
        body,
        button,
        input,
        select,
        textarea {
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* ════════════════════════════════════════════════════════
           ⚙️  [선택 수정] CSS 변수 — 전체 색상·폰트 크기 일괄 조정
           ════════════════════════════════════════════════════════ */
        :root {
            /* 폰트 크기 */
            --font-size-title: 1.275rem;
            --font-size-modal: 1.15rem;
            --font-size-guide: 1.025rem;
            --font-size-desc: 1rem;
            --font-size-small: 0.9rem;
            --font-size-tiny: 0.75rem;

            /* 텍스트 색상 */
            --color-text-main: #334155;
            --color-text-sub: #475569;
            --color-text-light: #64748b;

            /* 테마 포인트 색상 */
            --color-primary: #4f46e5;
            /* ✏️ 메인 포인트 색상 */
            --color-primary-bg: #e0e7ff;
            --color-tab-bg: #d8e0ff80;
            --color-action: #059669;
            --color-action-hover: #047857;
            --color-pause: #e11d48;
            --color-pause-bg: #fff1f2;
            --color-pause-border: #fecdd3;
            --color-obs1: #ea580c;
        }

        /* ════════════════════════════════════════════════════════
           ⚙️  [선택 수정] 디자인 클래스 매핑 — CSS 변수를 UI 요소에 적용
           ════════════════════════════════════════════════════════ */
        .sim-title {
            font-size: var(--font-size-title);
            font-weight: 700;
            color: var(--color-text-main);
            line-height: 1.25;
        }

        .guide-on-off {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: var(--color-text-light);
        }

        .guide-title {
            font-size: var(--font-size-guide);
            color: var(--color-primary);
            font-weight: 700;
        }

        .guide-desc {
            font-size: var(--font-size-desc);
            color: var(--color-text-sub);
        }

        .env-text {
            font-weight: 700;
            color: var(--color-text-light);
            font-size: var(--font-size-tiny);
        }

        .tab-btn {
            font-weight: 700;
            color: var(--color-text-light);
            font-size: var(--font-size-small);
        }

        @media (min-width: 768px) {
            .env-text {
                font-size: var(--font-size-small);
            }
        }

        .helper-text-default {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .helper-text-running {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-pause);
        }

        .helper-text-paused {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: #d97706;
        }

        .var-label-control {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-main);
        }

        .var-label-obs1 {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-obs1);
        }

        .var-label-obs2 {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-action);
        }

        .var-label-var {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: var(--color-text-main);
        }

        .slider-limit-label {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: #94a3b8;
        }

        .var-unit-display {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-primary);
            background-color: var(--color-primary-bg);
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
        }

        .select-option-text {
            font-size: var(--font-size-tiny);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .header-button {
            background-color: #fff;
            color: var(--color-text-sub);
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (hover: hover) and (pointer: fine) {
            .header-button:hover {
                background-color: #f1f5f9;
            }
        }

        .btn-action-start {
            background-color: var(--color-action);
            color: #fff;
            border-color: var(--color-action-hover);
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-action-start:hover {
                background-color: var(--color-action-hover);
            }
        }

        .btn-action-pause {
            background-color: var(--color-pause-bg);
            color: var(--color-pause);
            border-color: var(--color-pause-border);
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        .btn-sub {
            background-color: #fff;
            color: var(--color-text-main);
            border-color: #cbd5e1;
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-sub:hover {
                background-color: #f1f5f9;
            }
        }

        .btn-reset-custom {
            color: var(--color-text-main);
            border-color: #cbd5e1;
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-reset-custom:hover {
                color: var(--color-pause);
                border-color: #fda4af;
                background-color: var(--color-pause-bg);
            }
        }

        .modal-title {
            font-size: var(--font-size-modal);
            font-weight: 700;
            color: #1e293b;
        }

        .modal-close-btn {
            color: #94a3b8;
        }

        @media (hover: hover) and (pointer: fine) {
            .modal-close-btn:hover {
                color: #f43f5e;
            }
        }

        .concept-title-1 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #c2410c;
        }

        .concept-title-2 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #047857;
        }

        .concept-title-3 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #4338ca;
        }

        .concept-title-4 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #6e0478;
        }

        .concept-desc {
            font-size: var(--font-size-desc);
            color: var(--color-text-main);
        }

        .quiz-step {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: #4338ca;
            background-color: var(--color-primary-bg);
        }

        .quiz-question {
            font-size: var(--font-size-modal);
            font-weight: 700;
            color: #1e293b;
        }

        .quiz-btn-check {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #fff;
            background-color: #f97316;
            border: 1px solid #f97316;
            line-height: 1.5rem;
        }

        @media (hover: hover) and (pointer: fine) {
            .quiz-btn-check:hover {
                background-color: #ea580c;
                border-color: #ea580c;
            }
        }

        .quiz-answer-box {
            font-size: var(--font-size-guide);
            font-weight: 700;
            line-height: 1.5rem;
            color: var(--color-text-main);
            background-color: #f8fafc;
            border-color: #e2e8f0;
        }

        .header-button:is(.is-tap-feedback, .is-pen-hover),
        .btn-sub:is(.is-tap-feedback, .is-pen-hover),
        .zoom-btn:is(.is-tap-feedback, .is-pen-hover),
        .nav-btn:is(.is-tap-feedback, .is-pen-hover),
        #customSelectTrigger:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #f1f5f9;
        }

        .btn-action-start:is(.is-tap-feedback, .is-pen-hover) {
            background-color: var(--color-action-hover);
        }

        .btn-reset-custom:is(.is-tap-feedback, .is-pen-hover) {
            color: var(--color-pause);
            border-color: #fda4af;
            background-color: var(--color-pause-bg);
        }

        .modal-close-btn:is(.is-tap-feedback, .is-pen-hover) {
            color: #f43f5e;
        }

        .quiz-btn-check:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #ea580c;
        }

        .tab-btn:not(.border-indigo-600):is(.is-tap-feedback, .is-pen-hover) {
            background-color: rgb(226 232 240 / 0.5);
        }

        .radio-label:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #f8fafc;
        }

        #customSelectList [role="option"]:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #eef2ff;
        }

        /* PC·모바일에서 동일한 숫자 입력 스피너를 고정 노출 */
        .ratio-number-field {
            display: flex;
            flex: 1 1 0%;
            min-width: 0;
            position: relative;
        }

        .ratio-number-stepper {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            width: 2.5rem;
            justify-content: center;
            gap: 0;
        }

        .ratio-step-btn {
            display: flex;
            flex: 1 1 50%;
            min-height: 0;
            width: 100%;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 0.15rem;
            background-color: transparent;
            color: #737373;
            line-height: 1;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .ratio-step-icon {
            width: 0.66rem;
            height: 0.48rem;
            fill: currentColor;
        }

        .ratio-step-btn[data-step-direction="up"] .ratio-step-icon {
            transform: translateY(0.1875rem);
        }

        .ratio-step-btn[data-step-direction="down"] .ratio-step-icon {
            transform: translateY(-0.1875rem);
        }

        .ratio-step-btn:active {
            background-color: transparent;
            color: #475569;
        }

        .ratio-step-btn:focus {
            background-color: transparent;
        }

        .ratio-step-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .ratio-number-field>.input-text {
            appearance: textfield;
            -moz-appearance: textfield;
            padding-right: 2.75rem;
            background-color: transparent;
            transition: border-color 150ms ease;
        }

        .ratio-number-field>.input-text::-webkit-inner-spin-button,
        .ratio-number-field>.input-text::-webkit-outer-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }

        .ratio-number-field:has(>.ratio-number-stepper>.ratio-step-btn:active)>.input-text,
        .ratio-number-field:has(>.ratio-number-stepper>.ratio-step-btn.is-tap-feedback)>.input-text {
            border-color: #6366f1;
        }

        /* iOS Safari는 16px 미만 입력창에 포커스할 때 화면을 자동 확대한다. */
        @supports (-webkit-touch-callout: none) {
            html.mobile-number-controls input[type="number"] {
                font-size: 16px !important;
            }

            .radio-label>.select-option-text {
                white-space: nowrap;
            }
        }

        /* ════════════════════════════════════════════════════════
           🚫 [수정 금지] 코어 레이아웃 구조 — 전체화면·캔버스·스크롤
           ════════════════════════════════════════════════════════ */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html,
        body {
            overscroll-behavior: none;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-size: 16px !important;
        }

        .ui-box {
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
        }

        .shutter-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shutter-wrapper.is-open {
            grid-template-rows: 1fr;
        }

        .shutter-inner {
            overflow: hidden;
        }

        @media (hover: none), (pointer: coarse) {

            input,
            textarea,
            select,
            button,
            [role="button"],
            [contenteditable="true"] {
                touch-action: manipulation;
            }

            .zoom-btn,
            .nav-btn,
            .header-button,
            .btn-sub,
            .btn-reset-custom,
            .modal-close-btn,
            #btnScrollLeft,
            #btnScrollRight {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }

            .zoom-btn:active,
            .zoom-btn.is-tap-feedback,
            .nav-btn:active,
            .nav-btn.is-tap-feedback,
            .header-button:active,
            .header-button.is-tap-feedback,
            .btn-sub:active,
            .btn-sub.is-tap-feedback {
                background-color: #f1f5f9;
            }

            .btn-reset-custom:active,
            .btn-reset-custom.is-tap-feedback {
                color: var(--color-pause);
                border-color: #fda4af;
                background-color: var(--color-pause-bg);
            }

            .modal-close-btn:active,
            .modal-close-btn.is-tap-feedback {
                color: #f43f5e;
            }

            #btnScrollLeft:active,
            #btnScrollLeft.is-tap-feedback,
            #btnScrollRight:active,
            #btnScrollRight.is-tap-feedback {
                color: #4f46e5;
            }

            #fullscreen-btn:is(:active, .is-tap-feedback),
            #fullscreen-btn-mobile:is(:active, .is-tap-feedback) {
                background-color: #f1f5f9;
            }
        }

        canvas {
            touch-action: none;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .bar-track {
            width: 100%;
            height: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }

        .popup-overlay {
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
        }

        #workspace:fullscreen {
            background-color: #f8fafc;
            padding: 1rem;
            overflow-y: auto;
        }

        @media (orientation: landscape) {
            #workspace:fullscreen {
                padding: 1rem;
                overflow-y: hidden;
            }
        }
    </style>

    <!-- 🚫 [수정 금지] Tailwind 컴포넌트 추출 -->
    <style type="text/tailwindcss">
        @layer components {
            .panel-block      { @apply flex flex-col gap-2 p-3 border border-slate-200 rounded-lg bg-white; }
            .modal-container  { @apply bg-white border border-slate-300 rounded-2xl w-full flex flex-col relative shadow-2xl max-h-[70dvh]; }
            .modal-header     { @apply h-14 lg:h-16 px-6 border-b border-slate-100 flex items-center justify-between flex-none; }
            .modal-body       { @apply flex-1 overflow-y-auto p-4 lg:p-6 flex flex-col gap-4; }
            .guide-block      { @apply p-4 bg-slate-50 border border-slate-200 rounded-xl; }
            .zoom-btn         { @apply w-10 h-10 flex items-center justify-center bg-white border border-slate-300 rounded-full shadow-sm text-slate-600 font-bold desktop-only:hover:bg-slate-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed desktop-only:disabled:hover:bg-slate-50; }
            .nav-btn          { @apply w-12 h-12 flex items-center justify-center bg-white border border-slate-300 text-slate-600 rounded-full desktop-only:hover:bg-slate-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed desktop-only:disabled:hover:bg-slate-50; }
            .radio-label      { @apply flex items-start gap-2 p-2 border border-slate-200 rounded bg-white cursor-pointer desktop-only:hover:bg-slate-50 transition-colors has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 has-[:disabled]:opacity-50 has-[:disabled]:cursor-not-allowed; }
            .input-text       { @apply w-full p-2 border border-slate-200 rounded text-center focus:outline-none focus:border-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-slate-50; }
        }
    </style>
</head>

<!-- ════════════════════════════════════════════════════════════════════
     🚫 [수정 금지] BODY — 레이아웃 클래스 수정 금지
     ════════════════════════════════════════════════════════════════════ -->

<body
    class="bg-slate-100 text-slate-800 font-sans w-full m-0 p-0 box-border select-none overflow-x-hidden md:overflow-hidden landscape:overflow-hidden flex flex-col justify-center md:h-[100dvh] landscape:h-[100dvh]">

    <div
        class="flex flex-col w-full max-w-[1680px] mx-auto p-2 gap-2 box-border md:h-[100dvh] md:overflow-hidden landscape:h-[100dvh] landscape:overflow-hidden relative">

        <!-- ═══════════════════════════════════════════════════════════════
         🚫 [수정 금지] 헤더 — 제목은 JS CONTENT_CONFIG.title로 자동 주입
         ═══════════════════════════════════════════════════════════════ -->
        <header class="ui-box flex-none px-4 py-2 flex items-center justify-between z-10 bg-white relative">
            <div class="flex items-center gap-4">
                <a href="https://www.tsherpa.co.kr" target="_blank"
                    class="flex items-center flex-none desktop-only:hover:opacity-80 transition-opacity">
                    <img src="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_black.png"
                        alt="T셀파"
                        class="h-7 md:h-8 object-contain draggable-false flex-none hidden [@media(min-width:768px)]:block">
                    <img src="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_short.png"
                        alt="T셀파"
                        class="h-7 md:h-8 object-contain draggable-false flex-none block [@media(min-width:768px)]:hidden">
                </a>
                <div class="border-l border-slate-300 pl-4">
                    <h1 class="sim-title" id="sim-title-el">로딩 중...</h1><!-- CONTENT_CONFIG.title 자동 주입 -->
                </div>
            </div>
            <div class="flex items-center relative">
                <button id="moreMenuBtn"
                    class="header-button flex landscape:hidden desktop-only:hidden transition-colors ml-2"
                    title="메뉴 더보기">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                    </svg>
                </button>
                <div class="hidden landscape:flex desktop-only:flex items-center">
                    <!-- SOUND MANAGER -->
                    <div id="volume-popup"
                        class="flex items-center overflow-hidden transition-all duration-300 w-0 opacity-0">
                        <div
                            class="flex items-center gap-2 w-48 px-3 bg-white border border-slate-200 rounded-xl h-[36px] ml-2">
                            <button id="popup-mute-btn"
                                class="flex-none text-slate-500 desktop-only:hover:text-indigo-600 transition-colors">

        const uiSound = (function () {

            function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

            function playTone(freq, type, duration, volOffset = 0) {
                if (volume === 0) return;
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                const v = Math.max(0, Math.min(1, volume + volOffset));
                gain.gain.setValueAtTime(v, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            }

            function updateUI() {
                const on = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2l5 5V3l-5 5H7a2 2 0 00-2 2z"/>`;

                const svg = volume === 0 ? off : on;
                if (iconMain) iconMain.innerHTML = svg;
                if (iconPopup) iconPopup.innerHTML = svg;
                if (sliderEl) sliderEl.value = volume;
            }

            return {
                playClick: () => playTone(600, 'sine', 0.1),
                playTick: () => playTone(800, 'triangle', 0.05, -0.3),
                setDOM: (mIcon, pIcon, slider) => { iconMain = mIcon; iconPopup = pIcon; sliderEl = slider; updateUI(); },

                toggleMute: () => { volume = volume > 0 ? (previousVolume = volume, 0) : (previousVolume > 0 ? previousVolume : 0.5); updateUI(); }
            };

                const OT = [[156, 150, 150, 90], [236, 150, 240, 100], [316, 150, 322, 100], [176, 190, 120, 175], [256, 190, 262, 240], [336, 190, 375, 175]];
                const FeT = [[50, 80, 196, 150], [84, 80, 276, 150], [50, 114, 216, 190], [84, 114, 296, 190]];
                const pairs = [[0, 0], [0, 0], [0, 1], [1, 1], [1, 2], [1, 2], [2, 3], [2, 3], [2, 4], [3, 4], [3, 5], [3, 5]];
                const electrons = pairs.map(([f, o], k) => ({ from: f, to: 4 + o, t: [k * 0.035, k * 0.035 + 0.2], lift: 18 + 8 * (k % 3) }));
                const arrive = o => Math.max(...electrons.filter(e => e.to === 4 + o).map(e => e.t[1]));
                return {
                    rs: { Fe: 17, O: 13 },
                    atoms: [
                        ...FeT.map(([x, y, tx, ty], i) => ({ el: 'Fe', at: [x, y], to: [tx, ty], t: [0.62, 0.78], ch: ['', '3+', (3 * i + 2) * 0.035] })),
                        ...O0.map(([x, y], o) => ({ el: 'O', at: [x, y], to: [OT[o][0], OT[o][1]], via: [OT[o][2], OT[o][3]], t: [0.78 + 0.02 * (o % 3), 0.96], ch: ['', '2−', arrive(o)] }))
                    ],
                    electrons,
                    labels: [{ b: [67, 150, '철 (Fe)'], a: [67, 150, '철 이온 (Fe³⁺)'], t: 0.4, end: 0.62 },
                    { b: [293, 82, '산소 (O₂)'], a: [293, 82, '산화 이온 (O²⁻)'], t: 0.6, end: 0.78 },
                    { b: [0, 0, ''], a: [246, 226, '산화 철(III) (Fe₂O₃)'], t: 0.96 }],
                    tags: { ox: [67], red: [293], y: 30, after: { t: 0.8, ox: [206], red: [296], y: 120 } }
                };
            })()
        };

        /* 금속 표면의 원자 3개가 차례로 전자 2개를 잃고 이온이 되어 나가고, 그때마다 이온이 석출된다.
           ratio = 석출 원자 수 / 산화된 금속 원자 수 (Cu:Ag = 1:2, Zn:Cu = 1:1) */
        function surfaceModel(metal, ion, ratio, sol, rowLabel) {
            /* 금속 결정 조각: 두 층으로 빽빽하게 (아래층은 반 칸 어긋남) */
            const TOP = 166;   /* 아래층 바닥 = 166+36+20 = 222, 라벨은 그 아래 빈 곳(232) */
            const atoms = [...ROW(metal, [40, 120, 160, 240, 280, 360], TOP), ...ROW(metal, [20, 60, 100, 140, 180, 220, 260, 300, 340, 380], TOP + 36)], electrons = [];
            [80, 200, 320].forEach((c, i) => {
                const w0 = i * 0.3, mi = atoms.length;
                atoms.push({ el: metal, at: [c, TOP], to: [c, 44], t: [w0 + 0.16, w0 + 0.3], ch: ['', '2+', w0 + 0.05] });
                const spots = ratio === 2 ? [[c - 40, 80], [c + 40, 106]] : [[c + 40, 94]];
                spots.forEach(([x, y], j) => {
                    const ii = atoms.length, arrive = w0 + 0.1 + j * 0.04 + (ratio === 1 ? 0.04 : 0);
                    atoms.push({ el: ion, at: [x, y], to: [x, TOP - 20 - EL[ion].r], t: [arrive + 0.02, w0 + 0.3], ch: [ratio === 2 ? '+' : '2+', '', arrive] });
                    for (let k = 0; k < 3 - ratio; k++) electrons.push({ from: mi, to: ii, t: [w0 + j * 0.04 + k * 0.04, arrive], lift: 30 + 14 * k });
                });
            });
            return { sol, atoms, electrons, labels: [{ b: [200, 233, rowLabel], a: [200, 233, rowLabel], t: 0 }], tags: { ox: [80], red: [300], y: 20 } };
        }

        /* 분자 모양 (기준 좌표, sc = 원자 크기 배율) */
        function molShape(type, sc) {
            const r = 15 * sc, h = 10 * sc;
            if (type === 'CO2') return [['O', -2 * r, 0], ['C', 0, 0], ['O', 2 * r, 0]];
            if (type === 'O2') return [['O', -r, 0], ['O', r, 0]];
            if (type === 'H2O') return [['O', 0, 0], ['H', -r * 0.95, r * 0.95], ['H', r * 0.95, r * 0.95]];
            if (type === 'CH4') return [['C', 0, 0], ['H', -(r + h) * 0.9, 0], ['H', (r + h) * 0.9, 0], ['H', 0, -(r + h) * 0.9], ['H', 0, (r + h) * 0.9]];
            return [];
        }

        /* ── 도우미 ── */
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
        const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const hr = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
        const isRun = () => sysState.isStarted && !sysState.isPaused;
        const key = () => simData.mode[0] + simData.rxn;
        const font = (px, wt = 700) => `${wt} ${px}px 'Noto Sans KR', sans-serif`;
        /* 반응마다 진행도 0~100 % (광합성·세포호흡도 각각 따로, 사용자 수정 2) */
        const phaseKey = () => key();
        const lp = () => simData.progress;
        const tagSub = () => SIM_CONFIG.tagText[key()] || SIM_CONFIG.tagText[simData.mode[0]];
        const modelTime = () => clamp((lp() - 0.08) / 0.72, 0, 1);
        const tagOn = () => lp() > 0.08;   /* 산화·환원 표시는 이 한 조건으로 함께 켜진다 */
        const hasRole = (role, r) => !!role && role.split(' ').includes(r);

        function mixHex(a, b, t) {
            const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
            const A = p(a), B = p(b);
            return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
        }
        function rrect(x, y, w, h, r) {
            r = Math.max(0, Math.min(r, w / 2, h / 2));
            ctx.beginPath(); ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
        }
        function wrap(text, maxW) {
            const lines = []; let cur = '';

                const test = cur ? cur + ' ' + w : w;
                if (cur && ctx.measureText(test).width > maxW) { lines.push(cur); cur = w; } else cur = test;
            });
            if (cur) lines.push(cur);

        }
        function drawArrow(x1, y1, x2, y2, col, lw, hs) {
            const a = Math.atan2(y2 - y1, x2 - x1);
            ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * hs * 0.8, y2 - Math.sin(a) * hs * 0.8); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - Math.cos(a - 0.45) * hs, y2 - Math.sin(a - 0.45) * hs);
            ctx.lineTo(x2 - Math.cos(a + 0.45) * hs, y2 - Math.sin(a + 0.45) * hs); ctx.closePath(); ctx.fill();
        }
        function haloText(t, x, y, col, ui) {

            ctx.strokeText(t, x, y); ctx.fillStyle = col; ctx.fillText(t, x, y);
        }

        /* ── 배치: 캔버스 크기에서 ui 배율 하나를 구해 모두 비례 ── */
        function computeLayout(w, h) {
            const ui = clamp(Math.min(w / 1080, h / 700), 0.75, 1.5);
            /* 작은 캔버스(휴대폰 세로·가로): 관찰 상자 숨김, 반응식 띠 한 줄, 여백 최소 → 장치·모형이 공간을 최대한 쓴다 */
            const compact = h < 420 || w < 600;
            /* top: 캔버스 위 상태 알림(위 16px + 높이 약 36px) 아래에서 시작 */
            const pad = (compact ? 6 : 10) * ui, top = 60;
            const eqH = compact ? 32 : 86 * ui;
            const eq = { y: h - eqH - (compact ? 4 : 6), h: eqH, right: w - 124 };   /* 오른쪽 아래 초기화 버튼을 피함 */
            const areaBot = eq.y - (compact ? 2 : 6 * ui), H = Math.max(40, areaBot - top);
            const stacked = h > w * 0.95;
            let app, model;
            if (stacked) {
                const ah = H * 0.56;
                app = { x: pad, y: top, w: w - 2 * pad, h: ah };
                model = { x: pad, y: top + ah + 4 * ui, w: w - 2 * pad, h: H - ah - 4 * ui };
            } else {
                const W = w - 3 * pad, aw = W * (compact ? 0.55 : 0.52);
                app = { x: pad, y: top, w: aw, h: H };
                model = { x: 2 * pad + aw, y: top, w: W - aw, h: H };
            }
            /* 오른쪽 아래 초기화 버튼(아래 16px + 높이 40px, 폭 약 120px)을 모형 상자가 덮지 않게 */
            if (model.x + model.w > w - 130) model.h = Math.max(40, Math.min(model.y + model.h, h - 62) - model.y);
            return { w, h, ui, eq, app, model, stacked, compact };
        }

        /* ── 실험 장치 (기준 좌표로 그리고 상자에 맞춰 축소·확대) ── */
        let labelBuf = [];
        const lab = (x, y, t, align = 'center', c) => labelBuf.push({ x, y, t, align, c });
        /* 띠 라벨: 그림 위('T')·아래('B') 빈 띠에 놓아 그림과 겹치지 않게 하고, to(기준 좌표)가 있으면 지시선으로 잇는다 */
        const blab = (band, x, t, to, c) => labelBuf.push({ band, x, t, to, c });

        /* 불꽃(겉불꽃·속불꽃)이 심지 끝에 붙어 있는 알코올램프. 심지 끝 = by-64, 불꽃 끝 ≈ by-108 */
        function drawFlame(cx, baseY, t) {
            const fl = 1 + 0.07 * Math.sin(t * 23) + 0.04 * Math.sin(t * 37), fh = 46 * fl, sway = 1.5 * Math.sin(t * 9);
            const tear = (w, hgt) => {
                ctx.beginPath(); ctx.moveTo(cx - w, baseY);
                ctx.bezierCurveTo(cx - w * 1.3, baseY - hgt * 0.45, cx - w * 0.3 + sway, baseY - hgt * 0.8, cx + sway, baseY - hgt);
                ctx.bezierCurveTo(cx + w * 0.3 + sway, baseY - hgt * 0.8, cx + w * 1.3, baseY - hgt * 0.45, cx + w, baseY);
                ctx.quadraticCurveTo(cx, baseY + w * 0.6, cx - w, baseY); ctx.closePath();
            };
            const go = ctx.createLinearGradient(cx, baseY, cx, baseY - fh);
            go.addColorStop(0, 'rgba(251,146,60,0.95)'); go.addColorStop(0.55, 'rgba(250,204,21,0.85)'); go.addColorStop(1, 'rgba(254,240,138,0.05)');
            tear(9, fh); ctx.fillStyle = go; ctx.fill();
            const gi = ctx.createLinearGradient(cx, baseY, cx, baseY - fh * 0.42);
            gi.addColorStop(0, 'rgba(37,99,235,0.95)'); gi.addColorStop(1, 'rgba(147,197,253,0.35)');
            tear(4.5, fh * 0.42); ctx.fillStyle = gi; ctx.fill();
        }
        function drawLamp(cx, by, on, t) {
            const wickY = by - 64;
            /* 유리 몸통 */
            const body = () => {
                ctx.beginPath(); ctx.moveTo(cx - 10, by - 46); ctx.quadraticCurveTo(cx - 34, by - 36, cx - 32, by - 6);
                ctx.quadraticCurveTo(cx - 32, by, cx - 26, by); ctx.lineTo(cx + 26, by); ctx.quadraticCurveTo(cx + 32, by, cx + 32, by - 6);
                ctx.quadraticCurveTo(cx + 34, by - 36, cx + 10, by - 46); ctx.closePath();
            };
            const gg = ctx.createLinearGradient(cx - 32, 0, cx + 32, 0);
            gg.addColorStop(0, 'rgba(203,213,225,0.55)'); gg.addColorStop(0.35, 'rgba(255,255,255,0.85)'); gg.addColorStop(1, 'rgba(186,200,216,0.6)');
            body(); ctx.fillStyle = gg; ctx.fill();
            ctx.save(); body(); ctx.clip();
            const lg = ctx.createLinearGradient(0, by - 26, 0, by);
            lg.addColorStop(0, 'rgba(147,197,253,0.55)'); lg.addColorStop(1, 'rgba(96,165,250,0.7)');
            ctx.fillStyle = lg; ctx.fillRect(cx - 40, by - 26, 80, 26);
            ctx.beginPath(); ctx.ellipse(cx, by - 26, 31, 3, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(219,234,254,0.9)'; ctx.fill();
            ctx.restore();
            body(); ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2.4; ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(cx - 22, by - 34); ctx.quadraticCurveTo(cx - 27, by - 22, cx - 25, by - 10); ctx.stroke();
            /* 뚜껑(금속)과 심지 */
            const mg = ctx.createLinearGradient(cx - 9, 0, cx + 9, 0);
            mg.addColorStop(0, '#64748b'); mg.addColorStop(0.45, '#cbd5e1'); mg.addColorStop(1, '#475569');
            ctx.fillStyle = mg; rrect(cx - 9, by - 57, 18, 12, 2); ctx.fill();
            ctx.fillStyle = '#a8a29e'; ctx.fillRect(cx - 2.5, wickY, 5, 8);
            ctx.fillStyle = '#292524'; ctx.fillRect(cx - 2.5, wickY, 5, 2.5);
            if (on) drawFlame(cx, wickY + 1.5, t);
        }

        /* 유리관 질감: 반투명 채우기 + 두께선 + 흰 하이라이트 (가로 관, 좌표는 관 중심선 기준) */
        function glassTube(x0, x1, cy, R) {
            const g = ctx.createLinearGradient(0, cy - R, 0, cy + R);
            g.addColorStop(0, 'rgba(226,232,240,0.55)'); g.addColorStop(0.5, 'rgba(248,250,252,0.25)'); g.addColorStop(1, 'rgba(203,213,225,0.5)');
            ctx.fillStyle = g; ctx.fillRect(x0, cy - R, x1 - x0, 2 * R);
        }
        function glassEdges(x0, x1, cy, R) {
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3; ctx.lineCap = 'butt';
            ctx.beginPath(); ctx.moveTo(x0, cy - R); ctx.lineTo(x1, cy - R); ctx.moveTo(x0, cy + R); ctx.lineTo(x1, cy + R); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x0, cy - R + 2.2); ctx.lineTo(x1, cy - R + 2.2); ctx.moveTo(x0, cy + R - 2.2); ctx.lineTo(x1, cy + R - 2.2); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(x0 + 12, cy - R + 5); ctx.lineTo(x1 - 14, cy - R + 5); ctx.stroke();
        }
        /* 가루 더미: 바닥 yb에서 높이 hgt로 쌓인 알갱이. k = 검은색→붉은색 진행, coal = 남는 숯가루 */
        function drawPile(x0, x1, yb, hgt, k, seed, coal, g = 1) {
            const topAt = x => { const u = (x - x0) / (x1 - x0); return yb - hgt * (1 - Math.pow(2 * u - 1, 4)) * (0.82 + 0.18 * hr(Math.floor(x) + seed)); };
            ctx.beginPath(); ctx.moveTo(x0, yb);
            for (let x = x0; x <= x1; x += 3) ctx.lineTo(x, topAt(x));
            ctx.lineTo(x1, yb); ctx.closePath();
            ctx.fillStyle = mixHex('#1c1917', '#b8552e', k); ctx.fill();
            const dark = mixHex('#0c0a09', '#8a3416', k), light = mixHex('#57534e', '#e5916a', k);
            for (let i = 0; i < 70 * g; i++) {
                const x = x0 + 2 + hr(i + seed) * (x1 - x0 - 4), top = topAt(x);
                const y = top + 1 + hr(i + seed + 200) * Math.max(0.5, yb - top - 1.5);
                ctx.fillStyle = i % 3 ? dark : light;
                ctx.beginPath(); ctx.arc(x, y, (0.9 + hr(i + seed + 400) * 1.1) * g, 0, Math.PI * 2); ctx.fill();
            }
            if (coal) {
                ctx.fillStyle = '#050505';
                for (let i = 0; i < 30 * g; i++) {
                    if (hr(i + seed + 50) < 0.55 * k) continue;   /* 일부는 반응하지 않고 남는다 */
                    const x = x0 + 3 + hr(i + seed + 600) * (x1 - x0 - 6), top = topAt(x), y = top + 1.5 + hr(i + seed + 700) * Math.max(0.5, yb - top - 3);
                    const r = (1.5 + hr(i + seed + 800) * 1.1) * g;
                    ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x - r * 0.2, y - r); ctx.lineTo(x + r, y - r * 0.3); ctx.lineTo(x + r * 0.4, y + r * 0.8); ctx.closePath(); ctx.fill();
                }
            }
        }
        /* 클램프: 관을 위아래에서 무는 집게 + 스탠드 쪽 팔 */
        function drawClamp(x, cy, R, bossX, bossY) {
            ctx.strokeStyle = '#52525b'; ctx.lineWidth = 4; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(bossX, bossY); ctx.lineTo(x, cy + R + 10); ctx.lineTo(x, cy + R + 4); ctx.stroke();
            ctx.fillStyle = '#52525b'; ctx.fillRect(bossX - 7, bossY - 5, 14, 10);
            ctx.strokeStyle = '#71717a'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x + 8, cy - R - 3); ctx.quadraticCurveTo(x + 13, cy, x + 8, cy + R + 3); ctx.stroke();
            ctx.fillStyle = '#f97316';
            rrect(x - 8, cy - R - 6, 16, 6, 2); ctx.fill();
            rrect(x - 8, cy + R, 16, 6, 2); ctx.fill();
            ctx.fillStyle = '#3f3f46'; ctx.beginPath(); ctx.arc(x + 9, cy + R + 3, 2.2, 0, Math.PI * 2); ctx.fill();
        }

        /* ① 산화 구리(II) + 숯가루: 스탠드·시험관·고무관·석회수 (교과서 p.40) */
        function drawO0(p) {
            const on = isRun() && p < 1, t = simData.time;
            /* 고체 가열: 막힌 쪽(왼쪽)이 높고 입구(오른쪽)가 약간 아래로 */
            const A = { x: 48, y: 124 }, B = { x: 238, y: 152 };
            const ang = Math.atan2(B.y - A.y, B.x - A.x), len = Math.hypot(B.x - A.x, B.y - A.y), R = 12;
            const toLocal = (x, y) => { const dx = x - A.x, dy = y - A.y; return [dx * Math.cos(ang) + dy * Math.sin(ang), -dx * Math.sin(ang) + dy * Math.cos(ang)]; };
            ctx.fillStyle = '#334155'; rrect(20, 244, 250, 12, 3); ctx.fill();
            /* 스탠드 막대는 시험관 아래에서 멈추고, 클램프 팔이 시험관을 문다 */
            ctx.fillStyle = '#a1a1aa'; ctx.fillRect(147, 172, 6, 74);
            ctx.fillStyle = '#71717a'; rrect(145, 168, 10, 6, 2); ctx.fill();
            drawLamp(80, 244, on, t);
            ctx.save(); ctx.translate(A.x, A.y); ctx.rotate(ang);
            const tubePath = () => { ctx.beginPath(); ctx.moveTo(len, -R); ctx.lineTo(0, -R); ctx.arc(0, 0, R, -Math.PI / 2, Math.PI / 2, true); ctx.lineTo(len, R); };
            ctx.save(); tubePath(); ctx.closePath(); ctx.clip();
            glassTube(-R, len, 0, R);
            drawPile(-R, 112, R - 1.5, 9, smooth(0.05, 0.95, p), 11, true);
            ctx.restore();
            tubePath(); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3; ctx.stroke();
            ctx.save(); ctx.beginPath(); ctx.moveTo(len, -R + 2.2); ctx.lineTo(0, -R + 2.2); ctx.arc(0, 0, R - 2.2, -Math.PI / 2, Math.PI / 2, true); ctx.lineTo(len, R - 2.2);
            ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
            ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(8, -R + 5); ctx.lineTo(len - 12, -R + 5); ctx.stroke();
            ctx.fillStyle = '#dc4a2a'; rrect(len - 6, -R - 2, 18, 2 * R + 4, 3); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(len - 4, -R, 14, 3);
            const bl = toLocal(150, 178);
            drawClamp(140, 0, R, bl[0], bl[1]);
            ctx.restore();
            /* 석회수 비커: 유리 두께·수면 타원·그라데이션 */
            const turb = smooth(0.15, 0.9, p);
            const wg = ctx.createLinearGradient(0, 186, 0, 254);

        /* ③ 용광로: 위로 철광석·코크스·석회석, 아래로 뜨거운 공기 (교과서 p.45) */

        /* 금속 모양 (k = 크기 배율). 직선은 비커에 매달린 세로 줄 */
        function shapePts(shape, cx, cy, k = 1) {
            const pts = [];
            if (shape === 'heart') for (let t = 0; t <= Math.PI * 2 + 0.001; t += 0.02) {
                pts.push([cx + 16 * Math.pow(Math.sin(t), 3) * 3.9 * k, cy + (-10 - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 3.9) * k]);
            } else if (shape === 'spiral') for (let th = 0; th <= Math.PI * 5; th += 0.04) {
                const r = (5 + 57 * th / (Math.PI * 5)) * k; pts.push([cx + r * Math.cos(th), cy + r * Math.sin(th)]);
            } else for (let y = -60; y <= 60; y += 2) pts.push([cx, cy + y * k]);
            return pts;
        }
        function sites(pts, step) {
            const out = []; let acc = 0;
            for (let i = 1; i < pts.length; i++) {
                const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], d = Math.hypot(x1 - x0, y1 - y0);
                if (!d) continue;
                acc += d;
                while (acc >= step) { acc -= step; const u = 1 - acc / d; out.push({ x: x0 + (x1 - x0) * u, y: y0 + (y1 - y0) * u, nx: -(y1 - y0) / d, ny: (x1 - x0) / d }); }
            }
            return out;
        }

        /* ④ 비커(옆모습): 막대에 매단 구리줄+질산 은(교과서 p.42, p.66) / 아연+황산 구리(II)(지도서 p.114) */

            ctx.fillStyle = bg; ctx.fillRect(L0 + 2, SURF, R0 - L0 - 4, BOT - SURF - 2);

            ctx.moveTo(L0 + 2.5, TOP + 4); ctx.lineTo(L0 + 2.5, BOT - 9); ctx.moveTo(R0 - 2.5, TOP + 4); ctx.lineTo(R0 - 2.5, BOT - 9); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(cx, TOP, (R0 - L0) / 2 + 2, 6, 0, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(148,163,184,0.85)'; ctx.lineWidth = 2; ctx.stroke();

            ctx.strokeStyle = 'rgba(148,163,184,0.6)'; ctx.lineWidth = 1.5;

        /* ⑥ 광합성·세포호흡 순환 (교과서 p.44): 왼쪽 잎(엽록체) ↔ 오른쪽 마이토콘드리아.
           위 화살표: 포도당·산소 → 마이토콘드리아, 아래 화살표: 이산화 탄소·물 → 잎 */
        function drawCycle(p) {
            const photo = key() === 'l0', run = isRun(), t = simData.time;   /* 고른 반응 쪽 그림·화살표를 강조 */
            /* 해와 빛 */
            ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(52, 40, 17, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
            for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(52 + Math.cos(a) * 22, 40 + Math.sin(a) * 22); ctx.lineTo(52 + Math.cos(a) * 29, 40 + Math.sin(a) * 29); ctx.stroke(); }
            drawArrow(72, 58, 96, 92, photo ? '#f59e0b' : 'rgba(245,158,11,0.4)', 2.5, 8);
            /* 잎 */
            const leafGlow = photo ? 0.35 + 0.65 * Math.min(1, p * 3) : 0.25;
            if (photo) { const gl = ctx.createRadialGradient(120, 150, 10, 120, 150, 95); gl.addColorStop(0, `rgba(134,239,172,${0.55 * leafGlow})`); gl.addColorStop(1, 'rgba(134,239,172,0)'); ctx.fillStyle = gl; ctx.fillRect(20, 50, 200, 200); }
            if (imgOk('leaf')) ctx.drawImage(IMG.leaf, 46, 76, 148, 150);
            else {
            ctx.save(); ctx.translate(120, 150); ctx.rotate(-0.35);
            const leaf = () => { ctx.beginPath(); ctx.moveTo(-72, 0); ctx.bezierCurveTo(-40, -50, 40, -50, 72, 0); ctx.bezierCurveTo(40, 50, -40, 50, -72, 0); ctx.closePath(); };
            const lg = ctx.createLinearGradient(0, -40, 0, 40); lg.addColorStop(0, '#4ade80'); lg.addColorStop(1, '#15803d');
            leaf(); ctx.fillStyle = lg; ctx.fill(); ctx.strokeStyle = '#166534'; ctx.lineWidth = 2; ctx.stroke();
            ctx.strokeStyle = 'rgba(220,252,231,0.85)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-72, 0); ctx.lineTo(66, 0); ctx.stroke();
            [-40, -10, 20].forEach(x => { ctx.beginPath(); ctx.moveTo(x, 0); ctx.quadraticCurveTo(x + 12, -12, x + 22, -24); ctx.moveTo(x, 0); ctx.quadraticCurveTo(x + 12, 12, x + 22, 24); ctx.stroke(); });
            ctx.fillStyle = '#065f46';   /* 엽록체 */
            [[-44, -14], [-20, 16], [6, -18], [30, 14], [-56, 10], [44, -10]].forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(x, y, 6, 3.5, 0.4, 0, Math.PI * 2); ctx.fill(); });
            ctx.restore();
            ctx.strokeStyle = '#166534'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(56, 172); ctx.quadraticCurveTo(44, 196, 40, 216); ctx.stroke();
            }
            /* 마이토콘드리아 */
            if (!photo) { const gm = ctx.createRadialGradient(330, 150, 10, 330, 150, 95); gm.addColorStop(0, `rgba(253,186,116,${0.6 * Math.min(1, p * 3)})`); gm.addColorStop(1, 'rgba(253,186,116,0)'); ctx.fillStyle = gm; ctx.fillRect(230, 50, 200, 200); }
            if (imgOk('mitochondrion')) ctx.drawImage(IMG.mitochondrion, 258, 99, 144, 105);
            else {
            const mg = ctx.createLinearGradient(0, 118, 0, 182); mg.addColorStop(0, '#fed7aa'); mg.addColorStop(1, '#fb923c');
            ctx.beginPath(); ctx.ellipse(330, 150, 70, 34, 0, 0, Math.PI * 2); ctx.fillStyle = mg; ctx.fill(); ctx.strokeStyle = '#c2410c'; ctx.lineWidth = 2.5; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(330, 150, 62, 27, 0, 0, Math.PI * 2); ctx.strokeStyle = '#ea580c'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.strokeStyle = '#c2410c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(272, 150);
            for (let i = 0; i < 8; i++) { const x = 280 + i * 13; ctx.lineTo(x, i % 2 ? 128 : 172); ctx.lineTo(x + 6, 150); }
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(310, 130, 26, 5, -0.15, 0, Math.PI * 2); ctx.fill();
            }
            /* 순환 화살표: 위(광합성 생성물 → 마이토콘드리아), 아래(세포호흡 생성물 → 잎) */
            const arc = (x0, y0, cx, cy, x1, y1, on, col) => {
                ctx.strokeStyle = on ? col : 'rgba(148,163,184,0.6)'; ctx.lineWidth = on ? 4 : 3; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke();
                const a = Math.atan2(y1 - cy, x1 - cx);
                ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - Math.cos(a - 0.45) * 12, y1 - Math.sin(a - 0.45) * 12); ctx.lineTo(x1 - Math.cos(a + 0.45) * 12, y1 - Math.sin(a + 0.45) * 12); ctx.closePath(); ctx.fill();
                if (on && run) for (let i = 0; i < 4; i++) {
                    const u = (t * 0.45 + i / 4) % 1, x = (1 - u) * (1 - u) * x0 + 2 * u * (1 - u) * cx + u * u * x1, y = (1 - u) * (1 - u) * y0 + 2 * u * (1 - u) * cy + u * u * y1;
                    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.stroke();

            lab(330, 200, '마이토콘드리아');
            lab(photo ? 120 : 330, 16, photo ? '광합성' : '세포호흡', 'center', photo ? '#15803d' : '#c2410c');
        }

        /* ⑦ 메테인의 연소 (교과서 p.45): 가스레인지 버너의 가스 불꽃 */
        function drawBurner(p) {
            const on = isRun() && p < 1, t = simData.time;
            /* 상판·손잡이 */
            const sg = ctx.createLinearGradient(0, 168, 0, 196); sg.addColorStop(0, '#475569'); sg.addColorStop(1, '#1e293b');
            ctx.fillStyle = sg; rrect(30, 168, 300, 26, 6); ctx.fill();
            ctx.fillStyle = '#94a3b8'; [[70, 206], [290, 206]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y - 25, 7, 0, Math.PI * 2); ctx.fill(); });
            /* 받침(삼발이) */
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 4; ctx.lineCap = 'round';
            [[110, 120], [250, 240]].forEach(([x1, x2]) => { ctx.beginPath(); ctx.moveTo(x1, 168); ctx.lineTo(x1 + 8, 128); ctx.moveTo(x2, 168); ctx.lineTo(x2 - 8, 128); ctx.stroke(); });
            /* 버너 머리 */
            const bg = ctx.createLinearGradient(120, 0, 240, 0); bg.addColorStop(0, '#52525b'); bg.addColorStop(0.45, '#d4d4d8'); bg.addColorStop(1, '#3f3f46');
            ctx.fillStyle = bg; ctx.beginPath(); ctx.ellipse(180, 166, 62, 9, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#27272a'; ctx.fillRect(122, 154, 116, 12);
            ctx.fillStyle = bg; ctx.beginPath(); ctx.ellipse(180, 154, 58, 8, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#3f3f46'; ctx.lineWidth = 1.2; ctx.stroke();
            /* 가스 불꽃 고리 */
            if (on) {
                for (let i = 0; i < 16; i++) {
                    const a = i / 16 * Math.PI * 2, x = 180 + Math.cos(a) * 54, y = 152 + Math.sin(a) * 7, fh = 20 + 4 * Math.sin(t * 20 + i * 1.7);
                    const fg = ctx.createLinearGradient(x, y, x, y - fh);
                    fg.addColorStop(0, 'rgba(30,64,175,0.95)'); fg.addColorStop(0.6, 'rgba(96,165,250,0.8)'); fg.addColorStop(1, 'rgba(191,219,254,0.05)');
                    ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.quadraticCurveTo(x - 4, y - fh * 0.6, x, y - fh); ctx.quadraticCurveTo(x + 4, y - fh * 0.6, x + 5, y); ctx.closePath(); ctx.fill();
                }
                ctx.strokeStyle = 'rgba(251,146,60,0.55)'; ctx.lineWidth = 2;   /* 열 */
                for (let i = 0; i < 5; i++) {
                    const x = 130 + i * 25, ph = t * 6 + i;
                    ctx.beginPath(); for (let y = 120; y >= 50; y -= 5) { const xx = x + Math.sin(y * 0.12 + ph) * 4; y === 120 ? ctx.moveTo(xx, y) : ctx.lineTo(xx, y); } ctx.stroke();
                }
            }

            if (out > 0.05) { drawArrow(270, 110, 300, 60, `rgba(100,116,139,${out})`, 2.5, 8); lab(300, 46, '이산화 탄소 + 물'); }
            drawArrow(34, 118, 104, 148, '#64748b', 2.5, 8);
            lab(48, 104, '메테인 + 산소');
            lab(180, 222, '가스레인지 버너');
            if (on) lab(180, 40, '열', 'center', '#c2410c');
        }

        /* ⑧ 철이 녹스는 반응 (교과서 p.41-42): 공기 중의 철못에 붉은 녹이 번진다 */
        function drawNail(p, seed = 7) {
            const k = smooth(0.05, 1, p);
            /* 공기 중의 산소 분자 */
            ctx.fillStyle = 'rgba(239,68,68,0.75)';
            for (let i = 0; i < 10; i++) {
                const x = 60 + hr(i + 300) * 280 + (isRun() ? Math.sin(simData.time + i) * 4 : 0), y = i % 2 ? 40 + hr(i + 310) * 22 : 168 + hr(i + 320) * 18;
                [-3.5, 3.5].forEach(dx => { ctx.beginPath(); ctx.arc(x + dx, y, 3.5, 0, Math.PI * 2); ctx.fill(); });
            }
            /* 못 */
            const ng = ctx.createLinearGradient(0, 90, 0, 112);
            ng.addColorStop(0, '#f1f5f9'); ng.addColorStop(0.35, '#cbd5e1'); ng.addColorStop(0.7, '#94a3b8'); ng.addColorStop(1, '#64748b');
            ctx.fillStyle = ng; ctx.beginPath(); ctx.moveTo(58, 92); ctx.lineTo(300, 92); ctx.lineTo(345, 101); ctx.lineTo(300, 110); ctx.lineTo(58, 110); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.2; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(52, 101, 7, 26, 0, 0, Math.PI * 2); ctx.fillStyle = ng; ctx.fill(); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(64, 95.5); ctx.lineTo(296, 95.5); ctx.stroke();
            /* 녹: 광택 없는 붉은 얼룩이 점점 번진다 */
            ctx.save(); ctx.beginPath(); ctx.moveTo(58, 92); ctx.lineTo(300, 92); ctx.lineTo(345, 101); ctx.lineTo(300, 110); ctx.lineTo(58, 110); ctx.closePath();
            ctx.ellipse(52, 101, 7, 26, 0, 0, Math.PI * 2); ctx.clip();
            const RUST = ['#9a3412', '#b45309', '#7c2d12', '#c2410c'];
            for (let i = 0; i < 60; i++) {
                const start = hr(i + seed) * 0.7; const g = clamp((k - start) / 0.3, 0, 1); if (g <= 0) continue;
                const x = 46 + hr(i + 40) * 300, y = 90 + hr(i + 80) * 22, r = (4 + 9 * hr(i + 120)) * g;
                ctx.fillStyle = RUST[i % 4]; ctx.globalAlpha = 0.85;

            }
            ctx.globalAlpha = 1; ctx.restore();
            const leader = (x1, y1, x2, y2) => { ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.arc(x2, y2, 2, 0, Math.PI * 2); ctx.fill(); };
            leader(90, 140, 100, 108); lab(80, 150, '철못 (철)');
            if (k > 0.25) { leader(260, 140, 250, 106); lab(270, 150, '녹 (산화 철(III))'); }
            lab(200, 18, '공기 중의 산소');
        }

        /* ── 삽화 이미지 (01_spec.json media, ./contents/ 상대경로). 다 불러오기 전·실패 시에는 코드 그림으로 그린다 ── */
        const IMG = {};
        [['apparatus_tube_heat', './contents/apparatus_tube_heat.webp'], ['apparatus_h2_tube', './contents/apparatus_h2_tube.webp'],
        ['gas_burner', './contents/gas_burner.webp'], ['iron_nail', './contents/iron_nail.webp'],
        ['leaf', './contents/leaf.webp'], ['mitochondrion', './contents/mitochondrion.webp'],

            const im = new Image();
            im.onload = () => { IMG[n] = im; draw(); };

        });
        const imgOk = n => !!(IMG[n] && IMG[n].naturalWidth);
        /* 이미지를 (x, y)에 배율 k로 그리고, fn 안에서는 이미지 픽셀 좌표로 바뀌는 부분을 얹는다 */
        function withImg(n, x, y, k, fn) {

            ctx.drawImage(IMG[n], 0, 0);

            ctx.restore();

        function leaderLine(x1, y1, x2, y2) {
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

        }

        /* ① 이미지판: 시험관 안 가루 더미·남은 숯, 심지 끝 불꽃, 기포와 석회수 흐림만 코드로 얹는다 (이미지 1000×562) */
        function drawO0Img(p) {

            withImg('apparatus_tube_heat', 0, 10, 0.5, () => {
                ctx.save(); ctx.translate(75, 170); ctx.rotate(Math.atan2(82, 480));
                ctx.beginPath(); ctx.moveTo(470, -25); ctx.lineTo(0, -25); ctx.arc(0, 0, 25, -Math.PI / 2, Math.PI / 2, true); ctx.lineTo(470, 25); ctx.closePath(); ctx.clip();
                drawPile(-25, 235, 24, 19, smooth(0.05, 0.95, p), 11, true, 2.4);
                ctx.restore();
                if (on) { ctx.save(); ctx.translate(108, 286); ctx.scale(1.9, 1.9); drawFlame(0, 0, t); ctx.restore(); }
                const turb = smooth(0.15, 0.9, p);
                ctx.save();
                ctx.beginPath(); ctx.moveTo(759, 404); ctx.lineTo(967, 404); ctx.lineTo(967, 528); ctx.quadraticCurveTo(967, 549, 946, 549); ctx.lineTo(780, 549); ctx.quadraticCurveTo(759, 549, 759, 528); ctx.closePath(); ctx.clip();
                /* 석회수 흐림: 기포가 올라가는 자리(고무관 끝)부터 뿌옇게 번지고, 끝에는 흰 탁한 액체가 된다 */
                const loc = smooth(0.08, 0.6, p), all = smooth(0.35, 1, p);

                    rg.addColorStop(0, `rgba(248,250,252,${0.95 * loc})`); rg.addColorStop(0.6, `rgba(241,245,249,${0.7 * loc})`); rg.addColorStop(1, 'rgba(241,245,249,0)');
                    ctx.fillStyle = rg; ctx.fillRect(759, 404, 208, 145);
                }
                if (all > 0) {
                    const mg = ctx.createLinearGradient(0, 404, 0, 549);
                    mg.addColorStop(0, `rgba(241,245,249,${0.85 * all})`); mg.addColorStop(1, `rgba(226,232,240,${0.97 * all})`);
                    ctx.fillStyle = mg; ctx.fillRect(759, 404, 208, 145);
                }
                if (turb > 0) {
                    ctx.fillStyle = `rgba(148,163,184,${0.55 * turb})`;
                    for (let i = 0; i < 70; i++) { ctx.beginPath(); ctx.arc(765 + hr(i + 70) * 196, 410 + hr(i + 110) * 134, 2.4, 0, Math.PI * 2); ctx.fill(); }
                }
                ctx.lineWidth = 1.6;
                simData.bubbles.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill(); ctx.strokeStyle = '#64748b'; ctx.stroke(); });
                ctx.restore();
            });
            blab('T', 110, p >= 1 ? '구리 가루 + 남은 숯가루' : '산화 구리(II) + 숯가루', [110, 104]);
            blab('B', 55, '알코올램프');
            blab('B', 432, '석회수');
        }

        /* ② 이미지판: 수소 흐름, 관 바닥 가루 더미, 심지 끝 불꽃, 차가운 쪽 물방울 (이미지 1000×546) */

                }
                ctx.restore();
                if (on) { ctx.save(); ctx.translate(455, 296); ctx.scale(1.15, 1.15); drawFlame(0, 0, t); ctx.restore(); }
                drawArrow(8, 192, 96, 192, '#64748b', 5, 18);
            });
            blab('T', 26, '수소', [26, 94]);
            blab('T', 228, p >= 1 ? '구리' : '산화 구리(II)', [228, 124]);
            if (p > 0.35) blab('T', 316, '물방울', [316, 98]);
            blab('B', 228, '알코올램프');
        }

        /* ⑦ 이미지판: 가스 구멍 둘레의 파란 불꽃 고리와 열 (이미지 1000×540) */
        function drawBurnerImg(p) {
            const on = isRun() && p < 1, t = simData.time;
            withImg('gas_burner', 0, 44, 0.5, () => {
                if (on) {
                    const flame = (x, y, fh, al) => {
                        const fg = ctx.createLinearGradient(x, y, x, y - fh);
                        fg.addColorStop(0, `rgba(30,64,175,${0.95 * al})`); fg.addColorStop(0.55, `rgba(96,165,250,${0.85 * al})`); fg.addColorStop(1, 'rgba(191,219,254,0.05)');
                        ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.quadraticCurveTo(x - 8, y - fh * 0.6, x, y - fh); ctx.quadraticCurveTo(x + 8, y - fh * 0.6, x + 9, y); ctx.closePath(); ctx.fill();
                    };
                    for (let i = 0; i < 26; i++) {   /* 뒤쪽 불꽃: 버너 뚜껑 뒤 테두리에서 위로 */
                        const a = Math.PI + i / 26 * Math.PI;
                        flame(505 + Math.cos(a) * 150, 188 + Math.sin(a) * 62, 34 + 6 * Math.sin(t * 20 + i), 0.75);
                    }
                    for (let i = 0; i <= 22; i++) {   /* 앞쪽 불꽃: 가스 구멍 줄에서 */
                        const a = i / 22 * Math.PI;
                        flame(505 + Math.cos(a) * 150, 216 + Math.sin(a) * 44, 44 + 8 * Math.sin(t * 22 + i * 1.7), 1);
                    }
                    ctx.strokeStyle = 'rgba(251,146,60,0.6)'; ctx.lineWidth = 4;

        /* ── 입자·전자 모형 ── */

        /* 분자 재배열 모형: 반응물 분자가 가운데로 모이며 사라지고, 생성물 분자가 가운데에서 나와 자리를 잡는다 */

        /* ── 반응식 띠: 산화(위)·환원(아래) 꺾쇠가 같은 순간에 켜진다 ── */

        /* ── 상태·패널 ── */
        function buildRxnList() {

                `<li role="option" tabindex="0" class="p-2 desktop-only:hover:bg-indigo-50 focus:bg-indigo-50 focus:outline-none cursor-pointer truncate" data-value="${i}">${n}</li>`).join('');

        function syncPanel() {

        function selfCheck() {

        /** 시뮬레이션 초기화 — 리셋 버튼 시 자동 호출 (고른 모드·반응·모양은 유지) */
        function initSimulation() {

                if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw());
            }
            buildRxnList();
            sysState.zoomLevel = 1.0; sysState.offsetX = 0; sysState.offsetY = 0;
            resetRun(); syncPanel(); draw();
        }

        function draw() {
            if (!ctx || !canvas) return;
            const w = sysState.canvasLogicalWidth, h = sysState.canvasLogicalHeight;
            ctx.clearRect(0, 0, w, h);
            if (!w || !h) return;
            syncLive();
            const L = computeLayout(w, h);

            ctx.restore();
        }

        function updatePhysics() {
            if (!sysState.isStarted || sysState.isPaused || sysState.isDragging) return;
