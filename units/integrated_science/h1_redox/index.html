<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산화·환원 반응</title><!-- JS의 CONTENT_CONFIG.title로 자동 변경됩니다 -->

    <!-- ════════════════════════════════════════════════════════
         🚫 [수정 금지] 핵심 라이브러리 — KaTeX · Tailwind CSS
         ════════════════════════════════════════════════════════ -->
    <link rel="icon" href="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_short.png"
        type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ════════════════════════════════════════════════════════
         ⚙️  [선택 수정] Tailwind 테마 — 브랜드 색상·폰트만 변경
         ════════════════════════════════════════════════════════ -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: { 'desktop-only': { 'raw': '(hover: hover) and (pointer: fine)' } },
                    colors: { primary: '#4f46e5' },   /* ✏️ 브랜드 색상 */
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] }
                }
            }
        }
    </script>
    <script>
        /* 모바일에서 생략되는 number 스피너만 보완하고 PC 네이티브 UI는 유지 */
        const isIPadDevice =
            /iPad/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isMobileNumberUI =
            navigator.userAgentData?.mobile === true ||
            /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
            isIPadDevice;
        if (isMobileNumberUI) document.documentElement.classList.add('mobile-number-controls');
    </script>

    <style>
        html,
        body,
        button,
        input,
        select,
        textarea {
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* ════════════════════════════════════════════════════════
           ⚙️  [선택 수정] CSS 변수 — 전체 색상·폰트 크기 일괄 조정
           ════════════════════════════════════════════════════════ */
        :root {
            /* 폰트 크기 */
            --font-size-title: 1.275rem;
            --font-size-modal: 1.15rem;
            --font-size-guide: 1.025rem;
            --font-size-desc: 1rem;
            --font-size-small: 0.9rem;
            --font-size-tiny: 0.75rem;

            /* 텍스트 색상 */
            --color-text-main: #334155;
            --color-text-sub: #475569;
            --color-text-light: #64748b;

            /* 테마 포인트 색상 */
            --color-primary: #4f46e5;
            /* ✏️ 메인 포인트 색상 */
            --color-primary-bg: #e0e7ff;
            --color-tab-bg: #d8e0ff80;
            --color-action: #059669;
            --color-action-hover: #047857;
            --color-pause: #e11d48;
            --color-pause-bg: #fff1f2;
            --color-pause-border: #fecdd3;
            --color-obs1: #ea580c;
        }

        /* ════════════════════════════════════════════════════════
           ⚙️  [선택 수정] 디자인 클래스 매핑 — CSS 변수를 UI 요소에 적용
           ════════════════════════════════════════════════════════ */
        .sim-title {
            font-size: var(--font-size-title);
            font-weight: 700;
            color: var(--color-text-main);
            line-height: 1.25;
        }

        .guide-on-off {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: var(--color-text-light);
        }

        .guide-title {
            font-size: var(--font-size-guide);
            color: var(--color-primary);
            font-weight: 700;
        }

        .guide-desc {
            font-size: var(--font-size-desc);
            color: var(--color-text-sub);
        }

        .env-text {
            font-weight: 700;
            color: var(--color-text-light);
            font-size: var(--font-size-tiny);
        }

        .tab-btn {
            font-weight: 700;
            color: var(--color-text-light);
            font-size: var(--font-size-small);
        }

        @media (min-width: 768px) {
            .env-text {
                font-size: var(--font-size-small);
            }
        }

        .helper-text-default {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .helper-text-running {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-pause);
        }

        .helper-text-paused {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: #d97706;
        }

        .var-label-control {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-main);
        }

        .var-label-obs1 {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-obs1);
        }

        .var-label-obs2 {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-action);
        }

        .var-label-var {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: var(--color-text-main);
        }

        .slider-limit-label {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: #94a3b8;
        }

        .var-unit-display {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-primary);
            background-color: var(--color-primary-bg);
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
        }

        .select-option-text {
            font-size: var(--font-size-tiny);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .header-button {
            background-color: #fff;
            color: var(--color-text-sub);
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (hover: hover) and (pointer: fine) {
            .header-button:hover {
                background-color: #f1f5f9;
            }
        }

        .btn-action-start {
            background-color: var(--color-action);
            color: #fff;
            border-color: var(--color-action-hover);
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-action-start:hover {
                background-color: var(--color-action-hover);
            }
        }

        .btn-action-pause {
            background-color: var(--color-pause-bg);
            color: var(--color-pause);
            border-color: var(--color-pause-border);
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        .btn-sub {
            background-color: #fff;
            color: var(--color-text-main);
            border-color: #cbd5e1;
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-sub:hover {
                background-color: #f1f5f9;
            }
        }

        .btn-reset-custom {
            color: var(--color-text-main);
            border-color: #cbd5e1;
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-reset-custom:hover {
                color: var(--color-pause);
                border-color: #fda4af;
                background-color: var(--color-pause-bg);
            }
        }

        .modal-title {
            font-size: var(--font-size-modal);
            font-weight: 700;
            color: #1e293b;
        }

        .modal-close-btn {
            color: #94a3b8;
        }

        @media (hover: hover) and (pointer: fine) {
            .modal-close-btn:hover {
                color: #f43f5e;
            }
        }

        .concept-title-1 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #c2410c;
        }

        .concept-title-2 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #047857;
        }

        .concept-title-3 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #4338ca;
        }

        .concept-title-4 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #6e0478;
        }

        .concept-desc {
            font-size: var(--font-size-desc);
            color: var(--color-text-main);
        }

        .quiz-step {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: #4338ca;
            background-color: var(--color-primary-bg);
        }

        .quiz-question {
            font-size: var(--font-size-modal);
            font-weight: 700;
            color: #1e293b;
        }

        .quiz-btn-check {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #fff;
            background-color: #f97316;
            border: 1px solid #f97316;
            line-height: 1.5rem;
        }

        @media (hover: hover) and (pointer: fine) {
            .quiz-btn-check:hover {
                background-color: #ea580c;
                border-color: #ea580c;
            }
        }

        .quiz-answer-box {
            font-size: var(--font-size-guide);
            font-weight: 700;
            line-height: 1.5rem;
            color: var(--color-text-main);
            background-color: #f8fafc;
            border-color: #e2e8f0;
        }

        .header-button:is(.is-tap-feedback, .is-pen-hover),
        .btn-sub:is(.is-tap-feedback, .is-pen-hover),
        .zoom-btn:is(.is-tap-feedback, .is-pen-hover),
        .nav-btn:is(.is-tap-feedback, .is-pen-hover),
        #customSelectTrigger:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #f1f5f9;
        }

        .btn-action-start:is(.is-tap-feedback, .is-pen-hover) {
            background-color: var(--color-action-hover);
        }

        .btn-reset-custom:is(.is-tap-feedback, .is-pen-hover) {
            color: var(--color-pause);
            border-color: #fda4af;
            background-color: var(--color-pause-bg);
        }

        .modal-close-btn:is(.is-tap-feedback, .is-pen-hover) {
            color: #f43f5e;
        }

        .quiz-btn-check:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #ea580c;
        }

        .tab-btn:not(.border-indigo-600):is(.is-tap-feedback, .is-pen-hover) {
            background-color: rgb(226 232 240 / 0.5);
        }

        .radio-label:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #f8fafc;
        }

        #customSelectList [role="option"]:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #eef2ff;
        }

        /* PC·모바일에서 동일한 숫자 입력 스피너를 고정 노출 */
        .ratio-number-field {
            display: flex;
            flex: 1 1 0%;
            min-width: 0;
            position: relative;
        }

        .ratio-number-stepper {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            width: 2.5rem;
            justify-content: center;
            gap: 0;
        }

        .ratio-step-btn {
            display: flex;
            flex: 1 1 50%;
            min-height: 0;
            width: 100%;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 0.15rem;
            background-color: transparent;
            color: #737373;
            line-height: 1;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .ratio-step-icon {
            width: 0.66rem;
            height: 0.48rem;
            fill: currentColor;
        }

        .ratio-step-btn[data-step-direction="up"] .ratio-step-icon {
            transform: translateY(0.1875rem);
        }

        .ratio-step-btn[data-step-direction="down"] .ratio-step-icon {
            transform: translateY(-0.1875rem);
        }

        .ratio-step-btn:active {
            background-color: transparent;
            color: #475569;
        }

        .ratio-step-btn:focus {
            background-color: transparent;
        }

        .ratio-step-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .ratio-number-field>.input-text {
            appearance: textfield;
            -moz-appearance: textfield;
            padding-right: 2.75rem;
            background-color: transparent;
            transition: border-color 150ms ease;
        }

        .ratio-number-field>.input-text::-webkit-inner-spin-button,
        .ratio-number-field>.input-text::-webkit-outer-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }

        .ratio-number-field:has(>.ratio-number-stepper>.ratio-step-btn:active)>.input-text,
        .ratio-number-field:has(>.ratio-number-stepper>.ratio-step-btn.is-tap-feedback)>.input-text {
            border-color: #6366f1;
        }

        /* iOS Safari는 16px 미만 입력창에 포커스할 때 화면을 자동 확대한다. */
        @supports (-webkit-touch-callout: none) {
            html.mobile-number-controls input[type="number"] {
                font-size: 16px !important;
            }

            .radio-label>.select-option-text {
                white-space: nowrap;
            }
        }

        /* ════════════════════════════════════════════════════════
           🚫 [수정 금지] 코어 레이아웃 구조 — 전체화면·캔버스·스크롤
           ════════════════════════════════════════════════════════ */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html,
        body {
            overscroll-behavior: none;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-size: 16px !important;
        }

        .ui-box {
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
        }

        .shutter-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shutter-wrapper.is-open {
            grid-template-rows: 1fr;
        }

        .shutter-inner {
            overflow: hidden;
        }

        @media (hover: none), (pointer: coarse) {

            input,
            textarea,
            select,
            button,
            [role="button"],
            [contenteditable="true"] {
                touch-action: manipulation;
            }

            .zoom-btn,
            .nav-btn,
            .header-button,
            .btn-sub,
            .btn-reset-custom,
            .modal-close-btn,
            #btnScrollLeft,
            #btnScrollRight {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }

            .zoom-btn:active,
            .zoom-btn.is-tap-feedback,
            .nav-btn:active,
            .nav-btn.is-tap-feedback,
            .header-button:active,
            .header-button.is-tap-feedback,
            .btn-sub:active,
            .btn-sub.is-tap-feedback {
                background-color: #f1f5f9;
            }

            .btn-reset-custom:active,
            .btn-reset-custom.is-tap-feedback {
                color: var(--color-pause);
                border-color: #fda4af;
                background-color: var(--color-pause-bg);
            }

            .modal-close-btn:active,
            .modal-close-btn.is-tap-feedback {
                color: #f43f5e;
            }

            #btnScrollLeft:active,
            #btnScrollLeft.is-tap-feedback,
            #btnScrollRight:active,
            #btnScrollRight.is-tap-feedback {
                color: #4f46e5;
            }

            #fullscreen-btn:is(:active, .is-tap-feedback),
            #fullscreen-btn-mobile:is(:active, .is-tap-feedback) {
                background-color: #f1f5f9;
            }
        }

        canvas {
            touch-action: none;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .bar-track {
            width: 100%;
            height: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }

        .popup-overlay {
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
        }

        #workspace:fullscreen {
            background-color: #f8fafc;
            padding: 1rem;
            overflow-y: auto;
        }

        @media (orientation: landscape) {
            #workspace:fullscreen {
                padding: 1rem;
                overflow-y: hidden;
            }
        }
    </style>

    <!-- 🚫 [수정 금지] Tailwind 컴포넌트 추출 -->
    <style type="text/tailwindcss">
        @layer components {
            .panel-block      { @apply flex flex-col gap-2 p-3 border border-slate-200 rounded-lg bg-white; }
            .modal-container  { @apply bg-white border border-slate-300 rounded-2xl w-full flex flex-col relative shadow-2xl max-h-[70dvh]; }
            .modal-header     { @apply h-14 lg:h-16 px-6 border-b border-slate-100 flex items-center justify-between flex-none; }
            .modal-body       { @apply flex-1 overflow-y-auto p-4 lg:p-6 flex flex-col gap-4; }
            .guide-block      { @apply p-4 bg-slate-50 border border-slate-200 rounded-xl; }
            .zoom-btn         { @apply w-10 h-10 flex items-center justify-center bg-white border border-slate-300 rounded-full shadow-sm text-slate-600 font-bold desktop-only:hover:bg-slate-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed desktop-only:disabled:hover:bg-slate-50; }
            .nav-btn          { @apply w-12 h-12 flex items-center justify-center bg-white border border-slate-300 text-slate-600 rounded-full desktop-only:hover:bg-slate-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed desktop-only:disabled:hover:bg-slate-50; }
            .radio-label      { @apply flex items-start gap-2 p-2 border border-slate-200 rounded bg-white cursor-pointer desktop-only:hover:bg-slate-50 transition-colors has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 has-[:disabled]:opacity-50 has-[:disabled]:cursor-not-allowed; }
            .input-text       { @apply w-full p-2 border border-slate-200 rounded text-center focus:outline-none focus:border-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-slate-50; }
        }
    </style>
</head>

<!-- ════════════════════════════════════════════════════════════════════
     🚫 [수정 금지] BODY — 레이아웃 클래스 수정 금지
     ════════════════════════════════════════════════════════════════════ -->

<body
    class="bg-slate-100 text-slate-800 font-sans w-full m-0 p-0 box-border select-none overflow-x-hidden md:overflow-hidden landscape:overflow-hidden flex flex-col justify-center md:h-[100dvh] landscape:h-[100dvh]">

    <div
        class="flex flex-col w-full max-w-[1680px] mx-auto p-2 gap-2 box-border md:h-[100dvh] md:overflow-hidden landscape:h-[100dvh] landscape:overflow-hidden relative">

        <!-- ═══════════════════════════════════════════════════════════════
         🚫 [수정 금지] 헤더 — 제목은 JS CONTENT_CONFIG.title로 자동 주입
         ═══════════════════════════════════════════════════════════════ -->
        <header class="ui-box flex-none px-4 py-2 flex items-center justify-between z-10 bg-white relative">
            <div class="flex items-center gap-4">
                <a href="https://www.tsherpa.co.kr" target="_blank"
                    class="flex items-center flex-none desktop-only:hover:opacity-80 transition-opacity">
                    <img src="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_black.png"
                        alt="T셀파"
                        class="h-7 md:h-8 object-contain draggable-false flex-none hidden [@media(min-width:768px)]:block">
                    <img src="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_short.png"
                        alt="T셀파"
                        class="h-7 md:h-8 object-contain draggable-false flex-none block [@media(min-width:768px)]:hidden">
                </a>
                <div class="border-l border-slate-300 pl-4">
                    <h1 class="sim-title" id="sim-title-el">로딩 중...</h1><!-- CONTENT_CONFIG.title 자동 주입 -->
                </div>
            </div>
            <div class="flex items-center relative">
                <button id="moreMenuBtn"
                    class="header-button flex landscape:hidden desktop-only:hidden transition-colors ml-2"
                    title="메뉴 더보기">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                    </svg>
                </button>
                <div class="hidden landscape:flex desktop-only:flex items-center">
                    <!-- SOUND MANAGER -->
                    <div id="volume-popup"
                        class="flex items-center overflow-hidden transition-all duration-300 w-0 opacity-0">
                        <div
                            class="flex items-center gap-2 w-48 px-3 bg-white border border-slate-200 rounded-xl h-[36px] ml-2">
                            <button id="popup-mute-btn"
                                class="flex-none text-slate-500 desktop-only:hover:text-indigo-600 transition-colors">

        /* ① 산화 구리(II) + 숯가루: 스탠드·시험관·고무관·석회수 (교과서 p.40) */
        function drawO0(p) {

        /* ③ 용광로: 위로 철광석·코크스·석회석, 아래로 뜨거운 공기 (교과서 p.45) */
        function drawFurnace(p) {
            const on = isRun() && p < 1, t = simData.time;
            const P = [[128, 52], [98, 178], [110, 224], [110, 272], [210, 272], [210, 224], [222, 178], [192, 52]];
            const path = () => { ctx.beginPath(); P.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); };
            ctx.fillStyle = '#a8a29e'; ctx.fillRect(46, 214, 66, 11); ctx.fillRect(208, 214, 66, 11);

            path(); ctx.fillStyle = g; ctx.fill();

            const fall = on || p > 0 ? t * 12 : 0, shift = fall % 16, base = Math.floor(fall / 16);
            const kinds = ['#9a3412', '#1c1917', '#e7e5e4'];
            for (let row = -1; row < 11; row++) for (let c = 0; c < 9; c++) {

        function shapePts(shape, cx, cy) {
            const pts = [];
            if (shape === 'heart') for (let t = 0; t <= Math.PI * 2 + 0.001; t += 0.02) {
                pts.push([cx + 16 * Math.pow(Math.sin(t), 3) * 3.9, cy - 10 - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 3.9]);
            } else if (shape === 'spiral') for (let th = 0; th <= Math.PI * 5; th += 0.04) {
                const r = 5 + 57 * th / (Math.PI * 5); pts.push([cx + r * Math.cos(th), cy + r * Math.sin(th)]);
            } else for (let x = -68; x <= 68; x += 2) pts.push([cx + x, cy]);
            return pts;
        }
        function sites(pts, step) {
            const out = []; let acc = 0;
            for (let i = 1; i < pts.length; i++) {
                const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], d = Math.hypot(x1 - x0, y1 - y0);
                if (!d) continue;
                acc += d;
                while (acc >= step) { acc -= step; const u = 1 - acc / d; out.push({ x: x0 + (x1 - x0) * u, y: y0 + (y1 - y0) * u, nx: -(y1 - y0) / d, ny: (x1 - x0) / d }); }
            }
            return out;
        }

        /* ④ 페트리 접시: 구리줄+질산 은(교과서 p.42) / 아연+황산 구리(II)(지도서 p.114) */
        function drawPetri(p, zinc) {
            ctx.fillStyle = '#f1f5f9'; ctx.fillRect(24, 30, 316, 236);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(20, 26, 316, 236);
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1.5; ctx.strokeRect(20, 26, 316, 236);
            const cx = 178, cy = 144, R = 100;

            ctx.beginPath(); ctx.arc(cx, cy, R - 4, 0, Math.PI * 2); ctx.fillStyle = `rgba(37,99,235,${a})`; ctx.fill();
            ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, cy, R - 6, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(148,163,184,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();

            ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            line(); ctx.strokeStyle = zinc ? '#64748b' : '#7c3a12'; ctx.lineWidth = zinc ? 10 : 6.5; ctx.stroke();
            line(); ctx.strokeStyle = zinc ? '#b6c0cc' : '#d0814e'; ctx.lineWidth = zinc ? 7 : 4; ctx.stroke();
            const S = sites(pts, 7);

                const path = new Path2D();
                S.forEach((q, i) => {
                    const g = smooth(0.02 + 0.25 * hr(i), 1, p); if (g <= 0) return;
                    [1, -1].forEach(side => {
                        const ln = (5 + 12 * hr(i * 3 + (side > 0 ? 1 : 2))) * g;
                        const ang = Math.atan2(q.ny * side, q.nx * side) + (hr(i * 7 + side) - 0.5) * 1.1;
                        const sx = q.x + Math.cos(ang) * 2.5, sy = q.y + Math.sin(ang) * 2.5;
                        const ex = sx + Math.cos(ang) * ln, ey = sy + Math.sin(ang) * ln;
                        path.moveTo(sx, sy); path.lineTo(ex, ey);
                        const mx = sx + Math.cos(ang) * ln * 0.55, my = sy + Math.sin(ang) * ln * 0.55;
                        [0.6, -0.6].forEach(b => { path.moveTo(mx, my); path.lineTo(mx + Math.cos(ang + b) * ln * 0.45, my + Math.sin(ang + b) * ln * 0.45); });
                    });
                });
                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2.6; ctx.stroke(path);
                ctx.strokeStyle = '#eef2f7'; ctx.lineWidth = 1.3; ctx.stroke(path);
            } else {
                S.forEach((q, i) => {
                    const g = smooth(0.02 + 0.25 * hr(i), 1, p); if (g <= 0) return;

                    }

            lab(178, 280, zinc ? '황산 구리(II) 수용액' : '질산 은 수용액');

        /* ⑤ 마그네슘의 연소: 집게로 잡은 리본을 가열 (교과서 p.43) */

        const APP = {
            o0: { w: 420, h: 275, f: drawO0 }, o1: { w: 440, h: 240, f: drawO1 }, o2: { w: 320, h: 285, f: drawFurnace },
            e0: { w: 356, h: 290, f: p => drawPetri(p, false) }, e1: { w: 360, h: 280, f: drawMg }, e2: { w: 356, h: 290, f: p => drawPetri(p, true) }

        function drawApparatus(L) {
            const k = key(), A = APP[k], r = L.app, ui = L.ui;
            ctx.font = font(13 * ui, 500);
            const obsW = r.w * 0.96, lines = wrap('관찰: ' + OBS[k], obsW - 20 * ui);
            const lh = 18 * ui, obsH = lines.length * lh + 14 * ui, gap = 8 * ui;

            const ox = r.x + (r.w - A.w * s) / 2, oy = r.y + Math.max(0, (r.h - (A.h * s + gap + obsH)) / 2);
            labelBuf = [];
            ctx.save(); ctx.translate(ox, oy); ctx.scale(s, s); A.f(simData.progress); ctx.restore();
            ctx.font = font(12.5 * ui); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
            labelBuf.forEach(l => {
                const tw = ctx.measureText(l.t).width, x = ox + l.x * s;
                let left = l.align === 'left' ? x : l.align === 'right' ? x - tw : x - tw / 2;
                left = clamp(left, r.x + 2, r.x + r.w - tw - 2);
                haloText(l.t, left, clamp(oy + l.y * s, r.y + 8 * ui, r.y + r.h - 8 * ui), l.c || '#334155', ui);
            });

                ctx.strokeStyle = '#fcd34d'; ctx.lineWidth = 1.2 * ui; ctx.stroke();
                ctx.font = font(13 * ui, 500); ctx.fillStyle = '#78350f'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                lines.forEach((ln, i) => ctx.fillText(ln, bx + obsW / 2, by + 7 * ui + lh * (i + 0.5)));
            }
        }

        /* ── 산화·환원 꼬리표 ── */
        function measureTag(kind, sub, fs) {
            ctx.font = font(fs); const w1 = ctx.measureText(kind === 'ox' ? '산화' : '환원').width + fs * 1.0;
            ctx.font = font(fs, 500); const w2 = sub ? ctx.measureText(sub).width + fs * 0.9 : 0;
            return { w: w1 + w2, h: fs * 1.7, w1 };
        }

        /* ── 반응식 띠: 산화(위)·환원(아래) 꺾쇠가 같은 순간에 켜진다 ── */

        }

        /** 시뮬레이션 초기화 — 리셋 버튼 시 자동 호출 (고른 모드·반응·모양·카드는 유지) */

            sysState.zoomLevel = 1.0; sysState.offsetX = 0; sysState.offsetY = 0;
            resetRun(); syncPanel(); draw();
        }

        function draw() {
            if (!ctx || !canvas) return;
            const w = sysState.canvasLogicalWidth, h = sysState.canvasLogicalHeight;
            ctx.clearRect(0, 0, w, h);
            if (!w || !h) return;
            syncLive();
            const L = computeLayout(w, h);
            ctx.save();
            if (simData.mode === 'life') drawLife(L);
            else { drawApparatus(L); drawModel(L); drawEquation(L); }
            ctx.restore();
        }

        function updatePhysics() {
            if (!sysState.isStarted || sysState.isPaused || sysState.isDragging) return;
            const now = performance.now();
            const dt = simData.lastTs ? Math.min(0.05, (now - simData.lastTs) / 1000) : 0;
            simData.lastTs = now;
            if (simData.done) { simData.done = false; simData.progress = 0; simData.bubbles = []; }   /* 완료 뒤 다시 시작 = 처음부터 */
            simData.time += dt;
            simData.progress = Math.min(1, simData.progress + dt / SIM_CONFIG.duration[simData.mode]);
            if (key() === 'o0') {
                if (simData.progress > 0.08 && simData.progress < 1) {
                    simData.spawn += dt * 14;
                    while (simData.spawn > 1) { simData.spawn--; simData.bubbles.push({ x: 334 + (Math.random() - 0.5) * 5, y: 242, r: 1.8 + Math.random() * 1.8 }); }
                }
                simData.bubbles.forEach(b => { b.y -= dt * 45; b.x += Math.sin(b.y * 0.3) * 0.15; });
                simData.bubbles = simData.bubbles.filter(b => b.y > 188);
            }
            if (simData.progress >= 1) {
                simData.done = true; simData.lastTs = 0; simData.bubbles = [];
                sysState.isStarted = false; sysState.isPaused = false;
                stopLoop(); updateUIState();
            }
        }
        /* ████ ZONE F 끝 ████████████████████████████████████████████████████████ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE G — LOOP & TAB STATE MANAGER (수정 금지)
           ════════════════════════════════════════════════════════════════════════ */
        function startLoop() { if (!sysState.isLooping) { sysState.isLooping = true; updateLoop(); } }
        function stopLoop() { sysState.isLooping = false; }
        function updateLoop() {
            if (!sysState.isLooping) return;
            updatePhysics(); draw();
            requestAnimationFrame(updateLoop);
        }

        function saveTabState(shape) {
            const selectedRadio = document.querySelector('input[name="simOption"]:checked')?.value;
            const selectedVal = DOM.customSelectTrigger?.getAttribute('data-selected-value') || null;
            tabStates[shape] = {
                ...simData,
                isStarted: sysState.isStarted, isPaused: sysState.isPaused,
                zoomLevel: sysState.zoomLevel, offsetX: sysState.offsetX, offsetY: sysState.offsetY,
                selectVal: selectedVal, radioVal: selectedRadio
            };
        }

        function loadTabState(shape) {
            const state = tabStates[shape];
            if (state) {
                Object.assign(simData, state);
                sysState.isStarted = state.isStarted; sysState.isPaused = state.isPaused;
                sysState.zoomLevel = state.zoomLevel || 1.0;
                sysState.offsetX = state.offsetX || 0;
                sysState.offsetY = state.offsetY || 0;

                const csvEl = document.getElementById('customSelectValue');
                if (state.selectVal) {
                    const li = document.querySelector(`#customSelectList li[data-value="${state.selectVal}"]`);
                    if (li && csvEl) { csvEl.innerHTML = li.innerHTML; DOM.customSelectTrigger?.setAttribute('data-selected-value', state.selectVal); }
                } else {
                    if (csvEl) csvEl.textContent = '학습 내용을 선택하세요';
                    DOM.customSelectTrigger?.removeAttribute('data-selected-value');
                }
                const radio = document.querySelector(`input[name="simOption"][value="${state.radioVal}"]`);
                if (radio) radio.checked = true;
            } else {
                simData.value1 = SIM_CONFIG.slider.initialValue;
                simData.diameter = SIM_CONFIG.object.radius * 2;
                simData.radius = SIM_CONFIG.object.radius;
                simData.ratioA = 1; simData.ratioB = 1;
                sysState.isStarted = false; sysState.isPaused = false;
                sysState.zoomLevel = 1.0; sysState.offsetX = 0; sysState.offsetY = 0;
                if (canvas) { simData.x = sysState.canvasLogicalWidth / 2; simData.y = sysState.canvasLogicalHeight / 2; }
                const csvEl = document.getElementById('customSelectValue');
                if (csvEl) csvEl.textContent = '학습 내용을 선택하세요';
                DOM.customSelectTrigger?.removeAttribute('data-selected-value');
                const dr = document.querySelector('input[name="simOption"][value="parallel"]');
                if (dr) dr.checked = true;
            }

            if (varSlider1) varSlider1.value = simData.value1;
            if (varDisplay1) varDisplay1.textContent = `${simData.value1} ${SIM_CONFIG.slider.unit}`;
            if (DOM.directInputSingle) DOM.directInputSingle.value = simData.diameter;
            if (DOM.ratioInputA) DOM.ratioInputA.value = simData.ratioA;
            if (DOM.ratioInputB) DOM.ratioInputB.value = simData.ratioB;

            sysState.isStarted && !sysState.isPaused ? startLoop() : stopLoop();
            updateUIState(); draw();
        }

        function updateUIState() {
            updateZoomButtons();
            const { statusIndicator, pauseBtn, helperText } = DOM;
            if (!statusIndicator || !pauseBtn || !helperText) return;

            const isRunning = sysState.isStarted && !sysState.isPaused;
            const isPaused = sysState.isPaused;
            const lock = isRunning; /* 동작 중 입력 잠금 */

            if (DOM.varSlider1) DOM.varSlider1.disabled = lock;
            if (DOM.directInputSingle) DOM.directInputSingle.disabled = lock;
            if (DOM.ratioInputA) DOM.ratioInputA.disabled = lock;
            if (DOM.ratioInputB) DOM.ratioInputB.disabled = lock;
            document.querySelectorAll('.ratio-step-btn').forEach(button => {
                button.disabled = lock;
            });
            if (DOM.customSelectTrigger) {
                DOM.customSelectTrigger.disabled = lock;
                if (lock && DOM.customSelectList && !DOM.customSelectList.classList.contains('hidden')) {
                    DOM.customSelectList.classList.add('hidden');
                    DOM.customSelectTrigger.setAttribute('aria-expanded', 'false');
                }
            }
            if (DOM.radioOptions) DOM.radioOptions.forEach(r => r.disabled = lock);

            if (isRunning) {
                statusIndicator.className = "w-3 h-3 rounded-full bg-rose-500 border border-rose-300 animate-pulse translate-y-[1px]";
                pauseBtn.className = "btn-action-pause col-span-2 py-2 border rounded-lg transition-colors";
                pauseBtn.innerHTML = '|| 일시정지';
                helperText.textContent = sysState.isDragging ? "🖐️ 위치 이동 중" : "▶️ 시뮬레이션 실행 중";
                helperText.className = "helper-text-running whitespace-nowrap transition-colors";
            } else if (isPaused) {
                statusIndicator.className = "w-3 h-3 rounded-full bg-amber-400 border border-amber-300 translate-y-[1px]";
                pauseBtn.className = "btn-action-start col-span-2 py-2 border rounded-lg transition-colors";
                pauseBtn.innerHTML = '▶ 계속하기';
                helperText.textContent = sysState.isDragging ? "🖐️ 위치 이동 중" : "⏸️ 일시정지 중";
                helperText.className = "helper-text-paused whitespace-nowrap transition-colors";
            } else {
                statusIndicator.className = "w-3 h-3 rounded-full bg-emerald-500 border border-emerald-300 translate-y-[1px]";
                pauseBtn.className = "btn-action-start col-span-2 py-2 border rounded-lg transition-colors";
                pauseBtn.innerHTML = '▶ 시작';
                helperText.textContent = "초기 상태를 설정하고 시작을 누르세요.";
                helperText.className = "helper-text-default whitespace-nowrap transition-colors";
            }
        }
        /* ════ ZONE G 끝 ════════════════════════════════════════════════════════ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE H — CANVAS RESIZE (수정 금지)
           ════════════════════════════════════════════════════════════════════════ */
        function limitOffset() {
            if (!canvas) return;
            if (sysState.zoomLevel <= 1.0) {
                if (sysState.offsetX !== 0 || sysState.offsetY !== 0) {
                    simData.x = Math.max(simData.radius, Math.min(sysState.canvasLogicalWidth - simData.radius, simData.x + sysState.offsetX));
                    simData.y = Math.max(simData.radius, Math.min(sysState.canvasLogicalHeight - simData.radius, simData.y + sysState.offsetY));
                    sysState.offsetX = 0; sysState.offsetY = 0;
                }
                return;
            }
            const R = simData.radius * sysState.zoomLevel;
            sysState.offsetX = Math.max(R - simData.x, Math.min((sysState.canvasLogicalWidth - R) - simData.x, sysState.offsetX));
            sysState.offsetY = Math.max(R - simData.y, Math.min((sysState.canvasLogicalHeight - R) - simData.y, sysState.offsetY));
        }

        function resizeCanvas() {
            if (!container || !canvas || !ctx) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
            canvas.style.width = `${rect.width}px`; canvas.style.height = `${rect.height}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            sysState.canvasLogicalWidth = rect.width;
            sysState.canvasLogicalHeight = rect.height;
            simData.x = rect.width / 2; simData.y = rect.height / 2;
            for (const k in tabStates) { if (tabStates[k]) { tabStates[k].x = rect.width / 2; tabStates[k].y = rect.height / 2; } }
            limitOffset(); draw();
        }

        const isFullscreenActive = () =>
            !!(document.fullscreenElement || document.webkitFullscreenElement);
        const FULLSCREEN_HISTORY_KEY = '__templateFullscreen';
        const FULLSCREEN_HISTORY_CLEANUP_DELAY = 400;
        const isNaverInAppBrowser = () => /NAVER\s*\((?:inapp|higgs);/i.test(navigator.userAgent);
        let fullscreenHistoryToken = null;
        let fullscreenExitFromHistory = false;
        let fullscreenHistoryCleanup = false;
        let fullscreenHistoryCleanupTimer = null;
        let previousScrollRestoration = null;

        const addFullscreenHistoryToken = stateValue => {
            if (!fullscreenHistoryToken) return stateValue;
            return { ...stateValue, [FULLSCREEN_HISTORY_KEY]: fullscreenHistoryToken };
        };

        const clearFullscreenHistoryTracking = () => {
            clearTimeout(fullscreenHistoryCleanupTimer);
            fullscreenHistoryCleanupTimer = null;
            if (previousScrollRestoration !== null && 'scrollRestoration' in history) {
                history.scrollRestoration = previousScrollRestoration;
            }
            previousScrollRestoration = null;
            fullscreenHistoryToken = null;
            fullscreenExitFromHistory = false;
            fullscreenHistoryCleanup = false;
        };

        const pushFullscreenHistoryEntry = () => {
            if (!isNaverInAppBrowser() || fullscreenHistoryToken) return;
            const token = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
            try {
                if ('scrollRestoration' in history && previousScrollRestoration === null) {
                    previousScrollRestoration = history.scrollRestoration;
                    history.scrollRestoration = 'manual';
                }
                history.pushState({ [FULLSCREEN_HISTORY_KEY]: token }, '');
                fullscreenHistoryToken = token;
            } catch (_) {
                clearFullscreenHistoryTracking();
            }
        };

        const restoreFullscreenHistoryEntry = () => {
            const shouldRestore = isFullscreenActive();
            clearFullscreenHistoryTracking();
            if (shouldRestore) pushFullscreenHistoryEntry();
        };

        const exitFullscreenFromHistory = () => {
            const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
            if (!exitFullscreen) {
                restoreFullscreenHistoryEntry();
                return;
            }
            const token = fullscreenHistoryToken;
            const restoreEntry = () => {
                if (fullscreenHistoryToken === token) restoreFullscreenHistoryEntry();
            };
            fullscreenExitFromHistory = true;
            try {
                const result = exitFullscreen.call(document);
                if (result && typeof result.catch === 'function') result.catch(restoreEntry);
            } catch (_) {
                restoreEntry();
            }
        };

        const cleanupFullscreenHistoryEntry = () => {
            const token = fullscreenHistoryToken;
            if (!token || !history.state || history.state[FULLSCREEN_HISTORY_KEY] !== token) {
                clearFullscreenHistoryTracking();
                return;
            }
            fullscreenHistoryCleanup = true;
            history.back();
        };

        const scheduleFullscreenHistoryCleanup = () => {
            const token = fullscreenHistoryToken;
            clearTimeout(fullscreenHistoryCleanupTimer);
            fullscreenHistoryCleanupTimer = setTimeout(() => {
                if (fullscreenHistoryToken !== token || isFullscreenActive()) return;
                const state = history.state;
                if (!state || state[FULLSCREEN_HISTORY_KEY] !== token) {
                    clearFullscreenHistoryTracking();
                    return;
                }
                /* 전체화면 종료와 history 이동을 분리해 iPad WebKit의 뷰포트 복원 충돌을 막는다.
                   모달·메뉴 항목이 위에 있으면 해당 항목이 닫힌 뒤 다시 정리한다. */
                if (Object.keys(state).length === 1) cleanupFullscreenHistoryEntry();
            }, FULLSCREEN_HISTORY_CLEANUP_DELAY);
        };

        window.addEventListener('popstate', event => {
            clearTimeout(fullscreenHistoryCleanupTimer);
            fullscreenHistoryCleanupTimer = null;
            const token = fullscreenHistoryToken;
            if (!token) return;
            const sameFullscreenEntry = !!(
                event.state && event.state[FULLSCREEN_HISTORY_KEY] === token
            );
            if (fullscreenHistoryCleanup) {
                if (sameFullscreenEntry) history.back();
                else clearFullscreenHistoryTracking();
                return;
            }
            if (sameFullscreenEntry) {
                if (!isFullscreenActive()) scheduleFullscreenHistoryCleanup();
                return;
            }
            if (isFullscreenActive()) exitFullscreenFromHistory();
            else clearFullscreenHistoryTracking();
        });

        function toggleFullScreen() {
            uiSound.playClick();
            const workspace = document.getElementById('workspace');
            if (!workspace) return;

            if (!isFullscreenActive()) {
                if (workspace.requestFullscreen) workspace.requestFullscreen().catch(e => console.error(e));
                else if (workspace.webkitRequestFullscreen) workspace.webkitRequestFullscreen();
                else alert("현재 브라우저는 전체화면을 지원하지 않습니다.");
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        const resetFullscreenButtonFeedback = () => {
            ['fullscreen-btn', 'fullscreen-btn-mobile'].forEach(id => {
                const button = document.getElementById(id);
                if (!button) return;
                clearTimeout(button._tapFeedbackTimer);
                button.classList.remove('is-tap-feedback', 'is-pen-hover');
                button.blur();
            });
        };

        const showSimulationToast = message => {
            document.getElementById('sim-toast')?.remove();
            const toast = document.createElement('div');
            toast.id = 'sim-toast';
            toast.setAttribute('role', 'status');
            toast.className = 'fixed top-30 left-1/2 transform -translate-x-1/2 bg-slate-800/90 backdrop-blur-sm text-white px-6 py-3 rounded-full shadow-lg z-[9999] font-bold text-[0.95rem] transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-2';
            toast.innerHTML = '<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>';
            toast.appendChild(document.createTextNode(message));
            (document.getElementById('workspace') || document.body).appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 1500);
        };

        let fullscreenExitForNumberInput = false;
        let fullscreenNumberExitResetTimer = null;

        const resetFullscreenNumberExitTracking = () => {
            clearTimeout(fullscreenNumberExitResetTimer);
            fullscreenNumberExitResetTimer = null;
            fullscreenExitForNumberInput = false;
        };

        const markFullscreenNumberInputPress = event => {
            if (!isIPadDevice || !isFullscreenActive()) return;
            const input = event.target.closest?.('#workspace input[type="number"]');
            if (!input || input.disabled) return;

            fullscreenExitForNumberInput = true;
            clearTimeout(fullscreenNumberExitResetTimer);
            fullscreenNumberExitResetTimer = setTimeout(
                resetFullscreenNumberExitTracking,
                2000
            );
        };

        const fullscreenNumberPressEvent = window.PointerEvent ? 'pointerdown' : 'touchstart';
        document.addEventListener(fullscreenNumberPressEvent, markFullscreenNumberInputPress, {
            capture: true,
            passive: true
        });

        const handleFullscreenChange = () => {
            if (!isFullscreenActive() && fullscreenExitForNumberInput) {
                resetFullscreenNumberExitTracking();
                showSimulationToast('숫자 입력을 위해 전체화면이 종료되었습니다.');
            }
            if (isFullscreenActive()) {
                pushFullscreenHistoryEntry();
            } else if (fullscreenHistoryToken) {
                if (fullscreenExitFromHistory) {
                    clearFullscreenHistoryTracking();
                } else {
                    scheduleFullscreenHistoryCleanup();
                }
            }
            if (!isFullscreenActive()) resetFullscreenButtonFeedback();
            requestAnimationFrame(() => {
                if (!isFullscreenActive()) resetFullscreenButtonFeedback();
                resizeCanvas();
            });

            const exitUI = document.getElementById('fullscreen-exit-ui');
            if (!exitUI) return;
            if (isFullscreenActive()) { exitUI.classList.remove('hidden', 'opacity-100'); exitUI.classList.add('opacity-0'); }
            else { exitUI.classList.add('hidden', 'opacity-0'); exitUI.classList.remove('opacity-100'); }
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        /* ════ ZONE H 끝 ════════════════════════════════════════════════════════ */


        /* ████████████████████████████████████████████████████████████████████████
           ████                                                               ████
           ████   ✏️  ZONE I — INPUT EVENT HANDLERS (입력 이벤트 핸들러)       ████
           ████   폼 변경 시 simData를 어떻게 업데이트할지 여기서 작성하세요.     ████
           ████                                                               ████
           ████████████████████████████████████████████████████████████████████████ */
        function bindInputEvents() {
            const locked = () => sysState.isStarted && !sysState.isPaused;

            /* 모드 (simOption은 실행 중 ZONE G가 잠금) */
            bindEvent('radioSelectContainer', 'change', (e) => {
                if (e.target.name !== 'simOption') return;
                setMode(e.target.value);
            });

            /* 금속 모양 · 생활 속 카드: 실행 중에는 무시 */
            bindEvent('shapeContainer', 'change', (e) => {
                if (e.target.name !== 'metalShape') return;
                if (locked()) { syncPanel(); return; }
                simData.shape = e.target.value; resetRun(); draw();
            });
            bindEvent('cardContainer', 'change', (e) => {
                if (e.target.name !== 'lifeCard') return;
                if (locked()) { syncPanel(); return; }
                setCard(parseInt(e.target.value, 10));
            });

            /* 산화·환원되는 물질 고르기 (시작 버튼과 상관없음) */
            bindEvent('judgeBlock', 'change', (e) => {
                const v = parseInt(e.target.value, 10);
                if (e.target.name === 'pickOx') simData.pickOx = v;
                else if (e.target.name === 'pickRed') simData.pickRed = v;
                else return;
                simData.judged = null; showJudge(); draw();
            });
            bindEvent('judgeBtn', 'click', () => { uiSound.playClick(); judge(); });

            /* 드롭다운 커스텀 셀렉트 — 목록이 모드마다 바뀌므로 위임 방식 */
            const trigger = DOM.customSelectTrigger;
            const list = DOM.customSelectList;
            if (trigger && list) {
                const items = () => Array.from(list.querySelectorAll('li'));
                const toggleDropdown = (show) => {
                    show = show !== undefined ? show : list.classList.contains('hidden');
                    if (show) { list.classList.remove('hidden'); trigger.setAttribute('aria-expanded', 'true'); }
                    else { list.classList.add('hidden'); trigger.setAttribute('aria-expanded', 'false'); }
                };
                trigger.addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown(); });
                trigger.addEventListener('keydown', (e) => {
                    if (['Enter', ' ', 'ArrowDown'].includes(e.key)) { e.preventDefault(); toggleDropdown(true); items()[0]?.focus(); }
                });
                list.addEventListener('click', (e) => {
                    const item = e.target.closest('li'); if (!item) return;
                    e.stopPropagation();
                    toggleDropdown(false);
                    setRxn(parseInt(item.getAttribute('data-value'), 10));
                });
                list.addEventListener('keydown', (e) => {
                    const item = e.target.closest('li'); if (!item) return;
                    const all = items(), i = all.indexOf(item);
                    if (['Enter', ' '].includes(e.key)) { e.preventDefault(); item.click(); trigger.focus(); }
                    else if (e.key === 'ArrowDown') { e.preventDefault(); all[(i + 1) % all.length]?.focus(); }
                    else if (e.key === 'ArrowUp') { e.preventDefault(); all[(i - 1 + all.length) % all.length]?.focus(); }
                    else if (e.key === 'Escape') { e.preventDefault(); toggleDropdown(false); trigger.focus(); }
                });
                document.addEventListener('click', () => { if (!list.classList.contains('hidden')) toggleDropdown(false); });
            }
        }
        /* ████ ZONE I 끝 ████████████████████████████████████████████████████████ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE J — CORE EVENT BINDING (수정 금지)
           전체화면·모달·셔터·캔버스 드래그·줌·탭·토스트 이벤트 처리
           ════════════════════════════════════════════════════════════════════════ */
        function bindCoreEvents() {

            /* 동작 중 입력 차단 토스트 */
            const showDisabledToast = (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                showSimulationToast('일시정지 후 설정을 변경해 주세요.');
            };

            const interceptInteraction = (e) => {
                if (!(sysState.isStarted && !sysState.isPaused)) return;
                const disabledControl = e.target.closest?.(':disabled, [aria-disabled="true"], .tab-btn');
                const disabledLabel = e.target.closest?.('label');
                if (!disabledControl && !disabledLabel?.querySelector(':disabled')) return;
                showDisabledToast(e);
            };

            ['controlsWrapper', 'shapeTabs'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('pointerdown', interceptInteraction, true);
                    el.addEventListener('click', interceptInteraction, true);
                    el.addEventListener('keydown', interceptInteraction, true);
                }
            });

            /* 손가락·펜 입력 피드백 — 모바일 펜의 hover/press 상태도 버튼과 옵션에 동일 적용 */
            const TAP_FEEDBACK_SELECTOR = 'button, [role="button"], .radio-label, #customSelectList [role="option"]';
            const isFeedbackDisabled = (control) =>
                control.matches(':disabled, [aria-disabled="true"]') || !!control.querySelector(':disabled');
            document.addEventListener('pointerdown', (e) => {
                if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
                const control = e.target.closest?.(TAP_FEEDBACK_SELECTOR);
                if (!control || isFeedbackDisabled(control)) return;
                control.classList.add('is-tap-feedback');
                clearTimeout(control._tapFeedbackTimer);
                const feedbackDuration = control.matches('.ratio-step-btn') ? 500 : 250;
                control._tapFeedbackTimer = setTimeout(() => {
                    control.classList.remove('is-tap-feedback');
                    control.blur();
                }, feedbackDuration);
            });
            document.addEventListener('pointerover', (e) => {
                if (e.pointerType !== 'pen' || e.buttons !== 0) return;
                const control = e.target.closest?.(TAP_FEEDBACK_SELECTOR);
                if (!control || isFeedbackDisabled(control)) return;
                control.classList.add('is-pen-hover');
            });
            document.addEventListener('pointerout', (e) => {
                if (e.pointerType !== 'pen') return;
                const control = e.target.closest?.(TAP_FEEDBACK_SELECTOR);
                if (!control || control.contains(e.relatedTarget)) return;
                control.classList.remove('is-pen-hover');
            });
            document.addEventListener('pointerup', (e) => {
                if (e.pointerType !== 'pen' || matchMedia('(any-hover: hover)').matches) return;
                e.target.closest?.(TAP_FEEDBACK_SELECTOR)?.classList.remove('is-pen-hover');
            });

            /* 사운드 */
            const soundBtn = document.getElementById('sound-toggle-btn');
            const popup = document.getElementById('volume-popup');
            const muteBtn = document.getElementById('popup-mute-btn');
            const slider = document.getElementById('volume-slider');
            if (soundBtn && popup && muteBtn && slider) {
                uiSound.setDOM(document.getElementById('sound-icon-main'), document.getElementById('sound-icon-popup'), slider);
                soundBtn.addEventListener('click', (e) => { e.stopPropagation(); popup.classList.toggle('w-48'); popup.classList.toggle('w-0'); popup.classList.toggle('opacity-0'); popup.classList.toggle('opacity-100'); });
                muteBtn.addEventListener('click', (e) => { e.stopPropagation(); uiSound.toggleMute(); if (parseFloat(slider.value) === 0) { popup.classList.remove('w-48', 'opacity-100'); popup.classList.add('w-0', 'opacity-0'); } });
                slider.addEventListener('input', (e) => uiSound.setVolume(e.target.value));
                window.addEventListener('click', (e) => { if (!soundBtn.contains(e.target) && !popup.contains(e.target) && popup.classList.contains('w-48')) { popup.classList.remove('w-48', 'opacity-100'); popup.classList.add('w-0', 'opacity-0'); } });
            }

            /* 모바일 메뉴 */
            const moreMenuBtn = document.getElementById('moreMenuBtn');
            const mobileMenuPanel = document.getElementById('mobileMenuPanel');
            if (moreMenuBtn && mobileMenuPanel) {
                const close = () => { mobileMenuPanel.classList.remove('w-[84px]', 'opacity-100'); mobileMenuPanel.classList.add('w-0', 'opacity-0'); };
                const toggle = () => {
                    uiSound.playClick();
                    const isOpen = mobileMenuPanel.classList.contains('w-[84px]');
                    if (!isOpen) { mobileMenuPanel.classList.remove('w-0', 'opacity-0'); mobileMenuPanel.classList.add('w-[84px]', 'opacity-100'); }
                    else { close(); }
                };
                moreMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
                window.addEventListener('resize', () => { if (isFullscreenActive()) return; if (getComputedStyle(moreMenuBtn).display === 'none' && mobileMenuPanel.classList.contains('w-[84px]')) { close(); } });
                window.addEventListener('click', (e) => { if (!moreMenuBtn.contains(e.target) && !mobileMenuPanel.contains(e.target) && mobileMenuPanel.classList.contains('w-[84px]')) { close(); } });
            }

            /* 전체화면 */
            bindEvent('fullscreen-btn', 'click', toggleFullScreen);
            bindEvent('fullscreen-btn-mobile', 'click', toggleFullScreen);

            /* 모달 */
            const toggleModal = (id, show) => {
                uiSound.playClick();
                const modal = document.getElementById(id); if (!modal) return;
                if (show) { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; history.pushState(addFullscreenHistoryToken({ modalOpen: id }), ''); }
                else { modal.classList.add('hidden'); document.body.style.overflow = ''; if (history.state?.modalOpen === id) history.back(); }
            };
            window.addEventListener('popstate', () => {
                ['helpBox', 'conceptBox', 'quizBox'].forEach(id => document.getElementById(id)?.classList.add('hidden'));
                document.body.style.overflow = '';
            });
            document.addEventListener('keydown', (event) => {
                if (event.key !== 'Escape') return;
                const openModalId = ['helpBox', 'conceptBox', 'quizBox'].find(id => {
                    const modal = document.getElementById(id);
                    return modal && !modal.classList.contains('hidden');
                });
                if (!openModalId) return;
                event.preventDefault();
                toggleModal(openModalId, false);
            });
            bindEvent('helpBtn', 'click', () => toggleModal('helpBox', true));
            bindEvent('help-Btn', 'click', () => toggleModal('helpBox', true));
            bindEvent('closeHelpBtn', 'click', () => toggleModal('helpBox', false));
            bindEvent('conceptBtn', 'click', () => toggleModal('conceptBox', true));
            bindEvent('closeConceptBtn', 'click', () => toggleModal('conceptBox', false));
            bindEvent('closeQuizBtn', 'click', () => toggleModal('quizBox', false));

            /* 셔터 */
            const shutterToggle = document.getElementById('shutter-toggle');
            const shutterContent = document.getElementById('shutter-content');
            const shutterIcon = document.getElementById('shutter-icon');
            if (shutterToggle && shutterContent) {
                const shutterText = shutterToggle.querySelector('span');
                shutterToggle.addEventListener('click', () => {
                    uiSound.playClick();
                    const isOpen = shutterContent.classList.toggle('is-open');
                    shutterToggle.classList.toggle('is-open', isOpen);
                    if (shutterIcon) shutterIcon.classList.toggle('rotate-180', isOpen);
                    if (shutterText) shutterText.textContent = isOpen ? '학습 가이드 닫기' : '학습 가이드 보기';
                });
            }

            /* 시작/일시정지 */
            bindEvent('pauseBtn', 'click', () => {
                uiSound.playClick();
                if (!sysState.isStarted) { sysState.isStarted = true; sysState.isPaused = false; startLoop(); }
                else { sysState.isPaused = !sysState.isPaused; sysState.isPaused ? stopLoop() : startLoop(); }
                updateUIState(); draw();
            });

            /* 리셋 */
            bindEvent('resetBtn', 'click', () => { uiSound.playClick(); initSimulation(); });

            /* 퀴즈 */
            function stabilizeQuizLayout() {
                if (!CONTENT_CONFIG.quizzes?.length) return;
                const sizerQ = document.getElementById('sizerQ');
                const sizerA = document.getElementById('sizerA');
                if (!sizerQ || !sizerA) return; // 뼈대가 없으면 작동 안 함

                let longestQ = '', longestA = '';

                // 1) 전체 퀴즈를 순회하면서 가장 긴 질문과 정답을 찾습니다.
                CONTENT_CONFIG.quizzes.forEach(({ q, a }) => {
                    if (q.length > longestQ.length) longestQ = q;
                    if (a.length > longestA.length) longestA = a;
                });

                // 2) 찾아낸 가장 긴 텍스트를 투명 뼈대(Sizer)에 꽂아 넣습니다. (끝!)
                sizerQ.textContent = longestQ;
                sizerA.textContent = longestA;
            }

            function updateQuizUI() {
                if (!CONTENT_CONFIG.quizzes?.length) return;
                const q = CONTENT_CONFIG.quizzes[sysState.currentQuizIndex];
                const stepEl = document.getElementById('quizStep');
                const qEl = document.getElementById('questionText');
                const aEl = document.getElementById('answerText');
                const showBtn = document.getElementById('showAnswerBtn');
                const prevBtn = document.getElementById('prevQuizBtn');
                const nextBtn = document.getElementById('nextQuizBtn');
                if (stepEl) stepEl.textContent = `질문 ${sysState.currentQuizIndex + 1} / ${CONTENT_CONFIG.quizzes.length}`;
                if (qEl) qEl.innerText = q.q;
                if (aEl) { aEl.textContent = q.a; aEl.classList.add('hidden'); }
                if (showBtn) showBtn.classList.remove('hidden');
                if (prevBtn) prevBtn.disabled = sysState.currentQuizIndex === 0;
                if (nextBtn) nextBtn.disabled = sysState.currentQuizIndex === CONTENT_CONFIG.quizzes.length - 1;
            }
            bindEvent('quizBtn', 'click', () => { sysState.currentQuizIndex = 0; updateQuizUI(); toggleModal('quizBox', true); requestAnimationFrame(stabilizeQuizLayout); });
            bindEvent('showAnswerBtn', 'click', () => { uiSound.playClick(); document.getElementById('answerText')?.classList.remove('hidden'); document.getElementById('showAnswerBtn')?.classList.add('hidden'); });
            bindEvent('nextQuizBtn', 'click', () => { if (sysState.currentQuizIndex < CONTENT_CONFIG.quizzes.length - 1) { uiSound.playClick(); sysState.currentQuizIndex++; updateQuizUI(); } });
            bindEvent('prevQuizBtn', 'click', () => { if (sysState.currentQuizIndex > 0) { uiSound.playClick(); sysState.currentQuizIndex--; updateQuizUI(); } });
            window.addEventListener('resize', debounce(stabilizeQuizLayout, 100));

            /* 캔버스 상단 탭 */
            const shapeTabsDOM = document.getElementById('shapeTabs');
            if (shapeTabsDOM) {
                const updateTabScrollIndicators = () => {
                    const leftInd = document.getElementById('tabScrollLeft');
                    const rightInd = document.getElementById('tabScrollRight');
                    if (!leftInd || !rightInd) return;
                    const maxSL = shapeTabsDOM.scrollWidth - shapeTabsDOM.clientWidth;
                    leftInd.classList.toggle('opacity-0', shapeTabsDOM.scrollLeft <= 1);
                    leftInd.classList.toggle('pointer-events-none', shapeTabsDOM.scrollLeft <= 1);
                    leftInd.classList.toggle('opacity-100', shapeTabsDOM.scrollLeft > 1);
                    rightInd.classList.toggle('opacity-0', Math.ceil(shapeTabsDOM.scrollLeft) >= maxSL - 1 || maxSL <= 0);
                    rightInd.classList.toggle('pointer-events-none', Math.ceil(shapeTabsDOM.scrollLeft) >= maxSL - 1 || maxSL <= 0);
                    rightInd.classList.toggle('opacity-100', Math.ceil(shapeTabsDOM.scrollLeft) < maxSL - 1 && maxSL > 0);
                };
                shapeTabsDOM.addEventListener('scroll', updateTabScrollIndicators);
                window.addEventListener('resize', debounce(updateTabScrollIndicators, 100));
                setTimeout(updateTabScrollIndicators, 150);

                bindEvent('btnScrollLeft', 'click', () => { uiSound.playClick(); shapeTabsDOM.scrollBy({ left: -120, behavior: 'smooth' }); });
                bindEvent('btnScrollRight', 'click', () => { uiSound.playClick(); shapeTabsDOM.scrollBy({ left: 120, behavior: 'smooth' }); });

                let isDownTab = false, startXTab = 0, scrollLeftTab = 0;
                shapeTabsDOM.addEventListener('mousedown', (e) => { isDownTab = true; startXTab = e.pageX - shapeTabsDOM.offsetLeft; scrollLeftTab = shapeTabsDOM.scrollLeft; });
                shapeTabsDOM.addEventListener('mouseleave', () => isDownTab = false);
                shapeTabsDOM.addEventListener('mouseup', () => isDownTab = false);
                shapeTabsDOM.addEventListener('mousemove', (e) => { if (!isDownTab) return; e.preventDefault(); shapeTabsDOM.scrollLeft = scrollLeftTab - (e.pageX - shapeTabsDOM.offsetLeft - startXTab) * 1.5; });

                const tabBtns = shapeTabsDOM.querySelectorAll('.tab-btn');
                shapeTabsDOM.addEventListener('click', (e) => {
                    const target = e.target.closest('.tab-btn');
                    if (!target || (sysState.isStarted && !sysState.isPaused)) return;
                    const newShape = target.getAttribute('data-shape');
                    if (simData.shape === newShape) return;
                    saveTabState(simData.shape);
                    tabBtns.forEach(b => { b.classList.remove('border-indigo-600', 'text-indigo-600', 'bg-white'); b.classList.add('border-transparent', 'text-slate-500', 'bg-transparent', 'desktop-only:hover:bg-slate-200/50'); });
                    target.classList.remove('border-transparent', 'text-slate-500', 'bg-transparent', 'desktop-only:hover:bg-slate-200/50');
                    target.classList.add('border-indigo-600', 'text-indigo-600', 'bg-white');
                    simData.shape = newShape;
                    loadTabState(simData.shape);
                });
            }

            /* 전체화면 마우스 오버 */
            let fullscreenHoverTimer;
            document.addEventListener('mousemove', (e) => {
                if (!document.fullscreenElement) return;
                const exitUI = document.getElementById('fullscreen-exit-ui'); if (!exitUI) return;
                if (e.clientY < 80) { exitUI.classList.remove('opacity-0'); exitUI.classList.add('opacity-100'); clearTimeout(fullscreenHoverTimer); }
                else { clearTimeout(fullscreenHoverTimer); fullscreenHoverTimer = setTimeout(() => { exitUI.classList.remove('opacity-100'); exitUI.classList.add('opacity-0'); }, 10); }
            });
        }
        /* ════ ZONE J 끝 ════════════════════════════════════════════════════════ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE K — 초기 실행 (수정 금지)
           ════════════════════════════════════════════════════════════════════════ */
        const resizeObserver = new ResizeObserver(() => resizeCanvas());

        window.addEventListener('load', () => {
            if (container) resizeObserver.observe(container);
            bindCoreEvents();   /* 🚫 코어 이벤트 바인딩 */
            bindInputEvents();  /* ✏️ 입력 이벤트 바인딩 (ZONE I) */
            initSimulation();   /* ✏️ 시뮬레이션 초기화  (ZONE F) */
        });
        /* ════ ZONE K 끝 ════════════════════════════════════════════════════════ */
    </script>
</body>

</html>
