<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밀도 차를 이용한 혼합물의 분리</title><!-- JS의 CONTENT_CONFIG.title로 자동 변경됩니다 -->

    <!-- ════════════════════════════════════════════════════════
         🚫 [수정 금지] 핵심 라이브러리 — KaTeX · Tailwind CSS
         ════════════════════════════════════════════════════════ -->
    <link rel="icon" href="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_short.png"
        type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ════════════════════════════════════════════════════════
         ⚙️  [선택 수정] Tailwind 테마 — 브랜드 색상·폰트만 변경
         ════════════════════════════════════════════════════════ -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: { 'desktop-only': { 'raw': '(hover: hover) and (pointer: fine)' } },
                    colors: { primary: '#4f46e5' },   /* ✏️ 브랜드 색상 */
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] }
                }
            }
        }
    </script>
    <script>
        /* 모바일에서 생략되는 number 스피너만 보완하고 PC 네이티브 UI는 유지 */
        const isIPadDevice =
            /iPad/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isMobileNumberUI =
            navigator.userAgentData?.mobile === true ||
            /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
            isIPadDevice;
        if (isMobileNumberUI) document.documentElement.classList.add('mobile-number-controls');
    </script>

    <style>
        html,
        body,
        button,
        input,
        select,
        textarea {
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* ════════════════════════════════════════════════════════
           ⚙️  [선택 수정] CSS 변수 — 전체 색상·폰트 크기 일괄 조정
           ════════════════════════════════════════════════════════ */
        :root {
            /* 폰트 크기 */
            --font-size-title: 1.275rem;
            --font-size-modal: 1.15rem;
            --font-size-guide: 1.025rem;
            --font-size-desc: 1rem;
            --font-size-small: 0.9rem;
            --font-size-tiny: 0.75rem;

            /* 텍스트 색상 */
            --color-text-main: #334155;
            --color-text-sub: #475569;
            --color-text-light: #64748b;

            /* 테마 포인트 색상 */
            --color-primary: #4f46e5;
            /* ✏️ 메인 포인트 색상 */
            --color-primary-bg: #e0e7ff;
            --color-tab-bg: #d8e0ff80;
            --color-action: #059669;
            --color-action-hover: #047857;
            --color-pause: #e11d48;
            --color-pause-bg: #fff1f2;
            --color-pause-border: #fecdd3;
            --color-obs1: #ea580c;
        }

        /* ════════════════════════════════════════════════════════
           ⚙️  [선택 수정] 디자인 클래스 매핑 — CSS 변수를 UI 요소에 적용
           ════════════════════════════════════════════════════════ */
        .sim-title {
            font-size: var(--font-size-title);
            font-weight: 700;
            color: var(--color-text-main);
            line-height: 1.25;
        }

        .guide-on-off {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: var(--color-text-light);
        }

        .guide-title {
            font-size: var(--font-size-guide);
            color: var(--color-primary);
            font-weight: 700;
        }

        .guide-desc {
            font-size: var(--font-size-desc);
            color: var(--color-text-sub);
        }

        .env-text {
            font-weight: 700;
            color: var(--color-text-light);
            font-size: var(--font-size-tiny);
        }

        .tab-btn {
            font-weight: 700;
            color: var(--color-text-light);
            font-size: var(--font-size-small);
        }

        @media (min-width: 768px) {
            .env-text {
                font-size: var(--font-size-small);
            }
        }

        .helper-text-default {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .helper-text-running {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-pause);
        }

        .helper-text-paused {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .var-label-control {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-main);
        }

        .var-label-obs1 {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-obs1);
        }

        .var-label-obs2 {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-action);
        }

        .var-label-var {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: var(--color-text-main);
        }

        .slider-limit-label {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: #94a3b8;
        }

        .var-unit-display {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-primary);
            background-color: var(--color-primary-bg);
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
        }

        .select-option-text {
            font-size: var(--font-size-tiny);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .header-button {
            background-color: #fff;
            color: var(--color-text-sub);
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (hover: hover) and (pointer: fine) {
            .header-button:hover {
                background-color: #f1f5f9;
            }
        }

        .btn-action-start {
            background-color: var(--color-action);
            color: #fff;
            border-color: var(--color-action-hover);
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-action-start:hover {
                background-color: var(--color-action-hover);
            }
        }

        .btn-action-pause {
            background-color: var(--color-pause-bg);
            color: var(--color-pause);
            border-color: var(--color-pause-border);
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        .btn-sub {
            background-color: #fff;
            color: var(--color-text-main);
            border-color: #cbd5e1;
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-sub:hover {
                background-color: #f1f5f9;
            }
        }

        .btn-reset-custom {
            color: var(--color-text-main);
            border-color: #cbd5e1;
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-reset-custom:hover {
                color: var(--color-pause);
                border-color: #fda4af;
                background-color: var(--color-pause-bg);
            }
        }

        .modal-title {
            font-size: var(--font-size-modal);
            font-weight: 700;
            color: #1e293b;
        }

        .modal-close-btn {
            color: #94a3b8;
        }

        @media (hover: hover) and (pointer: fine) {
            .modal-close-btn:hover {
                color: #f43f5e;
            }
        }

        .concept-title-1 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #c2410c;
        }

        .concept-title-2 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #047857;
        }

        .concept-title-3 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #4338ca;
        }

        .concept-title-4 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #6e0478;
        }

        .concept-desc {
            font-size: var(--font-size-desc);
            color: var(--color-text-main);
        }

        .quiz-step {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: #4338ca;
            background-color: var(--color-primary-bg);
        }

        .quiz-question {
            font-size: var(--font-size-modal);
            font-weight: 700;
            color: #1e293b;
            white-space: pre-wrap; /* 질문·보기 줄바꿈과 보기 사이 공백 유지 */
        }

        .quiz-btn-check {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #fff;
            background-color: #f97316;
            border: 1px solid #f97316;
            line-height: 1.5rem;
        }

        @media (hover: hover) and (pointer: fine) {
            .quiz-btn-check:hover {
                background-color: #ea580c;
                border-color: #ea580c;
            }
        }

        .quiz-answer-box {
            font-size: var(--font-size-guide);
            font-weight: 700;
            line-height: 1.5rem;
            color: var(--color-text-main);
            background-color: #f8fafc;
            border-color: #e2e8f0;
            white-space: pre-line; /* 정답·해설 줄바꿈 유지 */
        }

        .header-button:is(.is-tap-feedback, .is-pen-hover),
        .btn-sub:is(.is-tap-feedback, .is-pen-hover),
        .zoom-btn:is(.is-tap-feedback, .is-pen-hover),
        .nav-btn:is(.is-tap-feedback, .is-pen-hover),
        #customSelectTrigger:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #f1f5f9;
        }

        .btn-action-start:is(.is-tap-feedback, .is-pen-hover) {
            background-color: var(--color-action-hover);
        }

        .btn-reset-custom:is(.is-tap-feedback, .is-pen-hover) {
            color: var(--color-pause);
            border-color: #fda4af;
            background-color: var(--color-pause-bg);
        }

        .modal-close-btn:is(.is-tap-feedback, .is-pen-hover) {
            color: #f43f5e;
        }

        .quiz-btn-check:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #ea580c;
        }

        .tab-btn:not(.border-indigo-600):is(.is-tap-feedback, .is-pen-hover) {
            background-color: rgb(226 232 240 / 0.5);
        }

        .radio-label:not(:has(:checked)):is(.is-tap-feedback, .is-pen-hover),
        .panel-block label:has(input[type="checkbox"]):is(.is-tap-feedback, .is-pen-hover) {
            background-color: #f8fafc;
        }

        @media (hover: hover) and (pointer: fine) {
            .radio-label:not(:has(:checked)):hover {
                background-color: #f8fafc;
            }
        }

        #customSelectList [role="option"]:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #eef2ff;
        }

        /* PC·모바일에서 동일한 숫자 입력 스피너를 고정 노출 */
        .ratio-number-field {
            display: flex;
            flex: 1 1 0%;
            min-width: 0;
            position: relative;
        }

        .ratio-number-stepper {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            width: 2.5rem;
            justify-content: center;
            gap: 0;
        }

        .ratio-step-btn {
            display: flex;
            flex: 1 1 50%;
            min-height: 0;
            width: 100%;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 0.15rem;
            background-color: transparent;
            color: #737373;
            line-height: 1;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .ratio-step-icon {
            width: 0.66rem;
            height: 0.48rem;
            fill: currentColor;
        }

        .ratio-step-btn[data-step-direction="up"] .ratio-step-icon {
            transform: translateY(0.1875rem);
        }

        .ratio-step-btn[data-step-direction="down"] .ratio-step-icon {
            transform: translateY(-0.1875rem);
        }

        .ratio-step-btn:active {
            background-color: transparent;
            color: #475569;
        }

        .ratio-step-btn:focus {
            background-color: transparent;
        }

        .ratio-step-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .ratio-number-field>.input-text {
            appearance: textfield;
            -moz-appearance: textfield;
            padding-right: 2.75rem;
            background-color: transparent;
            transition: border-color 150ms ease;
        }

        .ratio-number-field>.input-text::-webkit-inner-spin-button,
        .ratio-number-field>.input-text::-webkit-outer-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }

        .ratio-number-field:has(>.ratio-number-stepper>.ratio-step-btn:active)>.input-text,
        .ratio-number-field:has(>.ratio-number-stepper>.ratio-step-btn.is-tap-feedback)>.input-text {
            border-color: #6366f1;
        }

        /* iOS Safari는 16px 미만 입력창에 포커스할 때 화면을 자동 확대한다. */
        @supports (-webkit-touch-callout: none) {
            html.mobile-number-controls input[type="number"] {
                font-size: 16px !important;
            }

            .radio-label>.select-option-text {
                white-space: nowrap;
            }
        }

        /* ════════════════════════════════════════════════════════
           🚫 [수정 금지] 코어 레이아웃 구조 — 전체화면·캔버스·스크롤
           ════════════════════════════════════════════════════════ */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html,
        body {
            overscroll-behavior: none;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-size: 16px !important;
        }

        .ui-box {
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
        }

        .shutter-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shutter-wrapper.is-open {
            grid-template-rows: 1fr;
        }

        .shutter-inner {
            overflow: hidden;
        }

        @media (hover: none),
        (pointer: coarse) {

            input,
            textarea,
            select,
            button,
            [role="button"],
            [contenteditable="true"] {
                touch-action: manipulation;
            }

            .nav-btn,
            .header-button,
            .btn-sub,
            .btn-reset-custom,
            .modal-close-btn {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }

            .nav-btn:is(:active, .is-tap-feedback),
            .header-button:is(:active, .is-tap-feedback),
            .btn-sub:is(:active, .is-tap-feedback) {
                background-color: #f1f5f9;
            }

            .btn-reset-custom:is(:active, .is-tap-feedback) {
                color: var(--color-pause);
                border-color: #fda4af;
                background-color: var(--color-pause-bg);
            }

            .modal-close-btn:is(:active, .is-tap-feedback) {
                color: #f43f5e;
            }

            #fullscreen-btn:is(:active, .is-tap-feedback),
            #fullscreen-btn-mobile:is(:active, .is-tap-feedback) {
                background-color: #f1f5f9;
            }
        }

        canvas {
            touch-action: none;
            cursor: default;
        }

        .bar-track {
            width: 100%;
            height: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }

        .popup-overlay {
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
        }

        #workspace:fullscreen {
            background-color: #f8fafc;
            padding: 1rem;
            overflow-y: auto;
        }

        @media (orientation: landscape) {
            #workspace:fullscreen {
                padding: 1rem;
                overflow-y: hidden;
            }
        }
    </style>

    <!-- 🚫 [수정 금지] Tailwind 컴포넌트 추출 -->
    <style type="text/tailwindcss">
        @layer components {
            .panel-block      { @apply flex flex-col gap-2 p-3 border border-slate-200 rounded-lg bg-white; }
            .modal-container  { @apply bg-white border border-slate-300 rounded-2xl w-full flex flex-col relative shadow-2xl max-h-[70dvh]; }
            .modal-header     { @apply h-14 lg:h-16 px-6 border-b border-slate-100 flex items-center justify-between flex-none; }
            .modal-body       { @apply flex-1 overflow-y-auto p-4 lg:p-6 flex flex-col gap-4; }
            .guide-block      { @apply p-4 bg-slate-50 border border-slate-200 rounded-xl; }
            .zoom-btn         { @apply w-8 h-8 flex items-center justify-center bg-white border border-slate-300 rounded-full shadow-sm text-slate-600 font-bold desktop-only:hover:bg-slate-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed desktop-only:disabled:hover:bg-slate-50; }
            .nav-btn          { @apply w-12 h-12 flex items-center justify-center bg-white border border-slate-300 text-slate-600 rounded-full desktop-only:hover:bg-slate-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed desktop-only:disabled:hover:bg-slate-50; }
            .radio-label      { @apply flex items-start gap-2 p-2 border border-slate-200 rounded bg-white cursor-pointer transition-colors has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 has-[:disabled]:opacity-50 has-[:disabled]:cursor-not-allowed; }
            .input-text       { @apply w-full p-2 border border-slate-200 rounded text-center focus:outline-none focus:border-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-slate-50; }
        }
    </style>
</head>

<!-- ════════════════════════════════════════════════════════════════════
     🚫 [수정 금지] BODY — 레이아웃 클래스 수정 금지
     ════════════════════════════════════════════════════════════════════ -->

<body
    class="bg-slate-100 text-slate-800 font-sans w-full m-0 p-0 box-border select-none overflow-x-hidden md:overflow-hidden landscape:overflow-hidden flex flex-col justify-center md:h-[100dvh] landscape:h-[100dvh]">

    <div
        class="flex flex-col w-full max-w-[1680px] mx-auto p-2 gap-2 box-border md:h-[100dvh] md:overflow-hidden landscape:h-[100dvh] landscape:overflow-hidden relative">

        <!-- ═══════════════════════════════════════════════════════════════
         🚫 [수정 금지] 헤더 — 제목은 JS CONTENT_CONFIG.title로 자동 주입
         ═══════════════════════════════════════════════════════════════ -->
        <header class="ui-box flex-none px-4 py-2 flex items-center justify-between z-10 bg-white relative">
            <div class="flex items-center gap-4">
                <a href="https://www.tsherpa.co.kr" target="_blank"
                    class="flex items-center flex-none desktop-only:hover:opacity-80 transition-opacity">
                    <img src="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_black.png"
                        alt="T셀파"
                        class="h-7 md:h-8 object-contain draggable-false flex-none hidden [@media(min-width:768px)]:block">
                    <img src="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_short.png"
                        alt="T셀파"
                        class="h-7 md:h-8 object-contain draggable-false flex-none block [@media(min-width:768px)]:hidden">
                </a>
                <div class="border-l border-slate-300 pl-4">
                    <h1 class="sim-title" id="sim-title-el">로딩 중...</h1><!-- CONTENT_CONFIG.title 자동 주입 -->
                </div>
            </div>
            <div class="flex items-center relative">
                <button id="moreMenuBtn"
                    class="header-button flex landscape:hidden desktop-only:hidden transition-colors ml-2"
                    title="메뉴 더보기">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                    </svg>
                </button>
                <div class="hidden landscape:flex desktop-only:flex items-center">
                    <!-- 학습 가이드 -->
                    <button id="helpBtn" class="header-button desktop-only:md:hidden font-bold text-lg ml-2">

           ████                                                               ████
           ████   ✏️  ZONE F — SIMULATION LOGIC (시뮬레이션 핵심 로직)         ████
           ████   draw()와 updatePhysics()에 시뮬레이션 코드를 작성하세요.       ████

           ███████████████████████████████████████████████████████████████████████ */

        /* ── 공통 상수 ─────────────────────────────────────────────── */
        const FONT = '"Noto Sans KR", sans-serif';
        const COLORS = {
            water: 'rgba(56, 189, 248, 0.45)', waterLine: '#0284c7',
            oil: 'rgba(250, 204, 21, 0.75)', oilLine: '#a16207',
            mix: 'rgba(125, 211, 252, 0.50)', mixLine: '#0369a1',
            glass: '#94a3b8', text: '#334155', sub: '#64748b', light: '#94a3b8',
            primary: '#4f46e5', bg: '#ffffff'
        };
        const LIQ = {
            water: { fill: 'rgba(56, 189, 248, 0.26)', line: '#0284c7' },
            glycerol: { fill: 'rgba(167, 139, 250, 0.26)', line: '#6d28d9' },
            salt: { fill: 'rgba(45, 212, 191, 0.26)', line: '#0f766e' }
        };
        const BANNER_STYLE = {
            info: { bg: 'rgba(255, 255, 255, 0.94)', border: '#cbd5e1', text: '#334155' },
            success: { bg: 'rgba(236, 253, 245, 0.96)', border: '#10b981', text: '#047857' },
            warn: { bg: 'rgba(255, 247, 237, 0.96)', border: '#fb923c', text: '#c2410c' }
        };

        /* 밀도 비교 (내부 판정용, 화면에는 수치를 내지 않고 '크다/작다'만 쓴다).
           01_spec.json formula_or_source: 물 1.0, 글리세롤 1.26, PET 1.35, LDPE 0.91, PS 1.06, 식용유 0.93 g/mL.
           소금물·볍씨는 수치 없이 정성 판정: 소금물 > 물, 쭉정이 < 소금물 < 알찬 볍씨. */
        const DENSITY = { water: 1.0, glycerol: 1.26, PET: 1.35, LDPE: 0.91, PS: 1.06, oil: 0.93 };
        const QUAL = { 'salt|water': 1, 'chaff|salt': -1, 'good|salt': 1 };
        function denser(a, b) {
            if (a in DENSITY && b in DENSITY) return DENSITY[a] > DENSITY[b];
            if (QUAL[a + '|' + b] !== undefined) return QUAL[a + '|' + b] > 0;
            if (QUAL[b + '|' + a] !== undefined) return QUAL[b + '|' + a] < 0;
            return false;
        }
        const NAME = { PET: 'PET', LDPE: 'LDPE', PS: 'PS', chaff: '쭉정이', good: '알찬 볍씨', water: '물', glycerol: '글리세롤', salt: '소금물', oil: '식용유' };
        const TOPIC = { PET: 'PET는', LDPE: 'LDPE는', PS: 'PS는', chaff: '쭉정이는', good: '알찬 볍씨는', water: '물은', glycerol: '글리세롤은', salt: '소금물은', oil: '식용유는' };
        const SOLID_SETS = { plastic: ['PET', 'LDPE', 'PS'], rice: ['chaff', 'good'] };
        /* 교과서 근거가 있는 조합만 고를 수 있다 (플라스틱: 물·글리세롤, 볍씨: 소금물) */
        const ALLOWED_LIQUIDS = { plastic: ['water', 'glycerol'], rice: ['salt'] };

        /* 고체 조각 모양·개수·움직임 (비커 그림 픽셀 단위) */
        const PARTICLE_SPEC = {
            PET: { count: 7, r: 5.6, ry: 4, speed: 1.0, sx: 14, sy: 8, floatK: 0 },
            LDPE: { count: 7, r: 5.6, ry: 3.6, speed: 0.9, sx: 14, sy: 7, floatK: 1 },
            PS: { count: 7, r: 4.8, ry: 4.8, speed: 0.8, sx: 13, sy: 9, floatK: 1 },
            chaff: { count: 9, r: 7.2, ry: 2.6, speed: 0.9, sx: 16, sy: 6, floatK: 0 },
            good: { count: 12, r: 7.6, ry: 4, speed: 0.9, sx: 16, sy: 7, floatK: 0 }
        };
        const PARTICLE_DRAW = 0.8;   /* 조각 그림 크기 (비커 배율에 곱함) */

        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

        /* ── 캔버스 크기 비례 (design.md 4장): 배율 하나(UI)로 글자·상자·라벨·선 굵기·간격을 함께 키운다 ── */
        let UI = 1;
        function updateUI(w, h) { UI = clamp(Math.min(w / 1080, h / 700), 0.75, 1.5); }
        const U = v => v * UI;                                            /* 길이·선 굵기·여백 */
        const F = (base, min) => Math.round(Math.max(base * UI, min));    /* 글자 크기 (좁은 화면 최소값) */

        /* ── 기구는 모두 코드로 그린다 (연한 회색 가는 선, 거의 투명한 유리 + 옅은 하이라이트) ── */
        const GLASS = {
            line: '#94a3b8', fill: 'rgba(241, 245, 249, 0.55)', hi: 'rgba(255, 255, 255, 0.85)',
            metal: '#e2e8f0', metalDark: '#cbd5e1', metalLine: '#64748b', base: '#f8fafc'
        };

        /* ── 분별 깔때기 (설계 단위 94 × 296): 서양배 몸통, 좁은 목, 가는 관 ── */
        const FN = { w: 94, h: 296, cx: 46.5, top: 56, bot: 206, stemX: 46.5, valveY: 214, stemBot: 288, neckY: 36, neckHW: 7, stemHW: 2.5 };
        function funnelHW(y) {
            if (y <= 122) {
                const t = (122 - y) / 68;
                return Math.max(6, 28 * Math.sqrt(Math.max(0, 1 - t * t)));
            }
            const s = Math.min(1, (y - 122) / 84);
            return 2.5 + 25.5 * (1 - s) * (1 + 0.3 * s);
        }
        /* 아래(꼭지)부터 쌓인 부피 표 — 단면적 ∝ 반폭² */
        const FUNNEL_SPAN = FN.bot - FN.top;
        const FUNNEL_VOL = (() => {
            const cum = [0];
            for (let i = 1; i <= FUNNEL_SPAN; i++) {
                const hw = funnelHW(FN.bot - i + 0.5);
                cum.push(cum[i - 1] + hw * hw);
            }
            return cum;
        })();
        const FUNNEL_TOTAL = FUNNEL_VOL[FUNNEL_SPAN];
        function levelForVolume(v) {
            if (v <= 0) return FN.bot;
            if (v >= FUNNEL_TOTAL) return FN.top;
            let lo = 0, hi = FUNNEL_SPAN;
            while (hi - lo > 1) {
                const m = (lo + hi) >> 1;
                if (FUNNEL_VOL[m] < v) lo = m; else hi = m;
            }
            const f = (v - FUNNEL_VOL[lo]) / (FUNNEL_VOL[hi] - FUNNEL_VOL[lo]);
            return FN.bot - (lo + f);
        }

        /* ── 비커 (설계 단위 201 × 248): 위가 살짝 벌어진 원통, 납작한 타원 바닥 ──
           외곽선과 액체가 같은 함수(bkWall)에서 나오고, 액체는 안쪽으로 INSET만큼 들어가 선 밖으로 나가지 않는다 */
        const BK = { w: 201, h: 248, cx: 103, rimY: 20, rimRy: 10, bot: 228, ry: 10, base: 240, inset: 1.8 };
        const BK_FLOOR = BK.bot + BK.ry - BK.inset - 1;   /* 안쪽 바닥의 가장 낮은 곳 */
        function bkWall(v, inset) {
            const t = (v - BK.rimY) / (BK.bot - BK.rimY);
            return { l: 17 + t * 6 + inset, r: 189 - t * 6 - inset };
        }
        function mkBox(x0, y0, k) { return { k, x0, y0, x: u => x0 + u * k, y: v => y0 + v * k }; }

        /* ── 스탠드 (설계 단위 600 × 600) 기준 배치 ───────────────── */
        const STAND = {
            clampX: 378, clampY: 175,          /* 클램프 링 가운데 = 깔때기 몸통 윗부분 */
            funnelScale: 1.25, funnelGripY: 80,
            mainBeaker: { cx: 378, bottom: 545, scale: 0.62 },
            sideBeaker: { cx: 507, bottom: 545, scale: 0.45 },
            stopperRest: { x: 200, y: 533 }
        };
        STAND.ringR = funnelHW(STAND.funnelGripY) * STAND.funnelScale + 2.5;   /* 링이 몸통에 딱 맞게 */

        /* ── 배치 ───────────────────────────────────────────────────
           밀도 비교 상자·범례·메시지 바 자리를 먼저 비워 두고, 남은 영역 가운데에 기구를 놓는다.
           A: 밀도 비교 상자는 왼쪽, 범례는 오른쪽 세로 띠 / B: 둘 다 위쪽 여백 (좁은 화면)
           두 배치 중 기구가 더 크게 들어가는 쪽을 고른다. */
        function planLayout(w, h, sceneW, sceneH, padTop, padBot, hasLegend, maxS) {
            updateUI(w, h);
            const fsD = F(13, 11);
            const legend = hasLegend ? legendSize(w) : null;
            const banner = bannerSize(currentMessage(), w);
            const bottom = h - Math.max(70, U(16) + banner.bh + U(10));
            const fit = (left, top, regW) => {
                const regH = bottom - top;
                const S = Math.max(0.15, Math.min(regW / sceneW, (regH - padTop - padBot) / sceneH, maxS));
                return {
                    S, x0: left + (regW - sceneW * S) / 2,
                    y0: top + padTop + Math.max(0, (regH - padTop - padBot - sceneH * S) / 2)
                };
            };
            /* A: 옆 띠 */
            const dA = simData.showDensity ? densitySize(Math.min(U(300), Math.max(U(150), w * 0.3)), fsD) : null;
            const leftA = dA ? U(16) + dA.w + U(12) : U(16);
            const rightA = legend ? U(16) + legend.w + U(12) : U(16);
            const A = fit(leftA, 72, w - leftA - rightA);
            A.d = dA;
            /* B: 위쪽 여백 */
            const maxDW = w - U(32) - (legend ? legend.w + U(12) : 0);
            const dB = simData.showDensity ? densitySize(Math.max(U(120), Math.min(maxDW, U(460))), fsD) : null;
            const topB = Math.max(72, 60 + Math.max(dB ? dB.h : 0, legend ? legend.h : 0) + U(12));
            const B = fit(U(16), topB, w - U(32));
            B.d = dB;
            const P = (A.S >= B.S * 0.97) ? A : B;
            P.dpos = { x: U(16), y: 60 };
            P.legend = legend;
            P.legendPos = legend ? { x: w - U(16) - legend.w, y: 60 } : null;
            return P;
        }

        function liquidLayout(w, h) {
            updateUI(w, h);
            /* 기구 배율도 UI와 같은 수준으로만 커진다 (기준 화면 약 0.8) */
            const plan = planLayout(w, h, 600, 600, 0, 0, false, 0.8 * UI);
            const S = plan.S, X0 = plan.x0, Y0 = plan.y0;
            const L = { S, X0, Y0, plan, X: u => X0 + u * S, Y: v => Y0 + v * S };
            const fs = STAND.funnelScale;
            L.fS = fs * S;
            L.fx0 = L.X(STAND.clampX - FN.cx * fs);
            L.fy0 = L.Y(STAND.clampY - STAND.funnelGripY * fs);
            L.FX = u => L.fx0 + u * L.fS;
            L.FY = v => L.fy0 + v * L.fS;
            const bb = b => mkBox(L.X(b.cx - BK.cx * b.scale), L.Y(b.bottom - BK.base * b.scale), b.scale * S);
            L.main = bb(STAND.mainBeaker);
            L.side = bb(STAND.sideBeaker);
            return L;
        }
        function solidLayout(w, h) {
            const n = simData.stage === 2 ? 2 : 1;
            updateUI(w, h);
            const fs = F(13, 12);
            const gapU = 60;                                   /* 비커 사이 (그림 픽셀) */
            const padTop = fs + U(16);                         /* '분리용 액체' 이름 */
            const padBot = simData.showLabels ? 2 * (fs + U(6)) + U(8) : U(6);   /* 뜬 것 / 가라앉은 것 */
            const plan = planLayout(w, h, n * BK.w + (n - 1) * gapU, BK.h, padTop, padBot, true, Math.min(SIM_CONFIG.solid.maxScale, 1.5 * UI));
            const k = plan.S;
            const boxes = [];
            for (let i = 0; i < n; i++) boxes.push(mkBox(plan.x0 + i * (BK.w + gapU) * k, plan.y0, k));
            return { k, boxes, plan };
        }

        /* ── 그리기 도우미 ─────────────────────────────────────────── */
        function rrect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }
        function wrapLines(text, maxW) {
            const words = text.split(' ');
            const lines = [];
            let cur = '';
            words.forEach(wd => {
                const t = cur ? cur + ' ' + wd : wd;
                if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = wd; }
                else cur = t;
            });
            if (cur) lines.push(cur);
            return lines;
        }
        function haloText(text, x, y) {
            ctx.save();
            ctx.lineJoin = 'round';
            ctx.lineWidth = U(3);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.strokeText(text, x, y);
            ctx.restore();
            ctx.fillText(text, x, y);
        }

        /* 비커 경로 (vTop부터 바닥까지). inset > 0이면 안쪽(액체용), 0이면 외곽선 */
        function beakerPath(B, vTop, inset) {
            const a = bkWall(vTop, inset), b = bkWall(BK.bot, inset);
            ctx.beginPath();
            ctx.moveTo(B.x(a.l), B.y(vTop));
            ctx.lineTo(B.x(b.l), B.y(BK.bot));
            ctx.ellipse(B.x((b.l + b.r) / 2), B.y(BK.bot), (b.r - b.l) / 2 * B.k, Math.max(1, BK.ry - inset * 0.5) * B.k, 0, Math.PI, 0, true);
            ctx.lineTo(B.x(a.r), B.y(vTop));
            ctx.closePath();
        }
        function surfaceEllipse(B, v, color) {
            if (v > BK.bot - 3) return;
            const s = bkWall(v, BK.inset);
            ctx.strokeStyle = color; ctx.lineWidth = U(1.2);
            ctx.beginPath();
            ctx.ellipse(B.x((s.l + s.r) / 2), B.y(v), (s.r - s.l) / 2 * B.k, 4 * B.k, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        /* 비커 유리 뒤쪽 (액체보다 먼저) */
        function drawBeakerBack(B) {
            ctx.save();
            beakerPath(B, BK.rimY, 0);
            ctx.fillStyle = GLASS.fill; ctx.fill();
            /* 바닥 타원 뒤쪽 반 */
            const b = bkWall(BK.bot, 0);
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)'; ctx.lineWidth = U(1);
            ctx.beginPath();
            ctx.ellipse(B.x((b.l + b.r) / 2), B.y(BK.bot), (b.r - b.l) / 2 * B.k, BK.ry * B.k, 0, Math.PI, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        /* 비커 유리 앞쪽 선 (액체 다음): 옆벽, 테두리 타원, 왼쪽 위 부리, 눈금, 하이라이트 */
        function drawBeakerFront(B) {
            const a = bkWall(BK.rimY, 0), b = bkWall(BK.bot, 0);
            const lw = U(1.6);
            ctx.save();
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            /* 하이라이트 */
            ctx.strokeStyle = GLASS.hi; ctx.lineWidth = Math.max(1.5, 4 * B.k);
            ctx.beginPath(); ctx.moveTo(B.x(bkWall(50, 0).l + 12), B.y(50)); ctx.lineTo(B.x(bkWall(200, 0).l + 12), B.y(200)); ctx.stroke();
            ctx.lineWidth = Math.max(1, 2 * B.k);
            ctx.beginPath(); ctx.moveTo(B.x(bkWall(60, 0).l + 22), B.y(60)); ctx.lineTo(B.x(bkWall(140, 0).l + 22), B.y(140)); ctx.stroke();
            /* 옆벽 */
            ctx.strokeStyle = GLASS.line; ctx.lineWidth = lw;
            ctx.beginPath();
            ctx.moveTo(B.x(a.l), B.y(BK.rimY)); ctx.lineTo(B.x(b.l), B.y(BK.bot));
            ctx.moveTo(B.x(a.r), B.y(BK.rimY)); ctx.lineTo(B.x(b.r), B.y(BK.bot));
            ctx.stroke();
            /* 바닥 타원 앞쪽 반 */
            ctx.beginPath();
            ctx.ellipse(B.x((b.l + b.r) / 2), B.y(BK.bot), (b.r - b.l) / 2 * B.k, BK.ry * B.k, 0, 0, Math.PI);
            ctx.stroke();
            /* 테두리 */
            ctx.beginPath();
            ctx.ellipse(B.x((a.l + a.r) / 2), B.y(BK.rimY), (a.r - a.l) / 2 * B.k, BK.rimRy * B.k, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.lineWidth = Math.max(1, lw * 0.6);
            ctx.beginPath();
            ctx.ellipse(B.x((a.l + a.r) / 2), B.y(BK.rimY + 2), (a.r - a.l) / 2 * B.k - 3 * B.k, (BK.rimRy - 1.5) * B.k, 0, 0, Math.PI);
            ctx.stroke();
            /* 부리 (왼쪽 위) */
            ctx.lineWidth = lw;
            ctx.beginPath();
            ctx.moveTo(B.x(a.l + 14), B.y(BK.rimY - 8));
            ctx.quadraticCurveTo(B.x(a.l - 4), B.y(BK.rimY - 9), B.x(a.l - 9), B.y(BK.rimY - 3));
            ctx.quadraticCurveTo(B.x(a.l - 4), B.y(BK.rimY + 3), B.x(a.l + 2), B.y(BK.rimY + 6));
            ctx.stroke();
            /* 눈금 */
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.8)'; ctx.lineWidth = U(1);
            for (let v = 90; v <= 210; v += 30) {
                const r = bkWall(v, 0).r;
                ctx.beginPath(); ctx.moveTo(B.x(r - 30), B.y(v)); ctx.lineTo(B.x(r - 12), B.y(v)); ctx.stroke();
            }
            ctx.restore();
        }
        /* 받는 비커 속 액체 층 (아래부터). 맨 위 표면 높이(그림 픽셀)를 돌려준다 */
        function drawBeakerContents(B, layers) {
            const kv = SIM_CONFIG.liquid.beakerFill / FUNNEL_TOTAL;
            let v = BK_FLOOR;
            const surfaces = [];
            ctx.save();
            beakerPath(B, BK.rimY + 6, BK.inset);
            ctx.clip();
            layers.forEach(l => {
                if (l.vol <= 0) return;
                const top = v - l.vol * kv;
                ctx.fillStyle = l.color;
                ctx.fillRect(B.x(0), B.y(top), BK.w * B.k, (v - top) * B.k);
                surfaces.push({ v: top, line: l.line });
                v = top;
            });
            ctx.restore();
            surfaces.forEach(s => surfaceEllipse(B, s.v, s.line));
            return v;
        }
        /* 분별 깔때기 몸통 경로. inset > 0이면 안쪽(액체용) */
        function funnelBodyPath(L, inset) {
            ctx.beginPath();
            for (let y = FN.top; y <= FN.bot; y += 2) ctx.lineTo(L.FX(FN.cx - Math.max(0.6, funnelHW(y) - inset)), L.FY(y));
            for (let y = FN.bot; y >= FN.top; y -= 2) ctx.lineTo(L.FX(FN.cx + Math.max(0.6, funnelHW(y) - inset)), L.FY(y));
            ctx.closePath();
        }
        /* 분별 깔때기 외곽선 (목 → 몸통 → 가는 관 → 비스듬한 끝) */
        function funnelOutlinePath(L) {
            const c = FN.cx;
            ctx.beginPath();
            ctx.moveTo(L.FX(c - FN.neckHW), L.FY(FN.neckY));
            ctx.lineTo(L.FX(c - FN.neckHW), L.FY(FN.top));
            for (let y = FN.top; y <= FN.bot; y += 2) ctx.lineTo(L.FX(c - Math.max(FN.stemHW, funnelHW(y))), L.FY(y));
            ctx.lineTo(L.FX(c - FN.stemHW), L.FY(FN.stemBot));
            ctx.lineTo(L.FX(c + FN.stemHW), L.FY(FN.stemBot + 4));
            ctx.lineTo(L.FX(c + FN.stemHW), L.FY(FN.bot));
            for (let y = FN.bot; y >= FN.top; y -= 2) ctx.lineTo(L.FX(c + Math.max(FN.stemHW, funnelHW(y))), L.FY(y));
            ctx.lineTo(L.FX(c + FN.neckHW), L.FY(FN.neckY));
        }

        /* 마개 (코드로 그림): 공 모양 손잡이 + 깔때기에 꽂히는 부분 */
        function drawStopperShape(x, y, s, rot) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.fillStyle = '#f8fafc'; ctx.strokeStyle = GLASS.line; ctx.lineWidth = U(1.5);
            ctx.beginPath(); ctx.arc(0, 0, 8.5 * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.rect(-2.5 * s, 8 * s, 5 * s, 5 * s); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.rect(-10 * s, 13 * s, 20 * s, 5 * s); ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-7 * s, 18 * s); ctx.lineTo(7 * s, 18 * s); ctx.lineTo(5 * s, 32 * s); ctx.lineTo(-5 * s, 32 * s);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.restore();
        }

        /* 꼭지 손잡이 (코드로 그림): 닫힘은 관과 수직, 열림은 관과 나란하게 */
        /* 꼭지: 관을 감싸는 몸체 + 오른쪽 둥근 끝 + T자 손잡이 (닫힘 가로 / 열림 세로) */
        function drawValve(L) {
            const s = L.fS, open = simData.valveOpen, c = FN.cx, vy = FN.valveY;
            ctx.save();
            ctx.lineWidth = U(1.5); ctx.lineJoin = 'round';
            /* 몸체 */
            ctx.fillStyle = 'rgba(248, 250, 252, 0.9)'; ctx.strokeStyle = GLASS.line;
            rrect(L.FX(c - 9), L.FY(vy - 4.5), 18 * s, 9 * s, 2.5 * s); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(L.FX(c + 12.5), L.FY(vy), 3.8 * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            /* 관 속 액체가 몸체를 지나 보이게 */
            if (simData.flowing && !simData.dripping) {
                ctx.fillStyle = COLORS[simData.flowing];
                ctx.fillRect(L.FX(c - 1.3), L.FY(vy - 4.5), 2.6 * s, 9 * s);
            }
            /* 손잡이 */
            ctx.strokeStyle = open ? '#059669' : '#e11d48';
            ctx.fillStyle = open ? '#d1fae5' : '#ffe4e6';
            rrect(L.FX(c - 16), L.FY(vy - 2), 7 * s, 4 * s, 1.2 * s); ctx.fill(); ctx.stroke();
            if (open) {
                rrect(L.FX(c - 22), L.FY(vy - 15), 6 * s, 30 * s, 2.5 * s); ctx.fill(); ctx.stroke();
            } else {
                rrect(L.FX(c - 32), L.FY(vy - 3), 17 * s, 6 * s, 2.5 * s); ctx.fill(); ctx.stroke();
                rrect(L.FX(c - 35), L.FY(vy - 10), 5 * s, 20 * s, 2 * s); ctx.fill(); ctx.stroke();
            }
            ctx.restore();
        }

        /* 스탠드: 원근감 있는 받침, 세로 막대, 십자 고정 나사, 가로 막대, 클램프 */
        function drawStand(L) {
            const X = L.X, Y = L.Y, S = L.S;
            ctx.save();
            ctx.lineWidth = U(1.5); ctx.lineJoin = 'round';
            /* 받침 윗면 + 앞면 */
            ctx.fillStyle = GLASS.base; ctx.strokeStyle = GLASS.line;
            ctx.beginPath();
            ctx.moveTo(X(125), Y(452)); ctx.lineTo(X(490), Y(452)); ctx.lineTo(X(560), Y(558)); ctx.lineTo(X(40), Y(558));
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = GLASS.metal;
            ctx.beginPath();
            ctx.moveTo(X(40), Y(558)); ctx.lineTo(X(560), Y(558)); ctx.lineTo(X(560), Y(580));
            ctx.lineTo(X(530), Y(580)); ctx.lineTo(X(522), Y(588)); ctx.lineTo(X(78), Y(588)); ctx.lineTo(X(70), Y(580));
            ctx.lineTo(X(40), Y(580)); ctx.closePath(); ctx.fill(); ctx.stroke();
            /* 세로 막대 */
            ctx.fillStyle = GLASS.metal; ctx.strokeStyle = GLASS.line;
            rrect(X(148), Y(8), 14 * S, 495 * S, 3 * S); ctx.fill(); ctx.stroke();
            ctx.fillStyle = GLASS.metalDark; ctx.strokeStyle = GLASS.metalLine;
            rrect(X(141), Y(482), 28 * S, 32 * S, 4 * S); ctx.fill(); ctx.stroke();
            /* 가로 막대 (클램프 쪽) */
            const ringL = STAND.clampX - STAND.ringR;
            ctx.fillStyle = GLASS.metal; ctx.strokeStyle = GLASS.line;
            rrect(X(70), Y(STAND.clampY - 6), (ringL - 50 - 70) * S, 12 * S, 3 * S); ctx.fill(); ctx.stroke();
            /* 클램프 몸체 (링으로 이어짐) */
            ctx.fillStyle = GLASS.metalDark; ctx.strokeStyle = GLASS.metalLine;
            rrect(X(ringL - 56), Y(STAND.clampY - 10), 58 * S, 20 * S, 4 * S); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(X(ringL - 28), Y(STAND.clampY), 4.5 * S, 0, Math.PI * 2); ctx.stroke();
            /* 십자 고정 나사 */
            ctx.fillStyle = GLASS.metal; ctx.strokeStyle = GLASS.metalLine;
            rrect(X(136), Y(STAND.clampY - 24), 38 * S, 48 * S, 4 * S); ctx.fill(); ctx.stroke();
            ctx.fillStyle = GLASS.metalDark;
            ctx.beginPath(); ctx.arc(X(155), Y(STAND.clampY), 9 * S, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(X(149), Y(STAND.clampY - 6)); ctx.lineTo(X(161), Y(STAND.clampY + 6)); ctx.stroke();
            rrect(X(164), Y(STAND.clampY - 4), 22 * S, 8 * S, 3 * S); ctx.fill(); ctx.stroke();
            ctx.restore();
        }
        /* 클램프 링 (뒤쪽 반 / 앞쪽 반): 깔때기 몸통 윗부분을 감싼다 */
        function drawClampRing(L, front) {
            const X = L.X, Y = L.Y, S = L.S, R = STAND.ringR;
            ctx.save();
            ctx.lineCap = 'round';
            const arc = (color, width) => {
                ctx.strokeStyle = color; ctx.lineWidth = width;
                ctx.beginPath();
                ctx.ellipse(X(STAND.clampX), Y(STAND.clampY), R * S, R * 0.3 * S, 0, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2);
                ctx.stroke();
            };
            arc(GLASS.metalLine, Math.max(3, 7 * S));
            arc(GLASS.metal, Math.max(1.5, 4 * S));
            ctx.restore();
        }

        /* 분별 깔때기: 유리 면 → 액체(몸통 안쪽으로 클리핑) → 외곽선·하이라이트 → 꼭지·마개 */
        function drawFunnel(L) {
            const isOil = simData.liquidMix === 'oil';
            ctx.save();
            funnelOutlinePath(L); ctx.closePath();
            ctx.fillStyle = GLASS.fill; ctx.fill();
            ctx.restore();
            const yL = levelForVolume(simData.lower);
            const yU = levelForVolume(simData.lower + simData.upper);
            const yM = levelForVolume(simData.mix);
            const fill = (top, bottom, color) => {
                ctx.fillStyle = color;
                ctx.fillRect(L.FX(0), L.FY(top), FN.w * L.fS, (bottom - top) * L.fS);
            };
            ctx.save();
            funnelBodyPath(L, 1.4);
            ctx.clip();
            if (isOil) {
                if (simData.lower > 0) fill(yL, FN.bot + 1, COLORS.water);
                if (simData.upper > 0) fill(yU, yL, COLORS.oil);
            } else if (simData.mix > 0) {
                fill(yM, FN.bot + 1, COLORS.mix);
            }
            ctx.restore();

            const hLine = (yy, color, width) => {
                const hw = Math.max(0.6, funnelHW(yy) - 1.4);
                ctx.strokeStyle = color; ctx.lineWidth = U(width);
                ctx.beginPath(); ctx.moveTo(L.FX(FN.cx - hw), L.FY(yy)); ctx.lineTo(L.FX(FN.cx + hw), L.FY(yy)); ctx.stroke();
            };
            if (isOil) {
                if (simData.lower > 0 && simData.upper > 0) hLine(yL, COLORS.waterLine, 2);
                if (simData.lower + simData.upper > 0) hLine(yU, simData.upper > 0 ? COLORS.oilLine : COLORS.waterLine, 1.3);
            } else if (simData.mix > 0) {
                hLine(yM, COLORS.mixLine, 1.3);
            }

            /* 꼭지 아래 관을 지나는 액체 */
            if (simData.flowing && !simData.dripping) {
                ctx.fillStyle = COLORS[simData.flowing];
                ctx.fillRect(L.FX(FN.stemX - 1.3), L.FY(FN.bot - 2), 2.6 * L.fS, (FN.stemBot - FN.bot + 2) * L.fS);
            }

            /* 하이라이트 (몸통 왼쪽 안) */
            ctx.save();
            ctx.lineCap = 'round';
            ctx.strokeStyle = GLASS.hi; ctx.lineWidth = Math.max(1.5, 3.5 * L.fS);
            ctx.beginPath();
            for (let y = 78; y <= 150; y += 3) ctx.lineTo(L.FX(FN.cx - funnelHW(y) * 0.62), L.FY(y));
            ctx.stroke();
            ctx.restore();

            /* 외곽선 */
            ctx.save();
            ctx.lineJoin = 'round';
            ctx.strokeStyle = GLASS.line; ctx.lineWidth = U(1.6);
            funnelOutlinePath(L); ctx.stroke();
            /* 입구 테두리 */
            ctx.fillStyle = 'rgba(248, 250, 252, 0.9)';
            rrect(L.FX(FN.cx - 9.5), L.FY(FN.neckY - 3.5), 19 * L.fS, 4 * L.fS, 1.5 * L.fS); ctx.fill(); ctx.stroke();
            ctx.restore();

            drawValve(L);
            /* 마개를 닫았으면 입구에 꽂혀 있다 (열면 받침 위에 놓인다) */
            if (!simData.stopperOpen) drawStopperShape(L.FX(FN.cx), L.FY(FN.neckY - 21.5), L.fS, 0);
        }

        /* 위층을 입구로 따라 내는 줄기 */
        function drawPourStream(L) {
            const sx = L.FX(FN.cx + FN.neckHW), sy = L.FY(FN.neckY - 3);
            const ex = L.side.x(BK.cx), ey = L.side.y(70);
            ctx.save();
            ctx.strokeStyle = COLORS.oil; ctx.lineWidth = Math.max(2, 4 * L.S);
            ctx.setLineDash([U(8), U(6)]);
            ctx.lineDashOffset = -simData.frame * 1.5;
            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(L.X(500), L.Y(20), ex, ey); ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }

        /* 이름표 여러 개를 겹치지 않게 오른쪽에 세운다 */
        function drawTags(tags, xText, fs) {
            if (!tags.length) return;
            tags.sort((a, b) => a.y - b.y);
            const gap = fs + U(6);
            tags.forEach((t, i) => { t.ty = i ? Math.max(t.y, tags[i - 1].ty + gap) : t.y; });
            ctx.save();
            ctx.font = `600 ${fs}px ${FONT}`;
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            tags.forEach(t => {
                ctx.strokeStyle = t.color; ctx.lineWidth = U(1.2);
                ctx.beginPath(); ctx.moveTo(t.ax, t.y); ctx.lineTo(xText - U(10), t.ty); ctx.lineTo(xText - U(4), t.ty); ctx.stroke();
                ctx.fillStyle = t.color;
                ctx.beginPath(); ctx.arc(t.ax, t.y, U(2.5), 0, Math.PI * 2); ctx.fill();
                haloText(t.text, xText, t.ty);
            });
            ctx.restore();
        }

        /* 고체 조각 (코드로 그림) — PET: 파란 조각, LDPE: 초록 원판, PS: 주황 네모, 볍씨 */
        function drawParticleAt(type, x, y, s, rot) {
            const sp = PARTICLE_SPEC[type];
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.lineWidth = U(1.1);
            const q = s * PARTICLE_DRAW;
            if (type === 'PET') {
                ctx.beginPath();
                ctx.moveTo(-7 * q, -4.5 * q); ctx.lineTo(6 * q, -5.5 * q); ctx.lineTo(7.5 * q, 4 * q); ctx.lineTo(-5 * q, 5.5 * q);
                ctx.closePath();
                ctx.fillStyle = 'rgba(59, 130, 246, 0.6)'; ctx.fill();
                ctx.strokeStyle = '#1d4ed8'; ctx.stroke();
            } else if (type === 'LDPE') {
                ctx.beginPath(); ctx.ellipse(0, 0, sp.r * s, sp.ry * s, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#86efac'; ctx.fill();
                ctx.strokeStyle = '#15803d'; ctx.stroke();
            } else if (type === 'PS') {
                ctx.beginPath(); ctx.rect(-5.5 * q, -5.5 * q, 11 * q, 11 * q);
                ctx.fillStyle = '#fdba74'; ctx.fill();
                ctx.strokeStyle = '#c2410c'; ctx.stroke();
            } else {
                const fillC = { chaff: '#f1e6c2', good: '#d4952f' }[type];
                const strokeC = { chaff: '#b9a26b', good: '#8a5a12' }[type];
                ctx.beginPath(); ctx.ellipse(0, 0, sp.r * s, sp.ry * s, 0, 0, Math.PI * 2);
                ctx.fillStyle = fillC; ctx.fill();
                ctx.strokeStyle = strokeC; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-sp.r * 0.65 * s, 0); ctx.lineTo(sp.r * 0.65 * s, 0);
                ctx.globalAlpha = 0.45; ctx.lineWidth = U(0.9); ctx.stroke();
            }
            ctx.restore();
        }

        /* ── 고체 조각 만들기·자리 정하기 ──────────────────────────── */
        function makeParticles() {
            const list = [];
            SOLID_SETS[simData.solidMix].forEach(type => {
                const sp = PARTICLE_SPEC[type];
                for (let i = 0; i < sp.count; i++) {
                    list.push({
                        type, beaker: 0, x: 36 + Math.random() * 132, y: 100 + Math.random() * 112, tx: 0, ty: 0,
                        rot: (Math.random() - 0.5) * 1.2, phase: Math.random() * Math.PI * 2,
                        speed: sp.speed * (0.8 + Math.random() * 0.4), floats: false
                    });
                }
            });
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }
            assignTargets(list, simData.sepLiquid);
            return list;
        }
        function assignTargets(list, liquid) {
            const surf = SIM_CONFIG.solid.surface, bottom = SIM_CONFIG.solid.bottom;
            const groups = { float: [], sink: [] };
            list.forEach(p => {
                p.floats = !denser(p.type, liquid);   /* 액체보다 밀도가 작으면 뜬다 */
                groups[p.floats ? 'float' : 'sink'].push(p);
            });
            ['float', 'sink'].forEach(g => {
                const ps = groups[g].slice();
                if (!ps.length) return;
                const sx = Math.max(...ps.map(p => PARTICLE_SPEC[p.type].sx));
                const sy = Math.max(...ps.map(p => PARTICLE_SPEC[p.type].sy));
                const left = 32, inner = 142;
                const ncols = Math.max(1, Math.floor(inner / sx));
                const step = inner / ncols;
                const slots = ps.map((_, i) => {
                    const row = Math.floor(i / ncols), col = i % ncols;
                    const x = left + (col + 0.5 + (row % 2 ? 0.5 : 0)) * step;
                    return { x: Math.min(left + inner - 4, x) + (Math.random() - 0.5) * 2, row };
                });
                ps.sort((a, b) => a.x - b.x);
                slots.sort((a, b) => a.x - b.x);
                ps.forEach((p, i) => {
                    const sp = PARTICLE_SPEC[p.type];
                    const slot = slots[i];
                    p.tx = slot.x;
                    p.ty = g === 'float' ? surf + sp.floatK + slot.row * sy : bottom - sp.ry - slot.row * sy;
                });
            });
        }
        function beakerLiquid(i) {
            if (simData.stage === 2) return i === 0 ? 'water' : 'glycerol';
            return simData.sepLiquid;
        }

        /* ── 실험 상태 ─────────────────────────────────────────────── */
        function ensureAllowedLiquid() {
            const allowed = ALLOWED_LIQUIDS[simData.solidMix];
            if (!allowed.includes(simData.sepLiquid)) simData.sepLiquid = allowed[0];
        }
        function syncPanel() {
            const setRadio = (name, val) => {
                const r = document.querySelector(`input[name="${name}"][value="${val}"]`);
                if (r) r.checked = true;
            };
            setRadio('modeOpt', simData.mode);
            setRadio('stopperOpt', simData.stopperOpen ? 'open' : 'closed');
            setRadio('valveOpt', simData.valveOpen ? 'open' : 'closed');
            const allowed = ALLOWED_LIQUIDS[simData.solidMix];
            document.querySelectorAll('input[name="sepLiquidOpt"]').forEach(r => {
                r.disabled = !allowed.includes(r.value);
                r.checked = r.value === simData.sepLiquid;
            });
            const lm = document.getElementById('liquidMixSelect'); if (lm) lm.value = simData.liquidMix;
            const sm = document.getElementById('solidMixSelect'); if (sm) sm.value = simData.solidMix;
            const cd = document.getElementById('chkDensity'); if (cd) cd.checked = simData.showDensity;
            const cl = document.getElementById('chkLabels'); if (cl) cl.checked = simData.showLabels;
            document.querySelectorAll('[data-mode-block]').forEach(el => {
                el.classList.toggle('hidden', el.getAttribute('data-mode-block') !== simData.mode);
            });
            updateButtons();
        }
        function canPour() {
            return simData.mode === 'liquid' && simData.liquidMix === 'oil' && !simData.valveOpen && !simData.pouring &&
                simData.upper > 0 && simData.lower <= simData.initLower * SIM_CONFIG.liquid.waterTolerance;
        }
        function canTransfer() {
            return simData.mode === 'solid' && simData.solidMix === 'plastic' && simData.sepLiquid === 'water' &&
                simData.stage === 1 && sysState.isStarted && simData.settled;
        }
        function updateButtons() {
            const pour = document.getElementById('pourBtn');
            if (pour) pour.disabled = !canPour();
            const tr = document.getElementById('transferBtn');
            if (tr) tr.disabled = !canTransfer();
        }

        function resetExperiment() {
            const T = FUNNEL_TOTAL, C = SIM_CONFIG.liquid;
            simData.stopperOpen = false;
            simData.valveOpen = false;
            simData.flowing = null;
            simData.dripping = false;
            simData.pouring = false;
            simData.poured = false;
            simData.notice = null;
            simData.dripLeft = T * SIM_CONFIG.flow.dripLimit;
            if (simData.liquidMix === 'oil') {
                simData.lower = T * C.initLowerRatio; simData.upper = T * C.initUpperRatio; simData.mix = 0;
            } else {
                simData.lower = 0; simData.upper = 0; simData.mix = T * (C.initLowerRatio + C.initUpperRatio);
            }
            simData.initLower = simData.lower; simData.initUpper = simData.upper; simData.initMix = simData.mix;
            simData.beakerLower = 0; simData.beakerUpper = 0; simData.beakerMix = 0; simData.sideOil = 0;
            ensureAllowedLiquid();
            simData.stage = 1;
            simData.particles = makeParticles();
            simData.settled = false;
            simData.frame = 0;
            syncPanel();
        }

        function stopRun() {
            sysState.isStarted = false;
            sysState.isPaused = false;
            stopLoop();
            updateUIState();
        }
        function ensureRunning() {
            if (!sysState.isStarted || sysState.isPaused) {
                sysState.isStarted = true;
                sysState.isPaused = false;
                startLoop();
                updateUIState();
            }
        }
        function setValve(open) {
            if (simData.mode !== 'liquid') return;
            simData.valveOpen = open;
            simData.notice = null;
            if (open) simData.pouring = false;
            else { simData.flowing = null; simData.dripping = false; }
            syncPanel();
            if (open) ensureRunning();
            if (!sysState.isLooping) draw();
        }
        function setStopper(open) {
            if (simData.mode !== 'liquid') return;
            simData.stopperOpen = open;
            simData.notice = null;
            if (!open) simData.pouring = false;
            syncPanel();
            if (!sysState.isLooping) draw();
        }
        function startPour() {
            if (!canPour()) return;
            if (!simData.stopperOpen) {
                simData.notice = { kind: 'warn', text: '위층은 분별 깔때기의 입구로 따라 낸다. 마개를 먼저 열자.' };
                draw();
                return;
            }
            simData.notice = null;
            simData.pouring = true;
            ensureRunning();
            updateButtons();
            draw();
        }
        function transferSunk() {
            if (!canTransfer()) return;
            const moved = simData.particles.filter(p => p.beaker === 0 && !p.floats);
            moved.forEach(p => {
                p.beaker = 1;
                p.x = 36 + Math.random() * 130;
                p.y = 96 + Math.random() * 40;
            });
            assignTargets(moved, 'glycerol');
            simData.stage = 2;
            simData.settled = false;
            ensureRunning();
            updateButtons();
            draw();
        }

        /* 시뮬레이션 초기화 — 초기화 버튼과 첫 실행 때 호출된다 (코어가 호출, 이름 유지) */
        function initSimulation() {
            simData.mode = 'liquid';
            simData.liquidMix = 'oil';
            simData.solidMix = 'plastic';
            simData.sepLiquid = 'water';
            simData.showDensity = true;
            simData.showLabels = true;
            resetExperiment();

            sysState.isStarted = false;
            sysState.isPaused = false;
            sysState.zoomLevel = 1.0;
            sysState.offsetX = 0;
            sysState.offsetY = 0;

            stopLoop();
            updateUIState();
            draw();
        }

        /* ── 안내 문장 ─────────────────────────────────────────────── */
        const MSG_STOPPER_CLOSED = '마개를 닫은 채 꼭지를 열면 분별 깔때기 안의 압력이 줄어 액체가 잘 내려오지 않는다. 꼭지를 닫고 마개를 먼저 열자.';
        function liquidMessage() {
            const C = SIM_CONFIG.liquid;
            if (simData.notice) return simData.notice;
            if (simData.valveOpen && !simData.stopperOpen && simData.lower + simData.upper + simData.mix > 0) {
                return { kind: 'warn', text: MSG_STOPPER_CLOSED };
            }
            if (simData.liquidMix === 'ethanol') {
                if (simData.valveOpen && simData.mix > 0) return { kind: 'warn', text: '물과 에탄올이 섞인 채로 함께 흘러나온다. 층이 없어서 한 가지 액체만 따로 받을 수 없다.' };
                if (simData.beakerMix > 0) return { kind: 'warn', text: '비커에 받은 액체도 물과 에탄올이 섞여 있다. 밀도 차가 있어도 완전히 섞이면 층이 생기지 않으므로 분별 깔때기로 나뉘지 않는다.' };
                return { kind: 'info', text: '물과 에탄올은 서로 잘 섞여 층이 생기지 않았다. 마개를 연 다음 꼭지를 열어 어떻게 되는지 관찰해 보자.' };
            }
            const tolW = simData.initLower * C.waterTolerance;
            const tolO = simData.initUpper * C.oilTolerance;
            const late = simData.beakerUpper > tolO;
            if (simData.pouring) return { kind: 'info', text: '위층의 식용유를 분별 깔때기의 입구로 따라 내고 있다.' };
            if (simData.poured) {
                if (late) return { kind: 'warn', text: '위층의 식용유를 입구로 따라 냈다. 하지만 꼭지를 늦게 닫아 아래층을 받은 비커에도 식용유가 섞여 있다. 다시하기를 눌러 보자.' };
                return { kind: 'success', text: '분리 완료! 밀도가 큰 물은 아래층이라 꼭지로 먼저 받고, 밀도가 작은 식용유는 위층이라 입구로 따라 냈다. 깔때기에 남은 경계면 부근 액체는 다른 비커에 받는다.' };
            }
            if (simData.valveOpen) {
                if (simData.lower + simData.upper <= 0) return { kind: 'warn', text: '꼭지를 계속 열어 두어 식용유까지 모두 흘러나왔다. 비커에서 식용유가 다시 물 위에 떠 있어 분리되지 않았다. 다시하기를 눌러 보자.' };
                if (simData.lower > 0) {
                    if (simData.lower > simData.initLower * C.nearInterface) return { kind: 'info', text: '아래층의 물이 먼저 비커로 흘러나오고 있다. 경계면이 내려오는 것을 지켜보자.' };
                    return { kind: 'warn', text: '경계면이 꼭지에 가까워졌다. 경계면 직전에 꼭지를 닫자!' };
                }
                return { kind: 'warn', text: '경계면이 꼭지를 지나 식용유도 섞여 나오고 있다. 얼른 꼭지를 닫자!' };
            }
            if (simData.beakerLower + simData.beakerUpper <= 0) {
                if (!simData.stopperOpen) return { kind: 'info', text: '물과 식용유가 두 층으로 나뉘어 있다. 마개를 연 다음 꼭지를 열어 아래층부터 받아 보자.' };
                return { kind: 'info', text: '마개를 열었다. 이제 꼭지를 열어 아래층의 물부터 받아 보자.' };
            }
            if (late) return { kind: 'warn', text: '꼭지를 늦게 닫아 식용유도 비커로 섞여 나왔다. 다시하기를 눌러 경계면 직전에 꼭지를 닫아 보자.' };
            if (simData.lower > tolW) return { kind: 'info', text: '꼭지를 닫았다. 아직 아래층의 물이 많이 남아 있다. 꼭지를 다시 열어 경계면 직전까지 받자.' };
            return { kind: 'success', text: '경계면 직전에 꼭지를 잘 닫았다! 경계면 부근 액체는 다른 비커에 받고, \'위층 따라 내기\'를 눌러 위층의 식용유를 입구로 따라 내자.' };
        }

        function solidMessage() {
            const liq = simData.sepLiquid;
            if (!sysState.isStarted) return { kind: 'info', text: `고체 혼합물을 ${NAME[liq]}에 넣고 저어 섞었다. 실험 시작을 누르면 어떻게 되는지 관찰해 보자.` };
            if (!simData.settled) {
                const l = simData.stage === 2 ? 'glycerol' : liq;
                return { kind: 'info', text: `${NAME[l]}보다 밀도가 작은 것은 떠오르고, 밀도가 큰 것은 가라앉고 있다.` };
            }
            /* 01_spec.json 판정 결과표 그대로 */
            if (simData.solidMix === 'rice') return { kind: 'success', text: '소금물에서 속이 빈 쭉정이는 뜨고 알찬 볍씨는 가라앉았다. 가라앉은 알찬 볍씨만 골라낼 수 있다.' };
            if (simData.stage === 2) return { kind: 'success', text: '글리세롤에서 PS는 뜨고 PET는 가라앉았다. 물과 글리세롤을 차례로 써서 PET, LDPE, PS를 모두 분리했다.' };
            if (liq === 'water') return { kind: 'success', text: '물에서 LDPE는 뜨고 PET와 PS는 가라앉았다. \'가라앉은 것을 글리세롤로 옮기기\'를 눌러 PET와 PS를 나눠 보자.' };
            return { kind: 'warn', text: '글리세롤에서 LDPE와 PS는 뜨고 PET는 가라앉았다. LDPE와 PS는 함께 떠서 나뉘지 않으므로, 먼저 물에 넣어 LDPE를 분리해 보자.' };
        }

        function densityLines() {
            const cmp = (a, b) => `${TOPIC[a]} ${NAME[b]}보다 밀도가 ${denser(a, b) ? '크다' : '작다'}`;
            if (simData.mode === 'liquid') {
                if (simData.liquidMix === 'oil') return [cmp('water', 'oil') + '.', '→ 밀도가 큰 물이 아래층, 밀도가 작은 식용유가 위층이 된다.'];
                return ['물과 에탄올은 밀도가 다르다.', '하지만 서로 잘 섞여 층이 생기지 않는다.', '밀도 차가 있어도 완전히 섞이면 층이 생기지 않는다.'];
            }
            const liqs = simData.stage === 2 ? ['water', 'glycerol'] : [simData.sepLiquid];
            const lines = [];
            liqs.forEach(liq => {
                if (liq !== 'water') lines.push(cmp(liq, 'water') + '.');
                const types = (simData.stage === 2 && liq === 'glycerol') ? ['PET', 'PS'] : SOLID_SETS[simData.solidMix];
                types.forEach(t => lines.push(`${cmp(t, liq)} → ${denser(t, liq) ? '가라앉는다' : '뜬다'}`));
            });
            return lines;
        }

        /* ── 화면 상자 ─────────────────────────────────────────────── */
        function currentMessage() {
            return simData.mode === 'liquid' ? liquidMessage() : solidMessage();
        }
        function bannerSize(msg, w) {
            if (!msg) return { lines: [], bw: 0, bh: 0, fs: 12, lh: 16 };
            const fs = F(14, 12);
            ctx.save();
            ctx.font = `600 ${fs}px ${FONT}`;
            /* 오른쪽 아래 초기화 버튼(DOM, 크기 고정) 자리는 비운다 */
            const maxW = Math.max(U(160), Math.min(w - U(32) - (w < 640 ? 52 : 150), U(640)));
            const lines = wrapLines(msg.text, maxW - U(24));
            const lh = fs * 1.45;
            const bw = Math.min(maxW, Math.max(...lines.map(l => ctx.measureText(l).width)) + U(24));
            ctx.restore();
            return { lines, bw, bh: lines.length * lh + U(16), fs, lh };
        }
        function drawBanner(msg, w, h) {
            if (!msg) return;
            const b = bannerSize(msg, w);
            ctx.save();
            ctx.font = `600 ${b.fs}px ${FONT}`;
            const x = U(16), y = h - U(16) - b.bh;
            const st = BANNER_STYLE[msg.kind] || BANNER_STYLE.info;
            rrect(x, y, b.bw, b.bh, U(10));
            ctx.fillStyle = st.bg; ctx.fill();
            ctx.strokeStyle = st.border; ctx.lineWidth = U(1.5); ctx.stroke();
            ctx.fillStyle = st.text; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            b.lines.forEach((l, i) => ctx.fillText(l, x + U(12), y + U(8) + b.lh * (i + 0.5)));
            ctx.restore();
        }

        function densitySize(maxW, fs) {
            const lines = densityLines();
            if (!lines.length) return null;
            ctx.save();
            ctx.font = `500 ${fs}px ${FONT}`;
            let wrapped = [];
            lines.forEach(l => { wrapped = wrapped.concat(wrapLines(l, maxW - U(24))); });
            const textW = Math.max(...wrapped.map(l => ctx.measureText(l).width));
            ctx.font = `700 ${fs}px ${FONT}`;
            const titleW = ctx.measureText('밀도 비교').width;
            ctx.restore();
            const lh = fs * 1.5;
            return { w: Math.min(maxW, Math.max(textW, titleW) + U(24)), h: U(10) + lh + wrapped.length * lh + U(8), lines: wrapped, fs, lh };
        }
        function drawDensityBox(d, pos) {
            if (!d) return;
            const x = pos.x, y = pos.y, lh = d.lh;
            ctx.save();
            rrect(x, y, d.w, d.h, U(10));
            ctx.fillStyle = 'rgba(255, 255, 255, 0.94)'; ctx.fill();
            ctx.strokeStyle = '#c7d2fe'; ctx.lineWidth = U(1.5); ctx.stroke();
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.font = `700 ${d.fs}px ${FONT}`;
            ctx.fillStyle = COLORS.primary;
            ctx.fillText('밀도 비교', x + U(12), y + U(10) + lh * 0.5);
            ctx.font = `500 ${d.fs}px ${FONT}`;
            ctx.fillStyle = COLORS.text;
            d.lines.forEach((l, i) => ctx.fillText(l, x + U(12), y + U(10) + lh * (i + 1.5)));
            ctx.restore();
        }

        function legendSize(w) {
            const types = SOLID_SETS[simData.solidMix];
            const fs = F(13, 11);
            ctx.save();
            ctx.font = `500 ${fs}px ${FONT}`;
            const textW = Math.max(...types.map(t => ctx.measureText(NAME[t]).width));
            ctx.restore();
            const rowH = fs + U(14);
            return { w: textW + U(54), h: types.length * rowH + U(12), fs, rowH, types };
        }
        function drawLegend(g, pos) {
            if (!g) return;
            const types = g.types, fs = g.fs, rowH = g.rowH, bw = g.w, bh = g.h;
            const x = pos.x, y = pos.y;
            ctx.save();
            ctx.font = `500 ${fs}px ${FONT}`;
            rrect(x, y, bw, bh, U(10));
            ctx.fillStyle = 'rgba(255, 255, 255, 0.94)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = U(1.2); ctx.stroke();
            types.forEach((t, i) => {
                const cy = y + U(6) + rowH * (i + 0.5);
                drawParticleAt(t, x + U(22), cy, U(1.5), 0);
                ctx.fillStyle = COLORS.text; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                ctx.fillText(NAME[t], x + U(42), cy);
            });
            ctx.restore();
        }

        /* ── 액체 혼합물 모드 그리기 ───────────────────────────────── */
        function drawLiquidMode(L, w, h) {
            const S = L.S;
            const fs = F(13, 12);
            const isOil = simData.liquidMix === 'oil';
            ctx.save();
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';

            /* 스탠드와 클램프 링 뒤쪽 반 */
            drawStand(L);
            drawClampRing(L, false);

            /* 비커 유리 뒤쪽 */
            drawBeakerBack(L.main);
            if (isOil) drawBeakerBack(L.side);

            /* 분별 깔때기 (관 끝이 받는 비커 안으로 들어간다) */
            drawFunnel(L);
            drawClampRing(L, true);

            /* 비커 속 액체 */
            const mainLayers = isOil
                ? [{ vol: simData.beakerLower, color: COLORS.water, line: COLORS.waterLine },
                   { vol: simData.beakerUpper, color: COLORS.oil, line: COLORS.oilLine }]
                : [{ vol: simData.beakerMix, color: COLORS.mix, line: COLORS.mixLine }];
            const mainTop = drawBeakerContents(L.main, mainLayers);
            if (isOil) drawBeakerContents(L.side, [{ vol: simData.sideOil, color: COLORS.oil, line: COLORS.oilLine }]);

            /* 꼭지에서 비커로 떨어지는 액체 */
            const tipX = L.FX(FN.stemX), tipY = L.FY(FN.stemBot + 1);
            const surfY = L.main.y(mainTop);
            if (simData.flowing && surfY > tipY) {
                ctx.fillStyle = COLORS[simData.flowing];
                ctx.strokeStyle = COLORS[simData.flowing];
                if (simData.dripping) {
                    const t = (simData.frame % 40) / 40;
                    ctx.beginPath(); ctx.arc(tipX, tipY + (surfY - tipY) * t, Math.max(1.8, 2.6 * S), 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.lineWidth = Math.max(2, 3 * S); ctx.lineCap = 'butt';
                    ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(tipX, surfY); ctx.stroke();
                    ctx.lineCap = 'round';
                }
            }

            /* 비커 유리 앞쪽 선 */
            drawBeakerFront(L.main);
            if (isOil) drawBeakerFront(L.side);

            /* 마개를 열었으면 받침 위에 놓아 둔다 */
            if (simData.stopperOpen) drawStopperShape(L.X(STAND.stopperRest.x), L.Y(STAND.stopperRest.y), L.fS, -Math.PI / 2);

            /* 위층 따라 내기 */
            if (simData.pouring) drawPourStream(L);

            /* 마개·꼭지 상태 */
            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            ctx.font = `700 ${fs}px ${FONT}`;
            ctx.fillStyle = simData.valveOpen ? '#047857' : '#be123c';
            haloText(simData.valveOpen ? '꼭지: 열림' : '꼭지: 닫힘', L.FX(4), L.FY(FN.valveY));
            ctx.fillStyle = simData.stopperOpen ? '#047857' : '#be123c';
            haloText(simData.stopperOpen ? '마개: 열림' : '마개: 닫힘', L.FX(24), L.FY(16));
            ctx.font = `500 ${F(12, 11)}px ${FONT}`;
            ctx.fillStyle = COLORS.light;
            haloText('(눌러서 열기·닫기)', L.FX(4), L.FY(FN.valveY) + fs + U(4));
            haloText('(눌러서 열기·닫기)', L.FX(24), L.FY(16) + fs + U(4));

            /* 층 이름 */
            if (simData.showLabels) {
                const yL = levelForVolume(simData.lower);
                const yU = levelForVolume(simData.lower + simData.upper);
                const yM = levelForVolume(simData.mix);
                const anchor = v => L.FX(FN.cx + funnelHW(v) * 0.75);
                const tags = [];
                if (isOil) {
                    if (simData.upper > 0 && yL - yU > 2) {
                        const v = (yU + yL) / 2;
                        tags.push({ y: L.FY(v), ax: anchor(v), text: '식용유 (위층)', color: COLORS.oilLine });
                    }
                    if (simData.upper > 0 && simData.lower > 0) {
                        tags.push({ y: L.FY(yL), ax: anchor(yL), text: '경계면', color: COLORS.text });
                    }
                    if (simData.lower > 0) {
                        const v = Math.min((yL + FN.bot) / 2, FN.bot - 4);
                        tags.push({ y: L.FY(v), ax: L.FX(FN.cx), text: simData.poured ? '경계면 부근 액체' : '물 (아래층)', color: COLORS.waterLine });
                    }
                } else if (simData.mix > 0) {
                    const v = (yM + FN.bot) / 2;
                    tags.push({ y: L.FY(v), ax: anchor(v), text: '물 + 에탄올 (층이 생기지 않음)', color: COLORS.mixLine });
                }
                drawTags(tags, L.FX(FN.cx + 30) + U(14), fs);

                /* 받는 비커 속 (왼쪽에 이름) */
                const kv = SIM_CONFIG.liquid.beakerFill / FUNNEL_TOTAL;
                const B = L.main;
                ctx.save();
                ctx.font = `600 ${fs}px ${FONT}`;
                ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                const lx = B.x(14);
                if (isOil) {
                    const hW = simData.beakerLower * kv, hO = simData.beakerUpper * kv;
                    const base = BK_FLOOR;
                    let wy = null;
                    if (hW > 6) { wy = B.y(base - hW / 2); ctx.fillStyle = COLORS.waterLine; haloText('물', lx, wy); }
                    if (hO > 2) {
                        let oy = B.y(base - hW - hO / 2);
                        if (wy !== null) oy = Math.min(oy, wy - fs - U(4));
                        ctx.fillStyle = COLORS.oilLine; haloText('식용유', lx, oy);
                    }
                    if (simData.sideOil > 0) {
                        const sB = L.side;
                        ctx.textAlign = 'center'; ctx.fillStyle = COLORS.oilLine;
                        haloText('식용유 (따라 낸 위층)', sB.x(BK.cx), sB.y(0) - fs);
                    }
                } else {
                    const hM = simData.beakerMix * kv;
                    if (hM > 6) { ctx.fillStyle = COLORS.mixLine; haloText('물 + 에탄올', lx, B.y(BK_FLOOR - hM / 2)); }
                }
                ctx.restore();

                /* 기구 이름 */
                ctx.font = `500 ${fs}px ${FONT}`;
                ctx.fillStyle = COLORS.sub; ctx.textAlign = 'left';
                haloText('분별 깔때기', L.FX(64), L.FY(48));
            }
            ctx.restore();
        }

        /* ── 고체 혼합물 모드 그리기 ───────────────────────────────── */
        function drawSolidMode(lay, w, h) {
            const fs = F(13, 12);
            const surf = SIM_CONFIG.solid.surface;
            lay.boxes.forEach((B, i) => {
                const liqKey = beakerLiquid(i);
                const liq = LIQ[liqKey];
                ctx.save();
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';

                /* 유리 뒤쪽 */
                drawBeakerBack(B);

                /* 액체 (비커 안쪽 경로) */
                ctx.save();
                beakerPath(B, surf, BK.inset);
                ctx.fillStyle = liq.fill; ctx.fill();
                ctx.restore();

                /* 조각 (비커 안쪽으로 클리핑) */
                ctx.save();
                beakerPath(B, BK.rimY + 6, BK.inset);
                ctx.clip();
                simData.particles.forEach(p => {
                    if (p.beaker !== i) return;
                    const bob = (p.floats && Math.abs(p.ty - p.y) < 1) ? Math.sin(simData.frame * 0.05 + p.phase) * 0.6 : 0;
                    drawParticleAt(p.type, B.x(p.x), B.y(p.y + bob), B.k, p.rot);
                });
                ctx.restore();
                surfaceEllipse(B, surf, liq.line);

                /* 유리 앞쪽 선 */
                drawBeakerFront(B);

                /* 분리용 액체 이름 */
                ctx.font = `700 ${fs}px ${FONT}`;
                ctx.fillStyle = liq.line; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                haloText(`분리용 액체: ${NAME[liqKey]}`, B.x(BK.cx), B.y(0) - U(12));

                /* 뜬 것 / 가라앉은 것 */
                if (simData.showLabels && sysState.isStarted && simData.settled) {
                    const types = SOLID_SETS[simData.solidMix];
                    const here = simData.particles.filter(p => p.beaker === i);
                    const fl = types.filter(t => here.some(p => p.type === t && p.floats)).map(t => NAME[t]);
                    const sk = types.filter(t => here.some(p => p.type === t && !p.floats)).map(t => NAME[t]);
                    const skText = sk.length ? sk.join(', ') : (simData.stage === 2 && i === 0 ? '글리세롤로 옮김' : '없음');
                    ctx.font = `600 ${fs}px ${FONT}`;
                    const ty = B.y(BK.h) + fs;
                    ctx.fillStyle = '#0369a1';
                    haloText(`뜬 것: ${fl.length ? fl.join(', ') : '없음'}`, B.x(BK.cx), ty);
                    ctx.fillStyle = '#92400e';
                    haloText(`가라앉은 것: ${skText}`, B.x(BK.cx), ty + fs + U(6));
                }
                ctx.restore();
            });

            /* 옮기는 화살표 */
            if (lay.boxes.length === 2) {
                const a = lay.boxes[0], b = lay.boxes[1];
                const x1 = a.x(190) + U(4), x2 = b.x(14) - U(4), yy = a.y(150);
                if (x2 - x1 < U(24)) { drawLegend(lay.plan.legend, lay.plan.legendPos); return; }
                ctx.save();
                ctx.strokeStyle = COLORS.sub; ctx.fillStyle = COLORS.sub; ctx.lineWidth = U(2);
                ctx.beginPath(); ctx.moveTo(x1, yy); ctx.lineTo(x2 - U(6), yy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x2, yy); ctx.lineTo(x2 - U(9), yy - U(5)); ctx.lineTo(x2 - U(9), yy + U(5)); ctx.closePath(); ctx.fill();
                ctx.font = `500 ${F(12, 11)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                ctx.save(); ctx.translate((x1 + x2) / 2, yy - U(6));
                const lw = ctx.measureText('가라앉은 것').width;
                if (lw > x2 - x1) ctx.scale((x2 - x1) / lw, (x2 - x1) / lw);
                haloText('가라앉은 것', 0, 0);
                ctx.restore();
                ctx.restore();
            }
            drawLegend(lay.plan.legend, lay.plan.legendPos);
        }

        /* ─────────────────────────────────────────────────────────────
           ✏️  draw() — 매 프레임 캔버스를 그리는 함수 (코어가 호출, 이름 유지)
           ctx와 simData 값을 이용해 원하는 도형을 그리세요.
           ───────────────────────────────────────────────────────────── */
        function draw() {
            if (!ctx) return;
            const w = sysState.canvasLogicalWidth, h = sysState.canvasLogicalHeight;
            if (!w || !h) return;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, w, h);
            let plan;
            if (simData.mode === 'liquid') { const L = liquidLayout(w, h); drawLiquidMode(L, w, h); plan = L.plan; }
            else { const lay = solidLayout(w, h); drawSolidMode(lay, w, h); plan = lay.plan; }
