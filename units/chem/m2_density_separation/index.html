            if (simData.showDensity) drawDensityBox(plan.d, plan.dpos);
            drawBanner(currentMessage(), w, h);
            updateButtons();
        }

        /* 분별 깔때기에서 흘러나오기: 마개를 열어야 잘 나오고, 아래층부터 나온다 */
        function updateFlow() {
            const F = SIM_CONFIG.flow, C = SIM_CONFIG.liquid, T = FUNNEL_TOTAL;
            simData.flowing = null;
            simData.dripping = false;

            /* 위층을 입구로 따라 내기 */
            if (simData.pouring) {
                const d = Math.min(simData.upper, T * F.pourRate);
                simData.upper -= d; simData.sideOil += d;
                if (simData.upper <= 1e-9) { simData.upper = 0; simData.pouring = false; simData.poured = true; }
                return;
            }

            if (!simData.valveOpen) return;
            const total = simData.lower + simData.upper + simData.mix;
            if (total <= 0) return;
            let rate;
            if (!simData.stopperOpen) {
                /* 마개를 닫은 채로는 몇 방울만 떨어지고 멈춘다 */
                if (simData.dripLeft <= 0) return;
                rate = Math.min(simData.dripLeft, T * F.dripRate);
                simData.dripLeft -= rate;
                simData.dripping = true;
            } else {
                const head = (FN.bot - levelForVolume(total)) / FUNNEL_SPAN;
                rate = T * F.baseRate * Math.max(F.minHeadFactor, Math.sqrt(head));
                if (simData.liquidMix === 'oil') {
                    const nearWater = simData.lower > 0 && simData.lower < simData.initLower * C.nearInterface;
                    const justPast = simData.lower <= 0 && simData.beakerUpper < simData.initUpper * 0.15;
                    if (nearWater || justPast) rate *= F.slowFactor;
                }
            }
            if (simData.liquidMix === 'oil') {
                if (simData.lower > 0) {
                    const d = Math.min(rate, simData.lower);
                    simData.lower -= d; simData.beakerLower += d; simData.flowing = 'water';
                } else {
                    const d = Math.min(rate, simData.upper);
                    simData.upper -= d; simData.beakerUpper += d; simData.flowing = 'oil';
                }
            } else {
                const d = Math.min(rate, simData.mix);
                simData.mix -= d; simData.beakerMix += d; simData.flowing = 'mix';
            }
        }

        /* 고체 조각: 액체보다 밀도가 작으면 표면으로, 크면 바닥으로 */
        function updateParticles() {
            let allSettled = true;
            simData.particles.forEach(p => {
                const dy = p.ty - p.y, ady = Math.abs(dy);
                const v = p.speed * (ady < 14 ? Math.max(0.12, ady / 14) : 1);
                p.y += Math.sign(dy) * Math.min(ady, v);
                const dx = p.tx - p.x;
                p.x += dx * 0.03 + (ady > 3 ? Math.sin(simData.frame * 0.06 + p.phase) * 0.25 : 0);
                if (ady > 3) p.rot += Math.sin(simData.frame * 0.03 + p.phase) * 0.01;
                else p.rot *= 0.97;
                if (ady > 0.6 || Math.abs(dx) > 1.2) allSettled = false;
            });
            simData.settled = allSettled;
        }

        /* 프레임별 물리 연산 — 시작 버튼을 누르면 매 프레임 호출된다 (코어가 호출, 이름 유지) */
        function updatePhysics() {
            simData.frame++;
            if (simData.mode === 'liquid') updateFlow();
            else updateParticles();
        }

        /* 캔버스 포인터 조작 — type: 'down' | 'move' | 'up', pos: 캔버스 논리 좌표 {x, y} (코어 ZONE J가 호출) */
        function onCanvasPointer(type, pos, e) {
            if (type !== 'down' || simData.mode !== 'liquid') return;
            const L = liquidLayout(sysState.canvasLogicalWidth, sysState.canvasLogicalHeight);
            const r = Math.max(18, 20 * L.fS);
            if (Math.hypot(pos.x - L.FX(26), pos.y - L.FY(FN.valveY)) < r) { setValve(!simData.valveOpen); return; }
            const sx = simData.stopperOpen ? L.X(STAND.stopperRest.x) + 12 * L.fS : L.FX(FN.cx);
            const sy = simData.stopperOpen ? L.Y(STAND.stopperRest.y) : L.FY(18);
            if (Math.hypot(pos.x - sx, pos.y - sy) < r) setStopper(!simData.stopperOpen);
        }
        /* ████ ZONE F 끝 ████████████████████████████████████████████████████████ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE G — LOOP & TAB STATE MANAGER (수정 금지)
           ════════════════════════════════════════════════════════════════════════ */
        function startLoop() { if (!sysState.isLooping) { sysState.isLooping = true; updateLoop(); } }
        function stopLoop() { sysState.isLooping = false; }
        function updateLoop() {
            if (!sysState.isLooping) return;
            updatePhysics(); draw();
            requestAnimationFrame(updateLoop);
        }

        function saveTabState(shape) {
            const selectedRadio = document.querySelector('input[name="simOption"]:checked')?.value;
            const selectedVal = DOM.customSelectTrigger?.getAttribute('data-selected-value') || null;
            tabStates[shape] = {
                ...simData,
                isStarted: sysState.isStarted, isPaused: sysState.isPaused,
                zoomLevel: sysState.zoomLevel, offsetX: sysState.offsetX, offsetY: sysState.offsetY,
                selectVal: selectedVal, radioVal: selectedRadio
            };
        }

        function loadTabState(shape) {
            const state = tabStates[shape];
            if (state) {
                Object.assign(simData, state);
                sysState.isStarted = state.isStarted; sysState.isPaused = state.isPaused;
                sysState.zoomLevel = state.zoomLevel || 1.0;
                sysState.offsetX = state.offsetX || 0;
                sysState.offsetY = state.offsetY || 0;

                const csvEl = document.getElementById('customSelectValue');
                if (state.selectVal) {
                    const li = document.querySelector(`#customSelectList li[data-value="${state.selectVal}"]`);
                    if (li && csvEl) { csvEl.innerHTML = li.innerHTML; DOM.customSelectTrigger?.setAttribute('data-selected-value', state.selectVal); }
                } else {
                    if (csvEl) csvEl.textContent = '학습 내용을 선택하세요';
                    DOM.customSelectTrigger?.removeAttribute('data-selected-value');
                }
                const radio = document.querySelector(`input[name="simOption"][value="${state.radioVal}"]`);
                if (radio) radio.checked = true;
            } else {
                simData.value1 = SIM_CONFIG.slider.initialValue;
                simData.diameter = SIM_CONFIG.object.radius * 2;
                simData.radius = SIM_CONFIG.object.radius;
                simData.ratioA = 1; simData.ratioB = 1;
                sysState.isStarted = false; sysState.isPaused = false;
                sysState.zoomLevel = 1.0; sysState.offsetX = 0; sysState.offsetY = 0;
                if (canvas) { simData.x = sysState.canvasLogicalWidth / 2; simData.y = sysState.canvasLogicalHeight / 2; }
                const csvEl = document.getElementById('customSelectValue');
                if (csvEl) csvEl.textContent = '학습 내용을 선택하세요';
                DOM.customSelectTrigger?.removeAttribute('data-selected-value');
                const dr = document.querySelector('input[name="simOption"][value="parallel"]');
                if (dr) dr.checked = true;
            }

            if (varSlider1) varSlider1.value = simData.value1;
            if (varDisplay1) varDisplay1.textContent = `${simData.value1} ${SIM_CONFIG.slider.unit}`;
            if (DOM.directInputSingle) DOM.directInputSingle.value = simData.diameter;
            if (DOM.ratioInputA) DOM.ratioInputA.value = simData.ratioA;
            if (DOM.ratioInputB) DOM.ratioInputB.value = simData.ratioB;

            sysState.isStarted && !sysState.isPaused ? startLoop() : stopLoop();
            updateUIState(); draw();
        }

        function updateUIState() {
            const { statusIndicator, pauseBtn, helperText } = DOM;
            if (!statusIndicator || !pauseBtn || !helperText) return;
            const isRunning = sysState.isStarted && !sysState.isPaused;
            const isPaused = sysState.isPaused;
            const lock = false; /* 동작 중 입력 잠금 해제 (실시간 상호작용 지원) */

            if (DOM.varSlider1) DOM.varSlider1.disabled = lock;
            if (DOM.directInputSingle) DOM.directInputSingle.disabled = lock;
            if (DOM.ratioInputA) DOM.ratioInputA.disabled = lock;
            if (DOM.ratioInputB) DOM.ratioInputB.disabled = lock;
            if (DOM.customSelectTrigger) {
                DOM.customSelectTrigger.disabled = lock;
                if (lock && DOM.customSelectList && !DOM.customSelectList.classList.contains('hidden')) {
                    DOM.customSelectList.classList.add('hidden');
                    DOM.customSelectTrigger.setAttribute('aria-expanded', 'false');
                }
            }
            if (DOM.radioOptions) DOM.radioOptions.forEach(r => r.disabled = lock);

            const helperBoxWrapper = document.getElementById('helperBoxWrapper');
            if (isRunning) {
                statusIndicator.className = "w-3 h-3 rounded-full bg-rose-500 border border-rose-300 animate-pulse translate-y-[1px]";
                pauseBtn.className = "btn-action-pause col-span-2 py-2 border rounded-lg transition-colors";
                pauseBtn.innerHTML = SIM_CONFIG.labels.pause;
                helperText.textContent = SIM_CONFIG.labels.helperRunning;
                helperText.className = "helper-text-running whitespace-nowrap transition-colors";
                if (helperBoxWrapper) helperBoxWrapper.classList.add('hidden');
            } else if (isPaused) {
                statusIndicator.className = "w-3 h-3 rounded-full bg-amber-400 border border-amber-300 translate-y-[1px]";
                pauseBtn.className = "btn-action-start col-span-2 py-2 border rounded-lg transition-colors";
                pauseBtn.innerHTML = SIM_CONFIG.labels.start;
                helperText.textContent = SIM_CONFIG.labels.helperPaused;
                helperText.className = "helper-text-paused whitespace-nowrap transition-colors";
                if (helperBoxWrapper) helperBoxWrapper.classList.remove('hidden');
            } else {
                statusIndicator.className = "w-3 h-3 rounded-full bg-emerald-500 border border-emerald-300 translate-y-[1px]";
                pauseBtn.className = "btn-action-start col-span-2 py-2 border rounded-lg transition-colors";
                pauseBtn.innerHTML = SIM_CONFIG.labels.start;
                helperText.textContent = SIM_CONFIG.labels.helperIdle;
                helperText.className = "helper-text-default whitespace-nowrap transition-colors";
                if (helperBoxWrapper) helperBoxWrapper.classList.remove('hidden');
            }
        }
        /* ════ ZONE G 끝 ════════════════════════════════════════════════════════ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE H — CANVAS RESIZE (수정 금지)
           ════════════════════════════════════════════════════════════════════════ */
        function limitOffset() {
            if (!canvas) return;
            if (sysState.zoomLevel <= 1.0) {
                sysState.offsetX = 0;
                sysState.offsetY = 0;
                return;
            }
            const maxOffset = Math.min(sysState.canvasLogicalWidth, sysState.canvasLogicalHeight) * 0.5 * (sysState.zoomLevel - 1.0);
            sysState.offsetX = Math.max(-maxOffset, Math.min(maxOffset, sysState.offsetX));
            sysState.offsetY = Math.max(-maxOffset, Math.min(maxOffset, sysState.offsetY));
        }

        function resizeCanvas() {
            if (!container || !canvas || !ctx) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
            canvas.style.width = `${rect.width}px`; canvas.style.height = `${rect.height}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            sysState.canvasLogicalWidth = rect.width;
            sysState.canvasLogicalHeight = rect.height;
            simData.x = rect.width / 2; simData.y = rect.height / 2;
            for (const k in tabStates) { if (tabStates[k]) { tabStates[k].x = rect.width / 2; tabStates[k].y = rect.height / 2; } }

            // 초기화 버튼 동적 스타일 조정 (높이가 270px 이하일 때)
            const resetBtn = document.getElementById('resetBtn');
            const resetBtnText = document.getElementById('resetBtnText');
            if (resetBtn && resetBtnText) {
                if (rect.height <= 400) {
                    resetBtnText.style.display = 'none';
                    resetBtn.style.padding = '0';
                    resetBtn.style.width = '2.5rem';
                    resetBtn.style.height = '2.5rem';
                    resetBtn.style.justifyContent = 'center';
                } else {
                    resetBtnText.style.display = '';
                    resetBtn.style.padding = '';
                    resetBtn.style.width = '';
                    resetBtn.style.height = '';
                    resetBtn.style.justifyContent = '';
                }
            }

            limitOffset(); draw();
        }

        const isFullscreenActive = () =>
            !!(document.fullscreenElement || document.webkitFullscreenElement);
        const FULLSCREEN_HISTORY_KEY = '__templateFullscreen';
        const FULLSCREEN_HISTORY_CLEANUP_DELAY = 400;
        const isNaverInAppBrowser = () => /NAVER\s*\((?:inapp|higgs);/i.test(navigator.userAgent);
        let fullscreenHistoryToken = null;
        let fullscreenExitFromHistory = false;
        let fullscreenHistoryCleanup = false;
        let fullscreenHistoryCleanupTimer = null;
        let previousScrollRestoration = null;

        const addFullscreenHistoryToken = stateValue => {
            if (!fullscreenHistoryToken) return stateValue;
            return { ...stateValue, [FULLSCREEN_HISTORY_KEY]: fullscreenHistoryToken };
        };

        const clearFullscreenHistoryTracking = () => {
            clearTimeout(fullscreenHistoryCleanupTimer);
            fullscreenHistoryCleanupTimer = null;
            if (previousScrollRestoration !== null && 'scrollRestoration' in history) {
                history.scrollRestoration = previousScrollRestoration;
            }
            previousScrollRestoration = null;
            fullscreenHistoryToken = null;
            fullscreenExitFromHistory = false;
            fullscreenHistoryCleanup = false;
        };

        const pushFullscreenHistoryEntry = () => {
            if (!isNaverInAppBrowser() || fullscreenHistoryToken) return;
            const token = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
            try {
                if ('scrollRestoration' in history && previousScrollRestoration === null) {
                    previousScrollRestoration = history.scrollRestoration;
                    history.scrollRestoration = 'manual';
                }
                history.pushState({ [FULLSCREEN_HISTORY_KEY]: token }, '');
                fullscreenHistoryToken = token;
            } catch (_) {
                clearFullscreenHistoryTracking();
            }
        };

        const restoreFullscreenHistoryEntry = () => {
            const shouldRestore = isFullscreenActive();
            clearFullscreenHistoryTracking();
            if (shouldRestore) pushFullscreenHistoryEntry();
        };

        const exitFullscreenFromHistory = () => {
            const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
            if (!exitFullscreen) {
                restoreFullscreenHistoryEntry();
                return;
            }
            const token = fullscreenHistoryToken;
            const restoreEntry = () => {
                if (fullscreenHistoryToken === token) restoreFullscreenHistoryEntry();
            };
            fullscreenExitFromHistory = true;
            try {
                const result = exitFullscreen.call(document);
                if (result && typeof result.catch === 'function') result.catch(restoreEntry);
            } catch (_) {
                restoreEntry();
            }
        };

        const cleanupFullscreenHistoryEntry = () => {
            const token = fullscreenHistoryToken;
            if (!token || !history.state || history.state[FULLSCREEN_HISTORY_KEY] !== token) {
                clearFullscreenHistoryTracking();
                return;
            }
            fullscreenHistoryCleanup = true;
            history.back();
        };

        const scheduleFullscreenHistoryCleanup = () => {
            const token = fullscreenHistoryToken;
            clearTimeout(fullscreenHistoryCleanupTimer);
            fullscreenHistoryCleanupTimer = setTimeout(() => {
                if (fullscreenHistoryToken !== token || isFullscreenActive()) return;
                const state = history.state;
                if (!state || state[FULLSCREEN_HISTORY_KEY] !== token) {
                    clearFullscreenHistoryTracking();
                    return;
                }
                if (Object.keys(state).length === 1) cleanupFullscreenHistoryEntry();
            }, FULLSCREEN_HISTORY_CLEANUP_DELAY);
        };

        window.addEventListener('popstate', event => {
            clearTimeout(fullscreenHistoryCleanupTimer);
            fullscreenHistoryCleanupTimer = null;
            const token = fullscreenHistoryToken;
            if (!token) return;
            const sameFullscreenEntry = !!(
                event.state && event.state[FULLSCREEN_HISTORY_KEY] === token
            );
            if (fullscreenHistoryCleanup) {
                if (sameFullscreenEntry) history.back();
                else clearFullscreenHistoryTracking();
                return;
            }
            if (sameFullscreenEntry) {
                if (!isFullscreenActive()) scheduleFullscreenHistoryCleanup();
                return;
            }
            if (isFullscreenActive()) exitFullscreenFromHistory();
            else clearFullscreenHistoryTracking();
        });

        function toggleFullScreen() {
            const workspace = document.getElementById('workspace');
            if (!workspace) return;

            if (!isFullscreenActive()) {
                if (workspace.requestFullscreen) workspace.requestFullscreen().catch(e => console.error(e));
                else if (workspace.webkitRequestFullscreen) workspace.webkitRequestFullscreen();
                else alert("현재 브라우저는 전체화면을 지원하지 않습니다.");
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        const resetFullscreenButtonFeedback = () => {
            ['fullscreen-btn', 'fullscreen-btn-mobile'].forEach(id => {
                const button = document.getElementById(id);
                if (!button) return;
                clearTimeout(button._tapFeedbackTimer);
                button.classList.remove('is-tap-feedback', 'is-pen-hover');
                button.blur();
            });
        };

        const showSimulationToast = message => {
            document.getElementById('sim-toast')?.remove();
            const toast = document.createElement('div');
            toast.id = 'sim-toast';
            toast.setAttribute('role', 'status');
            toast.className = 'fixed top-30 left-1/2 transform -translate-x-1/2 bg-slate-800/90 backdrop-blur-sm text-white px-6 py-3 rounded-full shadow-lg z-[9999] font-bold text-[0.95rem] transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-2';
            toast.innerHTML = '<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>';
            toast.appendChild(document.createTextNode(message));
            (document.getElementById('workspace') || document.body).appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 1500);
        };

        let fullscreenExitForNumberInput = false;
        let fullscreenNumberExitResetTimer = null;

        const resetFullscreenNumberExitTracking = () => {
            clearTimeout(fullscreenNumberExitResetTimer);
            fullscreenNumberExitResetTimer = null;
            fullscreenExitForNumberInput = false;
        };

        const markFullscreenNumberInputPress = event => {
            if (!isIPadDevice || !isFullscreenActive()) return;
            const input = event.target.closest?.('#workspace input[type="number"]');
            if (!input || input.disabled) return;
            fullscreenExitForNumberInput = true;
            clearTimeout(fullscreenNumberExitResetTimer);
            fullscreenNumberExitResetTimer = setTimeout(resetFullscreenNumberExitTracking, 2000);
        };

        const fullscreenNumberPressEvent = window.PointerEvent ? 'pointerdown' : 'touchstart';
        document.addEventListener(fullscreenNumberPressEvent, markFullscreenNumberInputPress, {
            capture: true,
            passive: true
        });

        const handleFullscreenChange = () => {
            if (!isFullscreenActive() && fullscreenExitForNumberInput) {
                resetFullscreenNumberExitTracking();
                showSimulationToast('숫자 입력을 위해 전체화면이 종료되었습니다.');
            }
            if (isFullscreenActive()) {
                pushFullscreenHistoryEntry();
            } else if (fullscreenHistoryToken) {
                if (fullscreenExitFromHistory) clearFullscreenHistoryTracking();
                else scheduleFullscreenHistoryCleanup();
            }
            if (!isFullscreenActive()) resetFullscreenButtonFeedback();
            requestAnimationFrame(() => {
                if (!isFullscreenActive()) resetFullscreenButtonFeedback();
                resizeCanvas();
            });

            const exitUI = document.getElementById('fullscreen-exit-ui');
            if (!exitUI) return;
            if (isFullscreenActive()) {
                exitUI.classList.remove('hidden', 'opacity-100');
                exitUI.classList.add('opacity-0');
            } else {
                exitUI.classList.add('hidden', 'opacity-0');
                exitUI.classList.remove('opacity-100');
            }
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        /* ════ ZONE H 끝 ════════════════════════════════════════════════════════ */


        /* ████████████████████████████████████████████████████████████████████████
           ████                                                               ████
           ████   ✏️  ZONE I — INPUT EVENT HANDLERS (입력 이벤트 핸들러)       ████
           ████   폼 변경 시 simData를 어떻게 업데이트할지 여기서 작성하세요.     ████
           ████                                                               ████
           ████████████████████████████████████████████████████████████████████████ */
        function bindInputEvents() {
            const onRadio = (name, handler) => {
                document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
                    r.addEventListener('change', () => { if (r.checked) handler(r.value); });
                });
            };
            const restart = () => { stopRun(); resetExperiment(); draw(); };

            /* 모드 전환: 새 실험으로 바꾸고 시작 전 상태로 */
            onRadio('modeOpt', value => { simData.mode = value; restart(); });

            /* 액체 혼합물 선택 */
            const liquidMixSelect = document.getElementById('liquidMixSelect');
            if (liquidMixSelect) {
                liquidMixSelect.addEventListener('change', () => { simData.liquidMix = liquidMixSelect.value; restart(); });
            }

            /* 마개·꼭지 */
            onRadio('stopperOpt', value => setStopper(value === 'open'));
            onRadio('valveOpt', value => setValve(value === 'open'));

            /* 위층 따라 내기 */
            const pourBtn = document.getElementById('pourBtn');
            if (pourBtn) pourBtn.addEventListener('click', startPour);

            /* 고체 혼합물 선택: 고를 수 있는 분리용 액체도 함께 바뀐다 */
            const solidMixSelect = document.getElementById('solidMixSelect');
            if (solidMixSelect) {
                solidMixSelect.addEventListener('change', () => {
                    simData.solidMix = solidMixSelect.value;
                    ensureAllowedLiquid();
                    restart();
                });
            }

            /* 분리용 액체: 고르면 고체 혼합물을 새로 넣고 바로 관찰한다 */
            onRadio('sepLiquidOpt', value => {
                if (!ALLOWED_LIQUIDS[simData.solidMix].includes(value)) { syncPanel(); return; }
                simData.sepLiquid = value;
                resetExperiment();
                ensureRunning();
                draw();
            });

            /* 가라앉은 것을 글리세롤로 옮기기 */
            const transferBtn = document.getElementById('transferBtn');
            if (transferBtn) transferBtn.addEventListener('click', transferSunk);

            /* 표시 요소 */
            const chkDensity = document.getElementById('chkDensity');
            if (chkDensity) chkDensity.addEventListener('change', () => { simData.showDensity = chkDensity.checked; draw(); });
            const chkLabels = document.getElementById('chkLabels');
            if (chkLabels) chkLabels.addEventListener('change', () => { simData.showLabels = chkLabels.checked; draw(); });

            /* 다시하기: 고른 조건은 그대로 두고 실험만 처음 상태로 */
            const retryBtn = document.getElementById('retryBtn');
            if (retryBtn) retryBtn.addEventListener('click', restart);
        }
        /* ████ ZONE I 끝 ████████████████████████████████████████████████████████ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE J — CORE EVENT BINDING (수정 금지)
           전체화면·모달·셔터·캔버스 드래그·줌·탭·토스트 이벤트 처리
           ════════════════════════════════════════════════════════════════════════ */
        function bindCoreEvents() {

            /* 동작 중 입력 차단 토스트 */
            const interceptInteraction = (e) => {
                // 실시간 상호작용을 허용하므로 아무런 차단도 수행하지 않음
            };

            /* 손가락·펜 입력 피드백 */
            const TAP_FEEDBACK_SELECTOR = 'button, [role="button"], .radio-label, label:has(input[type="checkbox"])';
            const isFeedbackDisabled = control =>
                control.matches(':disabled, [aria-disabled="true"]') || !!control.querySelector(':disabled');
            document.addEventListener('pointerdown', e => {
                if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
                const control = e.target.closest?.(TAP_FEEDBACK_SELECTOR);
                if (!control || isFeedbackDisabled(control)) return;
                control.classList.add('is-tap-feedback');
                clearTimeout(control._tapFeedbackTimer);
                control._tapFeedbackTimer = setTimeout(() => {
                    control.classList.remove('is-tap-feedback');
                    control.blur();
                }, 250);
            });
            document.addEventListener('pointerover', e => {
                if (e.pointerType !== 'pen' || e.buttons !== 0) return;
                const control = e.target.closest?.(TAP_FEEDBACK_SELECTOR);
                if (!control || isFeedbackDisabled(control)) return;
                control.classList.add('is-pen-hover');
            });
            document.addEventListener('pointerout', e => {
                if (e.pointerType !== 'pen') return;
                const control = e.target.closest?.(TAP_FEEDBACK_SELECTOR);
                if (!control || control.contains(e.relatedTarget)) return;
                control.classList.remove('is-pen-hover');
            });
            document.addEventListener('pointerup', e => {
                if (e.pointerType !== 'pen' || matchMedia('(any-hover: hover)').matches) return;
                e.target.closest?.(TAP_FEEDBACK_SELECTOR)?.classList.remove('is-pen-hover');
            });

            /* 모바일 메뉴 */
            const moreMenuBtn = document.getElementById('moreMenuBtn');
            const mobileMenuPanel = document.getElementById('mobileMenuPanel');
            if (moreMenuBtn && mobileMenuPanel) {
                const close = () => { mobileMenuPanel.classList.remove('w-[84px]', 'opacity-100'); mobileMenuPanel.classList.add('w-0', 'opacity-0'); };
                const toggle = () => {
                    const isOpen = mobileMenuPanel.classList.contains('w-[84px]');
                    if (!isOpen) { mobileMenuPanel.classList.remove('w-0', 'opacity-0'); mobileMenuPanel.classList.add('w-[84px]', 'opacity-100'); }
                    else { close(); }
                };
                moreMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
                window.addEventListener('resize', () => {
                    if (isFullscreenActive()) return;
                    if (getComputedStyle(moreMenuBtn).display === 'none' && mobileMenuPanel.classList.contains('w-[84px]')) close();
                });
                window.addEventListener('click', (e) => {
                    if (!moreMenuBtn.contains(e.target) && !mobileMenuPanel.contains(e.target) && mobileMenuPanel.classList.contains('w-[84px]')) close();
                });
            }

            /* 전체화면 */
            bindEvent('fullscreen-btn', 'click', toggleFullScreen);
            bindEvent('fullscreen-btn-mobile', 'click', toggleFullScreen);

            /* 모달 */
            const toggleModal = (id, show) => {
                const modal = document.getElementById(id); if (!modal) return;
                if (show) { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; history.pushState(addFullscreenHistoryToken({ modalOpen: id }), ''); }
                else { modal.classList.add('hidden'); document.body.style.overflow = ''; if (history.state?.modalOpen === id) history.back(); }
            };
            window.addEventListener('popstate', () => {
                ['helpBox', 'conceptBox', 'quizBox'].forEach(id => document.getElementById(id)?.classList.add('hidden'));
                document.body.style.overflow = '';
            });
            document.addEventListener('keydown', event => {
                if (event.key !== 'Escape') return;
                const openModalId = ['helpBox', 'conceptBox', 'quizBox'].find(id => {
                    const modal = document.getElementById(id);
                    return modal && !modal.classList.contains('hidden');
                });
                if (!openModalId) return;
                event.preventDefault();
                toggleModal(openModalId, false);
            });
            bindEvent('helpBtn', 'click', () => toggleModal('helpBox', true));
            bindEvent('help-Btn', 'click', () => toggleModal('helpBox', true));
            bindEvent('closeHelpBtn', 'click', () => toggleModal('helpBox', false));
            bindEvent('conceptBtn', 'click', () => toggleModal('conceptBox', true));
            bindEvent('closeConceptBtn', 'click', () => toggleModal('conceptBox', false));
            bindEvent('closeQuizBtn', 'click', () => toggleModal('quizBox', false));

            /* 셔터 */
            const shutterToggle = document.getElementById('shutter-toggle');
            const shutterContent = document.getElementById('shutter-content');
            const shutterIcon = document.getElementById('shutter-icon');
            if (shutterToggle && shutterContent) {
                const shutterText = shutterToggle.querySelector('span');
                shutterToggle.addEventListener('click', () => {
                    const isOpen = shutterContent.classList.toggle('is-open');
                    shutterToggle.classList.toggle('is-open', isOpen);
                    if (shutterIcon) shutterIcon.classList.toggle('rotate-180', isOpen);
                    if (shutterText) shutterText.textContent = isOpen ? '학습 가이드 닫기' : '학습 가이드 보기';
                });
            }

            /* 시작/일시정지 */
            bindEvent('pauseBtn', 'click', () => {
                if (!sysState.isStarted) { sysState.isStarted = true; sysState.isPaused = false; startLoop(); }
                else { sysState.isPaused = !sysState.isPaused; sysState.isPaused ? stopLoop() : startLoop(); }
                updateUIState(); draw();
            });

            /* 리셋 */
            bindEvent('resetBtn', 'click', () => { initSimulation(); });

            /* 퀴즈 */
            function stabilizeQuizLayout() {
                if (!CONTENT_CONFIG.quizzes?.length) return;
                const quizBox = document.getElementById('quizBox');
                const modal = quizBox?.querySelector('.modal-container');
                const qEl = document.getElementById('questionText');
                const answerArea = document.getElementById('answerArea');
                const aEl = document.getElementById('answerText');
                const showBtn = document.getElementById('showAnswerBtn');
                if (!quizBox || quizBox.classList.contains('hidden') || !modal || !qEl || !answerArea || !aEl || !showBtn) return;

                const currentQuestion = qEl.textContent;
                const currentAnswer = aEl.textContent;
                const answerWasHidden = aEl.classList.contains('hidden');
                const buttonWasHidden = showBtn.classList.contains('hidden');
                modal.style.height = '';
                qEl.style.height = '';
                answerArea.style.height = '';
                answerArea.style.flex = '';
                answerArea.style.minHeight = '';

                let maxQuestionHeight = 0;
                CONTENT_CONFIG.quizzes.forEach(({ q }) => {
                    qEl.textContent = q;
                    maxQuestionHeight = Math.max(maxQuestionHeight, qEl.getBoundingClientRect().height);
                });
                showBtn.classList.add('hidden');
                aEl.classList.remove('hidden');
                let maxAnswerHeight = 0;
                CONTENT_CONFIG.quizzes.forEach(({ a }) => {
                    aEl.textContent = a;
                    maxAnswerHeight = Math.max(maxAnswerHeight, aEl.getBoundingClientRect().height);
                });
                showBtn.classList.remove('hidden');
                maxAnswerHeight = Math.max(maxAnswerHeight, showBtn.getBoundingClientRect().height);
                qEl.style.height = `${Math.ceil(maxQuestionHeight)}px`;
                const answerStyle = getComputedStyle(answerArea);
                const answerPadding = (parseFloat(answerStyle.paddingTop) || 0) + (parseFloat(answerStyle.paddingBottom) || 0);
                answerArea.style.minHeight = `${Math.ceil(maxAnswerHeight + answerPadding)}px`;
                const fixedModalHeight = Math.ceil(modal.getBoundingClientRect().height);

                qEl.textContent = currentQuestion;
                aEl.textContent = currentAnswer;
                aEl.classList.toggle('hidden', answerWasHidden);
                showBtn.classList.toggle('hidden', buttonWasHidden);
                qEl.style.height = '';
                answerArea.style.minHeight = '';
                modal.style.height = `${fixedModalHeight}px`;
            }

            function updateQuizUI() {
                if (!CONTENT_CONFIG.quizzes?.length) return;
                const q = CONTENT_CONFIG.quizzes[sysState.currentQuizIndex];
                const stepEl = document.getElementById('quizStep');
                const qEl = document.getElementById('questionText');
                const aEl = document.getElementById('answerText');
                const showBtn = document.getElementById('showAnswerBtn');
                const prevBtn = document.getElementById('prevQuizBtn');
                const nextBtn = document.getElementById('nextQuizBtn');
                if (stepEl) stepEl.textContent = `질문 ${sysState.currentQuizIndex + 1} / ${CONTENT_CONFIG.quizzes.length}`;
                if (qEl) qEl.textContent = q.q;  /* 줄바꿈은 CSS pre-wrap으로 (innerText는 높이 맞춤 때 줄바꿈이 사라짐) */
                if (aEl) { aEl.textContent = q.a; aEl.classList.add('hidden'); }
                if (showBtn) showBtn.classList.remove('hidden');
                if (prevBtn) prevBtn.disabled = sysState.currentQuizIndex === 0;
                if (nextBtn) nextBtn.disabled = sysState.currentQuizIndex === CONTENT_CONFIG.quizzes.length - 1;
            }
            bindEvent('quizBtn', 'click', () => { sysState.currentQuizIndex = 0; updateQuizUI(); toggleModal('quizBox', true); requestAnimationFrame(stabilizeQuizLayout); });
            bindEvent('showAnswerBtn', 'click', () => { document.getElementById('answerText')?.classList.remove('hidden'); document.getElementById('showAnswerBtn')?.classList.add('hidden'); });
            bindEvent('nextQuizBtn', 'click', () => { if (sysState.currentQuizIndex < CONTENT_CONFIG.quizzes.length - 1) { sysState.currentQuizIndex++; updateQuizUI(); } });
            bindEvent('prevQuizBtn', 'click', () => { if (sysState.currentQuizIndex > 0) { sysState.currentQuizIndex--; updateQuizUI(); } });
            window.addEventListener('resize', debounce(stabilizeQuizLayout, 100));

            /* 캔버스 포인터 — 단원별 조작은 ZONE F의 onCanvasPointer(type, pos, e)에서 처리 */
            if (canvas) {
                const getPos = (clientX, clientY) => {
                    const r = canvas.getBoundingClientRect();
                    return {
                        x: (clientX - r.left) * (sysState.canvasLogicalWidth / r.width),
                        y: (clientY - r.top) * (sysState.canvasLogicalHeight / r.height)
                    };
                };
                const emit = (type, e) => {
                    if (typeof onCanvasPointer === 'function') onCanvasPointer(type, getPos(e.clientX, e.clientY), e);
                };
                canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); emit('down', e); });
                canvas.addEventListener('pointermove', (e) => emit('move', e));
                const pointerUp = (e) => {
                    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
                    emit('up', e);
                    updateUIState();
                };
                canvas.addEventListener('pointerup', pointerUp);
                canvas.addEventListener('pointercancel', pointerUp);
            }

            /* 캔버스 상단 탭 */
            const shapeTabsDOM = document.getElementById('shapeTabs');
            if (shapeTabsDOM) {
                const updateTabScrollIndicators = () => {
                    const leftInd = document.getElementById('tabScrollLeft');
                    const rightInd = document.getElementById('tabScrollRight');
                    if (!leftInd || !rightInd) return;
                    const maxSL = shapeTabsDOM.scrollWidth - shapeTabsDOM.clientWidth;
                    leftInd.classList.toggle('opacity-0', shapeTabsDOM.scrollLeft <= 1);
                    leftInd.classList.toggle('pointer-events-none', shapeTabsDOM.scrollLeft <= 1);
                    leftInd.classList.toggle('opacity-100', shapeTabsDOM.scrollLeft > 1);
                    rightInd.classList.toggle('opacity-0', Math.ceil(shapeTabsDOM.scrollLeft) >= maxSL - 1 || maxSL <= 0);
                    rightInd.classList.toggle('pointer-events-none', Math.ceil(shapeTabsDOM.scrollLeft) >= maxSL - 1 || maxSL <= 0);
                    rightInd.classList.toggle('opacity-100', Math.ceil(shapeTabsDOM.scrollLeft) < maxSL - 1 && maxSL > 0);
                };
                shapeTabsDOM.addEventListener('scroll', updateTabScrollIndicators);
                window.addEventListener('resize', debounce(updateTabScrollIndicators, 100));
                setTimeout(updateTabScrollIndicators, 150);

                bindEvent('btnScrollLeft', 'click', () => { shapeTabsDOM.scrollBy({ left: -120, behavior: 'smooth' }); });
                bindEvent('btnScrollRight', 'click', () => { shapeTabsDOM.scrollBy({ left: 120, behavior: 'smooth' }); });

                let isDownTab = false, startXTab = 0, scrollLeftTab = 0;
                shapeTabsDOM.addEventListener('mousedown', (e) => { isDownTab = true; startXTab = e.pageX - shapeTabsDOM.offsetLeft; scrollLeftTab = shapeTabsDOM.scrollLeft; });
                shapeTabsDOM.addEventListener('mouseleave', () => isDownTab = false);
                shapeTabsDOM.addEventListener('mouseup', () => isDownTab = false);
                shapeTabsDOM.addEventListener('mousemove', (e) => { if (!isDownTab) return; e.preventDefault(); shapeTabsDOM.scrollLeft = scrollLeftTab - (e.pageX - shapeTabsDOM.offsetLeft - startXTab) * 1.5; });

                const tabBtns = shapeTabsDOM.querySelectorAll('.tab-btn');
                shapeTabsDOM.addEventListener('click', (e) => {
                    const target = e.target.closest('.tab-btn');
                    if (!target || (sysState.isStarted && !sysState.isPaused)) return;
                    const newShape = target.getAttribute('data-shape');
                    if (simData.shape === newShape) return;
                    saveTabState(simData.shape);
                    tabBtns.forEach(b => { b.classList.remove('border-indigo-600', 'text-indigo-600', 'bg-white'); b.classList.add('border-transparent', 'text-slate-500', 'bg-transparent', 'desktop-only:hover:bg-slate-200/50'); });
                    target.classList.remove('border-transparent', 'text-slate-500', 'bg-transparent', 'desktop-only:hover:bg-slate-200/50');
                    target.classList.add('border-indigo-600', 'text-indigo-600', 'bg-white');
                    simData.shape = newShape;
                    loadTabState(simData.shape);
                });
            }

            /* 전체화면 마우스 오버 */
            let fullscreenHoverTimer;
            document.addEventListener('mousemove', (e) => {
                if (!document.fullscreenElement) return;
                const exitUI = document.getElementById('fullscreen-exit-ui'); if (!exitUI) return;
                if (e.clientY < 80) { exitUI.classList.remove('opacity-0'); exitUI.classList.add('opacity-100'); clearTimeout(fullscreenHoverTimer); }
                else { clearTimeout(fullscreenHoverTimer); fullscreenHoverTimer = setTimeout(() => { exitUI.classList.remove('opacity-100'); exitUI.classList.add('opacity-0'); }, 10); }
            });
        }
        /* ════ ZONE J 끝 ════════════════════════════════════════════════════════ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE K — 초기 실행 (수정 금지)
           ════════════════════════════════════════════════════════════════════════ */
        const resizeObserver = new ResizeObserver(() => resizeCanvas());

        window.addEventListener('load', () => {
            if (container) resizeObserver.observe(container);
            bindCoreEvents();   /* 🚫 코어 이벤트 바인딩 */
            bindInputEvents();  /* ✏️ 입력 이벤트 바인딩 (ZONE I) */
            initSimulation();   /* ✏️ 시뮬레이션 초기화  (ZONE F) */
        });
        /* ════ ZONE K 끝 ════════════════════════════════════════════════════════ */
    </script>
</body>

</html>
