<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>용해도</title><!-- JS의 CONTENT_CONFIG.title로 자동 변경됩니다 -->

    <!-- ════════════════════════════════════════════════════════
         🚫 [수정 금지] 핵심 라이브러리 — KaTeX · Tailwind CSS
         ════════════════════════════════════════════════════════ -->
    <link rel="icon" href="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_short.png"
        type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ════════════════════════════════════════════════════════
         ⚙️  [선택 수정] Tailwind 테마 — 브랜드 색상·폰트만 변경
         ════════════════════════════════════════════════════════ -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: { 'desktop-only': { 'raw': '(hover: hover) and (pointer: fine)' } },
                    colors: { primary: '#4f46e5' },   /* ✏️ 브랜드 색상 */
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] }
                }
            }
        }
    </script>
    <script>
        /* 모바일에서 생략되는 number 스피너만 보완하고 PC 네이티브 UI는 유지 */
        const isIPadDevice =
            /iPad/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isMobileNumberUI =
            navigator.userAgentData?.mobile === true ||
            /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
            isIPadDevice;
        if (isMobileNumberUI) document.documentElement.classList.add('mobile-number-controls');
    </script>

    <style>
        html,
        body,
        button,
        input,
        select,
        textarea {
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* ════════════════════════════════════════════════════════
           ⚙️  [선택 수정] CSS 변수 — 전체 색상·폰트 크기 일괄 조정
           ════════════════════════════════════════════════════════ */
        :root {
            /* 폰트 크기 */
            --font-size-title: 1.275rem;
            --font-size-modal: 1.15rem;
            --font-size-guide: 1.025rem;
            --font-size-desc: 1rem;
            --font-size-small: 0.9rem;
            --font-size-tiny: 0.75rem;

            /* 텍스트 색상 */
            --color-text-main: #334155;
            --color-text-sub: #475569;
            --color-text-light: #64748b;

            /* 테마 포인트 색상 */
            --color-primary: #4f46e5;
            /* ✏️ 메인 포인트 색상 */
            --color-primary-bg: #e0e7ff;
            --color-tab-bg: #d8e0ff80;
            --color-action: #059669;
            --color-action-hover: #047857;
            --color-pause: #e11d48;
            --color-pause-bg: #fff1f2;
            --color-pause-border: #fecdd3;
            --color-obs1: #ea580c;
        }

        /* ════════════════════════════════════════════════════════
           ⚙️  [선택 수정] 디자인 클래스 매핑 — CSS 변수를 UI 요소에 적용
           ════════════════════════════════════════════════════════ */
        .sim-title {
            font-size: var(--font-size-title);
            font-weight: 700;
            color: var(--color-text-main);
            line-height: 1.25;
        }

        .guide-on-off {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: var(--color-text-light);
        }

        .guide-title {
            font-size: var(--font-size-guide);
            color: var(--color-primary);
            font-weight: 700;
        }

        .guide-desc {
            font-size: var(--font-size-desc);
            color: var(--color-text-sub);
        }

        .env-text {
            font-weight: 700;
            color: var(--color-text-light);
            font-size: var(--font-size-tiny);
        }

        .tab-btn {
            font-weight: 700;
            color: var(--color-text-light);
            font-size: var(--font-size-small);
        }

        @media (min-width: 768px) {
            .env-text {
                font-size: var(--font-size-small);
            }
        }

        .helper-text-default {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .helper-text-running {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-pause);
        }

        .helper-text-paused {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .var-label-control {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-text-main);
        }

        .var-label-obs1 {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-obs1);
        }

        .var-label-obs2 {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-action);
        }

        .var-label-var {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: var(--color-text-main);
        }

        .slider-limit-label {
            font-size: var(--font-size-tiny);
            font-weight: 500;
            color: #94a3b8;
        }

        .var-unit-display {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: var(--color-primary);
            background-color: var(--color-primary-bg);
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
        }

        .select-option-text {
            font-size: var(--font-size-tiny);
            font-weight: 700;
            color: var(--color-text-sub);
        }

        .header-button {
            background-color: #fff;
            color: var(--color-text-sub);
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (hover: hover) and (pointer: fine) {
            .header-button:hover {
                background-color: #f1f5f9;
            }
        }

        .btn-action-start {
            background-color: var(--color-action);
            color: #fff;
            border-color: var(--color-action-hover);
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-action-start:hover {
                background-color: var(--color-action-hover);
            }
        }

        .btn-action-pause {
            background-color: var(--color-pause-bg);
            color: var(--color-pause);
            border-color: var(--color-pause-border);
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        .btn-sub {
            background-color: #fff;
            color: var(--color-text-main);
            border-color: #cbd5e1;
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-sub:hover {
                background-color: #f1f5f9;
            }
        }

        .btn-reset-custom {
            color: var(--color-text-main);
            border-color: #cbd5e1;
            font-weight: 700;
            font-size: var(--font-size-small);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-reset-custom:hover {
                color: var(--color-pause);
                border-color: #fda4af;
                background-color: var(--color-pause-bg);
            }
        }

        .modal-title {
            font-size: var(--font-size-modal);
            font-weight: 700;
            color: #1e293b;
        }

        .modal-close-btn {
            color: #94a3b8;
        }

        @media (hover: hover) and (pointer: fine) {
            .modal-close-btn:hover {
                color: #f43f5e;
            }
        }

        .concept-title-1 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #c2410c;
        }

        .concept-title-2 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #047857;
        }

        .concept-title-3 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #4338ca;
        }

        .concept-title-4 {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #6e0478;
        }

        .concept-desc {
            font-size: var(--font-size-desc);
            color: var(--color-text-main);
        }

        .quiz-step {
            font-size: var(--font-size-small);
            font-weight: 700;
            color: #4338ca;
            background-color: var(--color-primary-bg);
        }

        .quiz-question {
            font-size: var(--font-size-modal);
            font-weight: 700;
            color: #1e293b;
            white-space: pre-wrap; /* 질문·보기 줄바꿈과 보기 사이 공백 유지 */
        }

        .quiz-btn-check {
            font-size: var(--font-size-desc);
            font-weight: 700;
            color: #fff;
            background-color: #f97316;
            border: 1px solid #f97316;
            line-height: 1.5rem;
        }

        @media (hover: hover) and (pointer: fine) {
            .quiz-btn-check:hover {
                background-color: #ea580c;
                border-color: #ea580c;
            }
        }

        .quiz-answer-box {
            font-size: var(--font-size-guide);
            font-weight: 700;
            line-height: 1.5rem;
            color: var(--color-text-main);
            background-color: #f8fafc;
            border-color: #e2e8f0;
            white-space: pre-line; /* 정답·해설 줄바꿈 유지 */
        }

        .header-button:is(.is-tap-feedback, .is-pen-hover),
        .btn-sub:is(.is-tap-feedback, .is-pen-hover),
        .zoom-btn:is(.is-tap-feedback, .is-pen-hover),
        .nav-btn:is(.is-tap-feedback, .is-pen-hover),
        #customSelectTrigger:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #f1f5f9;
        }

        .btn-action-start:is(.is-tap-feedback, .is-pen-hover) {
            background-color: var(--color-action-hover);
        }

        .btn-reset-custom:is(.is-tap-feedback, .is-pen-hover) {
            color: var(--color-pause);
            border-color: #fda4af;
            background-color: var(--color-pause-bg);
        }

        .modal-close-btn:is(.is-tap-feedback, .is-pen-hover) {
            color: #f43f5e;
        }

        .quiz-btn-check:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #ea580c;
        }

        .tab-btn:not(.border-indigo-600):is(.is-tap-feedback, .is-pen-hover) {
            background-color: rgb(226 232 240 / 0.5);
        }

        .radio-label:not(:has(:checked)):is(.is-tap-feedback, .is-pen-hover),
        .panel-block label:has(input[type="checkbox"]):is(.is-tap-feedback, .is-pen-hover) {
            background-color: #f8fafc;
        }

        @media (hover: hover) and (pointer: fine) {
            .radio-label:not(:has(:checked)):hover {
                background-color: #f8fafc;
            }
        }

        #customSelectList [role="option"]:is(.is-tap-feedback, .is-pen-hover) {
            background-color: #eef2ff;
        }

        /* PC·모바일에서 동일한 숫자 입력 스피너를 고정 노출 */
        .ratio-number-field {
            display: flex;
            flex: 1 1 0%;
            min-width: 0;
            position: relative;
        }

        .ratio-number-stepper {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            width: 2.5rem;
            justify-content: center;
            gap: 0;
        }

        .ratio-step-btn {
            display: flex;
            flex: 1 1 50%;
            min-height: 0;
            width: 100%;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 0.15rem;
            background-color: transparent;
            color: #737373;
            line-height: 1;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .ratio-step-icon {
            width: 0.66rem;
            height: 0.48rem;
            fill: currentColor;
        }

        .ratio-step-btn[data-step-direction="up"] .ratio-step-icon {
            transform: translateY(0.1875rem);
        }

        .ratio-step-btn[data-step-direction="down"] .ratio-step-icon {
            transform: translateY(-0.1875rem);
        }

        .ratio-step-btn:active {
            background-color: transparent;
            color: #475569;
        }

        .ratio-step-btn:focus {
            background-color: transparent;
        }

        .ratio-step-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .ratio-number-field>.input-text {
            appearance: textfield;
            -moz-appearance: textfield;
            padding-right: 2.75rem;
            background-color: transparent;
            transition: border-color 150ms ease;
        }

        .ratio-number-field>.input-text::-webkit-inner-spin-button,
        .ratio-number-field>.input-text::-webkit-outer-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }

        .ratio-number-field:has(>.ratio-number-stepper>.ratio-step-btn:active)>.input-text,
        .ratio-number-field:has(>.ratio-number-stepper>.ratio-step-btn.is-tap-feedback)>.input-text {
            border-color: #6366f1;
        }

        /* iOS Safari는 16px 미만 입력창에 포커스할 때 화면을 자동 확대한다. */
        @supports (-webkit-touch-callout: none) {
            html.mobile-number-controls input[type="number"] {
                font-size: 16px !important;
            }

            .radio-label>.select-option-text {
                white-space: nowrap;
            }
        }

        /* ════════════════════════════════════════════════════════
           🚫 [수정 금지] 코어 레이아웃 구조 — 전체화면·캔버스·스크롤
           ════════════════════════════════════════════════════════ */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html,
        body {
            overscroll-behavior: none;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-size: 16px !important;
        }

        .ui-box {
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
        }

        .shutter-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shutter-wrapper.is-open {
            grid-template-rows: 1fr;
        }

        .shutter-inner {
            overflow: hidden;
        }

        @media (hover: none),
        (pointer: coarse) {

            input,
            textarea,
            select,
            button,
            [role="button"],
            [contenteditable="true"] {
                touch-action: manipulation;
            }

            .nav-btn,
            .header-button,
            .btn-sub,
            .btn-reset-custom,
            .modal-close-btn {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }

            .nav-btn:is(:active, .is-tap-feedback),
            .header-button:is(:active, .is-tap-feedback),
            .btn-sub:is(:active, .is-tap-feedback) {
                background-color: #f1f5f9;
            }

            .btn-reset-custom:is(:active, .is-tap-feedback) {
                color: var(--color-pause);
                border-color: #fda4af;
                background-color: var(--color-pause-bg);
            }

            .modal-close-btn:is(:active, .is-tap-feedback) {
                color: #f43f5e;
            }

            #fullscreen-btn:is(:active, .is-tap-feedback),
            #fullscreen-btn-mobile:is(:active, .is-tap-feedback) {
                background-color: #f1f5f9;
            }
        }

        canvas {
            touch-action: none;
            cursor: default;
        }

        .bar-track {
            width: 100%;
            height: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }

        .popup-overlay {
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
        }

        #workspace:fullscreen {
            background-color: #f8fafc;
            padding: 1rem;
            overflow-y: auto;
        }

        @media (orientation: landscape) {
            #workspace:fullscreen {
                padding: 1rem;
                overflow-y: hidden;
            }
        }
    </style>

    <!-- 🚫 [수정 금지] Tailwind 컴포넌트 추출 -->
    <style type="text/tailwindcss">
        @layer components {
            .panel-block      { @apply flex flex-col gap-2 p-3 border border-slate-200 rounded-lg bg-white; }
            .modal-container  { @apply bg-white border border-slate-300 rounded-2xl w-full flex flex-col relative shadow-2xl max-h-[70dvh]; }
            .modal-header     { @apply h-14 lg:h-16 px-6 border-b border-slate-100 flex items-center justify-between flex-none; }
            .modal-body       { @apply flex-1 overflow-y-auto p-4 lg:p-6 flex flex-col gap-4; }
            .guide-block      { @apply p-4 bg-slate-50 border border-slate-200 rounded-xl; }
            .zoom-btn         { @apply w-8 h-8 flex items-center justify-center bg-white border border-slate-300 rounded-full shadow-sm text-slate-600 font-bold desktop-only:hover:bg-slate-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed desktop-only:disabled:hover:bg-slate-50; }
            .nav-btn          { @apply w-12 h-12 flex items-center justify-center bg-white border border-slate-300 text-slate-600 rounded-full desktop-only:hover:bg-slate-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed desktop-only:disabled:hover:bg-slate-50; }
            .radio-label      { @apply flex items-start gap-2 p-2 border border-slate-200 rounded bg-white cursor-pointer transition-colors has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 has-[:disabled]:opacity-50 has-[:disabled]:cursor-not-allowed; }
            .input-text       { @apply w-full p-2 border border-slate-200 rounded text-center focus:outline-none focus:border-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-slate-50; }
        }
    </style>
</head>

<!-- ════════════════════════════════════════════════════════════════════
     🚫 [수정 금지] BODY — 레이아웃 클래스 수정 금지
     ════════════════════════════════════════════════════════════════════ -->

<body
    class="bg-slate-100 text-slate-800 font-sans w-full m-0 p-0 box-border select-none overflow-x-hidden md:overflow-hidden landscape:overflow-hidden flex flex-col justify-center md:h-[100dvh] landscape:h-[100dvh]">

    <div
        class="flex flex-col w-full max-w-[1680px] mx-auto p-2 gap-2 box-border md:h-[100dvh] md:overflow-hidden landscape:h-[100dvh] landscape:overflow-hidden relative">

        <!-- ═══════════════════════════════════════════════════════════════
         🚫 [수정 금지] 헤더 — 제목은 JS CONTENT_CONFIG.title로 자동 주입
         ═══════════════════════════════════════════════════════════════ -->
        <header class="ui-box flex-none px-4 py-2 flex items-center justify-between z-10 bg-white relative">
            <div class="flex items-center gap-4">
                <a href="https://www.tsherpa.co.kr" target="_blank"
                    class="flex items-center flex-none desktop-only:hover:opacity-80 transition-opacity">
                    <img src="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_black.png"
                        alt="T셀파"
                        class="h-7 md:h-8 object-contain draggable-false flex-none hidden [@media(min-width:768px)]:block">
                    <img src="https://cdata2.tsherpa.co.kr/tsherpa/Tsherpa2021/mh/vibe/00_common/images/t_logo_short.png"
                        alt="T셀파"
                        class="h-7 md:h-8 object-contain draggable-false flex-none block [@media(min-width:768px)]:hidden">
                </a>
                <div class="border-l border-slate-300 pl-4">
                    <h1 class="sim-title" id="sim-title-el">로딩 중...</h1><!-- CONTENT_CONFIG.title 자동 주입 -->
                </div>
            </div>
            <div class="flex items-center relative">
                <button id="moreMenuBtn"
                    class="header-button flex landscape:hidden desktop-only:hidden transition-colors ml-2"
                    title="메뉴 더보기">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                    </svg>
                </button>
                <div class="hidden landscape:flex desktop-only:flex items-center">
                    <!-- 학습 가이드 -->
                    <button id="helpBtn" class="header-button desktop-only:md:hidden font-bold text-lg ml-2">

        const rnd = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
        const isRunning = () => sysState.isStarted && !sysState.isPaused;
        /* 확대 배율: 1440×900 화면의 캔버스 = 1, 0.75 ~ 1.5 */
        const uiScale = (w, h) => clamp(Math.min(w / 1080, h / 700), 0.75, 1.5);

        /* ── 용해도 계산 (표 사이 온도는 선형 보간) ─────────────────── */
        function solubility(key, T) {
            const ts = SIM_CONFIG.temps, s = SIM_CONFIG.solutes[key].s;
            const t = clamp(T, ts[0], ts[ts.length - 1]);
            for (let i = 0; i < ts.length - 1; i++) {
                if (t <= ts[i + 1]) return s[i] + (s[i + 1] - s[i]) * (t - ts[i]) / (ts[i + 1] - ts[i]);
            }
            return s[s.length - 1];
        }
        /* 판정: 넣은 양 m과 현재 온도의 용해도 S (소수 첫째 자리 기준) */
        function judge() {
            const key = simData.solute;
            const Td = round1(simData.T);
            const S = round1(solubility(key, Td));
            const m = simData.value1;
            const cmp = m < S - 1e-9 ? 'under' : (Math.abs(m - S) < 1e-9 ? 'equal' : 'over');
            return { key, name: SIM_CONFIG.solutes[key].name, Td, S, m, cmp, dissolved: Math.min(m, S), left: Math.max(0, round1(m - S)) };
        }
        /* 녹은 양·남은 가루·결정 갱신. 온도를 낮춰 녹은 양이 줄면 그만큼 결정(석출), 다시 녹을 때는 결정부터 녹는다 */
        function settle(dt, instant) {
            const st = judge();
            const diff = st.m - (simData.dis + simData.powder + simData.crys);
            if (diff > 1e-9) simData.powder += diff;
            else if (diff < -1e-9) {
                let r = -diff;
                ['powder', 'crys', 'dis'].forEach(k => { const a = Math.min(simData[k], r); simData[k] -= a; r -= a; });
            }
            const target = st.dissolved;
            const rate = SIM_CONFIG.rate.dissolve * dt;
            if (simData.dis < target - 1e-9) {
                const a = instant ? target - simData.dis : Math.min(target - simData.dis, rate);
                const fromCrys = Math.min(simData.crys, a);
                simData.crys -= fromCrys;
                simData.powder = Math.max(0, simData.powder - (a - fromCrys));
                simData.dis += a;
            } else if (simData.dis > target + 1e-9) {
                const a = instant ? simData.dis - target : Math.min(simData.dis - target, rate);
                simData.dis -= a;
                simData.crys += a;
            }
            ['dis', 'powder', 'crys'].forEach(k => { if (simData[k] < 1e-6) simData[k] = 0; });
        }
        function applyInstant() {
            simData.T = simData.tempTarget;
            settle(0, true);
        }

        /* ── 그리기 도우미 ─────────────────────────────────────────── */
        function rrect(x, y, w, h, r) {
            r = Math.max(0, Math.min(r, w / 2, h / 2));
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }
        function wrapLines(text, maxW) {
            const words = text.split(' ');
            const lines = [];
            let cur = '';
            words.forEach(wd => {
                const t = cur ? cur + ' ' + wd : wd;
                if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = wd; }
                else cur = t;
            });
            if (cur) lines.push(cur);
            return lines;
        }
        function haloText(text, x, y, lw) {
            ctx.save();
            ctx.lineJoin = 'round';
            ctx.lineWidth = lw || 3;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.strokeText(text, x, y);
            ctx.restore();
            ctx.fillText(text, x, y);
        }
        /* 둥근 라벨. align: 'left' | 'right' | 'center' (x 기준), 크기는 fs에 비례 */
        function pill(text, x, y, style, fs, align, weight) {
            ctx.save();
            ctx.font = `${weight || 700} ${fs}px ${FONT}`;
            const w = ctx.measureText(text).width + fs * 1.1, h = fs * 1.7;
            const x0 = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
            rrect(x0, y - h / 2, w, h, h / 2);
            ctx.fillStyle = style.bg; ctx.fill();
            if (style.border) { ctx.strokeStyle = style.border; ctx.lineWidth = Math.max(1, fs / 12); ctx.stroke(); }
            ctx.fillStyle = style.text; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, x0 + w / 2, y + fs * 0.05);
            ctx.restore();
            return { x0, w, h };
        }
        function pillWidth(text, fs, weight) {
            ctx.save();
            ctx.font = `${weight || 700} ${fs}px ${FONT}`;
            const w = ctx.measureText(text).width + fs * 1.1;
            ctx.restore();
            return w;
        }

        /* ── 비커 (앞 단원과 같은 그림, 설계 단위 201 × 248) ── */
        const BK = { w: 201, h: 248, cx: 103, rimY: 20, rimRy: 10, bot: 228, ry: 10, base: 240, inset: 1.8 };
        function bkWall(v, inset) {
            const t = (v - BK.rimY) / (BK.bot - BK.rimY);
            return { l: 17 + t * 6 + inset, r: 189 - t * 6 - inset };
        }
        function mkBox(x0, y0, k) { return { k, x0, y0, x: u => x0 + u * k, y: v => y0 + v * k }; }
        function beakerPath(B, vTop, inset) {
            const a = bkWall(vTop, inset), b = bkWall(BK.bot, inset);
            ctx.beginPath();
            ctx.moveTo(B.x(a.l), B.y(vTop));
            ctx.lineTo(B.x(b.l), B.y(BK.bot));
            ctx.ellipse(B.x((b.l + b.r) / 2), B.y(BK.bot), (b.r - b.l) / 2 * B.k, Math.max(1, BK.ry - inset * 0.5) * B.k, 0, Math.PI, 0, true);
            ctx.lineTo(B.x(a.r), B.y(vTop));
            ctx.closePath();
        }
        function surfaceEllipse(B, v, color) {
            const s = bkWall(v, BK.inset);
            ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, 1.2 * B.k);
            ctx.beginPath();
            ctx.ellipse(B.x((s.l + s.r) / 2), B.y(v), (s.r - s.l) / 2 * B.k, 4 * B.k, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        function drawBeakerBack(B) {
            ctx.save();
            beakerPath(B, BK.rimY, 0);
            ctx.fillStyle = GLASS.fill; ctx.fill();
            const b = bkWall(BK.bot, 0);
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)'; ctx.lineWidth = Math.max(1, B.k);
            ctx.beginPath();
            ctx.ellipse(B.x((b.l + b.r) / 2), B.y(BK.bot), (b.r - b.l) / 2 * B.k, BK.ry * B.k, 0, Math.PI, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        function drawBeakerFront(B) {
            const a = bkWall(BK.rimY, 0), b = bkWall(BK.bot, 0);
            const lw = Math.max(1.2, 1.6 * B.k + 0.4);
            ctx.save();
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.strokeStyle = GLASS.hi; ctx.lineWidth = Math.max(1.5, 4 * B.k);
            ctx.beginPath(); ctx.moveTo(B.x(bkWall(50, 0).l + 12), B.y(50)); ctx.lineTo(B.x(bkWall(200, 0).l + 12), B.y(200)); ctx.stroke();
            ctx.lineWidth = Math.max(1, 2 * B.k);
            ctx.beginPath(); ctx.moveTo(B.x(bkWall(60, 0).l + 22), B.y(60)); ctx.lineTo(B.x(bkWall(140, 0).l + 22), B.y(140)); ctx.stroke();
            ctx.strokeStyle = GLASS.line; ctx.lineWidth = lw;
            ctx.beginPath();
            ctx.moveTo(B.x(a.l), B.y(BK.rimY)); ctx.lineTo(B.x(b.l), B.y(BK.bot));
            ctx.moveTo(B.x(a.r), B.y(BK.rimY)); ctx.lineTo(B.x(b.r), B.y(BK.bot));
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(B.x((b.l + b.r) / 2), B.y(BK.bot), (b.r - b.l) / 2 * B.k, BK.ry * B.k, 0, 0, Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(B.x((a.l + a.r) / 2), B.y(BK.rimY), (a.r - a.l) / 2 * B.k, BK.rimRy * B.k, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.lineWidth = Math.max(1, lw * 0.6);
            ctx.beginPath();
            ctx.ellipse(B.x((a.l + a.r) / 2), B.y(BK.rimY + 2), (a.r - a.l) / 2 * B.k - 3 * B.k, (BK.rimRy - 1.5) * B.k, 0, 0, Math.PI);
            ctx.stroke();
            ctx.lineWidth = lw;
            ctx.beginPath();
            ctx.moveTo(B.x(a.l + 14), B.y(BK.rimY - 8));
            ctx.quadraticCurveTo(B.x(a.l - 4), B.y(BK.rimY - 9), B.x(a.l - 9), B.y(BK.rimY - 3));
            ctx.quadraticCurveTo(B.x(a.l - 4), B.y(BK.rimY + 3), B.x(a.l + 2), B.y(BK.rimY + 6));
            ctx.stroke();
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.8)'; ctx.lineWidth = Math.max(1, B.k);
            for (let v = 90; v <= 210; v += 30) {
                const r = bkWall(v, 0).r;
                ctx.beginPath(); ctx.moveTo(B.x(r - 30), B.y(v)); ctx.lineTo(B.x(r - 12), B.y(v)); ctx.stroke();
            }
            ctx.restore();
        }

        /* ── 실험 장치 (설계 단위: 가로 0~480, 세로 20~418) ──────────
           왼쪽 스탠드 + 온도 센서, 가운데 비커(물 100 g) + 핫플레이트, 오른쪽 이름 칸 */
        const SCENE = { x0: 0, x1: 480, y0: 20, y1: 418, cx0: 86, cx1: 316 };
        const APP = { cx: 200, plateTop: 352, tableY: 413, rodX: 40, armY: 96, probeX: 252, probeTip: 318, waterV: 70, labelX: 338 };
        const BX0 = APP.cx - BK.cx;
        const BY0 = APP.plateTop + 1 - BK.base;

        function drawStand(L) {
            const X = L.X, Y = L.Y, S = L.S;
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = Math.max(1, S);
            ctx.beginPath(); ctx.moveTo(X(SCENE.x0), Y(APP.tableY)); ctx.lineTo(X(SCENE.x1), Y(APP.tableY)); ctx.stroke();
            ctx.lineWidth = Math.max(1, 1.2 * S);
            ctx.fillStyle = GLASS.metalDark; ctx.strokeStyle = GLASS.metalLine;
            rrect(X(8), Y(APP.tableY - 12), 96 * S, 12 * S, 3 * S); ctx.fill(); ctx.stroke();
            ctx.fillStyle = GLASS.metal; ctx.strokeStyle = GLASS.line;
            rrect(X(APP.rodX), Y(28), 9 * S, (APP.tableY - 12 - 28 + 1) * S, 3 * S); ctx.fill(); ctx.stroke();
        }
        /* 핫플레이트: 납작한 본체 + 위 원판, 가열 중이면 원판 테두리 주황 + 빨간 표시등 */
        function drawHotplate(L, on) {
            const X = L.X, Y = L.Y, S = L.S;
            ctx.save();
            ctx.lineWidth = Math.max(1, 1.5 * S);
            ctx.fillStyle = '#94a3b8';
            rrect(X(109), Y(407), 16 * S, 6 * S, 2 * S); ctx.fill();
            rrect(X(275), Y(407), 16 * S, 6 * S, 2 * S); ctx.fill();
            ctx.fillStyle = '#f8fafc'; ctx.strokeStyle = GLASS.line;
            rrect(X(93), Y(361), 214 * S, 47 * S, 9 * S); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#eef2f6';
            rrect(X(103), Y(373), 194 * S, 27 * S, 6 * S); ctx.fill();
            ctx.fillStyle = '#334155';
            ctx.beginPath(); ctx.arc(X(139), Y(386.5), 9 * S, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = Math.max(1, 1.5 * S);
            ctx.beginPath(); ctx.moveTo(X(139), Y(386.5)); ctx.lineTo(X(139), Y(379)); ctx.stroke();
            ctx.fillStyle = on ? '#ef4444' : '#cbd5e1';
            ctx.beginPath(); ctx.arc(X(269), Y(386.5), 3.5 * S, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#64748b';
            ctx.strokeStyle = on ? '#fdba74' : '#475569';
            ctx.lineWidth = on ? Math.max(2, 3.2 * S) : Math.max(1, 1.2 * S);
            rrect(X(107), Y(APP.plateTop), 186 * S, 10 * S, 4 * S); ctx.fill(); ctx.stroke();
            ctx.restore();
        }
        /* 온도 센서: 집게로 잡은 가는 막대 + 위 측정 장치(현재 온도 표시) */
        function drawSensor(L) {
            const X = L.X, Y = L.Y, S = L.S, px = APP.probeX;
            ctx.save();
            ctx.lineWidth = Math.max(1, S);
            ctx.fillStyle = GLASS.metal; ctx.strokeStyle = GLASS.metalLine;
            rrect(X(px - 2.2), Y(84), 4.4 * S, (APP.probeTip - 84) * S, 2 * S); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#94a3b8';
            rrect(X(px - 2.2), Y(APP.probeTip - 14), 4.4 * S, 14 * S, 2 * S); ctx.fill();
            /* 집게 */
            ctx.lineWidth = Math.max(1, 1.2 * S);
            ctx.fillStyle = GLASS.metal; ctx.strokeStyle = GLASS.line;
            rrect(X(APP.rodX), Y(APP.armY - 3.5), (px - 9 - APP.rodX) * S, 7 * S, 2 * S); ctx.fill(); ctx.stroke();
            ctx.fillStyle = GLASS.metalDark; ctx.strokeStyle = GLASS.metalLine;
            rrect(X(APP.rodX - 7), Y(APP.armY - 11), 23 * S, 22 * S, 3 * S); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(X(APP.rodX + 4.5), Y(APP.armY), 4 * S, 0, Math.PI * 2); ctx.stroke();
            rrect(X(px - 10), Y(APP.armY - 8), 20 * S, 16 * S, 3 * S); ctx.fill(); ctx.stroke();
            /* 측정 장치 */
            ctx.fillStyle = '#e0f2fe'; ctx.strokeStyle = '#0369a1'; ctx.lineWidth = Math.max(1, 1.4 * S);
            rrect(X(px - 18), Y(24), 36 * S, 60 * S, 7 * S); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#0f172a';
            rrect(X(px - 14), Y(32), 28 * S, 16 * S, 2.5 * S); ctx.fill();
            ctx.fillStyle = '#86efac';
            ctx.font = `700 ${Math.max(6, 9 * S)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(simData.T.toFixed(1), X(px), Y(40.5));
            ctx.strokeStyle = '#0369a1'; ctx.lineWidth = Math.max(1, S);
            ctx.beginPath(); ctx.arc(X(px), Y(66), 6 * S, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
        }
        /* 바닥의 고체 자리 (비커 단위) */
        function solidsGeom() {
            const p = simData.powder, c = simData.crys;
            const hasP = p > 0.05, hasC = c > 0.05;
            const W = hasP ? Math.min(150, 36 + Math.sqrt(p) * 9) : 0;
            const H = hasP ? Math.min(28, 3 + Math.sqrt(p) * 2.2) : 0;
            const ux = hasC ? BK.cx - 30 : BK.cx;
            return { hasP, hasC, W, H, ux, base: BK.bot + 5, top: Math.max(H, hasC ? 10 : 0) };
        }
        function crystalList() {
            const n = Math.min(26, Math.max(2, Math.ceil(simData.crys / 2.5)));
            const wb = bkWall(BK.bot, BK.inset);
            const list = [];
            for (let i = 0; i < n; i++) {
                const sz = 5 + rnd(i, 9) * 4;
                list.push({
                    u: wb.l + 16 + rnd(i, 7) * (wb.r - wb.l - 32),
                    v: BK.bot + 4 - sz * 0.45 - rnd(i, 8) * 4,
                    sz, ang: (rnd(i, 10) - 0.5) * 1.3
                });
            }
            return list;
        }
        function crystalPath(x, y, sz, ang, shape) {
            ctx.save();
            ctx.translate(x, y); ctx.rotate(ang);
            ctx.beginPath();
            if (shape === 'cube') ctx.rect(-sz * 0.55, -sz * 0.55, sz * 1.1, sz * 1.1);
            else if (shape === 'needle') {
                const Lh = sz * 1.5, Wh = sz * 0.45;
                ctx.moveTo(-Lh, 0); ctx.lineTo(-Lh + Wh, -Wh); ctx.lineTo(Lh - Wh, -Wh);
                ctx.lineTo(Lh, 0); ctx.lineTo(Lh - Wh, Wh); ctx.lineTo(-Lh + Wh, Wh); ctx.closePath();
            } else {
                ctx.moveTo(0, -sz * 0.75); ctx.lineTo(sz, 0); ctx.lineTo(0, sz * 0.75); ctx.lineTo(-sz, 0); ctx.closePath();
            }
            ctx.restore();
        }
        /* 입자 모형: 용매(물) 입자 사이에 녹은 용질 입자가 고르게 섞여 있다 */
        function drawParticles(B, sty, g) {
            const wb = bkWall(BK.bot, BK.inset);
            const uL = wb.l + 8, uR = wb.r - 8;
            const vT = APP.waterV + 10, vB = BK.bot - 2 - g.top;
            const jig = isRunning(), f = simData.frame;
            const dot = (i, seed, r, fill, line) => {
                let u = uL + rnd(i, seed) * (uR - uL), v = vT + rnd(i, seed + 1) * Math.max(4, vB - vT);
                if (jig) { u += Math.sin(f * 0.07 + i * 1.7) * 2.2; v += Math.cos(f * 0.06 + i * 2.3) * 2.2; }
                ctx.beginPath(); ctx.arc(B.x(u), B.y(v), Math.max(1, r * B.k), 0, Math.PI * 2);
                ctx.fillStyle = fill; ctx.fill();
                ctx.strokeStyle = line; ctx.lineWidth = Math.max(0.6, 0.8 * B.k); ctx.stroke();
            };
            for (let i = 0; i < 70; i++) dot(i, 1, 2.3, SOLVENT.fill, SOLVENT.line);
            const n = Math.round(Math.min(simData.dis, 250) / 2.5);
            for (let i = 0; i < n; i++) dot(i, 11, 3.3, sty.particle, sty.pLine);
        }
        function drawSolids(B, sty, g) {
            if (g.hasP) {
                const ux = g.ux, W = g.W, H = g.H, base = g.base;
                ctx.beginPath();
                ctx.moveTo(B.x(ux - W / 2), B.y(base));
                ctx.bezierCurveTo(B.x(ux - W * 0.28), B.y(base - H * 1.33), B.x(ux + W * 0.28), B.y(base - H * 1.33), B.x(ux + W / 2), B.y(base));
                ctx.closePath();
                ctx.fillStyle = sty.solid; ctx.fill();
                ctx.strokeStyle = sty.solidLine; ctx.lineWidth = Math.max(1, B.k); ctx.stroke();
                ctx.fillStyle = sty.solidLine;
                for (let i = 0; i < 18; i++) {
                    const t = rnd(i, 21) - 0.5;
                    const hh = H * (1 - 4 * t * t) * 0.8;
                    const gu = ux + t * W * 0.8, gv = base - 1.5 - rnd(i, 22) * Math.max(0, hh - 2);
                    ctx.beginPath(); ctx.arc(B.x(gu), B.y(gv), Math.max(0.6, 0.9 * B.k), 0, Math.PI * 2); ctx.fill();
                }
            }
            if (g.hasC) {
                crystalList().forEach(c => {
                    crystalPath(B.x(c.u), B.y(c.v), c.sz * B.k, c.ang, sty.shape);
                    ctx.fillStyle = sty.blue ? '#3b82f6' : '#ffffff'; ctx.fill();
                    ctx.strokeStyle = sty.blue ? '#1e3a8a' : '#64748b'; ctx.lineWidth = Math.max(0.8, 1.1 * B.k); ctx.stroke();
                });
            }
        }
        function solutionFill(key) {
            if (SUB_STYLE[key].blue) return `rgba(37, 99, 235, ${(0.1 + 0.45 * Math.min(1, simData.dis / 80)).toFixed(3)})`;
            return 'rgba(186, 230, 253, 0.4)';
        }
        /* 부품 이름 (오른쪽 칸, 지시선). 겹치면 아래로 민다 */
        function drawPartLabels(L, items, fs, ui) {
            ctx.save();
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            const tx = L.X(APP.labelX + 6);
            let prev = -Infinity;
            items.slice().sort((a, b) => a.ty - b.ty).forEach(it => {
                const ty = Math.max(L.Y(it.ty), prev + fs * 1.9);
                prev = ty;
                ctx.strokeStyle = COLORS.leader; ctx.lineWidth = Math.max(1, ui);
                ctx.beginPath(); ctx.moveTo(tx - 4 * ui, ty); ctx.lineTo(L.X(it.x), L.Y(it.y)); ctx.stroke();
                ctx.fillStyle = COLORS.leader;
                ctx.beginPath(); ctx.arc(L.X(it.x), L.Y(it.y), 2 * ui, 0, Math.PI * 2); ctx.fill();
                if (it.style) pill(it.text, tx, ty, it.style, fs, 'left');
                else {
                    ctx.font = `500 ${fs}px ${FONT}`; ctx.fillStyle = COLORS.text;
                    haloText(it.text, tx, ty, 3 * ui);
                }
            });
            ctx.restore();
        }

        function drawApparatus(L, ui, st) {
            const X = L.X, Y = L.Y, S = L.S, sty = SUB_STYLE[st.key];
            const running = isRunning();
            const heating = running && simData.T < simData.tempTarget - 0.01;
            const cooling = running && simData.T > simData.tempTarget + 0.01;
            const g = solidsGeom();
            ctx.save();
            if (L.crop) { ctx.beginPath(); ctx.rect(L.clip.x, L.clip.y, L.clip.w, L.clip.h); ctx.clip(); }
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            drawStand(L);
            drawHotplate(L, heating);
            const B = mkBox(X(BX0), Y(BY0), S);
            drawBeakerBack(B);
            ctx.save();
            beakerPath(B, APP.waterV, BK.inset);
            ctx.fillStyle = solutionFill(st.key); ctx.fill();
            ctx.clip();
            drawParticles(B, sty, g);
            drawSolids(B, sty, g);
            ctx.restore();
            surfaceEllipse(B, APP.waterV, sty.blue ? '#2563eb' : '#7dd3fc');
            drawSensor(L);
            drawBeakerFront(B);
            ctx.restore();

            /* 글자 (캔버스 배율 ui에 비례, 장치 칸을 넘지 않게) */
            const fs = Math.min(clamp(12.5 * ui, 9.5, 19), 15 * S);
            const fsSmall = Math.max(8, Math.min(fs, 13 * S));
            pill('물 100 g', B.x(BK.cx - 18), B.y(112), PILL_STYLE.tag, fsSmall, 'center');
            if (heating || cooling) pill(heating ? '가열 중' : '냉각 중', X(146), Y(60), heating ? PILL_STYLE.heat : PILL_STYLE.cool, fsSmall, 'center');
            if (L.showLabels) {
                const items = [
                    { text: '온도 센서', x: APP.probeX + 18, y: 50, ty: 50 },
                    { text: '핫플레이트', x: 300, y: 378, ty: 392 }
                ];
                if (st.m > 0) {
                    const stTxt = st.cmp === 'under' ? '불포화 용액' : '포화 용액';
                    items.push({ text: stTxt, x: BX0 + 172, y: 240, ty: 240, style: st.cmp === 'under' ? PILL_STYLE.unsat : PILL_STYLE.sat });
                }
                if (g.hasP) items.push({ text: '녹지 않은 용질', x: BX0 + g.ux + g.W * 0.2, y: BY0 + g.base - g.H * 0.5, ty: 316 });
                if (g.hasC) {
                    const cs = crystalList();
                    const c = cs.reduce((a, b) => (b.u > a.u ? b : a), cs[0]);
                    items.push({ text: '석출(결정이 생김)', x: BX0 + c.u, y: BY0 + c.v, ty: 338, style: PILL_STYLE.crys });
                }
                drawPartLabels(L, items, fs, ui);
            } else if (g.hasC) {
                pill('석출', B.x(BK.cx + 40), B.y(196), PILL_STYLE.crys, fsSmall, 'center');
            }
        }

        /* ── 용해도 곡선 그래프 ───────────────────────────────────── */
        function crossTemp(key, yMax) {
            const ts = SIM_CONFIG.temps, s = SIM_CONFIG.solutes[key].s;
            for (let i = 0; i < ts.length - 1; i++) {
                if (s[i] <= yMax && s[i + 1] > yMax) return ts[i] + (yMax - s[i]) / (s[i + 1] - s[i]) * (ts[i + 1] - ts[i]);
            }
            return null;
        }
        function drawGraph(G, ui, st) {
            if (G.w < 140 || G.h < 140) return;
            const compact = G.w < 340;
            const fs = clamp(12.5 * ui, 9.5, 19);
            const pad = (compact ? 9 : 14) * ui;
            const gcfg = SIM_CONFIG.graph;
            const sel = st.key;
            ctx.save();
            rrect(G.x, G.y, G.w, G.h, 12 * ui);
            ctx.fillStyle = COLORS.bg; ctx.fill();
            ctx.strokeStyle = COLORS.card; ctx.lineWidth = Math.max(1, 1.2 * ui); ctx.stroke();

            /* 머리: 제목 + 용매 표시 */
            let y = G.y + pad;
            ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
            if (!compact) {
                const hy = y + fs * 0.6;
                ctx.font = `700 ${fs * 1.1}px ${FONT}`; ctx.fillStyle = COLORS.text;
                ctx.fillText('용해도 곡선', G.x + pad, hy);
                const chip = '용매: 물 100 g';
                const cw = pillWidth(chip, fs * 0.92);
                pill(chip, G.x + G.w - pad - cw, hy, { bg: '#eef2ff', text: COLORS.primary, border: '#c7d2fe' }, fs * 0.92, 'left');
                y += fs * 1.2 + 10 * ui;
            }

            /* 범례 (선택한 물질은 굵게) */
            const keys = simData.showAll ? SIM_CONFIG.order : [sel];
            const seg = 18 * ui, rowH = fs + 8 * ui;
            const lx0 = G.x + pad;
            let lx = lx0, ly = y + fs / 2;
            keys.forEach(k => {
                const on = k === sel;
                ctx.font = `${on ? 700 : 500} ${fs}px ${FONT}`;
                const name = SIM_CONFIG.solutes[k].name;
                const iw = seg + 5 * ui + ctx.measureText(name).width + 14 * ui;
                if (lx + iw > G.x + G.w - pad + 12 * ui && lx > lx0) { lx = lx0; ly += rowH; }
                ctx.strokeStyle = SUB_STYLE[k].color; ctx.lineWidth = (on ? 3.5 : 2) * ui; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + seg, ly); ctx.stroke();
                ctx.fillStyle = on ? COLORS.text : COLORS.sub;
                ctx.fillText(name, lx + seg + 5 * ui, ly);
                lx += iw;
            });
            y = ly + fs / 2;

            /* 아래 출처 */
            const capFs = clamp(fs * 0.82, 8, 16);
            ctx.font = `500 ${capFs}px ${FONT}`;
            const capLines = wrapLines(SIM_CONFIG.source, G.w - 2 * pad);
            const capLh = capFs * 1.35, capH = capLines.length * capLh;
            ctx.fillStyle = COLORS.light; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            capLines.forEach((l, i) => ctx.fillText(l, G.x + pad, G.y + G.h - pad - capH + capLh * (i + 0.5)));

            /* 그림 영역 */
            ctx.font = `500 ${fs}px ${FONT}`;
            const numW = ctx.measureText('180').width;
            const topMargin = Math.max(14 * ui, fs * 0.95 + 8 * ui);
            const px0 = G.x + pad + fs + 6 * ui + numW + 6 * ui;
            const px1 = G.x + G.w - pad - 10 * ui;
            const py0 = y + topMargin;
            const xTitleH = compact ? 0 : fs + 6 * ui;
            const py1 = G.y + G.h - pad - capH - 6 * ui - (fs + 6 * ui) - xTitleH;
            if (px1 - px0 < 60 || py1 - py0 < 50) { ctx.restore(); return; }
            const sx = T => px0 + T / gcfg.tMax * (px1 - px0);
            const sy = v => py1 - v / gcfg.yMax * (py1 - py0);
            const curvePath = (k, from) => {
                for (let T = 0; T <= gcfg.tMax + 1e-9; T += 0.5) {
                    const p = [sx(T), sy(solubility(k, T))];
                    if (T === 0 && from) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
                }
            };

            /* 포화·불포화 영역 (선택한 물질 기준) */
            if (simData.showRegion) {
                ctx.save();
                ctx.beginPath(); ctx.rect(px0, py0, px1 - px0, py1 - py0); ctx.clip();
                ctx.beginPath(); ctx.moveTo(sx(0), sy(0)); curvePath(sel, false); ctx.lineTo(sx(gcfg.tMax), sy(0)); ctx.closePath();
                ctx.fillStyle = 'rgba(56, 189, 248, 0.15)'; ctx.fill();
                ctx.beginPath(); ctx.moveTo(sx(0), sy(gcfg.yMax)); curvePath(sel, false); ctx.lineTo(sx(gcfg.tMax), sy(gcfg.yMax)); ctx.closePath();
                ctx.fillStyle = 'rgba(251, 146, 60, 0.13)'; ctx.fill();
                ctx.restore();
            }

            /* 눈금선 */
            ctx.strokeStyle = COLORS.grid; ctx.lineWidth = Math.max(1, ui);
            ctx.beginPath();
            for (let T = gcfg.tStep; T <= gcfg.tMax + 1e-9; T += gcfg.tStep) { ctx.moveTo(sx(T), py0); ctx.lineTo(sx(T), py1); }
            for (let v = gcfg.yStep; v <= gcfg.yMax + 1e-9; v += gcfg.yStep) { ctx.moveTo(px0, sy(v)); ctx.lineTo(px1, sy(v)); }
            ctx.stroke();

            /* 축 */
            const aw = 4 * ui;
            ctx.strokeStyle = COLORS.axis; ctx.fillStyle = COLORS.axis; ctx.lineWidth = Math.max(1.2, 1.5 * ui);
            ctx.beginPath(); ctx.moveTo(px0, py1); ctx.lineTo(px0, py0 - 4 * ui); ctx.moveTo(px0, py1); ctx.lineTo(px1 + 6 * ui, py1); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px1 + 11 * ui, py1); ctx.lineTo(px1 + 3 * ui, py1 - aw); ctx.lineTo(px1 + 3 * ui, py1 + aw); ctx.closePath(); ctx.fill();
            ctx.fillStyle = COLORS.sub; ctx.font = `500 ${fs}px ${FONT}`;
            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            for (let v = 0; v <= gcfg.yMax + 1e-9; v += gcfg.yStep) ctx.fillText(String(v), px0 - 6 * ui, sy(v));
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            for (let T = gcfg.tLabelStep; T <= gcfg.tMax + 1e-9; T += gcfg.tLabelStep) ctx.fillText(String(T), sx(T), py1 + 6 * ui);
            ctx.font = `600 ${fs}px ${FONT}`; ctx.fillStyle = COLORS.text;
            if (!compact) {
                ctx.textAlign = 'right'; ctx.textBaseline = 'top';
                ctx.fillText('온도(℃)', px1 + 10 * ui, py1 + fs + 12 * ui);
            } else {
                ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
                haloText('온도(℃)', px1, py1 - 4 * ui, 3 * ui);
            }
            ctx.save();
            ctx.translate(G.x + pad + fs / 2, (py0 + py1) / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('용해도(g/물 100 g)', 0, 0);
            ctx.restore();

            /* 영역 이름 */
            if (simData.showRegion) {
                ctx.font = `700 ${fs * 0.95}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const tu = sel === 'KNO3' ? 40 : 55, ta = sel === 'KNO3' ? 25 : 45;
                ctx.fillStyle = '#0369a1';
                haloText('불포화', sx(tu), sy(solubility(sel, tu) / 2), 3 * ui);
                ctx.fillStyle = '#c2410c';
                haloText('포화 (녹지 않고 남음)', sx(ta), sy((Math.min(solubility(sel, ta), gcfg.yMax) + gcfg.yMax) / 2), 3 * ui);
            }

            /* 곡선 (나머지 먼저, 선택한 물질을 위에) */
            ctx.save();
            ctx.beginPath(); ctx.rect(px0, py0 - 1, px1 - px0 + 2, py1 - py0 + 2); ctx.clip();
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            keys.filter(k => k !== sel).concat([sel]).forEach(k => {
                ctx.strokeStyle = SUB_STYLE[k].color;
                ctx.lineWidth = (k === sel ? 3.5 : 2) * ui;
                ctx.globalAlpha = k === sel ? 1 : 0.7;
                ctx.beginPath(); curvePath(k, true); ctx.stroke();
            });
            ctx.restore();

            /* 180을 넘는 곡선: 위쪽 경계에서 멈추고 위쪽 화살표 + 값 */
            const pointHigh = simData.showPoint && Math.max(st.m, st.dissolved) > gcfg.yMax;
            keys.forEach(k => {
                const Tx = crossTemp(k, gcfg.yMax);
                if (Tx === null) return;
                const x = sx(Tx), col = SUB_STYLE[k].color;
                ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(1.2, 1.8 * ui);
                ctx.beginPath(); ctx.moveTo(x, py0); ctx.lineTo(x, py0 - topMargin + 6 * ui); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, py0 - topMargin + 2 * ui); ctx.lineTo(x - aw, py0 - topMargin + 8 * ui); ctx.lineTo(x + aw, py0 - topMargin + 8 * ui); ctx.closePath(); ctx.fill();
                if (pointHigh && st.Td > Tx - 15) return;
                const s = SIM_CONFIG.solutes[k].s;
                const txt = `100 ℃에서 ${s[s.length - 1].toFixed(1)}`;
                ctx.font = `600 ${fs * 0.85}px ${FONT}`; ctx.textBaseline = 'middle';
                const tw = ctx.measureText(txt).width;
                const right = x + 6 * ui + tw <= G.x + G.w - pad;
                ctx.textAlign = right ? 'left' : 'right';
                haloText(txt, right ? x + 6 * ui : x - 6 * ui, py0 - topMargin / 2, 3 * ui);
            });

            /* 현재 점 (온도, 녹은 양) */
            if (simData.showPoint && st.m > 0) {
                const x = sx(st.Td), col = SUB_STYLE[sel].color;
                const yv = sy(Math.min(st.dissolved, gcfg.yMax));
                const pfs = fs * 0.9;
                ctx.save();
                ctx.setLineDash([4 * ui, 4 * ui]); ctx.strokeStyle = COLORS.light; ctx.lineWidth = Math.max(1, ui);
                ctx.beginPath(); ctx.moveTo(x, py1); ctx.lineTo(x, yv); ctx.moveTo(px0, yv); ctx.lineTo(x, yv); ctx.stroke();
                ctx.restore();
                const placeX = (wd) => (x + 10 * ui + wd <= px1 ? { x: x + 10 * ui, a: 'left' } : { x: x - 10 * ui, a: 'right' });
                /* 넣은 양이 용해도보다 많으면: 넣은 양 표시 + 남은 양 */
                if (st.cmp === 'over') {
                    const ym = sy(Math.min(st.m, gcfg.yMax));
                    ctx.save();
                    ctx.setLineDash([5 * ui, 4 * ui]); ctx.strokeStyle = COLORS.obs; ctx.lineWidth = Math.max(1, 1.5 * ui);
                    ctx.beginPath(); ctx.moveTo(x, yv); ctx.lineTo(x, ym); ctx.stroke();
                    ctx.restore();
                    if (st.m <= gcfg.yMax) {
                        ctx.beginPath(); ctx.arc(x, ym, 5 * ui, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffffff'; ctx.fill();
                        ctx.strokeStyle = COLORS.obs; ctx.lineWidth = Math.max(1.2, 2 * ui); ctx.stroke();
                    } else {
                        ctx.fillStyle = COLORS.obs;
                        ctx.beginPath(); ctx.moveTo(x, py0 - 6 * ui); ctx.lineTo(x - 5 * ui, py0 + 3 * ui); ctx.lineTo(x + 5 * ui, py0 + 3 * ui); ctx.closePath(); ctx.fill();
                    }
                    const txt = `넣은 양 ${st.m} g (${st.left.toFixed(1)} g 남음)`;
                    const wd = pillWidth(txt, pfs);
                    const ly2 = clamp(Math.min(ym, yv - pfs * 2.4), py0 + pfs, py1 - pfs * 3);
                    const p = placeX(wd);
                    pill(txt, p.x, ly2, PILL_STYLE.left, pfs, p.a);
                }
                /* 점 */
                if (st.dissolved > gcfg.yMax) {
                    ctx.fillStyle = col; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1, 1.5 * ui);
                    ctx.beginPath(); ctx.moveTo(x, py0 - 7 * ui); ctx.lineTo(x - 6 * ui, py0 + 4 * ui); ctx.lineTo(x + 6 * ui, py0 + 4 * ui); ctx.closePath(); ctx.fill(); ctx.stroke();
                } else {
                    ctx.beginPath(); ctx.arc(x, yv, 6 * ui, 0, Math.PI * 2);
                    ctx.fillStyle = col; ctx.fill();
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1.2, 2 * ui); ctx.stroke();
                }
                const valTxt = st.cmp === 'under' ? fmtNum(st.m) : st.S.toFixed(1);
                const txt = `${fmtNum(st.Td)} ℃, ${valTxt} g`;
                const wd = pillWidth(txt, pfs);
                const p = placeX(wd);
                const ly1 = st.cmp === 'over' ? clamp(yv + pfs * 1.6, py0 + pfs, py1 - pfs) : clamp(yv - pfs * 1.6, py0 + pfs, py1 - pfs);
                pill(txt, p.x, ly1, { bg: PILL_STYLE.point.bg, text: COLORS.text, border: col }, pfs, p.a);
            }
            ctx.restore();
        }

        /* ── 상태 문장 (01_spec 판정 규칙) ─────────────────────────── */
        function statusMessage(st) {
            const head = `${fmtNum(st.Td)} ℃에서 ${st.name}의 용해도는 ${st.S.toFixed(1)} g/물 100 g`;
            if (st.m === 0) return { kind: 'info', text: `${head} → 넣은 용질이 없다. 넣는 용질의 질량을 정해 보자.` };
            if (st.cmp === 'under') return { kind: 'info', text: `${head} → ${st.m} g 모두 녹음(불포화 용액)` };
            if (st.cmp === 'equal') return { kind: 'success', text: `${head} → ${st.m} g 모두 녹음(포화 용액)` };
            let text = `${head} → ${st.m} g 중 ${st.S.toFixed(1)} g 녹고 ${st.left.toFixed(1)} g 남음(포화 용액)`;
            if (simData.crys > 0.05) text += ' · 온도를 낮추자 녹아 있던 용질이 결정으로 나왔다(석출).';
            return { kind: 'warn', text };
        }
        function bannerSize(msg, w, h, ui) {
            const fs = clamp(13 * ui, 10.5, 19);
            ctx.save();
            ctx.font = `600 ${fs}px ${FONT}`;
            const resetSpace = h > 400 ? 140 : 64;
            const maxW = Math.max(160, Math.min(w - 32 - resetSpace, 860 * ui));
            const padX = 12 * ui;
            const lines = wrapLines(msg.text, maxW - 2 * padX);
            const lh = fs * 1.45;
            const bw = Math.min(maxW, Math.max(...lines.map(l => ctx.measureText(l).width)) + 2 * padX);
            ctx.restore();
            return { lines, bw, bh: lines.length * lh + 14 * ui, fs, lh, padX, padY: 7 * ui };
        }
        function drawBanner(msg, b, h, ui) {
            ctx.save();
            ctx.font = `600 ${b.fs}px ${FONT}`;
            const x = 16, y = h - 16 - b.bh;
            const st = BANNER_STYLE[msg.kind] || BANNER_STYLE.info;
            rrect(x, y, b.bw, b.bh, 10 * ui);
            ctx.fillStyle = st.bg; ctx.fill();
            ctx.strokeStyle = st.border; ctx.lineWidth = Math.max(1, 1.5 * ui); ctx.stroke();
            ctx.fillStyle = st.text; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            b.lines.forEach((l, i) => ctx.fillText(l, x + b.padX, y + b.padY + b.lh * (i + 0.5)));
            ctx.restore();
        }

        /* ── 배치: 장치 + 그래프를 한 묶음으로 가운데 (넓으면 좌우, 좁으면 썸네일·위아래) ── */
        function computeLayout(w, h, ui, banner) {
            const narrow = w < 640;
            const top = 56;
            const bottom = h - Math.max(60, banner.bh + 26);
            const left = narrow ? 8 : 16;
            const RW = w - 2 * left, RH = Math.max(80, bottom - top);
            const SH = SCENE.y1 - SCENE.y0, SW = SCENE.x1 - SCENE.x0, CW = SCENE.cx1 - SCENE.cx0;
            let appR, G, crop = false;
            if (RW >= 600 && RW >= RH * 1.1) {
                /* 묶음 최대 크기: 1440×900 화면의 약 1.5배 */
                const H = Math.min(RH, 980), W = Math.min(RW, 1560);
                const gap = 28 * ui;
                const gW = Math.min(H * 1.12, W * 0.56);
                const gH = Math.min(H, gW / 0.9);
                const appW = Math.max(120, Math.min(W - gap - gW, SW * H / SH));
                const total = appW + gap + gW;
                const x0 = left + (RW - total) / 2, yc = top + RH / 2;
                appR = { x: x0, y: yc - H / 2, w: appW, h: H };
                G = { x: x0 + appW + gap, y: yc - gH / 2, w: gW, h: gH };
            } else if (narrow && RH < 560) {
                crop = true;
                const tw = Math.round(clamp(RW * 0.34, 100, 170));
                appR = { x: left, y: top, w: tw, h: RH };
                G = { x: left + tw + 8, y: top, w: RW - tw - 8, h: RH };
            } else {
                const ah = Math.round(RH * 0.42);
                appR = { x: left, y: top, w: RW, h: ah };
                const gh = RH - ah - 10;
                const gw = Math.min(RW, Math.max(gh * 1.25, 300), 900 * ui);
                G = { x: left + (RW - gw) / 2, y: top + ah + 10, w: gw, h: gh };
            }
            let x0s = SCENE.x0, sw = SW;
            let S = Math.min(appR.w / sw, appR.h / SH);
            const showLabels = !crop && S >= 0.5;
            if (!showLabels) { x0s = SCENE.cx0; sw = CW; S = Math.min(appR.w / sw, appR.h / SH); }
            const X0 = appR.x + (appR.w - sw * S) / 2 - x0s * S;
            const Y0 = appR.y + (appR.h - SH * S) / 2 - SCENE.y0 * S;
            return {
                L: { S, X0, Y0, X: u => X0 + u * S, Y: v => Y0 + v * S, showLabels, crop: !showLabels, clip: appR },
                G
            };
        }

        /* ── 패널 동기화 ───────────────────────────────────────────── */
        function syncPanel() {
            const r = document.querySelector(`input[name="soluteOpt"][value="${simData.solute}"]`);
            if (r) r.checked = true;
            if (varSlider1) varSlider1.value = simData.value1;
            if (varDisplay1) varDisplay1.textContent = `${simData.value1} ${SIM_CONFIG.slider.unit}`;
            const ts = document.getElementById('tempSlider');
            if (ts) {
                ts.min = SIM_CONFIG.temp.min; ts.max = SIM_CONFIG.temp.max; ts.step = SIM_CONFIG.temp.step;
                ts.value = simData.tempTarget;
            }
            const td = document.getElementById('tempDisplay');
            if (td) td.textContent = `${simData.tempTarget} ${SIM_CONFIG.temp.unit}`;
            const setChk = (id, v) => { const el = document.getElementById(id); if (el) el.checked = v; };
            setChk('chkAll', simData.showAll);
            setChk('chkPoint', simData.showPoint);
            setChk('chkRegion', simData.showRegion);
        }

        /* 시뮬레이션 초기화 — 초기화 버튼과 첫 실행 때 호출된다 (코어가 호출, 이름 유지) */
        function initSimulation() {
            const D = SIM_CONFIG.defaults;
            simData.value1 = SIM_CONFIG.slider.initialValue;
            simData.solute = D.solute;
            simData.tempTarget = SIM_CONFIG.temp.initialValue;
            simData.T = SIM_CONFIG.temp.initialValue;
            simData.showAll = D.showAll;
            simData.showPoint = D.showPoint;
            simData.showRegion = D.showRegion;
            simData.dis = 0;
            simData.powder = 0;
            simData.crys = 0;
            simData.frame = 0;
            simData.lastTs = 0;
            settle(0, true);
            syncPanel();

            sysState.isStarted = false;
            sysState.isPaused = false;
            sysState.zoomLevel = 1.0;
            sysState.offsetX = 0;
            sysState.offsetY = 0;

            stopLoop();
            updateUIState();
            draw();
        }

        /* ─────────────────────────────────────────────────────────────
           ✏️  draw() — 매 프레임 캔버스를 그리는 함수 (코어가 호출, 이름 유지)
           ctx와 simData 값을 이용해 원하는 도형을 그리세요.
           ───────────────────────────────────────────────────────────── */
        function draw() {
            if (!ctx) return;
            const w = sysState.canvasLogicalWidth, h = sysState.canvasLogicalHeight;
            if (!w || !h) return;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, w, h);
            const ui = uiScale(w, h);
            const st = judge();
            const msg = statusMessage(st);
            const banner = bannerSize(msg, w, h, ui);
            const lay = computeLayout(w, h, ui, banner);
            drawApparatus(lay.L, ui, st);
            drawGraph(lay.G, ui, st);
            drawBanner(msg, banner, h, ui);
        }

        /* 프레임별 물리 연산 — 시작 버튼을 누르면 매 프레임 호출된다 (코어가 호출, 이름 유지)
           시작한 동안은 온도가 슬라이더 값까지 천천히 바뀌고, 녹거나 결정이 생기는 과정도 천천히 보인다 */
        function updatePhysics() {
            const now = performance.now();
            let dt = simData.lastTs ? (now - simData.lastTs) / 1000 : 1 / 60;
            if (!(dt > 0) || dt > 0.1) dt = 1 / 60;
            simData.lastTs = now;
            simData.frame++;
            const d = simData.tempTarget - simData.T, step = SIM_CONFIG.rate.temp * dt;
            simData.T = Math.abs(d) <= step ? simData.tempTarget : simData.T + Math.sign(d) * step;
            settle(dt, false);
        }

        /* 캔버스 포인터 조작 — type: 'down' | 'move' | 'up', pos: 캔버스 논리 좌표 {x, y} (코어 ZONE J가 호출) */
        function onCanvasPointer(type, pos, e) {
            /* 이 단원은 제어 패널로만 조작한다 */
        }
        /* ████ ZONE F 끝 ████████████████████████████████████████████████████████ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE G — LOOP & TAB STATE MANAGER (수정 금지)
           ════════════════════════════════════════════════════════════════════════ */
        function startLoop() { if (!sysState.isLooping) { sysState.isLooping = true; updateLoop(); } }
        function stopLoop() { sysState.isLooping = false; }
        function updateLoop() {
            if (!sysState.isLooping) return;
            updatePhysics(); draw();
            requestAnimationFrame(updateLoop);
        }

        function saveTabState(shape) {
            const selectedRadio = document.querySelector('input[name="simOption"]:checked')?.value;
            const selectedVal = DOM.customSelectTrigger?.getAttribute('data-selected-value') || null;
            tabStates[shape] = {
                ...simData,
                isStarted: sysState.isStarted, isPaused: sysState.isPaused,
                zoomLevel: sysState.zoomLevel, offsetX: sysState.offsetX, offsetY: sysState.offsetY,
                selectVal: selectedVal, radioVal: selectedRadio
            };
        }

        function loadTabState(shape) {
            const state = tabStates[shape];
            if (state) {
                Object.assign(simData, state);
                sysState.isStarted = state.isStarted; sysState.isPaused = state.isPaused;
                sysState.zoomLevel = state.zoomLevel || 1.0;
                sysState.offsetX = state.offsetX || 0;
                sysState.offsetY = state.offsetY || 0;

                const csvEl = document.getElementById('customSelectValue');
                if (state.selectVal) {
                    const li = document.querySelector(`#customSelectList li[data-value="${state.selectVal}"]`);
                    if (li && csvEl) { csvEl.innerHTML = li.innerHTML; DOM.customSelectTrigger?.setAttribute('data-selected-value', state.selectVal); }
                } else {
                    if (csvEl) csvEl.textContent = '학습 내용을 선택하세요';
                    DOM.customSelectTrigger?.removeAttribute('data-selected-value');
                }
                const radio = document.querySelector(`input[name="simOption"][value="${state.radioVal}"]`);
                if (radio) radio.checked = true;
            } else {
                simData.value1 = SIM_CONFIG.slider.initialValue;
                simData.diameter = SIM_CONFIG.object.radius * 2;
                simData.radius = SIM_CONFIG.object.radius;
                simData.ratioA = 1; simData.ratioB = 1;
                sysState.isStarted = false; sysState.isPaused = false;
                sysState.zoomLevel = 1.0; sysState.offsetX = 0; sysState.offsetY = 0;
                if (canvas) { simData.x = sysState.canvasLogicalWidth / 2; simData.y = sysState.canvasLogicalHeight / 2; }
                const csvEl = document.getElementById('customSelectValue');
                if (csvEl) csvEl.textContent = '학습 내용을 선택하세요';
                DOM.customSelectTrigger?.removeAttribute('data-selected-value');
                const dr = document.querySelector('input[name="simOption"][value="parallel"]');
                if (dr) dr.checked = true;
            }

            if (varSlider1) varSlider1.value = simData.value1;
            if (varDisplay1) varDisplay1.textContent = `${simData.value1} ${SIM_CONFIG.slider.unit}`;
            if (DOM.directInputSingle) DOM.directInputSingle.value = simData.diameter;
            if (DOM.ratioInputA) DOM.ratioInputA.value = simData.ratioA;
            if (DOM.ratioInputB) DOM.ratioInputB.value = simData.ratioB;

            sysState.isStarted && !sysState.isPaused ? startLoop() : stopLoop();
            updateUIState(); draw();
        }

        function updateUIState() {
            const { statusIndicator, pauseBtn, helperText } = DOM;
            if (!statusIndicator || !pauseBtn || !helperText) return;
            const isRunning = sysState.isStarted && !sysState.isPaused;
            const isPaused = sysState.isPaused;
            const lock = false; /* 동작 중 입력 잠금 해제 (실시간 상호작용 지원) */

            if (DOM.varSlider1) DOM.varSlider1.disabled = lock;
            if (DOM.directInputSingle) DOM.directInputSingle.disabled = lock;
            if (DOM.ratioInputA) DOM.ratioInputA.disabled = lock;
            if (DOM.ratioInputB) DOM.ratioInputB.disabled = lock;
            if (DOM.customSelectTrigger) {
                DOM.customSelectTrigger.disabled = lock;
                if (lock && DOM.customSelectList && !DOM.customSelectList.classList.contains('hidden')) {
                    DOM.customSelectList.classList.add('hidden');
                    DOM.customSelectTrigger.setAttribute('aria-expanded', 'false');
                }
            }
            if (DOM.radioOptions) DOM.radioOptions.forEach(r => r.disabled = lock);

            const helperBoxWrapper = document.getElementById('helperBoxWrapper');
            if (isRunning) {
                statusIndicator.className = "w-3 h-3 rounded-full bg-rose-500 border border-rose-300 animate-pulse translate-y-[1px]";
                pauseBtn.className = "btn-action-pause col-span-2 py-2 border rounded-lg transition-colors";
                pauseBtn.innerHTML = SIM_CONFIG.labels.pause;
                helperText.textContent = SIM_CONFIG.labels.helperRunning;
                helperText.className = "helper-text-running whitespace-nowrap transition-colors";
                if (helperBoxWrapper) helperBoxWrapper.classList.add('hidden');
            } else if (isPaused) {
                statusIndicator.className = "w-3 h-3 rounded-full bg-amber-400 border border-amber-300 translate-y-[1px]";
                pauseBtn.className = "btn-action-start col-span-2 py-2 border rounded-lg transition-colors";
                pauseBtn.innerHTML = SIM_CONFIG.labels.start;
                helperText.textContent = SIM_CONFIG.labels.helperPaused;
                helperText.className = "helper-text-paused whitespace-nowrap transition-colors";
                if (helperBoxWrapper) helperBoxWrapper.classList.remove('hidden');
            } else {
                statusIndicator.className = "w-3 h-3 rounded-full bg-emerald-500 border border-emerald-300 translate-y-[1px]";
                pauseBtn.className = "btn-action-start col-span-2 py-2 border rounded-lg transition-colors";
                pauseBtn.innerHTML = SIM_CONFIG.labels.start;
                helperText.textContent = SIM_CONFIG.labels.helperIdle;
                helperText.className = "helper-text-default whitespace-nowrap transition-colors";
                if (helperBoxWrapper) helperBoxWrapper.classList.remove('hidden');
            }
        }
        /* ════ ZONE G 끝 ════════════════════════════════════════════════════════ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE H — CANVAS RESIZE (수정 금지)
           ════════════════════════════════════════════════════════════════════════ */
        function limitOffset() {
            if (!canvas) return;
            if (sysState.zoomLevel <= 1.0) {
                sysState.offsetX = 0;
                sysState.offsetY = 0;
                return;
            }
            const maxOffset = Math.min(sysState.canvasLogicalWidth, sysState.canvasLogicalHeight) * 0.5 * (sysState.zoomLevel - 1.0);
            sysState.offsetX = Math.max(-maxOffset, Math.min(maxOffset, sysState.offsetX));
            sysState.offsetY = Math.max(-maxOffset, Math.min(maxOffset, sysState.offsetY));
        }

        function resizeCanvas() {
            if (!container || !canvas || !ctx) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
            canvas.style.width = `${rect.width}px`; canvas.style.height = `${rect.height}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            sysState.canvasLogicalWidth = rect.width;
            sysState.canvasLogicalHeight = rect.height;
            simData.x = rect.width / 2; simData.y = rect.height / 2;
            for (const k in tabStates) { if (tabStates[k]) { tabStates[k].x = rect.width / 2; tabStates[k].y = rect.height / 2; } }

            // 초기화 버튼 동적 스타일 조정 (높이가 270px 이하일 때)
            const resetBtn = document.getElementById('resetBtn');
            const resetBtnText = document.getElementById('resetBtnText');
            if (resetBtn && resetBtnText) {
                if (rect.height <= 400) {
                    resetBtnText.style.display = 'none';
                    resetBtn.style.padding = '0';
                    resetBtn.style.width = '2.5rem';
                    resetBtn.style.height = '2.5rem';
                    resetBtn.style.justifyContent = 'center';
                } else {
                    resetBtnText.style.display = '';
                    resetBtn.style.padding = '';
                    resetBtn.style.width = '';
                    resetBtn.style.height = '';
                    resetBtn.style.justifyContent = '';
                }
            }

            limitOffset(); draw();
        }

        const isFullscreenActive = () =>
            !!(document.fullscreenElement || document.webkitFullscreenElement);
        const FULLSCREEN_HISTORY_KEY = '__templateFullscreen';
        const FULLSCREEN_HISTORY_CLEANUP_DELAY = 400;
        const isNaverInAppBrowser = () => /NAVER\s*\((?:inapp|higgs);/i.test(navigator.userAgent);
        let fullscreenHistoryToken = null;
        let fullscreenExitFromHistory = false;
        let fullscreenHistoryCleanup = false;
        let fullscreenHistoryCleanupTimer = null;
        let previousScrollRestoration = null;

        const addFullscreenHistoryToken = stateValue => {
            if (!fullscreenHistoryToken) return stateValue;
            return { ...stateValue, [FULLSCREEN_HISTORY_KEY]: fullscreenHistoryToken };
        };

        const clearFullscreenHistoryTracking = () => {
            clearTimeout(fullscreenHistoryCleanupTimer);
            fullscreenHistoryCleanupTimer = null;
            if (previousScrollRestoration !== null && 'scrollRestoration' in history) {
                history.scrollRestoration = previousScrollRestoration;
            }
            previousScrollRestoration = null;
            fullscreenHistoryToken = null;
            fullscreenExitFromHistory = false;
            fullscreenHistoryCleanup = false;
        };

        const pushFullscreenHistoryEntry = () => {
            if (!isNaverInAppBrowser() || fullscreenHistoryToken) return;
            const token = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
            try {
                if ('scrollRestoration' in history && previousScrollRestoration === null) {
                    previousScrollRestoration = history.scrollRestoration;
                    history.scrollRestoration = 'manual';
                }
                history.pushState({ [FULLSCREEN_HISTORY_KEY]: token }, '');
                fullscreenHistoryToken = token;
            } catch (_) {
                clearFullscreenHistoryTracking();
            }
        };

        const restoreFullscreenHistoryEntry = () => {
            const shouldRestore = isFullscreenActive();
            clearFullscreenHistoryTracking();
            if (shouldRestore) pushFullscreenHistoryEntry();
        };

        const exitFullscreenFromHistory = () => {
            const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
            if (!exitFullscreen) {
                restoreFullscreenHistoryEntry();
                return;
            }
            const token = fullscreenHistoryToken;
            const restoreEntry = () => {
                if (fullscreenHistoryToken === token) restoreFullscreenHistoryEntry();
            };
            fullscreenExitFromHistory = true;
            try {
                const result = exitFullscreen.call(document);
                if (result && typeof result.catch === 'function') result.catch(restoreEntry);
            } catch (_) {
                restoreEntry();
            }
        };

        const cleanupFullscreenHistoryEntry = () => {
            const token = fullscreenHistoryToken;
            if (!token || !history.state || history.state[FULLSCREEN_HISTORY_KEY] !== token) {
                clearFullscreenHistoryTracking();
                return;
            }
            fullscreenHistoryCleanup = true;
            history.back();
        };

        const scheduleFullscreenHistoryCleanup = () => {
            const token = fullscreenHistoryToken;
            clearTimeout(fullscreenHistoryCleanupTimer);
            fullscreenHistoryCleanupTimer = setTimeout(() => {
                if (fullscreenHistoryToken !== token || isFullscreenActive()) return;
                const state = history.state;
                if (!state || state[FULLSCREEN_HISTORY_KEY] !== token) {
                    clearFullscreenHistoryTracking();
                    return;
                }
                if (Object.keys(state).length === 1) cleanupFullscreenHistoryEntry();
            }, FULLSCREEN_HISTORY_CLEANUP_DELAY);
        };

        window.addEventListener('popstate', event => {
            clearTimeout(fullscreenHistoryCleanupTimer);
            fullscreenHistoryCleanupTimer = null;
            const token = fullscreenHistoryToken;
            if (!token) return;
            const sameFullscreenEntry = !!(
                event.state && event.state[FULLSCREEN_HISTORY_KEY] === token
            );
            if (fullscreenHistoryCleanup) {
                if (sameFullscreenEntry) history.back();
                else clearFullscreenHistoryTracking();
                return;
            }
            if (sameFullscreenEntry) {
                if (!isFullscreenActive()) scheduleFullscreenHistoryCleanup();
                return;
            }
            if (isFullscreenActive()) exitFullscreenFromHistory();
            else clearFullscreenHistoryTracking();
        });

        function toggleFullScreen() {
            const workspace = document.getElementById('workspace');
            if (!workspace) return;

            if (!isFullscreenActive()) {
                if (workspace.requestFullscreen) workspace.requestFullscreen().catch(e => console.error(e));
                else if (workspace.webkitRequestFullscreen) workspace.webkitRequestFullscreen();
                else alert("현재 브라우저는 전체화면을 지원하지 않습니다.");
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        const resetFullscreenButtonFeedback = () => {
            ['fullscreen-btn', 'fullscreen-btn-mobile'].forEach(id => {
                const button = document.getElementById(id);
                if (!button) return;
                clearTimeout(button._tapFeedbackTimer);
                button.classList.remove('is-tap-feedback', 'is-pen-hover');
                button.blur();
            });
        };

        const showSimulationToast = message => {
