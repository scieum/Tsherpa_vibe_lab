            }
            bindEvent('quizBtn', 'click', () => { sysState.currentQuizIndex = 0; updateQuizUI(); toggleModal('quizBox', true); requestAnimationFrame(stabilizeQuizLayout); });
            bindEvent('showAnswerBtn', 'click', () => { uiSound.playClick(); document.getElementById('answerText')?.classList.remove('hidden'); document.getElementById('showAnswerBtn')?.classList.add('hidden'); });
            bindEvent('nextQuizBtn', 'click', () => { if (sysState.currentQuizIndex < CONTENT_CONFIG.quizzes.length - 1) { uiSound.playClick(); sysState.currentQuizIndex++; updateQuizUI(); } });
            bindEvent('prevQuizBtn', 'click', () => { if (sysState.currentQuizIndex > 0) { uiSound.playClick(); sysState.currentQuizIndex--; updateQuizUI(); } });
            window.addEventListener('resize', debounce(stabilizeQuizLayout, 100));

            /* 캔버스 드래그 */
            if (canvas) {
                const getPos = (clientX, clientY) => {
                    const r = canvas.getBoundingClientRect();
                    return {
                        x: (clientX - r.left) * (sysState.canvasLogicalWidth / r.width),
                        y: (clientY - r.top) * (sysState.canvasLogicalHeight / r.height)
                    };
                };

                let pointers = [];
                let lastPinchDist = null;

                canvas.addEventListener('pointerdown', (e) => {
                    canvas.setPointerCapture(e.pointerId);
                    pointers.push({ id: e.pointerId, x: e.clientX, y: e.clientY });

                    if (pointers.length === 1) {
                        const p = getPos(e.clientX, e.clientY);
                        sysState.lastX = p.x;
                        sysState.lastY = p.y;
                        sysState.isDragging = true;
                        canvas.style.cursor = 'grabbing';
                        updateUIState();
                    } else if (pointers.length === 2) {
                        sysState.isDragging = false;
                        lastPinchDist = Math.hypot(pointers[0].x - pointers[1].x, pointers[0].y - pointers[1].y);
                    }
                });

                canvas.addEventListener('pointermove', (e) => {
                    const idx = pointers.findIndex(p => p.id === e.pointerId);
                    if (idx !== -1) {
                        pointers[idx].x = e.clientX;
                        pointers[idx].y = e.clientY;
                    }

                    if (pointers.length === 2) {
                        const dist = Math.hypot(pointers[0].x - pointers[1].x, pointers[0].y - pointers[1].y);
                        if (lastPinchDist) {
                            const delta = dist - lastPinchDist;
                            sysState.zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, sysState.zoomLevel + delta * 0.005));
                            limitOffset();
                            updateZoomButtons();
                            if (!sysState.isLooping) draw();
                        }
                        lastPinchDist = dist;
                    } else if (pointers.length === 1 && sysState.isDragging) {
                        const p = getPos(e.clientX, e.clientY);
                        const dx = p.x - sysState.lastX;
                        const dy = p.y - sysState.lastY;
                        if (sysState.zoomLevel > 1.0) {
                            sysState.offsetX += dx; sysState.offsetY += dy; limitOffset();
                        } else {
                            simData.x = Math.max(simData.radius, Math.min(sysState.canvasLogicalWidth - simData.radius, simData.x + dx));
                            simData.y = Math.max(simData.radius, Math.min(sysState.canvasLogicalHeight - simData.radius, simData.y + dy));
                        }
                        sysState.lastX = p.x; sysState.lastY = p.y;
                        if (!sysState.isLooping) draw();
                    }
                });

                const pointerUp = (e) => {
                    pointers = pointers.filter(p => p.id !== e.pointerId);
                    if (pointers.length < 2) lastPinchDist = null;

                    if (pointers.length === 1) {
                        const p = getPos(pointers[0].x, pointers[0].y);
                        sysState.lastX = p.x; sysState.lastY = p.y;
                        sysState.isDragging = true;
                    } else if (pointers.length === 0) {
                        sysState.isDragging = false;
                        canvas.releasePointerCapture(e.pointerId);
                        canvas.style.cursor = 'grab';
                        updateUIState();
                    }
                };

                canvas.addEventListener('pointerup', pointerUp);
                canvas.addEventListener('pointercancel', pointerUp);

                canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const zoomFactor = e.deltaY < 0 ? 0.1 : -0.1;
                    sysState.zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, sysState.zoomLevel + zoomFactor));
                    limitOffset();
                    updateZoomButtons();
                    if (!sysState.isLooping) draw();
                }, { passive: false });
            }

            /* 캔버스 상단 탭 */
            const shapeTabsDOM = document.getElementById('shapeTabs');
            if (shapeTabsDOM) {
                const updateTabScrollIndicators = () => {
                    const leftInd = document.getElementById('tabScrollLeft');
                    const rightInd = document.getElementById('tabScrollRight');
                    if (!leftInd || !rightInd) return;
                    const maxSL = shapeTabsDOM.scrollWidth - shapeTabsDOM.clientWidth;
                    leftInd.classList.toggle('opacity-0', shapeTabsDOM.scrollLeft <= 1);
                    leftInd.classList.toggle('pointer-events-none', shapeTabsDOM.scrollLeft <= 1);
                    leftInd.classList.toggle('opacity-100', shapeTabsDOM.scrollLeft > 1);
                    rightInd.classList.toggle('opacity-0', Math.ceil(shapeTabsDOM.scrollLeft) >= maxSL - 1 || maxSL <= 0);
                    rightInd.classList.toggle('pointer-events-none', Math.ceil(shapeTabsDOM.scrollLeft) >= maxSL - 1 || maxSL <= 0);
                    rightInd.classList.toggle('opacity-100', Math.ceil(shapeTabsDOM.scrollLeft) < maxSL - 1 && maxSL > 0);
                };
                shapeTabsDOM.addEventListener('scroll', updateTabScrollIndicators);
                window.addEventListener('resize', debounce(updateTabScrollIndicators, 100));
                setTimeout(updateTabScrollIndicators, 150);

                bindEvent('btnScrollLeft', 'click', () => { uiSound.playClick(); shapeTabsDOM.scrollBy({ left: -120, behavior: 'smooth' }); });
                bindEvent('btnScrollRight', 'click', () => { uiSound.playClick(); shapeTabsDOM.scrollBy({ left: 120, behavior: 'smooth' }); });

                let isDownTab = false, startXTab = 0, scrollLeftTab = 0;
                shapeTabsDOM.addEventListener('mousedown', (e) => { isDownTab = true; startXTab = e.pageX - shapeTabsDOM.offsetLeft; scrollLeftTab = shapeTabsDOM.scrollLeft; });
                shapeTabsDOM.addEventListener('mouseleave', () => isDownTab = false);
                shapeTabsDOM.addEventListener('mouseup', () => isDownTab = false);
                shapeTabsDOM.addEventListener('mousemove', (e) => { if (!isDownTab) return; e.preventDefault(); shapeTabsDOM.scrollLeft = scrollLeftTab - (e.pageX - shapeTabsDOM.offsetLeft - startXTab) * 1.5; });

                const tabBtns = shapeTabsDOM.querySelectorAll('.tab-btn');
                shapeTabsDOM.addEventListener('click', (e) => {
                    const target = e.target.closest('.tab-btn');
                    if (!target || (sysState.isStarted && !sysState.isPaused)) return;
                    const newShape = target.getAttribute('data-shape');
                    if (simData.shape === newShape) return;
                    saveTabState(simData.shape);
                    tabBtns.forEach(b => { b.classList.remove('border-indigo-600', 'text-indigo-600', 'bg-white'); b.classList.add('border-transparent', 'text-slate-500', 'bg-transparent', 'desktop-only:hover:bg-slate-200/50'); });
                    target.classList.remove('border-transparent', 'text-slate-500', 'bg-transparent', 'desktop-only:hover:bg-slate-200/50');
                    target.classList.add('border-indigo-600', 'text-indigo-600', 'bg-white');
                    simData.shape = newShape;
                    loadTabState(simData.shape);
                });
            }

            /* 전체화면 마우스 오버 */
            let fullscreenHoverTimer;
            document.addEventListener('mousemove', (e) => {
                if (!document.fullscreenElement) return;
                const exitUI = document.getElementById('fullscreen-exit-ui'); if (!exitUI) return;
                if (e.clientY < 80) { exitUI.classList.remove('opacity-0'); exitUI.classList.add('opacity-100'); clearTimeout(fullscreenHoverTimer); }
                else { clearTimeout(fullscreenHoverTimer); fullscreenHoverTimer = setTimeout(() => { exitUI.classList.remove('opacity-100'); exitUI.classList.add('opacity-0'); }, 10); }
            });
        }
        /* ════ ZONE J 끝 ════════════════════════════════════════════════════════ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE K — FLOATING PANEL LOGIC (수정 금지)
           플로팅 패널 드래그 및 토글 애니메이션 제어
           ════════════════════════════════════════════════════════════════════════ */
        function initFloatingPanel() {
            const wrapper = DOM.floatingPanel, toggleBtn = DOM.panelBtn, panel = DOM.panelContent, icon = DOM.panelIcon;
            const workspaceNode = document.getElementById('workspace'), topBar = document.getElementById('canvasTopBar');
            if (!wrapper || !toggleBtn || !panel || !icon || !workspaceNode) return;

            toggleBtn.className = "hidden md:flex landscape:flex relative bg-white/95 backdrop-blur border border-slate-200 z-10 min-h-12 min-w-12 w-full h-12 overflow-hidden whitespace-nowrap rounded-t-xl";
            const hamburgerIcon = toggleBtn.children[0], arrowIcon = toggleBtn.children[1];
            if (hamburgerIcon) hamburgerIcon.className = "absolute top-1/2 -translate-y-1/2 left-4 pointer-events-none transition-all duration-200";
            if (arrowIcon) arrowIcon.className = "absolute top-1/2 -translate-y-1/2 right-4 pointer-events-none transition-all duration-200";

            let relX = 0.95, relY = 0.05, isPanelDragging = false, hasDragged = false;
            let startX = 0, startY = 0, panelOffsetX = 0, panelOffsetY = 0;
            let isControlOpen = true, isAnimating = false, toggleTimeout, sequenceTimeout;

            const isFloatingMode = () => window.innerWidth >= 768 || window.matchMedia("(orientation: landscape)").matches;

            const getPanelBounds = () => {
                const wsRect = workspaceNode.getBoundingClientRect();
                const wsStyle = getComputedStyle(workspaceNode);
                const insetLeft = parseFloat(wsStyle.paddingLeft) || 0;
                const insetRight = parseFloat(wsStyle.paddingRight) || 0;
                const insetTop = parseFloat(wsStyle.paddingTop) || 0;
                const insetBottom = parseFloat(wsStyle.paddingBottom) || 0;
                return {
                    wsRect,
                    left: insetLeft,
                    right: wsRect.width - insetRight,
                    top: insetTop + (topBar ? topBar.offsetHeight : 0),
                    bottom: wsRect.height - insetBottom
                };
            };

            DOM.resetFloatingPanelPosition = () => {
                if (!isFloatingMode()) return;
                const { left, right, top, bottom } = getPanelBounds();
                const edgeGap = 16;
                const newX = Math.max(left, right - wrapper.offsetWidth - edgeGap);
                const newY = Math.max(top, Math.min(top + edgeGap, bottom - wrapper.offsetHeight));
                wrapper.style.left = `${newX}px`;
                wrapper.style.right = 'auto';
                wrapper.style.top = `${newY}px`;
                wrapper.style.bottom = 'auto';
                saveRelPos();
            };

            const saveRelPos = () => {
                if (!isFloatingMode()) return;
                const { wsRect, left, right, top, bottom } = getPanelBounds(), wrapRect = wrapper.getBoundingClientRect();
                const maxW = right - left - wrapper.offsetWidth, maxH = bottom - top - wrapper.offsetHeight;
                if (maxW > 0) relX = (wrapRect.left - wsRect.left - left) / maxW; if (maxH > 0) relY = (wrapRect.top - wsRect.top - top) / maxH;
            };

            const handleResizePanel = () => {
                clearTimeout(toggleTimeout); clearTimeout(sequenceTimeout); isAnimating = false;
                wrapper.style.transition = 'none'; panel.style.transition = 'none'; toggleBtn.style.transition = 'none';

                if (!isFloatingMode()) {
                    wrapper.style.cssText = ""; panel.style.cssText = ""; toggleBtn.style.cssText = ""; toggleBtn.style.cursor = 'default';
                    isControlOpen = true; icon.style.transform = "rotate(180deg)"; wrapper.classList.replace('flex-col-reverse', 'flex-col');
                    toggleBtn.style.borderRadius = '12px 12px 0 0'; toggleBtn.style.borderBottomWidth = '0px'; toggleBtn.style.borderTopWidth = '1px';
                    panel.className = "w-full md:w-72 landscape:w-72 flex flex-col min-h-0 bg-white/95 backdrop-blur border border-slate-200 overflow-hidden origin-top";
                    panel.style.borderRadius = '12px'; panel.style.borderTopWidth = '1px'; panel.style.borderColor = '';
                    if (hamburgerIcon) hamburgerIcon.style.cssText = ""; if (arrowIcon) arrowIcon.style.cssText = "";
                    return;
                }
                const { wsRect, left, right, top: topBound, bottom: bottomBound } = getPanelBounds(), btnRect = toggleBtn.getBoundingClientRect();
                const btnTop = btnRect.top - wsRect.top;
                let availableBottom = bottomBound - 16 - (topBound + 16) - 100;
                if (availableBottom < 180) { availableBottom = 180 };
                const panelMaxHeight = Math.min(availableBottom, bottomBound - 16 - (topBound + 16) - toggleBtn.offsetHeight);
                panel.className = "w-full md:w-72 landscape:w-72 flex flex-col min-h-0 bg-white/95 backdrop-blur border border-slate-200 overflow-hidden origin-top";

                if (isControlOpen) {
                    wrapper.style.width = '288px'; panel.style.opacity = '1'; panel.style.maxHeight = panelMaxHeight + 'px'; panel.style.borderColor = ''; wrapper.classList.replace('flex-col-reverse', 'flex-col');
                    toggleBtn.style.borderRadius = '12px 12px 0 0'; toggleBtn.style.borderBottomWidth = '1px'; toggleBtn.style.borderTopWidth = '1px';
                    panel.style.borderRadius = '0 0 12px 12px'; panel.style.borderTopWidth = '0px'; panel.style.borderBottomWidth = '1px';
                } else {
                    wrapper.style.width = '48px'; panel.style.opacity = '0'; panel.style.maxHeight = '0px'; panel.style.borderColor = 'transparent';
                    toggleBtn.style.borderRadius = '24px'; toggleBtn.style.borderBottomWidth = '1px'; toggleBtn.style.borderTopWidth = '1px';
                }
                icon.style.transform = isControlOpen ? "rotate(180deg)" : "rotate(0deg)";
                let newX = left + relX * (right - left - wrapper.offsetWidth), newY = topBound + relY * (bottomBound - topBound - wrapper.offsetHeight);
                newX = Math.max(left, Math.min(newX, right - wrapper.offsetWidth)); newY = Math.max(topBound, Math.min(newY, bottomBound - wrapper.offsetHeight));
                wrapper.style.left = newX + 'px'; wrapper.style.top = newY + 'px'; wrapper.style.right = 'auto'; wrapper.style.bottom = 'auto';
            };

            toggleBtn.onclick = (e) => {
                if (!isFloatingMode() || hasDragged || isAnimating) return;
                isAnimating = true; uiSound.playClick(); isControlOpen = !isControlOpen;
                const { wsRect, left, right, top: topBound, bottom: bottomBound } = getPanelBounds(), btnRect = toggleBtn.getBoundingClientRect();
                clearTimeout(toggleTimeout); clearTimeout(sequenceTimeout);

                const btnTop = btnRect.top - wsRect.top, btnLeft = btnRect.left - wsRect.left;
                const btnBottom = wsRect.height - (btnTop + btnRect.height), btnRight = wsRect.width - (btnLeft + btnRect.width);
                const isLeftHalf = (btnLeft + btnRect.width / 2) < (left + (right - left) / 2);

                if (isControlOpen) {
                    const fullHeight = bottomBound - 16 - (topBound + 16) - 100, minExpansion = (bottomBound - topBound) / 3, minPanelHeight = 180;
                    const availableBottom = bottomBound - btnTop - toggleBtn.offsetHeight - 16;
                    const isUpward = availableBottom < minExpansion;
                    let actualTargetHeight, targetTop = btnTop, targetBottom = btnBottom;

                    wrapper.style.transition = 'none';
                    if (isLeftHalf) { wrapper.style.left = btnLeft + 'px'; wrapper.style.right = 'auto'; wrapper.classList.replace('items-end', 'items-start'); }
                    else { wrapper.style.left = 'auto'; wrapper.style.right = btnRight + 'px'; wrapper.classList.replace('items-start', 'items-end'); }

                    if (isUpward) {
                        actualTargetHeight = Math.max(minPanelHeight, Math.min(fullHeight, btnTop - topBound - 16));
                        let reqTop = btnTop - actualTargetHeight;
                        if (reqTop < topBound + 16) {
                            targetBottom = Math.max(wsRect.height - bottomBound + 16, btnBottom - ((topBound + 16) - reqTop));
                            actualTargetHeight = Math.min(actualTargetHeight, bottomBound - 16 - (topBound + 16) - toggleBtn.offsetHeight);
                        }
                        wrapper.style.top = 'auto'; wrapper.style.bottom = btnBottom + 'px'; wrapper.classList.replace('flex-col', 'flex-col-reverse');
                        toggleBtn.style.transition = 'border-radius 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-width 0.2s cubic-bezier(0.4, 0, 0.2, 1)';
                        toggleBtn.style.borderRadius = '0px 0px 12px 12px'; toggleBtn.style.borderTopWidth = '1px'; toggleBtn.style.borderBottomWidth = '1px';
                        panel.style.borderRadius = '12px 12px 0px 0px'; panel.style.borderTopWidth = '1px'; panel.style.borderBottomWidth = '0px';
                    } else {
                        actualTargetHeight = Math.max(minPanelHeight, Math.min(fullHeight, availableBottom));
                        let reqBottom = bottomBound - (btnTop + toggleBtn.offsetHeight + actualTargetHeight);
                        if (reqBottom < 16) {
                            targetTop = Math.max(topBound + 16, btnTop - (16 - reqBottom));
                            actualTargetHeight = Math.min(actualTargetHeight, bottomBound - 16 - (topBound + 16) - toggleBtn.offsetHeight);
                        }
                        wrapper.style.top = btnTop + 'px'; wrapper.style.bottom = 'auto'; wrapper.classList.replace('flex-col-reverse', 'flex-col');
                        toggleBtn.style.transition = 'border-radius 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-width 0.2s cubic-bezier(0.4, 0, 0.2, 1)';
                        toggleBtn.style.borderRadius = '12px 12px 0px 0px'; toggleBtn.style.borderTopWidth = '1px'; toggleBtn.style.borderBottomWidth = '1px';
                        panel.style.borderRadius = '0px 0px 12px 12px'; panel.style.borderTopWidth = '0px'; panel.style.borderBottomWidth = '1px';
                    }
                    panel.style.maxHeight = '0px'; panel.style.opacity = '0'; panel.style.borderColor = 'transparent'; wrapper.offsetWidth;
                    wrapper.style.transition = 'width 0.2s cubic-bezier(0.4, 0, 0.2, 1)'; wrapper.style.width = '288px'; icon.style.transform = "rotate(180deg)";
                    if (hamburgerIcon) hamburgerIcon.style.left = '16px'; if (arrowIcon) { arrowIcon.style.opacity = '1'; arrowIcon.style.right = '16px'; }

                    sequenceTimeout = setTimeout(() => {
                        panel.style.borderColor = ''; panel.style.opacity = '1'; panel.style.transition = 'max-height 0.2s cubic-bezier(0.4, 0, 0.2, 1)'; panel.style.maxHeight = actualTargetHeight + 'px';
                        if (isUpward && targetBottom !== btnBottom) { wrapper.style.transition += ', bottom 0.2s cubic-bezier(0.4, 0, 0.2, 1)'; wrapper.style.bottom = targetBottom + 'px'; }
                        else if (!isUpward && targetTop !== btnTop) { wrapper.style.transition += ', top 0.2s cubic-bezier(0.4, 0, 0.2, 1)'; wrapper.style.top = targetTop + 'px'; }
                        toggleTimeout = setTimeout(() => { isAnimating = false; saveRelPos(); }, 150);
                    }, 150);
                } else {
                    const isUpward = wrapper.classList.contains('flex-col-reverse'); wrapper.style.transition = 'none';
                    if (isLeftHalf) { wrapper.style.left = btnLeft + 'px'; wrapper.style.right = 'auto'; } else { wrapper.style.left = 'auto'; wrapper.style.right = btnRight + 'px'; }
                    if (isUpward) { wrapper.style.top = 'auto'; wrapper.style.bottom = wrapper.style.bottom || (wsRect.height - wrapRect.bottom) + 'px'; }
                    else { wrapper.style.top = wrapper.style.top || (wrapRect.top - wsRect.top) + 'px'; wrapper.style.bottom = 'auto'; }
                    wrapper.offsetWidth;
                    panel.style.transition = 'max-height 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.1s ease'; panel.style.maxHeight = "0px"; panel.style.borderColor = 'transparent'; icon.style.transform = "rotate(0deg)";
                    if (isUpward) { wrapper.style.transition = 'bottom 0.2s cubic-bezier(0.4, 0, 0.2, 1)'; wrapper.style.bottom = btnBottom + 'px'; }
                    else { wrapper.style.transition = 'top 0.2s cubic-bezier(0.4, 0, 0.2, 1)'; wrapper.style.top = btnTop + 'px'; }

                    sequenceTimeout = setTimeout(() => {
                        panel.style.opacity = "0"; wrapper.style.transition = 'width 0.2s cubic-bezier(0.4, 0, 0.2, 1)'; wrapper.style.width = '48px';
                        toggleBtn.style.transition = 'border-radius 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-width 0.2s cubic-bezier(0.4, 0, 0.2, 1)';
                        toggleBtn.style.borderRadius = '24px'; toggleBtn.style.borderTopWidth = '1px'; toggleBtn.style.borderBottomWidth = '1px';
                        if (hamburgerIcon) hamburgerIcon.style.left = '12px'; if (arrowIcon) { arrowIcon.style.opacity = '0'; arrowIcon.style.right = '0px'; }
                        toggleTimeout = setTimeout(() => {
                            isAnimating = false; wrapper.style.transition = 'none';
                            wrapper.style.right = 'auto'; wrapper.style.bottom = 'auto';
                            wrapper.style.left = (isLeftHalf ? btnLeft : wsRect.width - btnRight - 48) + 'px';
                            wrapper.style.top = (isUpward ? wsRect.height - btnBottom - 48 : btnTop) + 'px';
                            saveRelPos();
                        }, 150);
                    }, 150);
                }
            };

            const startPanelDrag = (e) => {
                if (!isFloatingMode() || (e.button !== 0 && e.type.includes('mouse')) || isAnimating) return;
                isPanelDragging = true; hasDragged = false;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX; const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                startX = clientX; startY = clientY; const rect = wrapper.getBoundingClientRect(), wsRect = workspaceNode.getBoundingClientRect();
                panelOffsetX = clientX - rect.left; panelOffsetY = clientY - rect.top; wrapper.style.transition = 'none'; wrapper.style.right = 'auto'; wrapper.style.bottom = 'auto';
                wrapper.style.left = (rect.left - wsRect.left) + 'px'; wrapper.style.top = (rect.top - wsRect.top) + 'px'; toggleBtn.style.cursor = 'grabbing';
            };

            const onPanelDrag = (e) => {
                if (!isPanelDragging) return;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX; const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                if (Math.abs(clientX - startX) > 3 || Math.abs(clientY - startY) > 3) hasDragged = true;
                const { wsRect, left, right, top, bottom } = getPanelBounds();
                let newX = Math.max(left, Math.min(clientX - wsRect.left - panelOffsetX, right - wrapper.offsetWidth)); let newY = Math.max(top, Math.min(clientY - wsRect.top - panelOffsetY, bottom - wrapper.offsetHeight));
                wrapper.style.left = newX + 'px'; wrapper.style.top = newY + 'px'; if (e.type.includes('touch')) e.preventDefault();
            };

            const endPanelDrag = () => { if (isPanelDragging) { isPanelDragging = false; toggleBtn.style.cursor = isFloatingMode() ? 'move' : 'default'; saveRelPos(); } };

            toggleBtn.addEventListener('mousedown', startPanelDrag); window.addEventListener('mousemove', onPanelDrag, { passive: false }); window.addEventListener('mouseup', endPanelDrag);
            toggleBtn.addEventListener('touchstart', startPanelDrag, { passive: false }); window.addEventListener('touchmove', onPanelDrag, { passive: false }); window.addEventListener('touchend', endPanelDrag);
            window.addEventListener('resize', handleResizePanel);
            document.addEventListener('fullscreenchange', handleResizePanel);
            document.addEventListener('webkitfullscreenchange', handleResizePanel);
            handleResizePanel();
        }
        /* ════ ZONE K 끝 ════════════════════════════════════════════════════════ */


        /* ════════════════════════════════════════════════════════════════════════
           🚫 ZONE L — 초기 실행 (수정 금지)
           ════════════════════════════════════════════════════════════════════════ */
        const resizeObserver = new ResizeObserver(() => resizeCanvas());

        window.addEventListener('load', () => {
            if (container) resizeObserver.observe(container);
            bindCoreEvents();      /* 🚫 코어 이벤트 바인딩 (ZONE J) */
            bindInputEvents();     /* ✏️ 입력 이벤트 바인딩 (ZONE I) */
            initFloatingPanel();   /* 🚫 플로팅 패널 초기화 (ZONE K) */
            initSimulation();      /* ✏️ 시뮬레이션 초기화  (ZONE F) */
        });
        /* ════ ZONE L 끝 ════════════════════════════════════════════════════════ */
    </script>
